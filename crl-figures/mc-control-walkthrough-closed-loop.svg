acity="1">A 0.9 · B 0.1</text><text x="362" y="878" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">更新后 π3 · S₁</text><rect x="362" y="890" width="302.4" height="18" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="664.4" y="890" width="33.6" height="18" rx="0" fill="#e2e7eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="362" y="933" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 0.9 · B 0.1</text><text x="22" y="1009" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">圆和箭头是实际轨迹；Q 在真实终止后更新；条宽是下一版动作概率</text></g></svg>
