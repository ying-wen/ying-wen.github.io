<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1046" viewBox="0 0 720 1046" role="img" aria-labelledby="crl-1rs1ska-title crl-1rs1ska-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1rs1ska-title">完整回合后，策略改变下一次采样</title><desc id="crl-1rs1ska-desc">沿用S0到S1再终止的两步任务。γ=0.5，固定ε=0.2，初始Q为零、初始策略均匀，改善时平局选B。给定均匀数(0.4,0.8)、(0.95,0.05)、(0.05,0.5)，程序按当回合冻结的π实际选择AB、BA、AA。圆为状态，箭头为真实转移，箭头上的字母及数字为动作及奖励。每回合下方是完整回报写入后的Q，橙色条宽是随后ε-greedy策略的A概率。三条回合轨迹各在其实际策略下的概率为0.25、0.01、0.09；这是一条可行输入序列，不是随机训练学习曲线。</desc><rect width="720" height="1046" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">完整回合后，策略改变下一次采样</text><text x="22" y="81" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">同一两步任务 · γ=0.5 · ε=0.2</text><text x="22" y="126" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">回合 1 · 使用 π0</text><text x="22" y="157" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">u = (0.4, 0.8)</text><circle cx="100" cy="181" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="100" y="187" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₀</text><circle cx="365" cy="181" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="365" y="187" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₁</text><circle cx="624" cy="181" r="22" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><circle cx="624" cy="181" r="17" fill="none" stroke="#19354e" stroke-width="1" opacity="1"/><text x="624" y="187" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">终</text><path d="M124 181L336.45 181" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d