<svg xmlns="http://www.w3.org/2000/svg" width="360" height="805" viewBox="0 0 360 805" role="img" aria-labelledby="crl-x5bqig-title crl-x5bqig-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-x5bqig-title">一次更新，哪些邻居会改变？</title><desc id="crl-x5bqig-desc">两套错位网格、格宽一、无哈希碰撞。在状态0.25更新误差一，每个活动权重增加0.1。四个探测点共享一、二、一、零个活动tile，预测分别增加0.1、0.2、0.1、0。每幅图使用同一坐标区间，着色表示此次被更新的tile。</desc><rect width="360" height="805" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="20" y="38" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次更新，哪些邻居会改变？</text><text x="20" y="76" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">s = 0.25 · δ = 1 · α = 0.1</text><text x="28" y="128" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">网格 1</text><rect x="28" y="142" width="76" height="42" rx="0" fill="#ffffff" stroke="#146ca1" stroke-width="1.5" opacity="1"/><rect x="104" y="142" width="152" height="42" rx="0" fill="#dcebf5" stroke="#146ca1" stroke-width="1.5" opacity="1"/><rect x="256" y="142" width="76" height="42" rx="0" fill="#ffffff" stroke="#146ca1" stroke-width="1.5" opacity="1"/><circle cx="142" cy="163" r="7" fill="#19354e" stroke="#ffffff" stroke-width="2" opacity="1"/><text x="28" y="204" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">网格 2</text><rect x="28" y="218" width="152" height="42" rx="0" fill="#d9eee7" stroke="#258375" stroke-width="1.5" opacity="1"/><rect x="180" y="218" width="152" height="42" rx="0" fill="#ffffff" stroke="#258375" stroke-width="1.5" opacity="1"/><circle cx="142" cy="239" r="7" fill="#19354e" stroke="#ffffff" stroke-width="2" opacity="1"/><path d="M142 115L142 275" fill="none" stroke="#19354e" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="3 5"/><text x="28" y="289" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-0.5</text><text x="104" y="289" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="180" y="289" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="256" y="289" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="332" y="289" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.5</text><text x="28" y="325" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每个着色 tile：Δw = 0.1</text><text x="28" y="356" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">同一位置，每套网格激活一格。</text><text x="28" y="418" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">邻居的预测会改变多少？</text><path d="M50 625L330 625" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="40" y="630" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M50 559L330 559" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="40" y="564" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.1</text><path d="M50 493L330 493" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="40" y="498" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.2</text><path d="M50 481L50 625" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M50 625L330 625" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M50 559H120L120 493H190L190 559H260L260 625H330" fill="none" stroke="#b65a28" stroke-width="4"/><circle cx="85" cy="559" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="85" y="656" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-0.25</text><circle cx="155" cy="493" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="155" y="656" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.25</text><circle cx="225" cy="559" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="225" y="656" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.75</text><circle cx="295" cy="625" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="295" y="656" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.25</text><text x="50" y="688" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">共享 tile 数</text><text x="85" y="716" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="155" y="716" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="225" y="716" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="295" y="716" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="28" y="769" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">重叠越多，同次改变越大。</text></g></svg>
