<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1195" viewBox="0 0 360 1195" role="img" aria-labelledby="crl-jt92o4-title crl-jt92o4-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-jt92o4-title">一起变化，不等于同一机制</title><desc id="crl-jt92o4-desc">两个二元结构模型均接收公平随机输入U。模型A中X=U且Y=U，模型B中X=U且Y=X。自然观察完全相同；把X强制置0后，Y为1的概率分别为0.5与0。圆点表示变量亮灭，不是神经记录。</desc><rect width="360" height="1195" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="20" y="38" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一起变化，不等于同一机制</text><text x="20" y="77" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">X 与 Y 总一起亮起：谁影响谁？</text><text x="20" y="124" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">模型 A：共同输入</text><path d="M168 203L110.7468 256.5595" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M106 261L109.8869 250.5171L116.7185 257.8198Z" fill="#146ca1"/><path d="M192 203L249.2532 256.5595" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M254 261L243.2815 257.8198L250.1131 250.5171Z" fill="#146ca1"/><circle cx="180" cy="186" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="193" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">U</text><circle cx="93" cy="279" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="93" y="286" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">X</text><circle cx="267" cy="279" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="267" y="286" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">Y</text><text x="20" y="334" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">观察到的 (X,Y)</text><circle cx="101" cy="370" r="10" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="137" cy="370" r="10" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="119" y="404" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">概率 0.5</text><circle cx="224" cy="370" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="260" cy="370" r="10" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><text x="242" y="404" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">概率 0.5</text><path d="M20 428L330 428" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="20" y="462" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">强制关闭 X</text><rect x="65" y="487" width="56" height="43" rx="6" fill="#ffffff" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="93" y="516" font-size="19" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">X=0</text><circle cx="250" cy="509" r="12" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="284" cy="509" r="12" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><text x="267" y="544" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">Y 仍随 U</text><text x="20" y="571" font-size="17" fill="#258375" text-anchor="start" font-weight="400" opacity="1">P(Y=1 | do(X=0)) = 0.5</text><text x="20" y="650" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">模型 B：X 传给 Y</text><path d="M168 729L110.7468 782.5595" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M106 787L109.8869 776.5171L116.7185 783.8198Z" fill="#146ca1"/><path d="M117 805L236.5 805" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M243 805L233 810L233 800Z" fill="#146ca1"/><circle cx="180" cy="712" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="719" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">U</text><circle cx="93" cy="805" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="93" y="812" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">X</text><circle cx="267" cy="805" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="267" y="812" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">Y</text><text x="20" y="860" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">观察到的 (X,Y)</text><circle cx="101" cy="896" r="10" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="137" cy="896" r="10" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="119" y="930" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">概率 0.5</text><circle cx="224" cy="896" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="260" cy="896" r="10" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><text x="242" y="930" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">概率 0.5</text><path d="M20 954L330 954" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="20" y="988" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">强制关闭 X</text><rect x="65" y="1013" width="56" height="43" rx="6" fill="#ffffff" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="93" y="1042" font-size="19" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">X=0</text><path d="M127 1035L238.5 1035" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M245 1035L235 1040L235 1030Z" fill="#146ca1"/><circle cx="267" cy="1035" r="16" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="267" y="1070" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">Y = 0</text><text x="20" y="1097" font-size="17" fill="#258375" text-anchor="start" font-weight="400" opacity="1">P(Y=1 | do(X=0)) = 0</text><text x="20" y="1154" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同样的观察，可有不同的干预结果。</text></g></svg>
