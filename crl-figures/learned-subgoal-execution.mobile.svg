<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1186" viewBox="0 0 360 1186" role="img" aria-labelledby="crl-psm5kx-title crl-psm5kx-desc" data-crl-visual="v1" data-evidence-kind="measured"><title id="crl-psm5kx-title">失败的技能，也有必须学到的后果</title><desc id="crl-psm5kx-desc">对比每个候选3次或4次练习。3次后到C技能实际走SAX，模型记录失败到X奖励0.9；4次后实际走SBC，模型记录奖励0、时长2、终点C权重0.81。之后在C真实probe得2，规划选择C并实际部署SBCY。两者练习预算不同，不作为匹配预算效能比较。</desc><rect width="360" height="1186" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">失败的技能，也有必须学到的后果</text><text x="28" y="82" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">冻结的是已学策略，不是理想成功路线</text><text x="28" y="121" font-size="21" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">每个候选练习 3 次</text><path d="M80.8411 215.3401L162.2011 167.3037" fill="none" stroke="#b54142" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M166.6789 164.6599L161.8237 172.1717L157.7563 165.2828Z" fill="#b54142"/><path d="M202.04 155L277.4 155" fill="none" stroke="#b54142" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M282.6 155L274.6 159L274.6 151Z" fill="#b54142"/><path d="M79.2869 236.9061L127.7007 275.8354" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M131.7531 279.0939L123.0121 277.198L128.0252 270.9635Z" fill="#c8d6e0"/><path d="M165.56 291L216.6 291" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M221.8 291L213.8 295L213.8 287Z" fill="#c8d6e0"/><path d="M248.5545 273.6545L291.7232 177.0928" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M293.8455 172.3455L294.2322 181.2815L286.9288 178.0164Z" fill="#c8d6e0"/><circle cx="64.48" cy="225" r="18" fill="#b54142" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="64.48" y="231" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="183.04" cy="155" r="18" fill="#b54142" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="183.04" y="161" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="301.6" cy="155" r="18" fill="#b54142" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="301.6" y="161" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">X</text><circle cx="301.6" cy="155" r="24" fill="none" stroke="#b54142" stroke-width="2" opacity="1"/><circle cx="146.56" cy="291" r="18" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="146.56" y="297" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="240.8" cy="291" r="18" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="240.8" y="297" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="28" y="343" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">实际停止在 X；没有到达 C</text><text x="28" y="377" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">技能外部奖励 0.9</text><text x="28" y="408" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">时长 2 步；终点权重 0.81</text><text x="28" y="445" font-size="19" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">规划后选 A；估计 0.9</text><text x="28" y="480" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">全程 24 个真实步</text><text x="28" y="509" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">另有 11 次允许的重置</text><text x="28" y="541" font-size="21" fill="#258375" text-anchor="start" font-weight="400" opacity="1">每个候选练习 4 次</text><path d="M80.8411 635.3401L162.2011 587.3037" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M166.6789 584.6599L161.8237 592.1717L157.7563 585.2828Z" fill="#c8d6e0"/><path d="M202.04 575L277.4 575" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M282.6 575L274.6 579L274.6 571Z" fill="#c8d6e0"/><path d="M79.2869 656.9061L127.7007 695.8354" fill="none" stroke="#258375" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M131.7531 699.0939L123.0121 697.198L128.0252 690.9635Z" fill="#258375"/><path d="M165.56 711L216.6 711" fill="none" stroke="#258375" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M221.8 711L213.8 715L213.8 707Z" fill="#258375"/><path d="M248.5545 693.6545L291.7232 597.0928" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M293.8455 592.3455L294.2322 601.2815L286.9288 598.0164Z" fill="#c8d6e0"/><circle cx="64.48" cy="645" r="18" fill="#258375" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="64.48" y="651" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="183.04" cy="575" r="18" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="183.04" y="581" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="301.6" cy="575" r="18" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="301.6" y="581" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">X</text><circle cx="146.56" cy="711" r="18" fill="#258375" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="146.56" y="717" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="240.8" cy="711" r="18" fill="#258375" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="240.8" y="717" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">C</text><circle cx="240.8" cy="711" r="24" fill="none" stroke="#258375" stroke-width="2" opacity="1"/><text x="28" y="763" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">实际停止在 C；到达了 C</text><text x="28" y="797" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">技能外部奖励 0</text><text x="28" y="828" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">时长 2 步；终点权重 0.81</text><text x="28" y="865" font-size="19" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">规划后选 C；估计 1.62</text><text x="28" y="900" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">全程 31 个真实步</text><text x="28" y="929" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">另有 13 次允许的重置</text><text x="28" y="974" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">练习后，规划的选择真正成为行动</text><path d="M63 1030L104.5 1030" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M111 1030L101 1035L101 1025Z" fill="#258375"/><path d="M149 1030L190.5 1030" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M197 1030L187 1035L187 1025Z" fill="#258375"/><path d="M235 1030L276.5 1030" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M283 1030L273 1035L273 1025Z" fill="#b65a28"/><circle cx="44" cy="1030" r="18" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="44" y="1036" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="130" cy="1030" r="18" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="130" y="1036" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="216" cy="1030" r="18" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="216" y="1036" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">C</text><circle cx="302" cy="1030" r="18" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="302" y="1036" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">Y</text><text x="28" y="1084" font-size="15" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">S → B → C 是技能；C → Y 是随后动作</text><text x="28" y="1118" font-size="17" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">奖励序列 0、0、2；折扣回报 1.62</text><text x="28" y="1155" font-size="15" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">圆环标出技能实际终点；浅灰边已被观察</text></g></svg>
