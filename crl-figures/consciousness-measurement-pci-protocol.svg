="66" cy="808" r="15" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><path d="M43 858 Q41 829 66 829 Q91 829 89 858" fill="#f5f8fb" stroke="#146ca1" stroke-width="2"/><circle cx="184" cy="808" r="15" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><path d="M161 858 Q159 829 184 829 Q209 829 207 858" fill="#f5f8fb" stroke="#146ca1" stroke-width="2"/><circle cx="302" cy="808" r="15" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><path d="M279 858 Q277 829 302 829 Q327 829 325 858" fill="#f5f8fb" stroke="#146ca1" stroke-width="2"/><text x="66" y="892" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">即时报告</text><text x="184" y="892" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">延迟报告</text><text x="302" y="892" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">无体验报告</text><text x="28" y="935" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">150人；部分有重复状态</text><path d="M362 828L395.5 828" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M402 828L392 833L392 823Z" fill="#7854a2"/><path d="M430 817V807Q444 789 458 807V817" fill="none" stroke="#7854a2" stroke-width="3"/><rect x="421" y="817" width="46" height="37" rx="5" fill="#ffffff" stroke="#7854a2" stroke-width="3" opacity="1"/><circle cx="444" cy="833" r="4" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="417" y="903" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">ROC：0.31</text><path d="M479 828L522.5 828" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M529 828L519 833L519 823Z" fill="#7854a2"/><circle cx="589" cy="808" r="15" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><path d="M566 858 Q564 829 589 829 Q614 829 612 858" fill="#f5f8fb" stroke="#19354e" stroke-width="2"/><text x="589" y="892" font-size="17" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">独立81位患者</text><text x="407" y="935" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">取位点最大值；固定阈值</text><text x="28" y="987" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">阈值随采集和处理协议；不读取当下内容</text></g></svg>
