<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1023" viewBox="0 0 720 1023" role="img" aria-labelledby="crl-1t4139f-title crl-1t4139f-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1t4139f-title">PCI：从响应矩阵到判断协议</title><desc id="crl-1t4139f-desc">原创装置及协议示意，无实测波形、PCI分布或计算的PCI值。TMS线圈施加局部脉冲，60通道EEG及2个眼部传感器记录，耳塞遮蔽线圈声；清理伪迹后源估计及显著性筛选得到源乘时间矩阵。两份6乘6构造矩阵都含18个活动格，左侧各行重复，右侧各行时序不同。PCI实际还须Lempel-Ziv复杂度与源熵归一化。150人基准群体按即时、延迟或无体验报告标注，部分重复状态；每个状态取可用位点最大PCI，ROC选择0.31操作阈值后固定用于独立81位患者。人像仅表示群体和参照类型，不按实际人数排列。</desc><rect width="720" height="1023" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">PCI：从响应矩阵到判断协议</text><text x="28" y="86" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">局部脉冲，记录刺激后的脑反应</text><circle cx="176" cy="206" r="48" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><circle cx="130.365" cy="194.7553" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="141.3425" cy="174.2532" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="165.3215" cy="160.2292" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="193.0308" cy="162.1942" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="214.7908" cy="179.4618" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="222.7652" cy="201.3078" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="133" cy="141" r="18" fill="#ffffff" stroke="#b65a28" stroke-width="4" opacity="1"/><circle cx="166" cy="134" r="18" fill="#ffffff" stroke="#b65a28" stroke-width="4" opacity="1"/><path d="M150 156L162.1153 187.1536" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M164 192L157.3724 185.9937L164.8284 183.0942Z" fill="#b65a28"/><circle cx="224" cy="211" r="6" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="28" y="279" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">TMS线圈</text><text x="209" y="279" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">EEG电极</text><text x="371" y="184" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">60通道 EEG + 2个眼部传感器</text><text x="371" y="223" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">耳塞遮蔽线圈的响声</text><text x="371" y="262" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每位置至少200次脉冲反应</text><path d="M176 293L176 335.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M176 342L171 332L181 332Z" fill="#146ca1"/><text x="28" y="379" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">清理伪迹 → 源估计 → 显著性筛选</text><text x="28" y="419" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">矩阵：行=源，列=刺激后时间格</text><rect x="144" y="454" width="22" height="22" rx="0" fill="#258375" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="169" y="454" width="22" height="22" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="194" y="454" width="22" height="22" rx="0" fill="#258375" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="219" y="454" width="22" height="22" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="244" y="454" width="22" height="22" rx="0" fill="#258375" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="269" y="454" width="22" height="22" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="144" y="479" width="22" height="22" rx="0" fill="#258375" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="169" y="479" wid