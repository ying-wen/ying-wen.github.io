<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1225" viewBox="0 0 360 1225" role="img" aria-labelledby="crl-x0z7e4-title crl-x0z7e4-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-x0z7e4-title">条件概率与总结果量要分开</title><desc id="crl-x0z7e4-desc">独立构造的精确期望算例，每个一秒窗口至多一次结果。预设正关系概率 .25/0、零关系 .25/.25、停止投放0/0。给定40窗口中有10、20或30个响应窗口，分别对应q=.25,.5,.75；期望次数正关系为2.5,5,7.5，零关系均为10，停止投放均为0。它们不是采样频次或动物数据。条件概率示意条的共同上限为1。</desc><rect width="360" height="1225" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="37" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">条件概率与总结果量要分开</text><text x="24" y="84" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">构造例子：每秒至多投放一次</text><g transform="translate(24,132)"><text x="0" y="0" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">正关系</text><text x="0" y="40" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">P(O|A)</text><rect x="133" y="20" width="120" height="23" rx="2" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="133" y="20" width="30" height="23" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="262" y="40" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">0.25</text><text x="0" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">P(O|¬A)</text><rect x="133" y="62" width="120" height="23" rx="2" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="133" y="62" width="0" height="23" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="262" y="82" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0</text><text x="0" y="121" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">ΔP = 0.25</text></g><g transform="translate(24,300)"><text x="0" y="0" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">零关系</text><text x="0" y="40" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">P(O|A)</text><rect x="133" y="20" width="120" height="23" rx="2" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="133" y="20" width="30" height="23" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="262" y="40" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">0.25</text><text x="0" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">P(O|¬A)</text><rect x="133" y="62" width="120" height="23" rx="2" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="133" y="62" width="30" height="23" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="262" y="82" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0.25</text><text x="0" y="121" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">ΔP = 0</text></g><g transform="translate(24,468)"><text x="0" y="0" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">停止投放</text><text x="0" y="40" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">P(O|A)</text><rect x="133" y="20" width="120" height="23" rx="2" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="133" y="20" width="0" height="23" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="262" y="40" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">0</text><text x="0" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">P(O|¬A)</text><rect x="133" y="62" width="120" height="23" rx="2" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="133" y="62" width="0" height="23" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="262" y="82" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0</text><text x="0" y="121" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">ΔP = 0</text></g><text x="24" y="691" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同概率，改变响应窗口比例 q</text><g transform="translate(24,743)"><path d="M93 34L93 282" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="93" y="314" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M181 34L181 282" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="181" y="314" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">5</text><path d="M269 34L269 282" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="269" y="314" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">10</text><text x="0" y="65" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">q=0.25</text><rect x="93" y="34" width="44" height="21" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="144" y="51" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">2.5</text><rect x="93" y="64" width="176" height="21" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="276" y="81" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">10</text><text x="0" y="148" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">q=0.5</text><rect x="93" y="117" width="88" height="21" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="188" y="134" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">5</text><rect x="93" y="147" width="176" height="21" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="276" y="164" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">10</text><text x="0" y="231" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">q=0.75</text><rect x="93" y="200" width="132" height="21" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="232" y="217" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">7.5</text><rect x="93" y="230" width="176" height="21" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="276" y="247" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">10</text><text x="181" y="350" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">40 秒内的期望投放次数</text></g><text x="24" y="1141" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">橙：正关系   蓝：零关系</text><text x="24" y="1180" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">条长显示期望，不是实际投放频次</text></g></svg>
