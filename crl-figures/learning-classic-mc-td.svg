<svg xmlns="http://www.w3.org/2000/svg" width="720" height="806" viewBox="0 0 720 806" role="img" aria-labelledby="title desc"><title id="title">同一经验，奖励怎样传回起点？</title><desc id="desc">确定性五步链上真正运行MC和TD(0)的起点价值估计曲线，基线是精确真实价值。</desc><style>text{font-family:system-ui,-apple-system,"Noto Sans CJK SC","PingFang SC",sans-serif} .strong{font-weight:650}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17324d"/></marker></defs><rect width="720" height="806" fill="#ffffff"/><text x="28" y="40" font-size="26" fill="#17324d" text-anchor="start" class="strong">同一经验，奖励怎样传回起点？</text><text x="28" y="76" font-size="21" fill="#526579" text-anchor="start" >S₀ → S₁ → S₂ → S₃ → S₄ → T；奖励 0,0,0,0,1</text><text x="28" y="111" font-size="20" fill="#526579" text-anchor="start" >固定唯一动作；每回合相同 5 步；MC/TD 都从零表开始</text><text x="28" y="153" font-size="22" fill="#17324d" text-anchor="start" class="strong">起点估计 V(S₀)</text><line x1="84" y1="432" x2="674" y2="432" stroke="#c6d2df" stroke-width="1" /><text x="72" y="439" font-size="20" fill="#526579" text-anchor="end" >0</text><line x1="84" y1="357" x2="674" y2="357" stroke="#c6d2df" stroke-width="1" /><text x="72" y="364" font-size="20" fill="#526579" text-anchor="end" >0.2</text><line x1="84" y1="282" x2="674" y2="282" stroke="#c6d2df" stroke-width="1" /><text x="72" y="289" font-size="20" fill="#526579" text-anchor="end" >0.4</text><line x1="84" y1="207" x2="674" y2="207" stroke="#c6d2df" stroke-width="1" /><text x="72" y="214" font-size="20" fill="#526579" text-anchor="end" >0.6</text><text x="84" y="462" font-size="20" fill="#526579" text-anchor="middle" >0</text><text x="206.91666666666669" y="462" font-size="20" fill="#526579" text-anchor="middle" >5</text><text x="329.83333333333337" y="462" font-size="20" fill="#526579" text-anchor="middle" >10</text><text x="452.75" y="462" font-size="20" fill="#526579" text-anchor="middle" >15</text><text x="575.6666666666667" y="462" font-size="20" fill="#526579" text-anchor="middle" >20</text><text x="674" y="462" font-size="20" fill="#526579" text-anchor="middle" >24</text><line x1="84" y1="432" x2="674" y2="432" stroke="#17324d" stroke-width="2" /><line x1="84" y1="432" x2="84" y2="162" stroke="#17324d" stroke-width="2" /><text x="380" y="495" font-size="20" fill="#526579" text-anchor="middle" >完成的回合数（每回合 5 次真实转移）</text><line x1="84" y1="185.9625" x2="674" y2="185.9625" stroke="#21715b" stroke-width="2" stroke-dasharray="7 6"/><polyline points="84,432 108.58333333333333,370.49062499999997 133.16666666666666,324.35859374999995 157.75,289.75957031249993 182.33333333333331,263.810302734375 206.91666666666669,244.34835205078122 231.5,229.75188903808592 256.08333333333337,218.80454177856438 280.66666666666663,210.59403133392325 305.25,204.43614850044244 329.83333333333337,199.8177363753318 354.4166666666667,196.35392728149887 379,193.75607046112412 403.5833333333333,191.80767784584307 428.1666666666667,190.3463833843823 452.75,189.2504125382867 477.3333333333333,188.42843440371502 501.9166666666667,187.8119508027862 526.5,187.34958810208968 551.0833333333333,187.00281607656726 575.6666666666667,186.74273705742542 600.25,186.54767779306903 624.8333333333334,186.4013833448018 649.4166666666666,186.2916625086013 674,186.209371881451" fill="none" stroke="#b55220" stroke-width="3.5"/><circle cx="108.58333333333333" cy="370.49062499999997" r="4.5" fill="#b55220"/><circle cx="206.91666666666669" cy="244.34835205078122" r="4.5" fill="#b55220"/><circle cx="379" cy="193.75607046112412" r="4.5" fill="#b55220"/><circle cx="674" cy="186.209371881451" r="4.5" fill="#b55220"/><polyline points="84,432 108.58333333333333,432 133.16666666666666,432 157.75,432 182.33333333333331,432 206.91666666666669,431.7597290039063 231.5,430.8587127685547 256.08333333333337,428.8314262390137 280.66666666666663,425.2836748123169 305.25,419.96204767227175 329.83333333333337,412.77785103321077 354.4166666666667,403.79760523438455 379,393.21374411433936 403.5833333333333,381.30690035428853 428.1666666666667,368.40781961423346 452.75,354.8637848371756 477.3333333333333,341.01193108791193 501.9166666666667,327.1600773386482 526.5,313.574605392255 551.0833333333333,300.47432887251864 575.6666666666667,288.0290661787692 600.25,276.36163240337896 624.8333333333334,265.5520981702969 649.4166666666666,255.64335845663837 674,246.64726582186938" fill="none" stroke="#146a9f" stroke-width="3.5"/><circle cx="108.58333333333333" cy="432" r="4.5" fill="#146a9f"/><circle cx="206.91666666666669" cy="431.7597290039063" r="4.5" fill="#146a9f"/><circle cx="379" cy="393.21374411433936" r="4.5" fill="#146a9f"/><circle cx="674" cy="246.64726582186938" r="4.5" fill="#146a9f"/><text x="125" y="542" font-size="21" fill="#b55220" text-anchor="start" >● MC：整段回报</text><text x="395" y="542" font-size="21" fill="#146a9f" text-anchor="start" >● TD(0)：一步自举</text><text x="28" y="579" font-size="21" fill="#21715b" text-anchor="start" >虚线是真实 v(S₀)=0.9⁴=0.6561</text><rect x="28" y="604" width="664" height="97" rx="10" fill="#edf4fa" stroke="#c6d2df"/><text x="46" y="637" font-size="20" fill="#17324d" text-anchor="start" >第 1 回合：MC=0.164025，TD=0；TD 第 5 回合才非零。</text><text x="46" y="671" font-size="20" fill="#17324d" text-anchor="start" >第 24 回合：MC=0.6554，TD=0.4943。</text><text x="28" y="746" font-size="19" fill="#526579" text-anchor="start" >γ=0.9，α=0.25，24 回合/120 转移；无奖励噪声，无需种子。</text><text x="28" y="777" font-size="20" fill="#526579" text-anchor="start" >显示有限预算下的传播过程，不是随机任务上的性能排名。</text></svg>
