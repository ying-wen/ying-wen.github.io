<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="crl-150606k-title crl-150606k-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-150606k-title">奖励率看斜率，折扣改变权重</title><desc id="crl-150606k-desc">同一三状态MDP的精确期望传播。累计曲线从选择点0开始，非采样曲线；下方柱形是两种折扣的时间权重。原始步长相同，返回选择点的概率为0.1。</desc><rect width="720" height="976" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">奖励率看斜率，折扣改变权重</text><text x="28" y="83" font-size="21" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">A：先得 4，以后等待</text><text x="28" y="115" font-size="21" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">B：先得 0，等待时每步得 1</text><text x="28" y="148" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">每个等待步有 0.1 概率返回选择点</text><path d="M66 200L66 460" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M66 460L692 460" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M66 460L692 460" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="58" y="465" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M66 367.1429L692 367.1429" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="58" y="372.1429" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">20</text><path d="M66 274.2857L692 274.2857" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="58" y="279.2857" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">40</text><text x="66" y="485" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text