<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1202" viewBox="0 0 720 1202" role="img" aria-labelledby="crl-137cnd-title crl-137cnd-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-137cnd-title">更新先后怎样改变动作</title><desc id="crl-137cnd-desc">原创精确机制计算，非随机训练。每行红色和青色条长度为捷径和绕行概率；虚线在固定u=.55处，u小于p选捷径，否则绕行。所有策略和乘子方向同用旧版本，eta_p .5、eta_lambda2，初始p.6 lambda0，三步后依次(p,lambda)=(.7,.6),(.5,1.4),(0,1.8)。第一轮成本反馈令lambda上升，但本轮p仍读旧lambda0而增加；下轮动作改变。右侧或下方画该固定u产生的实际模型路径和奖励成本事件；并未生成随机环境样本。底图改从p_old .2开始：归一化旧状态占据下平均KL的局部F=.625，delta .005；KL允许p最高约.3265，成本预算只允许p不超过.3。绿色色带为两者交集；圆为同时约束的局部解，方为仅奖励与局部KL的提案。候选的精确平均KL另在代码核验，图不含CPO共轭梯度、采样估计、线搜索或神经训练。</desc><rect width="720" height="1202" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">更新先后怎样改变动作</text><text x="28" y="86" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同用旧 p、旧 λ：ηₚ=.5，ηλ=2</text><text x="28" y="119" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">固定动作分位点 u=.55；虚线标出 u</text><text x="28" y="175" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">k=0</text><text x="78" y="175" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">p=0.6，λ=0</text><rect x="78" y="193" width="172.2" height="28" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="1"/><rect x="250.2" y="193" width="114.8" height="28" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><path d="M235.85 185L235.85 229" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><text x="78" y="247" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="365" y="247" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">