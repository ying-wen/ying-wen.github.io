45" fill="none" stroke="#e5ecf1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="587" y="475" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M671 293L671 445" fill="none" stroke="#e5ecf1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="671" y="475" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M419 452L671 452" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="672" y="500" font-size="17" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">价值</text><text x="381" y="336" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">L</text><path d="M503 330L556.2 330" fill="none" stroke="#258375" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M560.75 330L553.75 333.5L553.75 326.5Z" fill="#258375"/><circle cx="503" cy="330" r="5" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><rect x="555.75" y="325" width="10" height="10" rx="0" fill="#258375" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="503" y="315" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="560.75" y="358" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">27/16</text><text x="381" y="417" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">R</text><path d="M587 411L533.8 411" fill="none" stroke="#258375" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M529.25 411L536.25 407.5L536.25 414.5Z" fill="#258375"/><circle cx="587" cy="411" r="5" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><rect x="524.25" y="406" width="10" height="10" rx="0" fill="#258375" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="587" y="396" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="529.25" y="439" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">21/16</text><text x="382" y="529" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">s′ 贪心动作：R → L</text><circle cx="28" cy="580" r="5" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="44" y="586" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新前</text><rect x="133" y="575" width="10" height="10" rx="0" fill="#258375" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="154" y="586" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新后</text><text x="24" y="621" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">θ：(1/2, 1) → (3/4, 9/8)</text></g></svg>
