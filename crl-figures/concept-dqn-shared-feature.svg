<svg xmlns="http://www.w3.org/2000/svg" width="720" height="645" viewBox="0 0 720 645" role="img" aria-labelledby="crl-ser8gz-title crl-ser8gz-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-ser8gz-title">一次回归牵动四个预测</title><desc id="crl-ser8gz-desc">只有当前输入s的L动作参与损失。共享ReLU特征的两个参数从(1/2,1)更新到(3/4,9/8)，四个预测均改变。圆点是更新前，方点是更新后；箭头长度等于价值增量，所有轴均为0到3。后继L从1升到27/16，R从2降到21/16，贪心动作反转。</desc><rect width="720" height="645" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次回归牵动四个预测</text><text x="24" y="76" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一条经验：s ─L, r=0→ s′</text><path d="M95 137L209.5 137" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M216 137L206 142L206 132Z" fill="#146ca1"/><path d="M264 137L401.5 137" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M408 137L398 142L398 132Z" fill="#146ca1"/><circle cx="75" cy="137" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="75" y="144" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">x</text><circle cx="240" cy="137" r="24" fill="#eef8f5" stroke="#258375" stroke-width="2" opacity="1"/><text x="240" y="144" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">h</text><circle cx="430" cy="137" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="430" y="144" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">vh</text><text x="240" y="98" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">ReLU(wx)</text><text x="335" y="123" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">乘 v</text><path d="M452 131L547.7641 102.8341" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M554 101L545.8172 108.6185L542.9955 99.0248Z" fill="#146ca1"/><path d="M452 143L547.7641 171.1659" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M554 173L542.9955 174.9752L545.8172 165.3815Z" fill="#146ca1"/><text x="570" y="107" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">L: vh</text><text x="570" y="180" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R: 3−vh</text><text x="30" y="262" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">当前输入 s：x=1</text><path d="M66 293L66 445" fill="none" stroke="#e5ecf1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="66" y="475" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M150 293L150 445" fill="none" stroke="#e5ecf1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="150" y="475" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M234 293L234 445" fill="none" stroke="#e5ecf1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="234" y="475" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M318 293L318 445" fill="none" stroke="#e5ecf1" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="318" y="475" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M66 452L318 452" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="319" y="500" font-size="17" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">价值</text><text x="28" y="336" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">L</text>