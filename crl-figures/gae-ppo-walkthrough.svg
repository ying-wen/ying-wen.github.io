<svg xmlns="http://www.w3.org/2000/svg" width="720" height="951" viewBox="0 0 720 951" role="img" aria-labelledby="crl-9xegpq-title crl-9xegpq-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-9xegpq-title">把一条轨迹送入 PPO</title><desc id="crl-9xegpq-desc">原创精确算例：三个状态选前进才继续，任一其他动作以零奖励终止。给定成功轨迹奖励0、0、1，旧价值.2、.8、.4，终止值0，gamma1、lambda.5。优势.55、-.1、.6和lambda目标.75、.7、1固定。旧采样动作概率均.5，候选.7、.3、.55，epsilon.2。两条clipped单项的log概率偏导为零，但不是策略变化的硬约束。最后用整个小MDP的通关概率独立评价，未执行随机采样或优化。</desc><rect width="720" height="951" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">把一条轨迹送入 PPO</text><text x="28" y="88" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 一条成功轨迹，旧值不准确</text><path d="M98 145L225.5 145" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M232 145L222 150L222 140Z" fill="#146ca1"/><text x="165" y="123" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">R=0</text><circle cx="70" cy="145" r="25" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="70" y="151" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">s0</text><text x="70" y="197" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V旧=0.2</text><path d="M288 145L415.5 145" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M422 145L412 150L412 140Z" fill="#146ca1"/><text x="355" y="123" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">R=0</text><circle cx="260" cy="145" r="25" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="260" y="151" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">s1</text><text x="260" y="197" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V旧=0.8</text><path d="M478 145L605.5 145" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M612 145L602 150L602 140Z" fill="#146ca1"/><text x="545" y="123" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">R=1</text><circle cx="450" cy="145" r="25" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="450" y="151" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">s2</text><text x="450" y="197" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V旧=0.4</text><circle cx="640" cy="145" r="25" fill="#e1f2eb" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="640" cy="145" r="20" fill="none" stroke="#258375" stroke-width="2" opacity="1"/><text x="640" y="151" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">终</text><text x="640" y="197" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V旧=0</text><text x="28" y="252" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 反向累加：δ → A → 固定标签</text><text x="310" y="293" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=0</text><text x="462" y="293" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=1</text><text x="614" y="293" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=2</text><text x="28" y="333" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">δ</text><text x="310" y="333" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0.6</text><text x="462" y="333" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">−0.4</text><text x="614" y="333" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0.6</text><text x="28" y="373" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">GAE</text><text x="310" y="373" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.55</text><text x="462" y="373" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">−0.1</text><text x="614" y="373" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.6</text><text x="28" y="413" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">V旧 + GAE</text><text x="310" y="413" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.75</text><text x="462" y="413" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.7</text><text x="614" y="413" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="28" y="463" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">γ=1，λ=.5；旧 log p = log(.5)</text><text x="28" y="518" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · 同一批数据，改变动作概率</text><text x="28" y="567" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">t=0   A=0.55</text><text x="28" y="613" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">旧</text><path d="M72 607L226 607" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M72 607L149 607" fill="none" stroke="#52687b" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="149" cy="607" r="5" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="160" y="613" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0.5</text><text x="28" y="655" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">新</text><pa