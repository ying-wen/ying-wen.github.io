" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0.3</text><text x="303" y="688" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="457" y="688" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="259" y="725" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">r=0.6   ℓ=−0.08</text><text x="259" y="760" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">本项 log p 导数 = 0</text><text x="490" y="567" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">t=2   A=0.6</text><text x="490" y="613" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">旧</text><path d="M534 607L688 607" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M534 607L611 607" fill="none" stroke="#52687b" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="611" cy="607" r="5" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="622" y="613" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0.5</text><text x="490" y="655" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">新</text><path d="M534 649L688 649" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M534 649L618.7 649" fill="none" stroke="#146ca1" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="618.7" cy="649" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="629.7" y="655" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0.55</text><text x="534" y="688" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="688" y="688" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="490" y="725" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">r=1.1   ℓ=0.66</text><text x="490" y="760" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">本项 log p 导数 = 0.66</text><text x="28" y="835" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">4 · 独立评价：通关概率</text><text x="28" y="878" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">旧：.5 × .5 × .5 = .125</text><text x="28" y="916" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">新：.7 × .3 × .55 = .1155</text></g></svg>
