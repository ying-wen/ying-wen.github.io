<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1220" viewBox="0 0 720 1220" role="img" aria-labelledby="crl-1onew7s-title crl-1onew7s-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1onew7s-title">投影怎样搬运概率质量</title><desc id="crl-1onew7s-desc">原创categorical精算，五原子支持0至4。上部后继v在0和4各.5，经r=.5 gamma=.5到.5和2.5，各自按相邻距离插值到0/1及2/3，每点.25，均值保留1.5。下部只把首款改3，目标3/5各.5；5超支持并裁到4，目标均值4变3.5，而总质量仍为1。横轴延伸到5以显示溢出，5不是固定支持格点。虚线箭头表示对应关系，红实线表示裁剪。所有柱高由附带计算生成。</desc><rect width="720" height="1220" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">投影怎样搬运概率质量</text><text x="28" y="83" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">固定支持 z=0,1,2,3,4；N=5</text><path d="M70 200L640 200" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M70 200L70 206" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="70" y="228" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M184 200L184 206" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="184" y="228" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M298 200L298 206" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="298" y="228" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M412 200L412 206" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="412" y="228" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M526 200L526 206" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="526" y="228" font-size="