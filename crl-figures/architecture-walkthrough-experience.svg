<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="crl-xepjad-title crl-xepjad-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-xepjad-title">先走两趟，得到四条经验</title><desc id="crl-xepjad-desc">原创确定性配送任务的实际采集轨迹。第一趟从S选近路一步到D得2；重置位置后走S到A到B到G，奖励0、0、6。两次任务终止均重返S，重置不计奖励或环境步，学习器保留。Q从零开始、步长1、折扣0.9，四次真实更新后S近、S远、A、B的Q分别为2、0、0、6。绘图只使用实际轨迹中已经观察的边。</desc><rect width="720" height="680" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先走两趟，得到四条经验</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">真实时钟 t=1…4；模型调用 k=0</text><path d="M87.1386 210.7327L251.8655 141.7772" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M257.8614 139.2673L250.5677 147.7409L246.7063 138.5165Z" fill="#146ca1"/><text x="157" y="140" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">t1: +2</text><path d="M88.2479 225.961L230.4558 262.4246" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M236.7521 264.039L225.8236 266.3986L228.3073 256.7119Z" fill="#146ca1"/><text x="160" y="280" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">t2: 0</text><path d="M284 270L419.5 270" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M426 270L416 275L416 265Z" fill="#146ca1"/><text x="352" y="240" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">t3: 0</text><path d="M474 270L619.5 270" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M626 270L616 275L616 265Z" fill="#146ca1"/><text x="549" y="240" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">t4: +6</text><circle cx="65" cy="220" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="65" y="226" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="280" cy="130" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="280" cy="130" r="16" fill="none" stroke="#146ca1" stroke-width="1" opacity="1"/><text x="280" y="136" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">D</text><circle cx="260" cy="270" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="260" y="276" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="450" cy="270" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="450" y="276" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="650" cy="270" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="650" cy="270" r="16" fill="none" stroke="#146ca1" stroke-width="1" opacity="1"/><text x="650" y="276" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="65" y="185" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">出发</text><text x="28" y="365" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">四次直接更新后的 Q</text><path d="M116 525L164 525" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="121" y="491" width="38" height="34" rx="2" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="140" y="479" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="140" y="555" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S近</text><path d="M256 525L304 525" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="280" y="513" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="280" y="555" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S远</text><path d="M396 525L444 525" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="420" y="513" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="420" y="555" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M536 525L584 525" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="541" y="423" width="38" height="102" rx="2" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="560" y="411" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="560" y="555" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="28" y="610" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">每条模型边：1 次真实观察</text><text x="28" y="645" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">双圈：送达终止；重返 S 不清空学习器</text></g></svg>
