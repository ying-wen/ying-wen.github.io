<svg xmlns="http://www.w3.org/2000/svg" width="720" height="572" viewBox="0 0 720 572" role="img" aria-labelledby="crl-2nbciw-title crl-2nbciw-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-2nbciw-title">GAE 有两条不同的接续路径</title><desc id="crl-2nbciw-desc">给定当前奖励一、旧价值0.5、后继旧价值一、折扣0.9和lambda0.8。真正终止不自举也不接下一行，优势0.5；外部时间截断后重置保留最后观测的自举但不接新轨迹，优势1.4；同一轨迹下一优势为一时接续，优势2.12。蓝箭头为价值自举，橙箭头为样本递推，红双线切断相应路径。这是不同边界语义的给定数值对照。</desc><rect width="720" height="572" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="38" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">GAE 有两条不同的接续路径</text><text x="28" y="76" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">R = 1 · V = 0.5 · V′ = 1</text><text x="370" y="76" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">γ = 0.9 · λ = 0.8</text><rect x="20" y="110" width="214" height="314" rx="8" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><text x="34" y="138" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">任务真正终止</text><circle cx="63" cy="184" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M81 184L165.5 184" fill="none" stroke="#146ca1" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M172 184L162 189L162 179Z" fill="#146ca1"/><circle cx="191" cy="184" r="13" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><circle cx="191" cy="184" r="18" fill="none" stroke="#52687b" stroke-width="2" opacity="1"/><text x="127" y="172" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">+1</text><text x="63" y="221" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V=.5</text><text x="191" y="221" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">终止</text><path 