00" opacity="1">+1</text><text x="296" y="221" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V=.5</text><text x="424" y="221" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V′=1</text><path d="M424 258L302.5 258" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M296 258L306 253L306 263Z" fill="#146ca1"/><text x="267" y="288" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">bootstrap：b=1</text><path d="M424 319L302.5 319" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/><path data-arrow-mode="actual" d="M296 319L306 314L306 324Z" fill="#b65a28"/><path d="M355 310L355 328" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M364 310L364 328" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="267" y="349" font-size="17" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">接下一行：c=0</text><text x="267" y="392" font-size="24" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Â = 1.4</text><text x="453" y="392" font-size="17" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">δ=1.4</text><rect x="486" y="110" width="214" height="314" rx="8" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><text x="500" y="138" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">下一行仍是同一轨迹</text><circle cx="529" cy="184" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M547 184L631.5 184" fill="none" stroke="#146ca1" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M638 184L628 189L628 179Z" fill="#146ca1"/><circle cx="657" cy="184" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="593" y="172" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">+1</text><text x="529" y="221" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V=.5</text><text x="657" y="221" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V′=1</text><path d="M657 258L535.5 258" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M529 258L539 253L539 263Z" fill="#146ca1"/><text x="500" y="288" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">bootstrap：b=1</text><path d="M657 319L535.5 319" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M529 319L539 314L539 324Z" fill="#b65a28"/><text x="500" y="349" font-size="17" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">接下一行：c=1</text><text x="500" y="392" font-size="24" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Â = 2.12</text><text x="686" y="392" font-size="17" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">δ=1.4</text><text x="28" y="471" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">蓝箭头：使用最后观测的 V′。</text><text x="28" y="502" font-size="19" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">橙箭头：接入同轨迹的下一优势 1。</text><text x="28" y="543" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">普通 batch 尾：保留 V′，后向 carry 从 0 起。</text></g></svg>
