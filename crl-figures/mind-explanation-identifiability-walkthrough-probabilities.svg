<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1026" viewBox="0 0 720 1026" role="img" aria-labelledby="crl-1kixg0f-title crl-1kixg0f-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1kixg0f-title">参数可识别，机制仍可重合</title><desc id="crl-1kixg0f-desc">原创解析概率几何。横轴p1，纵轴p2；绿色区域满足1/2&lt;p1&lt;=p2&lt;sigmoid(2 logit(p1))，下边界alpha=1包含，上边界alpha=0排除；左下空心点(1/2,1/2)是排除的极限。A和B的p1相同，p2不同。紫色对角线也是首次反馈后锁存模型p1=p2的预测，因此delta更新模型在alpha=1时与不同的锁存机制在这两个条件完全重合。下方2x2矩阵按所有(21x21)计数的独立二项概率精确加权，生成者分别固定为(.2,5)的累积模型和kappa=1的锁存模型；每条件20轮，预定判别器在k2-k1&gt;=2时选累积，否则选锁存。行是生成者，列是选中者；不能将行条件概率倒读为模型后验，也不是对所有参数重新拟合的模型族恢复。</desc><rect width="720" height="1026" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">参数可识别，机制仍可重合</text><text x="28" y="84" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每个点是一对条件概率 (p₁,p₂)</text><path d="M72 465L77.05882352941178 460.0238399078495L82.11764705882355 455.0495423273496L87.17647058823533 450.07896744716277L92.2352941176471 445.11397081605753L97.29411764705887 440.15640103813763L102.35294117647065 435.2080974862087L107.41176470588229 430.27088803919924L112.47058823529406 425.3465868494478L117.52941176470583 420.4369921455375L122.58823529411761 415.5438840761971L127.64705882352939 410.6690226006103L132.70588235294116 405.8141454302722L137.76470588235293 400.9809660273066L142.8235294117647 396.1711716639137L147.88235294117646 391.3864215473603L152.94117647058826 386.6283450146413L158.00000000000006 381.89853980065584L163.05882352941182 377.19857038343196L168.1176470588236 372.5299664096212L173.17647058823522 367.89422120316055L178.23529411764702 363.2927903596671L183.29411764705878 358.7270904287977L188.35294117647055 354.19849768646316L193.41176470588232 349.7083469984527L198.4705882352941 345.2579307766809L203.52941176470588 340.8484980289347L20