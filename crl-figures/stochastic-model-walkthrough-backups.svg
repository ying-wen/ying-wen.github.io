<svg xmlns="http://www.w3.org/2000/svg" width="720" height="675" viewBox="0 0 720 675" role="img" aria-labelledby="crl-6d3fn0-title crl-6d3fn0-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-6d3fn0-title">同一模型的三种备份结果</title><desc id="crl-6d3fn0-desc">cross真实收到D,G后建立经验模型，各joint outcome概率1/2。三个cross目标都从同一冻结Q快照计算；alpha=1后分别写cross=0,1,1/2，然后S:go的模型查询读取本分支已写入的cross，得到go=0,.9,.45。前三行分别是模型采样D、模型采样G和枚举两后果的期望。紫虚线表示模型后果，柱长表示写入go的值。橙路径是随后真正执行的episode；若选择go，规定这次随机实际结果为D，回报0；选择exit实际得0.6。底部预算只计行动前两次规划：接口查询均2，sample处理2后果、expectation处理3后果，均写2次价值、获得0个新真实样本；图中的实际episode另计1或2环境步。原创精确分支比较，不是性能排序。</desc><rect width="720" height="675" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一模型的三种备份结果</text><text x="28" y="87" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">共同快照：cross=.5，go=.45</text><text x="28" y="122" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">模型：D,r0 与 G,r1 各占 1/2</text><text x="22" y="202" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">采样：抽到 D</text><circle cx="126" cy="245" r="17" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><text x="126" y="251" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">D</text><path d="M126 267L126 300.45" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M126 305L122.5 298L129.5 298Z" fill="#7854a2"/><text x="126" y="330" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">cross ← 0</text><path d="M56 367L206 367" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="56" y="355" width="0" height="24" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" o