<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1090" viewBox="0 0 720 1090" role="img" aria-labelledby="crl-11qhxq2-title crl-11qhxq2-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-11qhxq2-title">写入多少，决定哪段记忆占上风</title><desc id="crl-11qhxq2-desc">原创数值算例，第3次与第6次到达的负提示。顶条按实际g划分保留与写入比例。三条带符号横线共用零点和数值尺度，依次画(1-g)h_old、gc和两者之和。第3次旧活动部分0.323367超过负提示0.293899，h=0.029467，选左失败；第6次负提示0.408322超过旧活动0.370164，h=-0.038158，选右成功。橙箭头是实际动作；灰路每步保持h。</desc><rect width="720" height="1090" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">写入多少，决定哪段记忆占上风</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧活动按 1−g 保留；当前提示按 g 写入</text><text x="28" y="135" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">第 3 次：c=−1，g=0.2939</text><rect x="28" y="165" width="664" height="20" rx="0" fill="#e5e9ef" stroke="none" stroke-width="1.5" opacity="1"/><rect x="496.8508" y="165" width="195.1492" height="20" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="214" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">保留 0.706</text><text x="692" y="214" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">写入 0.294</text><path d="M360 257L360 445" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="260" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">旧活动部分</text><path d="M360 283L450.5426 283" fill="none" stroke="#52687b" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="450.5426" cy="283" r="5" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="692" y="260" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">+0.3234</text><text x="28" y="327" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">新提示部分</text><path d="M360 350L277.7082 350" fill="none" stroke="#146ca1" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="277.7082" cy="350" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="692" y="327" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">−0.2939</text><text x="28" y="394" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">混合后的 h</text><path d="M360 417L368.2508 417" fill="none" stroke="#b54142" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="368.2508" cy="417" r="5" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><text x="692" y="394" font-size="18" fill="#b54142" text-anchor="end" font-weight="400" opacity="1">+0.0295</text><text x="360" y="470" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M360 494L301.5 494" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M295 494L305 489L305 499Z" fill="#b65a28"/><text x="28" y="532" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">在 J 选左，实际 r=−1</text><text x="28" y="575" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">第 6 次：c=−1，g=0.4083</text><rect x="28" y="605" width="664" height="20" rx="0" fill="#e5e9ef" stroke="none" stroke-width="1.5" opacity="1"/><rect x="420.8739" y="605" width="271.1261" height="20" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="654" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">保留 0.592</text><text x="692" y="654" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">写入 0.408</text><path d="M360 697L360 885" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="700" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">旧活动部分</text><path d="M360 723L463.646 723" fill="none" stroke="#52687b" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="463.646" cy="723" r="5" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="692" y="700" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">+0.3702</text><text x="28" y="767" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">新提示部分</text><path d="M360 790L245.6697 790" fill="none" stroke="#146ca1" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="245.6697" cy="790" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="692" y="767" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">−0.4083</text><text x="28" y="834" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">混合后的 h</text><path d="M360 857L349.3157 857" fill="none" stroke="#258375" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="349.3157" cy="857" r="5" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="692" y="834" font-size="18" fill="#258375" text-anchor="end" font-weight="400" opacity="1">−0.0382</text><text x="360" y="910" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M360 934L418.5 934" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M425 934L415 939L415 929Z" fill="#b65a28"/><text x="28" y="972" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">在 J 选右，实际 r=+1</text><text x="28" y="1049" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两次都是 C 后 4 次灰观察；保持通道 ρ=1 给定</text></g></svg>
