<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1747" viewBox="0 0 360 1747" role="img" aria-labelledby="crl-1b9ydbs-title crl-1b9ydbs-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1b9ydbs-title">把一条轨迹送入 PPO</title><desc id="crl-1b9ydbs-desc">原创精确算例：三个状态选前进才继续，任一其他动作以零奖励终止。给定成功轨迹奖励0、0、1，旧价值.2、.8、.4，终止值0，gamma1、lambda.5。优势.55、-.1、.6和lambda目标.75、.7、1固定。旧采样动作概率均.5，候选.7、.3、.55，epsilon.2。两条clipped单项的log概率偏导为零，但不是策略变化的硬约束。最后用整个小MDP的通关概率独立评价，未执行随机采样或优化。</desc><rect width="360" height="1747" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="38" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">把一条轨迹送入 PPO</text><text x="28" y="88" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 一条成功轨迹，旧值不准确</text><path d="M66 173L66 224.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M66 231L61 221L71 221Z" fill="#146ca1"/><text x="110" y="208" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R=0</text><circle cx="66" cy="145" r="25" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="66" y="151" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">s0</text><text x="110" y="151" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">V旧=0.2</text><path d="M66 287L66 338.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M66 345L61 335L71 335Z" fill="#146ca1"/><text x="110" y="322" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R=0</text><circle cx="66" cy="259" r="25" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="66" y="265" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">s1</text><text x="110" y="265" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">V旧=0.8</text><path d="M66 401L66 452.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M66 459L61 449L71 449Z" fill="#146ca1"/><text x="110" y="436" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R=1</text><circle cx="66" cy="373" r="25" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="66" y="379" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">s2</text><text x="110" y="379" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">V旧=0.4</text><circle cx="66" cy="487" r="25" fill="#e1f2eb" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="66" cy="487" r="20" fill="none" stroke="#258375" stroke-width="2" opacity="1"/><text x="66" y="493" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">终</text><text x="110" y="493" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">V旧=0</text><text x="28" y="557" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 反向累加：δ → A → 固定标签</text><text x="143" y="598" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=0</text><text x="217" y="598" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=1</text><text x="294" y="598" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=2</text><text x="28" y="638" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">δ</text><text x="143" y="638" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0.6</text><text x="217" y="638" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">−0.4</text><text x="294" y="638" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0.6</text><text x="28" y="678" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">GAE</text><text x="143" y="678" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.55</text><text x="217" y="678" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">−0.1</text><text x="294" y="678" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.6</text><text x="28" y="718" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">V旧 + GAE</text><text x="143" y="718" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.75</text><text x="217" y="718" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.7</text><text x="294" y="718" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="28" y="768" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">γ=1，λ=.5；旧 log p = log(.5)</text><text x="28" y="823" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · 同一批数据，改变动作概率</text><text x="28" y="872" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">t=0   A=0.55</text><text x="28" y="918" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">旧</text><path d="M72 912L322 912" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M72 912L197 912" fill="none" stroke="#52687b" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="197" cy="912" r="5" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="208" y="918" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0.5</text><text x="28" y="960" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">新</text><path d="M72 954L322 954" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M72 954L247 954" fill="none" stroke="#146ca1" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="247" cy="954" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="258" y="960" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0.7</text><text x="72" y="993" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="322" y="993" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="28" y="1030" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">r=1.4   ℓ=0.66</text><text x="28" y="1065" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">本项 log p 导数 = 0</text><text x="28" y="1114" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">t=1   A=−0.1</text><text x="28" y="1160" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">旧</text><path d="M72 1154L322 1154" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M72 1154L197 1154" fill="none" stroke="#52687b" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="197" cy="1154" r="5" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="208" y="1160" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0.5</text><text x="28" y="1202" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">新</text><path d="M72 1196L322 1196" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M72 1196L147 1196" fill="none" stroke="#146ca1" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="147" cy="1196" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="158" y="1202" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0.3</text><text x="72" y="1235" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="322" y="1235" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="28" y="1272" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">r=0.6   ℓ=−0.08</text><text x="28" y="1307" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">本项 log p 导数 = 0</text><text x="28" y="1356" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">t=2   A=0.6</text><text x="28" y="1402" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">旧</text><path d="M72 1396L322 1396" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M72 1396L197 1396" fill="none" stroke="#52687b" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="197" cy="1396" r="5" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="208" y="1402" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0.5</text><text x="28" y="1444" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">新</text><path d="M72 1438L322 1438" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M72 1438L209.5 1438" fill="none" stroke="#146ca1" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="209.5" cy="1438" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="220.5" y="1444" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0.55</text><text x="72" y="1477" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="322" y="1477" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="28" y="1514" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">r=1.1   ℓ=0.66</text><text x="28" y="1549" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">本项 log p 导数 = 0.66</text><text x="28" y="1631" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">4 · 独立评价：通关概率</text><text x="28" y="1674" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">旧：.5 × .5 × .5 = .125</text><text x="28" y="1712" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">新：.7 × .3 × .55 = .1155</text></g></svg>
