<svg xmlns="http://www.w3.org/2000/svg" width="720" height="861" viewBox="0 0 720 861" role="img" aria-labelledby="crl-1hbrbz-title crl-1hbrbz-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1hbrbz-title">相同权重，不同的下一步</title><desc id="crl-1hbrbz-desc">原创精确算例。三条给定转移A到B到C到终点，奖励2、0、1；观察1、0、0。固定活动递推h下一步=h/2+下一观察，终点不bootstrap。紫框是在完成第一条转移后、B处暂停；保存w=2/21、h=.5、z=1、max_v=2及时间位置。下部四行共用权重轴[.065,.1]，空圆为旧权重，方块为第二次更新后权重；完整恢复、清z、清max_v和清h分别得到.093556391、.094548872、.071023010、.095238095。只清h的方块与旧权重重合。alpha=.1、gamma=.9、lambda=.8、beta=.9、epsilon=.1。圆半径辅助表示活动h的大小。无随机训练，差异不是控制性能。</desc><rect width="720" height="861" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同权重，不同的下一步</text><text x="28" y="83" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">活动状态随观察保留：h′ = h/2 + o′</text><circle cx="83" cy="157" r="20" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="83" y="206" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A · t=0</text><text x="83" y="234" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">o=1   h=1</text><path d="M108 157L236.5 157" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M243 157L233 162L233 152Z" fill="#146ca1"/><text x="175.5" y="134" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">R=2</text><circle cx="268" cy="157" r="15" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="268" y="206" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B · t=1</text><text x="268" y="234" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">o=0   h=0.5</text><path d="M293 157L421.5 157" fill="none" stro