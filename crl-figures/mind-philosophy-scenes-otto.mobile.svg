<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1235" viewBox="0 0 360 1235" role="img" aria-labelledby="crl-ql7qd5-title crl-ql7qd5-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-ql7qd5-title">地址在哪里，行动怎样改变？</title><desc id="crl-ql7qd5-desc">Inga 从生物记忆取回第53街地址；Otto 从随身笔记读出同一地址；两人前往同一博物馆。Twin Otto 与 Otto 皮肤内状态相同，笔记却误记为第51街，因而走向另一处。蓝箭头为读取，橙箭头为行走，位置只作示意。</desc><rect width="360" height="1235" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="20" y="39" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">地址在哪里，行动怎样改变？</text><text x="20" y="78" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一目的，不同的信息保存位置</text><text x="24" y="130" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Inga · 脑内记忆</text><g transform="translate(71 197)"><circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><path d="M0 17L0 72" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 31L-24 49" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 31L26 45" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 72L-21 102" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 72L22 102" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/></g><g transform="translate(211 203)"><path d="M-47 12Q-65 -7 -43 -24Q-43 -47 -18 -40Q0 -55 21 -39Q48 -42 49 -19Q69 0 47 14Z" fill="#f5f8fb" stroke="#52687b" stroke-width="1.7"/><text x="0" y="-6" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">53街</text><circle cx="-31" cy="25" r="5" fill="#ffffff" stroke="#52687b" stroke-width="1" opacity="1"/><circle cx="-43" cy="38" r="3" fill="#ffffff" stroke="#52687b