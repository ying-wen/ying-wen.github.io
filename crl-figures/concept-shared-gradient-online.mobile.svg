<svg xmlns="http://www.w3.org/2000/svg" width="360" height="704" viewBox="0 0 360 704" role="img" aria-labelledby="crl-1kjm2ay-title crl-1kjm2ay-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1kjm2ay-title">在线参数变化还需要一次补偿</title><desc id="crl-1kjm2ay-desc">原创精确参数路径图，固定走廊与同一首步权重(1,0)。第二步TD误差为−1.8，保存的旧B预测是0而当前B预测是0.8。红箭头使用普通累积迹到(−0.17,−0.54)。紫箭头只使用Dutch迹的TD增量到(−0.026,−0.432)，橙箭头再加预测变化修正(0.136,−0.048)到(0.11,−0.48)。这个终点与逐前缀在线前向定义一致。箭头表示参数更新，不表示环境动作或性能排名。</desc><rect width="360" height="704" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">在线参数变化还需要一次补偿</text><text x="24" y="84" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">首步已经更新：w₁=(1,0)，v̂(B)=0.8</text><path d="M68 195.8333L313 195.8333" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M117 475L117 140" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="313" y="243.8333" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">参数 1</text><text x="117" y="124" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">参数 2</text><path d="M117 191.8333L117 199.8333" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="117" y="219.8333" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M280.3333 191.8333L280.3333 199.8333" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="280.3333" y="219.8333" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M117 195.8333L274.4833 195.8333" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M280.3333 195.8