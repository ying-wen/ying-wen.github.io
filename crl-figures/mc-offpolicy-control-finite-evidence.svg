<svg xmlns="http://www.w3.org/2000/svg" width="720" height="987" viewBox="0 0 720 987" role="img" aria-labelledby="crl-1rdehdo-title crl-1rdehdo-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1rdehdo-title">指定路径以外：全部有限分支的价值分布</title><desc id="crl-1rdehdo-desc">同一两步任务、零Q与C初始化、贪心平局选B、行为ε=.2。上图横轴为改善后的确定性目标真实Vπ(S0)，纵轴为其精确出现概率。实心蓝点为首回合4条轨迹，空心橙点为两回合16个有序自适应分支；各分支的采样概率由先前Q产生的行为决定，并非等概率。Vπ=0概率从.81变为.6561，2与4的概率为首回合.18,.01、两回合.3096,.0343。下图共用0至4价值坐标，实线橙色是目标策略期望0,.4,.7564，虚线蓝色是含探索行为期望.4,.72,1.00512；横轴为完整回合预算0,1,2。数据为原创有限枚举并用独立闭式权重和核验，未运行随机训练、没有种子误差条或一般单调改善主张。</desc><rect width="720" height="987" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">指定路径以外：全部有限分支的价值分布</text><text x="22" y="81" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">枚举首回合4条、两回合16个自适应分支</text><path d="M80 150L80 360" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M80 360L80 365" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="80" y="386" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M383 150L383 360" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M383 360L383 365" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="383" y="386" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M686 150L686 360" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M686 360L686 365" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="686" y="386" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M80 360L686 360" fill=