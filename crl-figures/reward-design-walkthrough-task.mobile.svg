<svg xmlns="http://www.w3.org/2000/svg" width="360" height="843" viewBox="0 0 360 843" role="img" aria-labelledby="crl-qvlwsc-title crl-qvlwsc-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-qvlwsc-title">一件包裹，最多三个动作</title><desc id="crl-qvlwsc-desc">原创确定性有限任务。状态为(时钟t,物理位置x)。S只有接近，A可送达或等待。送达原奖励1，其余0；gamma0.9。第3个动作后为真正期限终止，已送达G也终止。全部三条路径为第2步送达、第3步送达、等待至超时。势在S为1、非终端A为3、所有终端为0。代理额外为每次进入A支付3，包括截止动作；该代理不识别真正送达。箭头为合法实际转移，不表示采样频率。</desc><rect width="360" height="843" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一件包裹，最多三个动作</text><text x="28" y="84" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每步耗时1；第3步后任务真正结束</text><path d="M180 170L180 230.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 237L175 227L185 227Z" fill="#146ca1"/><text x="154" y="210" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">接近</text><path d="M164.5545 284.658L91.3148 377.872" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M87.299 382.9831L89.5456 372.0308L97.4088 378.209Z" fill="#146ca1"/><text x="104.5557" y="323.9366" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">送达</text><path d="M193.5189 286.0295L251.3439 375.9793" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M254.8588 381.447L245.2453 375.739L253.6571 370.3314Z" fill="#146ca1"/><text x="246.8706" y="325.9403" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">等待</text><path d="M256.5781 426.0915L183.5222 540.8937" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180.0325 546.3775L181.183 535.2565L189.6196 540.6252Z" fill="#146ca1"/><text x="195.5648" y="478.5412" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">送达</text><path d="M273.0083 429.8183L285.8486 535.7507" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M286.6307 542.2035L280.4637 532.8778L290.3911 531.6745Z" fill="#b54142"/><text x="305.8111" y="489.3714" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">等待</text><circle cx="180" cy="145" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="180" y="151" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">S</text><text x="225" y="139" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">t=0</text><text x="225" y="163" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">Φ=1</text><circle cx="180" cy="265" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="180" y="271" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="225" y="259" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">t=1</text><text x="225" y="283" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">Φ=3</text><circle cx="70" cy="405" r="24" fill="#ffffff" stroke="#258375" stroke-width="2.5" opacity="1"/><circle cx="70" cy="405" r="19" fill="#ffffff" stroke="#258375" stroke-width="1" opacity="1"/><text x="70" y="411" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="70" y="454" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=2</text><text x="70" y="479" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Φ=0</text><circle cx="270" cy="405" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="270" y="411" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="230" y="399" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">t=2</text><text x="230" y="423" font-size="16" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">Φ=3</text><circle cx="165" cy="570" r="24" fill="#ffffff" stroke="#258375" stroke-width="2.5" opacity="1"/><circle cx="165" cy="570" r="19" fill="#ffffff" stroke="#258375" stroke-width="1" opacity="1"/><text x="165" y="576" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="165" y="619" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=3</text><text x="165" y="644" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Φ=0</text><circle cx="290" cy="570" r="24" fill="#ffffff" stroke="#b54142" stroke-width="2.5" opacity="1"/><circle cx="290" cy="570" r="19" fill="#ffffff" stroke="#b54142" stroke-width="1" opacity="1"/><text x="290" y="576" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="290" y="619" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=3</text><text x="290" y="644" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">Φ=0</text><text x="28" y="702" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">S：出发；A：门口；G：已送达</text><text x="28" y="737" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">双圈表示终端；红圈是未送达超时</text><text x="28" y="772" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">仅送达给原奖励1；γ=0.9</text><text x="28" y="807" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">代理另给到达/停留门口的每一步+3</text></g></svg>
