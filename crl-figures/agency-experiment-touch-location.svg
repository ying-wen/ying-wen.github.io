<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1493" viewBox="0 0 720 1493" role="img" aria-labelledby="crl-oa63h5-title crl-oa63h5-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-oa63h5-title">橡胶手：体验与位置怎样分开测？</title><desc id="crl-oa63h5-desc">装置与程序示意，依据Botvinick与Cohen1998年原文p756，以及Rohde等2011年Methods和Figure1原创重绘。上部显示立屏遮住左手和两画笔刷触，读者看见的虚线真手不是参与者可见信息。后续实验用黑布遮住真手，通过半透镜切换可见假手与暗场白点；实验2定位时刷触暂停，以鼠标调整光点三次取平均。时间线只累计120秒刺激，紫色标记为暂停定位事件，未编码暂停耗时。另有40秒组；仅观看控制只用于10秒与120秒组且总为第三块。未绘制实验数据、所有感强度或漂移量。</desc><rect width="720" height="1493" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">橡胶手：体验与位置怎样分开测？</text><text x="28" y="78" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同步刷触后，分别询问体验与位置</text><text x="28" y="121" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1998：屏风遮住真实左手</text><rect x="34" y="158" width="652" height="245" rx="6" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="131" y="188" width="126" height="159" rx="2" fill="#e4eaf0" stroke="#52687b" stroke-width="1.5" opacity="1"/><g transform="translate(194 293) rotate(0) scale(-0.8 0.8)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#52687b" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M-19 14Q3 7 23 14" fill="none" stroke="#52687b" stroke-width="1.2"/></g><g transform="translate(526 293) rotate(0) scale(-0.8 0.8)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" /><path d="M-19 14Q3 7 23 14" fill="none" stroke="#146ca1" stroke-width="1.2"/></g><path d="M353.36 164L353.36 355" fill="none" stroke="#19354e" stroke-width="8" stroke-linecap="round" opacity="1"/><path d="M183 217L201 187" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M178 224L188 210" fill="none" stroke="#b65a28" stroke-width="8" stroke-linecap="round" opacity="1"/><path d="M515 217L533 187" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M510 224L520 210" fill="none" stroke="#b65a28" stroke-width="8" stroke-linecap="round" opacity="1"/><text x="194" y="376" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">真实左手</text><text x="526" y="376" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">橡胶左手</text><path d="M428.32 419Q446.32 402 464.32 419Q446.32 436 428.32 419Z" fill="#ffffff" stroke="#19354e" stroke-width="2"/><circle cx="446.32" cy="419" r="6" fill="#19354e" stroke="none" stroke-width="2" opacity="1"/><path d="M446.32 403L522.02 339.3466" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M526 336L522.4513 344.2102L517.3026 338.0871Z" fill="#146ca1"/><path d="M446.32 403L353.36 355" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/><text x="273.68" y="420" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">屏风</text><text x="446.32" y="455" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">参与者只看见假手</text><text x="28" y="490" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">读者俯视示意；虚线真手在遮挡内</text><path d="M20 518L700 518" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="554" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2011：照明切换，把位置单独测出</text><text x="28" y="599" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">照明：看假手</text><rect x="36" y="633" width="302" height="163" rx="4" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><g transform="translate(202.9 759) rotate(0) scale(-0.82 0.82)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" /><path d="M-19 14Q3 7 23 14" fill="none" stroke="#146ca1" stroke-width="1.2"/></g><path d="M194.9 680L212.9 650" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M189.9 687L199.9 673" fill="none" stroke="#b65a28" stroke-width="8" stroke-linecap="round" opacity="1"/><text x="187" y="823" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">照明关闭后，假手消失</text><text x="28" y="856" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">黑布下真实手仍被刷触</text><text x="374" y="599" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">暗场：只看白点</text><rect x="382" y="633" width="302" height="163" rx="4" fill="#19354e" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="567.98" cy="691" r="7" fill="#ffffff" stroke="none" stroke-width="2" opacity="1"/><path d="M485.3 745L549.43 745" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M553.98 745L546.98 748.5L546.98 741.5Z" fill="#ffffff"/><text x="533" y="772" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">调整光点的位置</text><text x="374" y="856" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">刷触暂停；三次调整取平均</text><text x="28" y="902" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两机械臂刷触；真手一直在黑布下</text><text x="28" y="933" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">左右相隔 17 cm；光点经半透镜投射</text><path d="M20 959L700 959" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="998" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实验 2：同为 120 秒刺激</text><text x="28" y="1031" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每组内比较同步和异步两块</text><text x="28" y="1077" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 × 120 秒后定位</text><path d="M40 1109L680 1109" fill="none" stroke="#146ca1" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="680" cy="1109" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M680 1116L680 1129" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="40" y="1159" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0</text><text x="680" y="1159" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">120 秒刺激</text><text x="28" y="1194" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">12 × 10 秒，各段后定位</text><path d="M40 1226L680 1226" fill="none" stroke="#146ca1" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="93.3333" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M93.3333 1233L93.3333 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="146.6667" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M146.6667 1233L146.6667 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="200" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M200 1233L200 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="253.3333" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M253.3333 1233L253.3333 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="306.6667" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M306.6667 1233L306.6667 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="360" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M360 1233L360 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="413.3333" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M413.3333 1233L413.3333 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="466.6667" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M466.6667 1233L466.6667 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="520" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M520 1233L520 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="573.3333" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M573.3333 1233L573.3333 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="626.6667" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M626.6667 1233L626.6667 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="680" cy="1226" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M680 1233L680 1246" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="40" y="1276" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0</text><text x="680" y="1276" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">120 秒刺激</text><text x="28" y="1318" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">另有 3 × 40 秒组；图中未展开</text><circle cx="35" cy="1353" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="50" y="1359" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">定位暂停：时间另加</text><text x="28" y="1395" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">横向只累计刺激，不是总历时</text><text x="28" y="1430" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">仅观看：用于 10 秒与 120 秒组</text><text x="28" y="1461" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">它总在同步／异步之后进行</text></g></svg>
