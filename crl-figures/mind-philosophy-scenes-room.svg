<svg xmlns="http://www.w3.org/2000/svg" width="720" height="566" viewBox="0 0 720 566" role="img" aria-labelledby="crl-12qqr7a-title crl-12qqr7a-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-12qqr7a-title">中文房间：从字符到回答</title><desc id="crl-12qqr7a-desc">思想实验的房间包含只懂英语的操作者、英文规则和工作记录。房外输入问题并读取回答；虚线圈出操作者，紫线圈出整个系统。字符以几何笔画抽象表示。比较的是理解的归属层次，不是已完成的行为实验。</desc><rect width="720" height="566" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">中文房间：从字符到回答</text><text x="20" y="78" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">外部问答成功，理解应归给谁？</text><rect x="156" y="121" width="410" height="340" rx="8" fill="#f8f5fb" stroke="#7854a2" stroke-width="2.5" opacity="1"/><text x="172" y="151" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">整个系统：人、规则与记录</text><g transform="translate(261 228)"><circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><path d="M0 17L0 72" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 31L-24 49" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 31L26 45" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 72L-21 102" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 72L22 102" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/></g><ellipse cx="261" cy="271" rx="44" ry="76" fill="none" stroke="#52687b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="261" y="372" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">操作者</text><g transform="translate(401 192)"><rect x="0" y="0" width="100" height="86" rx="2" fill="#f5f8fb" stroke="#5268