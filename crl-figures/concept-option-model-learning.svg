<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="crl-vu19rf-title crl-vu19rf-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-vu19rf-title">模型怎样从四次转移中学到后果？</title><desc id="crl-vu19rf-desc">同一四步门口轨迹。完整段模型在g停止后把A的奖励估计改成−3.439，带折扣终点质量改成0.6561。一阶intra-option模型从零开始，按A、B、C、D的顺序读取固定记录四遍；每遍终点信息向前传播一格。圆下面第一行为奖励模型，第二行为到g的带折扣终点质量。g只是option停止点，不是环境终点，图中不对g初始化一个虚构的零步模型。</desc><rect width="720" height="1000" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="39" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">模型怎样从四次转移中学到后果？</text><text x="24" y="78" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一条 A → B → C → D → g</text><text x="24" y="107" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">每步 −1；γ=0.9；初始模型全为 0</text><text x="24" y="150" font-size="21" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">到达 g 后，用完整段更新 A</text><text x="24" y="185" font-size="22" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">奖励 −3.439；终点质量 0.6561</text><path d="M24 213L696 213" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="24" y="248" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">逐步模型：按原顺序读固定记录</text><text x="24" y="278" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">圆下两行：奖励模型 / 到 g 的折扣质量</text><text x="24" y="320" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">第 1 遍</text><path d="M158 350L221.45 350" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M226 350L219 353.5L219 346.5Z" fill="#146ca1"/><circle cx="136" cy="350" r="20" fill="#ffffff" stroke="#c8d6e0" stroke-width="2" opacity="1"/><t