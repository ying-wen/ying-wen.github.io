linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M264 104L254 109L254 99Z" fill="#7854a2"/><text x="288" y="112" font-size="26" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="156" y="162" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">结果价值由 1 变为 0</text><text x="0" y="219" font-size="19" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">只保存旧动作价值</text><path d="M23 244L23 288" fill="none" stroke="#52687b" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M23 252L57 261" fill="none" stroke="#146ca1" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="57" cy="261" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M10 290L38 290" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M70 261L249.5 261" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M256 261L246 266L246 256Z" fill="#7854a2"/><circle cx="284" cy="261" r="24" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="284" y="269" font-size="26" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="156" y="321" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">缺少更新依据，旧值仍为 1</text></g></g></svg>
