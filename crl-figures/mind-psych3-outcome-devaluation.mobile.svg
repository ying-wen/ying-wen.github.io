<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1326" viewBox="0 0 360 1326" role="img" aria-labelledby="crl-1mkomt5-title crl-1mkomt5-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1mkomt5-title">没再按过，为什么少按了？</title><desc id="crl-1mkomt5-desc">前三幅描绘结果贬值的时序：杠杆获得食物，在没有杠杆的情境把食物与不适配对，最后只测按压不给食物。实验还须设置其他食物贬值对照。第四幅为独立算例：已知动作确定到达食物，效用1变0；结果关系允许重算为0，只有旧动作缓存且没有相关更新则仍为1。虚线表示模型读取，不是实验中的再次取食。</desc><rect width="360" height="1326" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="38" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">没再按过，为什么少按了？</text><g transform="translate(24,91)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 学会动作后果</text><path d="M0 18L312 18" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="7" y="40" width="298" height="172" rx="10" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M38 85L38 129" fill="none" stroke="#52687b" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M38 93L72 102" fill="none" stroke="#146ca1" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="72" cy="102" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M25 131L53 131" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M83 99L253.5 99" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M260 99L250 104L250 94Z" fill="#146ca1"/><path d="M252,107 Q274,133 296,107 Z" fill="#ffffff" stroke="#52687b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="264" cy="104" r="5" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><circle cx="274" cy="104" r="5" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><circle cx="284" cy="104" r="5" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><g transform="translate(156,168)"><g transform="scale(0.7)"><ellipse cx="0" cy="0" rx="26" ry="15" fill="#f5f8fb" stroke="#52687b" stroke-width="2"/><circle cx="23" cy="-5" r="13" fill="#f5f8fb" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="18" cy="-16" r="6" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="29" cy="-7" r="2" fill="#19354e" stroke="none" stroke-width="2" opacity="1"/><path d="M-25,1 C-48,-12 -53,19 -68,9" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 -2L44 -6" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M35 0L44 4" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/></g></g><text x="156" y="249" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">按压后得到食物</text></g><g transform="translate(24,384)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 单独改变结果价值</text><path d="M0 18L312 18" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="7" y="40" width="298" height="172" rx="10" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M82,102 Q104,128 126,102 Z" fill="#ffffff" stroke="#52687b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="94" cy="99" r="5" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><circle cx="104" cy="99" r="5" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><circle cx="114" cy="99" r="5" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><path d="M137 101L167.5 101" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M174 101L164 106L164 96Z" fill="#b65a28"/><path d="M194,76 L194,98 C175,103 186,129 206,127 C237,124