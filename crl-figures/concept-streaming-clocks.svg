<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="707" viewBox="0 0 1080 707" role="img" aria-labelledby="title desc"><title id="title">经验继续到来，更新跟得上吗？</title><desc id="desc">横向位置是毫秒。经验帧每20毫秒到来；绿色或金色区段是每次12毫秒更新。逐条更新及时完成；三条经验合为一批；重复两次使等待依次增至4、8、12毫秒。更新块内是学习计数k，经验帧是环境计数t。</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ae691f"/></marker><marker id="rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ac586a"/></marker></defs><rect x="0" y="0" width="1080" height="707" rx="0" fill="#faf8f2" /><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="40" y="52" font-size="31" fill="#15323a" font-weight="700">经验继续到来，更新跟得上吗？</text><circle cx="224" cy="91" r="17" fill="#faf8f2" stroke="#536b70" stroke-width="2"/><line x1="224" y1="91" x2="224" y2="81" stroke="#536b70" stroke-width="2" /><line x1="224" y1="91" x2="232" y2="95" stroke="#536b70" stroke-width="2" /><text x="251" y="98" font-size="20" fill="#536b70" >20 ms / 经验</text><rect x="475" y="79" width="38" height="22" rx="4" fill="#087f83" /><text x="526" y="98" font-size="20" fill="#536b70" >12 ms / 更新</text><rect x="757" y="79" width="32" height="22" rx="4" fill="#f3dce2" /><text x="802" y="98" font-size="20" fill="#ac586a" >排队等待</text><line x1="190" y1="142" x2="190" y2="622" stroke="#d3ded8" stroke-width="2" stroke-dasharray="3 8"/><text x="190" y="656" font-size="18" fill="#536b70" text-anchor="middle">0</text><line x1="323" y1="142" x2="323" y2="622" stroke="#d3ded8" stroke-width="2" stroke-dasharray="3 8"/><text x="323" y="656" font-size="18" fill="#536b70" text-anchor="middle">20</text><line x1="456" y1="142