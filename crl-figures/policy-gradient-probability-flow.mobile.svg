<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1452" viewBox="0 0 360 1452" role="img" aria-labelledby="crl-grx0vx-title crl-grx0vx-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-grx0vx-title">把同一个参数的两处作用分开看</title><desc id="crl-grx0vx-desc">原创概率面积图。两次独立动作抽样对应单位正方形的横、纵坐标；获奖矩形面积是p0乘(1−p1)。左图只增加第一处概率，竖条面积增加；右图只增加第二处概率，横条面积移去。彩色条取dp=.08便于看见，两个面板分别保持另一处固定。实际共享theta时在p0=p1=p处将两个偏导相加，再乘sigmoid导数p(1−p)与折扣gamma。下方精确梯度贡献为+.036784与−.074073，总计−.037289；不是有限条面积变化直接当作梯度。</desc><rect width="360" height="1452" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">把同一个参数的两处作用分开看</text><text x="28" y="85" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">只有先选 1、再选 0 才获得奖励</text><circle cx="52" cy="126" r="12" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M70 126L123.5 126" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M130 126L120 131L120 121Z" fill="#b65a28"/><circle cx="148" cy="126" r="12" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><path d="M166 126L219.5 126" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M226 126L216 131L216 121Z" fill="#7854a2"/><circle cx="244" cy="126" r="15" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="244" y="132" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="52" y="163" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">第一步</text><text x="148" y="163" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">第二步</text><text x="244" y="163" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">奖励</text><text x="28" y="201" font-size="19" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">① 先只增加第一步的 p</text><rect x="55" y="230" width="260" height="260" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="55" y="230" width="173.7288" height="86.2712" rx="0" fill="#d5ebe5" stroke="none" stroke-width="1.5" opacity="1"/><rect x="228.7288" y="230" width="20.8" height="86.2712" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><path d="M228.7288 344.2712L244.9788 344.2712" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M249.5288 344.2712L242.5288 347.7712L242.5288 340.7712Z" fill="#b65a28"/><path d="M228.7288 223L228.7288 495" fill="none" stroke="#258375" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="5 5"/><path d="M249.5288 223L249.5288 495" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="67" y="259" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">获奖区域</text><text x="67" y="287" font-size="17" fill="#258375" text-anchor="start" font-weight="400" opacity="1">面积 = p(1−p)</text><text x="185" y="417.2" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">其余区域：奖励 0</text><path d="M55 490L315 490" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="55" y="516" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="315" y="516" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="228.7288" y="516" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">p</text><text x="43" y="237" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><text x="43" y="322.2712" font-size="16" fill="#258375" text-anchor="end" font-weight="400" opacity="1">1−p</text><text x="43" y="495" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><text x="55" y="555" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">新增竖条：(1−p) dp</text><text x="55" y="591" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">先选 1，更可能到达获奖分支</text><text x="28" y="686" font-size="19" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">② 再只增加第二步的 p</text><rect x="55" y="715" width="260" height="260" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="55" y="715" width="173.7288" height="86.2712" rx="0" fill="#d5ebe5" stroke="none" stroke-width="1.5" opacity="1"/><rect x="55" y="780.4712" width="173.7288" height="20.8" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><path d="M50 801.2712L320 801.2712" fill="none" stroke="#258375" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="5 5"/><path d="M50 780.4712L320 780.4712" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M254.7288 801.2712L254.7288 785.0212" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M254.7288 780.4712L258.2288 787.4712L251.2288 787.4712Z" fill="#7854a2"/><text x="67" y="744" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">获奖区域</text><text x="67" y="772" font-size="17" fill="#258375" text-anchor="start" font-weight="400" opacity="1">面积 = p(1−p)</text><text x="185" y="902.2" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">其余区域：奖励 0</text><path d="M55 975L315 975" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="55" y="1001" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="315" y="1001" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="228.7288" y="1001" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">p</text><text x="43" y="722" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><text x="43" y="807.2712" font-size="16" fill="#258375" text-anchor="end" font-weight="400" opacity="1">1−p</text><text x="43" y="980" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><text x="55" y="1040" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">移去横条：−p dp</text><text x="55" y="1076" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">到达以后，选 0 的概率却减小</text><text x="28" y="1145" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一参数：dp/dθ = p(1−p)</text><text x="28" y="1178" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">再乘奖励的折扣 γ，得到两项贡献</text><text x="28" y="1243" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">第一步</text><path d="M145 1237L320 1237" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M257.5 1224L257.5 1250" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M257.5 1237L298.2794 1237" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M303.4794 1237L295.4794 1241L295.4794 1233Z" fill="#b65a28"/><text x="303.4794" y="1218" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">+0.036784</text><text x="28" y="1304" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">第二步</text><path d="M145 1298L320 1298" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M257.5 1285L257.5 1311" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M257.5 1298L170.1089 1298" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M164.9089 1298L172.9089 1294L172.9089 1302Z" fill="#7854a2"/><text x="164.9089" y="1279" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">−0.074073</text><text x="28" y="1365" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">合计</text><path d="M145 1359L320 1359" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M257.5 1346L257.5 1372" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M257.5 1359L216.0883 1359" fill="none" stroke="#19354e" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M210.8883 1359L218.8883 1355L218.8883 1363Z" fill="#19354e"/><text x="210.8883" y="1340" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">−0.037289</text><text x="28" y="1417" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">p ≈ 0.668，γ = 0.5；合计为负</text></g></svg>
