<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1630" viewBox="0 0 360 1630" role="img" aria-labelledby="crl-9kf4cm-title crl-9kf4cm-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-9kf4cm-title">同一模型的三种备份结果</title><desc id="crl-9kf4cm-desc">cross真实收到D,G后建立经验模型，各joint outcome概率1/2。三个cross目标都从同一冻结Q快照计算；alpha=1后分别写cross=0,1,1/2，然后S:go的模型查询读取本分支已写入的cross，得到go=0,.9,.45。前三行分别是模型采样D、模型采样G和枚举两后果的期望。紫虚线表示模型后果，柱长表示写入go的值。橙路径是随后真正执行的episode；若选择go，规定这次随机实际结果为D，回报0；选择exit实际得0.6。底部预算只计行动前两次规划：接口查询均2，sample处理2后果、expectation处理3后果，均写2次价值、获得0个新真实样本；图中的实际episode另计1或2环境步。原创精确分支比较，不是性能排序。</desc><rect width="360" height="1630" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一模型的三种备份结果</text><text x="28" y="87" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">共同快照：cross=.5，go=.45</text><text x="28" y="122" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">模型：D,r0 与 G,r1 各占 1/2</text><text x="46" y="205" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">采样：抽到 D</text><circle cx="172" cy="248" r="17" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><text x="172" y="254" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">D</text><path d="M172 270L172 303.45" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M172 308L168.5 301L175.5 301Z" fill="#7854a2"/><text x="172" y="333" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">cross ← 0</text><path d="M80 370L230 370" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="80" y="358" width="0" height="24" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><circle cx="80" cy="370" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="172" y="416" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">go ← 0</text><text x="46" y="464" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">下一真实动作：exit</text><path d="M91 508L199.8 508" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M205 508L197 512L197 504Z" fill="#b65a28"/><circle cx="73" cy="508" r="17" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="73" y="514" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="223" cy="508" r="17" fill="#e1f3ed" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="223" y="514" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="46" y="553" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">实际回报 0.6</text><text x="46" y="588" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">行动前：查询2；展开2</text><text x="46" y="619" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">规划写入2；真实样本0</text><text x="46" y="681" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">采样：抽到 G</text><circle cx="172" cy="724" r="17" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="172" y="730" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">G</text><path d="M172 746L172 779.45" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M172 784L168.5 777L175.5 777Z" fill="#7854a2"/><text x="172" y="809" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">cross ← 1</text><path d="M80 846L230 846" fill="none" stroke="#c8d6e0"