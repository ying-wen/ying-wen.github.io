<svg xmlns="http://www.w3.org/2000/svg" width="720" height="596" viewBox="0 0 720 596" role="img" aria-labelledby="crl-y3xkxm-title crl-y3xkxm-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-y3xkxm-title">搜索标签与胜负标签来自哪里</title><desc id="crl-y3xkxm-desc">两人轮流行动、零和、完美信息的原创两层树。玩家1先选L或R，玩家2看见后选a或b；终局玩家1收益依次为1、−1、0、1。紫虚线是规则模拟，蓝实线标给定实际对局L然后b，因而根玩家标签−1、后继玩家标签+1。柱高为概率，蓝柱是固定先验(0.8,0.2)，橙柱来自32次确定性PUCT型完整终局模拟，访问次数(6,26)，归一化为(3/16,13/16)。不是随机训练或AlphaZero性能实验。</desc><rect width="720" height="596" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">搜索标签与胜负标签来自哪里</text><text x="28" y="83" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">局面树：终局数值均为玩家 1 收益</text><path d="M163 140L98.465 208.2762" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M94 213L97.2355 202.2981L104.5028 209.1672Z" fill="#7854a2"/><text x="126" y="172" font-size="19" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">L</text><path d="M85 252L54.7397 317.1056" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M52 323L51.6807 311.8242L60.749 316.0391Z" fill="#7854a2"/><text x="60" y="294" font-size="17" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">a</text><path d="M103 252L133.2603 317.1056" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M136 323L127.251 316.0391L136.3193 311.8242Z" fill="#7854a2"/><text x="128" y="294" font-size="17" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">b</text><path d="M193 140L257.535 208.2762" fill="none" stroke="#7854a2" stroke-width="3" 