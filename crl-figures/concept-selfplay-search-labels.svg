="400" opacity="1">π 拟合动作分布，不是胜负</text><text x="393" y="444" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">同一实际终局：</text><text x="393" y="475" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">根 z = −1；下一玩家 z = +1</text><path d="M367 80L367 492" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="541" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">先验不变；搜索预算与规则已给定。</text><text x="28" y="570" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">一条对局提供状态、π 与 z；这里只算标签，没有训练网络。</text></g></svg>
