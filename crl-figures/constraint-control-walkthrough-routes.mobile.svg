<svg xmlns="http://www.w3.org/2000/svg" width="360" height="948" viewBox="0 0 360 948" role="img" aria-labelledby="crl-uf0l12-title crl-uf0l12-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-uf0l12-title">近似回报，不同可行性</title><desc id="crl-uf0l12-desc">原创已知配送CMDP精确算例。初始分布只在路口s，gamma .9；捷径以奖励9.2及成本1直接到吸收终点T，绕行以奖励0到l，下一步奖励10到T且两步成本均0。T双圆圈表示终止，之后零奖励零成本。风险区进入是任务规定成本事件，不表示实测碰撞。下方同一坐标显示p为捷径概率，Jr=9+.2p、Jc=p，绿色为Jc不超过.3的区域。圆点p.3对应回报9.06且可行，方点p.6对应9.12且不可行。回报纵轴截取8.98至9.22以展示近似收益，横轴为未归一化期望成本。</desc><rect width="360" height="948" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">近似回报，不同可行性</text><text x="28" y="85" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一起点；γ=.9；未归一化预算 .3</text><rect x="148" y="141" width="60" height="60" rx="0" fill="#f7e6e5" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="178" y="168" font-size="18" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">风险区</text><path d="M82 181L267.5 181" fill="none" stroke="#b54142" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M274 181L264 186L264 176Z" fill="#b54142"/><circle cx="58" cy="181" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="58" y="187" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">s</text><circle cx="299" cy="181" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="299" cy="181" r="16" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="299" y="187" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">T</text><circle cx="58" cy="324" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="58" y="330" font-size="18" fill="#146ca1" text-anchor="middle" font-weigh