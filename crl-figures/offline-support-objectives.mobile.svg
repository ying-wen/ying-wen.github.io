<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1478" viewBox="0 0 360 1478" role="img" aria-labelledby="crl-1dic58a-title crl-1dic58a-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1dic58a-title">CQL 梯度与 IQL 的数据内目标</title><desc id="crl-1dic58a-desc">原创精确计算。同一s的给定Q=(0,2,4)，经验动作频率(.5,.5,0)。上图圆是给定值，方是固定终端Bellman标签下的一次解析梯度下降结果；步长1，保守权重alpha1，经验状态质量.5。有符号横条显示full mean gradient=.5*(softmax(Q)-pD)，已见动作Bellman残差此刻为0。下图为tau=.75的expectile loss，仅使用a0=0和a1=2，最低点V1.5，loss.375。优势加权精确分类提取beta1产生(.1192,.8808,0)，条长度表示概率。起点IQL标签1.35与提取策略真实回报1.5854是不同对象。无网络训练，分类支持结论不推广到有限logit softmax或神经连续策略。</desc><rect width="360" height="1478" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">CQL 梯度与 IQL 的数据内目标</text><text x="28" y="86" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · CQL：同一值轴的一步位移</text><path d="M90.4 145L90.4 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M90.4 370L90.4 375" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="90.4" y="396" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M196 145L196 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M196 370L196 375" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="196" y="396" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M301.6 145L301.6 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M301.6 370L301.6 375" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="301.6" y="396" font-size="16" fill="#52687b" text-anchor="middle" font-weight=