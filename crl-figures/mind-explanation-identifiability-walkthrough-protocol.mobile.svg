<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1653" viewBox="0 0 360 1653" role="img" aria-labelledby="crl-1bnk4xa-title crl-1bnk4xa-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1bnk4xa-title">控制反馈次数，再测一次选择</title><desc id="crl-1bnk4xa-desc">原创实验程序示意。屏幕显示L/R两个按钮，强制阶段R为灰色且被划去，橙色按键箭头仅指向L；每次强制L都显示奖励+1。无反馈探测两个按钮均可用，分叉橙箭头表示一次自由选择，选择后不显示奖励且不更新模型。n=1与n=2各自从Q0(L)=Q0(R)=0开始，蓝色向下箭头是试次顺序而非等长时间。人类实验的新刺激不保证内在价值重置。</desc><rect width="360" height="1653" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">控制反馈次数，再测一次选择</text><text x="28" y="83" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每轮只探测一次；随后重新开始</text><text x="28" y="123" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">条件 n=1</text><rect x="28" y="150" width="130" height="87" rx="5" fill="#f5f8fb" stroke="#19354e" stroke-width="2" opacity="1"/><path d="M93 237L93 253" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M63 253L123 253" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="61" cy="202" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="125" cy="202" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="61" y="208" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">L</text><text x="125" y="208" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="93" y="173" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">新一轮</text><rect x="37" y="274" width="47" height="9" rx="0" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><rect x="102" y="274" width="47" height="9" rx="0" fill="#ffffff" stroke="