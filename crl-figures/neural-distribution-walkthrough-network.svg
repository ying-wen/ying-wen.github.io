<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="crl-1rw24-title crl-1rw24-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1rw24-title">两个输入怎样共用一个非线性网络</title><desc id="crl-1rw24-desc">原创精确接单任务。一个输入到一个tanh隐单元，再到四个线性分位输出，共十个参数a,c,w1至w4,b1至b4；箭头为前向计算。初始a=c=.5，b各为1.5，w=(-.5,-.5,.5,.5)/tanh(1)。激活曲线的两个蓝点对应输入fixed=-1和floating=1，隐值分别0和约.762。下方同一回报轴显示fixed初始四点都为1.5，floating初始为1,1,2,2。每点质量.25，竖直错开仅避免重叠；青虚线为各动作真位置。改变权重为(-1,-1,1,1)/tanh(1)即能同时表示两真实分布，故本网络在两输入上的容量足够。</desc><rect width="720" height="960" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两个输入怎样共用一个非线性网络</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">x_f=−1，x_v=+1；共用十个参数</text><circle cx="95" cy="235" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="95" y="241" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">x</text><path d="M119 235L251.5 235" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M258 235L248 240L248 230Z" fill="#146ca1"/><text x="190" y="215" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">a, c</text><circle cx="285" cy="235" r="25" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="285" y="241" font-size="22" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">h</text><text x="285" y="294" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">tanh</text><path d="M314 235L539.8152 161.9994" fill="none" stroke="#7854a2" stroke-width="1.8" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M546 160L538.0229 167.8336L534.9468 158.3184Z" fill="#7854a2"/><circle cx="570" cy="160" r="20" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="570" y="166" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">q1</text><path d="M314 235L539.5374 210.6964" fill="none" stroke="#7854a2" stroke-width="1.8" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M546 210L536.5933 216.0426L535.5219 206.1002Z" fill="#7854a2"/><circle cx="570" cy="210" r="20" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="570" y="216" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">q2</text><path d="M314 235L539.5374 259.3036" fill="none" stroke="#7854a2" stroke-width="1.8" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M546 260L535.5219 263.8998L536.5933 253.9574Z" fill="#7854a2"/><circle cx="570" cy="260" r="20" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="570" y="266" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">q3</text><path d="M314 235L539.8152 308.0006" fill="none" stroke="#7854a2" stroke-width="1.8" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M546 310L534.9468 311.6816L538.0229 302.1664Z" fill="#7854a2"/><circle cx="570" cy="310" r="20" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="570" y="316" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">q4</text><text x="28" y="355" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">h=tanh(ax+c)；qᵢ=bᵢ+wᵢh</text><path d="M94.4167 430L94.4167 575" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M94.4167 575L94.4167 580" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="94.4167" y="601" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><path d="M196.5 430L196.5 575" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M196.5 575L196.5 580" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="196.5" y="601" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M298.5833 430L298.5833 575" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M298.5833 575L298.5833 580" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="298.5833" y="601" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M74 554.2857L319 554.2857" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M69 554.2857L74 554.2857" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="64" y="559.2857" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M74 485.2381L319 485.2381" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M69 485.2381L74 485.2381" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="64" y="490.2381" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M74 430L74 575" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M74 575L319 575" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="319" y="629" font-size="18" fill="#19354e" text-anchor="end" font-weight="400" opacity="1">输入 x</text><text x="74" y="412" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">初始 h</text><path d="M74 568.0494L79.1042 564.6235L84.2083 561.1847L89.3125 557.7374L94.4167 554.2857L99.5208 550.8341L104.625 547.3867L109.7292 543.9479L114.8333 540.522L119.9375 537.1132L125.0417 533.7254L130.1458 530.3628L