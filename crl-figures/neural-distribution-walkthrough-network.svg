" stroke-linecap="round" opacity="1"/><text x="74" y="893" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M170.6667 865L170.6667 870" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="170.6667" y="893" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><path d="M364 865L364 870" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="364" y="893" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.5</text><path d="M557.3333 865L557.3333 870" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="557.3333" y="893" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2.5</text><path d="M654 865L654 870" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="654" y="893" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M170.6667 828L170.6667 871" fill="none" stroke="#258375" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/><path d="M557.3333 828L557.3333 871" fill="none" stroke="#258375" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/><path d="M267.3333 865L267.3333 853" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="267.3333" cy="853" r="5" fill="#b65a28" stroke="#ffffff" stroke-width="1" opacity="1"/><path d="M267.3333 865L267.3333 843" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="267.3333" cy="843" r="5" fill="#b65a28" stroke="#ffffff" stroke-width="1" opacity="1"/><path d="M460.6667 865L460.6667 833" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="460.6667" cy="833" r="5" fill="#b65a28" stroke="#ffffff" stroke-width="1" opacity