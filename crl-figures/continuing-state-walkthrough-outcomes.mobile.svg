<svg xmlns="http://www.w3.org/2000/svg" width="360" height="981" viewBox="0 0 360 981" role="img" aria-labelledby="crl-1yhq9ey-title crl-1yhq9ey-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1yhq9ey-title">奖励信息能用吗？改变一项再比较</title><desc id="crl-1yhq9ey-desc">原创精确8路径枚举及独立条件期望树核对，隐藏Z整段固定、提示在给定Z后独立。每个横条表示一次选门的期望即时奖励，纵向各条件共享[-1,1]坐标。原例为-0.6、0.36，大步长2为-0.6、0，随机提示为0、0，删除提示为0、1。删除提示仍保留奖励输入，所以没有删除全部信息；在本例固定首动作下下一J的h=Z/4。原例另有概率0.08的路径写出a&gt;3，这个窗口不证明长期稳定。</desc><rect width="360" height="981" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">奖励信息能用吗？改变一项再比较</text><text x="28" y="83" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">隐藏门固定；两次提示条件独立</text><text x="28" y="115" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">蓝：第一次选门　青：第二次选门</text><text x="28" y="160" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">原例 α=1/2</text><path d="M70 243L300 243" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="268" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><text x="185" y="268" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="300" y="268" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M185 178L185 248" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 3"/><rect x="116" y="181" width="69" height="18" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="107" y="196" font-size="16" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">-0.6</text><rect x="185" y="208" width="41.4" height="18" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="235.4" y="223" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0.36</text><text x="28" y="322" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">大步长 α=2</text><path d="M70 405L300 405" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="430" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><text x="185" y="430" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="300" y="430" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M185 340L185 410" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 3"/><rect x="116" y="343" width="69" height="18" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="107" y="358" font-size="16" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">-0.6</text><circle cx="185" cy="379" r="4" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="194" y="385" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0</text><text x="28" y="484" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">随机提示 p=1/2</text><path d="M70 567L300 567" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="592" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><text x="185" y="592" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="300" y="592" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M185 502L185 572" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 3"/><circle cx="185" cy="514" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="194" y="520" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0</text><circle cx="185" cy="541" r="4" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="194" y="547" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0</text><text x="28" y="646" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">删除全部 C 提示</text><path d="M70 729L300 729" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="754" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><text x="185" y="754" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="300" y="754" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M185 664L185 734" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 3"/><circle cx="185" cy="676" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="194" y="682" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0</text><rect x="185" y="694" width="115" height="18" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="309" y="709" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1</text><path d="M28 803L332 803" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="837" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">删提示后：r 留在活动中</text><text x="28" y="868" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">下一 J 的 h=r/4，第二次全对</text><text x="28" y="910" font-size="16" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">原例也有概率 0.08 写出 a&gt;3</text><text x="28" y="941" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">短窗口收益不保证长期稳定</text></g></svg>
