opacity="1"/><text x="476" y="388" font-size="17" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">0</text><circle cx="435" cy="440" r="20" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="435" y="446" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M460 440L608.5 440" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M615 440L605 445L605 435Z" fill="#7854a2"/><circle cx="640" cy="440" r="20" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="640" y="446" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="537.5" y="481" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">t = 10，执行 L</text><text x="28" y="545" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次模型备份怎样传播远处的收益</text><circle cx="100" cy="604" r="21" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="100" y="610" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M126 604L582.5 604" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M589 604L579 609L579 599Z" fill="#7854a2"/><circle cx="615" cy="604" r="21" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="615" y="610" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="357" y="588" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">L，预计 2 步</text><text x="28" y="660" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">奖励预测 -0.016，时间成本 g × 2</text><text x="28" y="693" font-size="21" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">终点价值 0.1876 → 目标 0.1175</text><text x="28" y="735" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q(1,L) ← Q(1,L) + 0.1[目标 − Q(1,L)]</text><text x="28" y="778" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">虚线没有产生新奖励，也没有推进真实时间</text><text x="28" y="815" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">选择差异来自此前累计备份；此图不比较性能</text></g></svg>
