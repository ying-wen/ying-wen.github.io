<svg xmlns="http://www.w3.org/2000/svg" width="720" height="644" viewBox="0 0 720 644" role="img" aria-labelledby="crl-1l3xb1j-title crl-1l3xb1j-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1l3xb1j-title">一次更新怎样牵动两个预测？</title><desc id="crl-1l3xb1j-desc">原创精确计算。上方为两步走廊，奖励加2和减1，折扣1。左图特征有相同单位长度，内积0.8由虚线投影显示。右图以A、B预测为两条坐标轴，圆点0、1、2表示从零开始在完整回报可用后按A、B顺序进行MC回归的预测，方框是真值(1,−1)。第一步让A更准却使B更差，均匀半平方误差从0.5增加到0.5525。坐标与箭头均由脚本数值生成；不是学习曲线。</desc><rect width="720" height="644" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次更新怎样牵动两个预测？</text><path d="M141 106L331.15 106" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M337 106L328 110.5L328 101.5Z" fill="#146ca1"/><text x="239" y="89" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">+2</text><circle cx="118" cy="106" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="118" y="113" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M383 106L573.15 106" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M579 106L570 110.5L570 101.5Z" fill="#146ca1"/><text x="481" y="89" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">−1</text><circle cx="360" cy="106" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="360" y="113" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="602" cy="106" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="602" y="113" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">⊥</text><circle cx="602" cy="106" r="27" fill="none" s