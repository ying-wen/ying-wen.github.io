<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1648" viewBox="0 0 360 1648" role="img" aria-labelledby="crl-pbmoa5-title crl-pbmoa5-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-pbmoa5-title">奖励改变相对偏好与策略</title><desc id="crl-pbmoa5-desc">三臂gradient bandit的两步可能历史，初始偏好全零、基线0、步长0.3。先选C并得1，使用旧均匀概率与旧基线，偏好变为-0.1、-0.1、0.2，C概率从1/3增加到约0.403；随后基线变为1。再次选C但得0，使用旧基线1产生负增量，C概率降至约0.340，随后平均奖励基线变为0.5。上部紫色带符号长度表示偏好，共用尺度；下部蓝柱表示概率，共用0到1尺度。未选动作的偏好也改变，但没有凭空获得它们的奖励估计。</desc><rect width="360" height="1648" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">奖励改变相对偏好与策略</text><text x="22" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">α=0.3；两次都选 C，奖励先 1 后 0</text><text x="25" y="140" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">选择之前</text><text x="25" y="188" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">偏好 H</text><path d="M50 253L320 253" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><text x="40" y="258" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M78 253L78 253" fill="none" stroke="#7854a2" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="78" cy="253" r="4" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="78" y="238" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="78" y="327" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M192 253L192 253" fill="none" stroke="#7854a2" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="192" cy="253" r="4" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="192" y="238" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="192" y="327" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M306 253L306 253" fill="none" stroke="#7854a2" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="306" cy="253" r="4" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="306" y="238" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="306" y="327" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="25" y="370" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">选择概率 π</text><path d="M50 501L320 501" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><rect x="62" y="437.6667" width="32" height="63.3333" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="78" y="422.6667" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.333</text><text x="78" y="533" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><rect x="176" y="437.6667" width="32" height="63.3333" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="192" y="422.6667" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.333</text><text x="192" y="533" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><rect x="290" y="437.6667" width="32" height="63.3333" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="306" y="422.6667" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.333</text><text x="306" y="533" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="25" y="572" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">下一次的 B = 0</text><pat