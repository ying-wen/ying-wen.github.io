<svg xmlns="http://www.w3.org/2000/svg" width="360" height="965" viewBox="0 0 360 965" role="img" aria-labelledby="crl-i42ogf-title crl-i42ogf-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-i42ogf-title">一次发现有代价，知识由控制再使用</title><desc id="crl-i42ogf-desc">原创确定性闭环。先执行到A的option及探测动作，两步真实回报0；记录A到Y后A不再是frontier，选择C。执行到C的option及探测动作，三步回报0.9平方乘2为1.62。外部规划在已学option模型R=0、B分别0.9和0.81之上接入V(A)=1、V(C)=2，比较0.9与1.62，并在新的真实送货回合复用C的option。上方两次探测加起来5原子步，下方部署另3步。</desc><rect width="360" height="965" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次发现有代价，知识由控制再使用</text><text x="28" y="83" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">目标选择改变下一次真实行动</text><text x="28" y="130" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1. 选择 A，到达后试 probe</text><circle cx="48" cy="188" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="48" y="194" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><path d="M68 188L154 188" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M160.5 188L150.5 193L150.5 183Z" fill="#b65a28"/><circle cx="180.5" cy="188" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="180.5" y="194" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M200.5 188L286.5 188" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M293 188L283 193L283 183Z" fill="#b65a28"/><circle cx="313" cy="188" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="313" y="194" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">Y</text><text x="28" y="237" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">A→Y：真实净奖励 0</text><text x="28" y="268" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">本次外部回报 = 0.00</text><text x="28" y="306" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 出队；下一候选只剩 C</text><text x="28" y="365" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2. 选择 C，到达后试 probe</text><circle cx="48" cy="423" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="48" y="429" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><path d="M68 423L109.8333 423" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M116.3333 423L106.3333 428L106.3333 418Z" fill="#b65a28"/><circle cx="136.3333" cy="423" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="136.3333" y="429" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M156.3333 423L198.1667 423" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M204.6667 423L194.6667 428L194.6667 418Z" fill="#b65a28"/><circle cx="224.6667" cy="423" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="224.6667" y="429" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">C</text><path d="M244.6667 423L286.5 423" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M293 423L283 428L283 418Z" fill="#b65a28"/><circle cx="313" cy="423" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="313" y="429" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">Y</text><text x="28" y="472" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">C→Y：真实奖励 2</text><text x="28" y="503" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">本次外部回报 = 1.62</text><text x="28" y="541" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">未试动作已清空</text><text x="28" y="616" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">下一次送货：谁读取学到的模型？</text><text x="28" y="650" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">外部折扣回报 R + B·V</text><text x="28" y="711" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">oA</text><rect x="90" y="695" width="95" height="22" rx="2" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="194" y="713" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">0.90</text><text x="28" y="771" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">oC</text><rect x="90" y="755" width="171" height="22" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="270" y="773" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1.62</text><text x="28" y="830" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">实际复用 oC，再做 probe：S→B→C→Y</text><text x="28" y="863" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">新增 3 原子步；外部回报 1.62</text><text x="28" y="897" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 的覆盖分数较高，</text><text x="28" y="925" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">第一次却没有外部收益</text></g></svg>
