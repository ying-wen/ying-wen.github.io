<svg xmlns="http://www.w3.org/2000/svg" width="720" height="527" viewBox="0 0 720 527" role="img" aria-labelledby="crl-1fkviia-title crl-1fkviia-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1fkviia-title">Mary 走出黑白房间</title><desc id="crl-1fkviia-desc">同一位 Mary 先在黑白房间通过资料与黑白屏幕学习，后离开房间直接看到红色番茄。图像只呈现外部场景和信息获取条件；红色不代表测得的主观体验，图中不设体验刻度。</desc><rect width="720" height="527" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Mary 走出黑白房间</text><text x="20" y="78" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">读懂物理描述，和亲历颜色</text><g transform="translate(20 110)"><rect x="0" y="0" width="310" height="271" rx="4" fill="#f0f1f2" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="16" y="32" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">① 黑白房间</text><g transform="translate(76 107)"><circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M0 17L0 72" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 31L-24 49" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 31L26 45" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 72L-21 102" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 72L22 102" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/></g><path d="M28 225L287 225" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="161" y="63" width="117" height="85" rx="3" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><path d="M202 151L238 151" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><g transform="translate(221 109)"><g transform="scale(.68)"><g transform="translate(0 0)"><circle cx="0" cy="0" r="25" fill="#858b90" stroke="#19354e" stroke-width="1.5" opacity="1"/><path d="M-14 -22L-3 -21L0 -32L5 -21L16 -22L5 -14L-4 -16Z" fill="#52687b"/></g></g></g><text x="220" y="183" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">黑白屏幕</text><rect x="145" y="203" width="61" height="13" rx="1" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><rect x="151" y="190" width="61" height="13" rx="1" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="16" y="253" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">全部物理信息（设定）</text></g><g transform="translate(390 110)"><rect x="0" y="0" width="310" height="271" rx="4" fill="#fbfcfd" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="16" y="32" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">② 首次看见红色</text><g transform="translate(76 107)"><circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><path d="M0 17L0 72" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 31L-24 49" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 31L26 45" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 72L-21 102" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M0 72L22 102" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/></g><path d="M28 225L287 225" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><g transform="translate(225 133)"><circle cx="0" cy="0" r="25" fill="#b54142" stroke="#19354e" stroke-width="1.5" opacity="1"/><path d="M-14 -22L-3 -21L0 -32L5 -21L16 -22L5 -14L-4 -16Z" fill="#258375"/></g><path d="M177 170L276 170" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M188 170L188 223" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M265 170L265 223" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M190 119L115.1109 104.9583" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M110 104L118.6001 101.5428L117.1258 109.4058Z" fill="#146ca1"/><text x="225" y="203" font-size="18" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">红色番茄</text><text x="16" y="253" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">获得一次颜色经验</text></g><path d="M341 241L372.5 241" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M379 241L369 246L369 236Z" fill="#b65a28"/><path d="M28 417L692 417" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="455" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">新获得的究竟是什么？</text><text x="28" y="494" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">新的事实、新的能力，还是同一事实的新的认识方式？</text></g></svg>
