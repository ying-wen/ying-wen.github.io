<svg xmlns="http://www.w3.org/2000/svg" width="360" height="925" viewBox="0 0 360 925" role="img" aria-labelledby="crl-1m6d2gn-title crl-1m6d2gn-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1m6d2gn-title">按次数还是按时间？</title><desc id="crl-1m6d2gn-desc">两个半马尔可夫自环都回到S，没有外部重置。A每1秒得2，B每3秒得3。每次决策奖励B较高，但每秒奖励A较高。底部相同12秒内A累计24，B累计12，圆点每枚表示1奖励。</desc><rect width="360" height="925" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="42" font-size="24" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">按次数还是按时间？</text><g transform="translate(24,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · A：快而小</text><circle cx="70" cy="105" r="25" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="70" y="111" font-size="21" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">S</text><path d="M53,85 C22,29 161,29 138,110 C118,168 53,169 42,125" fill="none" stroke="#258375" stroke-width="3"/><path d="M41 135L42.35 128.25" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M43 125L44.5 130.5L39.5 129.5Z" fill="#258375"/><circle cx="217" cy="76" r="7" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><path d="M217 72.5L217 79.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="1"/><circle cx="238" cy="76" r="7" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><path d="M238 72.5L238 79.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="1"/><text x="202" y="113" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">2 奖励</text><text x="202" y="149" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1 秒</text><text x="156" y="210" font-size="24" fill="#258375" text-anchor="middle" fon