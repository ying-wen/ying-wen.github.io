<svg xmlns="http://www.w3.org/2000/svg" width="360" height="684" viewBox="0 0 360 684" role="img" aria-labelledby="crl-f2uj9u-title crl-f2uj9u-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-f2uj9u-title">遗漏的终点势留在回报里</title><desc id="crl-f2uj9u-desc">同一条三步等待轨迹，原奖励始终0。正确塑形奖励为1.7、-0.3、-3，累计折扣回报最终-1；忽略期限终端，最后仍使用门口势3，奖励为1.7、-0.3、-0.3，最终1.187。差额恰为gamma三次方乘3，即2.187。前两个时刻两条线重合；第三步不同来自期限边界。规定任务在第三步真正结束，后面没有隐含奖励或补齐动作。任意采样截断须另带尾值，不能照抄该终止设置。</desc><rect width="360" height="684" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">遗漏的终点势留在回报里</text><text x="28" y="84" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一等待轨迹：S → A → A → A</text><path d="M64 160L64 425" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M64 425L64 430" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="64" y="451" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M185.5 160L185.5 425" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M185.5 425L185.5 430" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="185.5" y="451" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M307 160L307 425" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M307 425L307 430" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="307" y="451" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M64 425L307 425" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M59 425L64 425" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="54" y="430" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">-1</text><path d="M64 336.6667L307 336.6667" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M59 336.6667L64 336.6667" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="54" y="341.6667" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M64 248.3333L307 248.3333" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M59 248.3333L64 248.3333" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="54" y="253.3333" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M64 160L307 160" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M59 160L64 160" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="54" y="165" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">2</text><path d="M64 160L64 425" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M64 425L307 425" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="307" y="479" font-size="18" fill="#19354e" text-anchor="end" font-weight="400" opacity="1">已经执行的动作数</text><text x="64" y="142" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">累计折扣塑形回报</text><path d="M64 186.5L185.5 210.35L307 425" fill="none" stroke="#146ca1" stroke-width="3"/><circle cx="64" cy="186.5" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="185.5" cy="210.35" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="307" cy="425" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M64 186.5L185.5 210.35L307 231.815" fill="none" stroke="#b54142" stroke-width="3" stroke-dasharray="7 5"/><circle cx="64" cy="186.5" r="4" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><circle cx="185.5" cy="210.35" r="4" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><circle cx="307" cy="231.815" r="4" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><text x="297" y="413" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">-1</text><text x="297" y="260.815" font-size="18" fill="#b54142" text-anchor="end" font-weight="400" opacity="1">1.187</text><text x="28" y="510" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">蓝实线：截止状态 Φ=0</text><text x="28" y="547" font-size="16" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">红虚线：错误保留门口 Φ=3</text><text x="28" y="590" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">最终差 = 0.9³ × 3 = 2.187</text><text x="28" y="635" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">第1、2步相同；最后一步结清边界</text></g></svg>
