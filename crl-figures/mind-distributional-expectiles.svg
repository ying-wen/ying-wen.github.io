<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 715" role="img" aria-labelledby="title desc"><title id="title">同样的平均奖励，不同的结果分布</title><desc id="desc">原创一步预测算例：确定奖励0.5和三点等概率奖励的均值相同，但不同expectile坐标有所不同。</desc><rect width="920" height="715" fill="white"/><g font-family="system-ui, sans-serif"><text x="40" y="43" font-size="28" fill="#24415c">一个均值遗漏了哪些结果差别？</text><text x="40" y="104" font-size="24" fill="#24415c">每次都是 0.5</text><path d="M60 225H380" stroke="#8094a8"/><rect x="205" y="135" width="26" height="90" rx="2" fill="#357e69"/><text x="56" y="253" font-size="18" fill="#24415c">0</text><text x="206" y="253" font-size="18" fill="#24415c">0.5</text><text x="356" y="253" font-size="18" fill="#24415c">1</text><text x="40" y="287" font-size="21" fill="#24415c">平均奖励 = 0.5</text><text x="480" y="104" font-size="24" fill="#24415c">0、0.5、1 等概率</text><path d="M500 225H820" stroke="#8094a8"/><rect x="495" y="195" width="26" height="30" rx="2" fill="#237ba1"/><rect x="645" y="195" width="26" height="30" rx="2" fill="#237ba1"/><rect x="795" y="195" width="26" height="30" rx="2" fill="#237ba1"/><text x="496" y="253" font-size="18" fill="#24415c">0</text><text x="646" y="253" font-size="18" fill="#24415c">0.5</text><text x="796" y="253" font-size="18" fill="#24415c">1</text><text x="480" y="287" font-size="21" fill="#24415c">平均奖励 = 0.5</text><text x="40" y="390" font-size="21" fill="#24415c">τ = 0.2</text><text x="237" y="390" font-size="24" fill="#24415c">0.50</text><path d="M480 382H820" stroke="#c6d4df"/><circle cx="565" cy="382" r="7" fill="#237ba1"/><text x="579" y="390" font-size="23" fill="#24415c">0.25</text><text x="40" y="455" font-size="21" fill="#24415c">τ = 0.5</text><text x="237" y="455" font-size="24" fill="#24415c">0.50</text><path d="M480 447H820" stroke="#c6d4df"/><circle cx="650" cy="447" r="7" fill="#237ba1"/><text x="664" y="455" font-size="23" fill="#24415c">0.50</text><text x="40" y="520" font-size="21" fill="#24415c">τ = 0.8</text><text x="237" y="520" font-size="24" fill="#24415c">0.50</text><path d="M480 512H820" stroke="#c6d4df"/><circle cx="735" cy="512" r="7" fill="#237ba1"/><text x="749" y="520" font-size="23" fill="#24415c">0.75</text><text x="40" y="337" font-size="18" fill="#24415c">正误差的权重</text><text x="202" y="337" font-size="18" fill="#24415c">确定奖励的预测</text><text x="480" y="337" font-size="18" fill="#24415c">三点奖励的预测（expectile）</text><rect x="35" y="551" width="850" height="129" rx="9" fill="#edf4f8"/><text x="55" y="582" font-size="22" fill="#24415c">同样收到 r = 0.5，三个通道的误差为 +0.25、0、−0.25。</text><text x="55" y="619" font-size="20" fill="#24415c">它们以不同的正／负误差权重学习，不同坐标一起描述结果分布。</text><text x="55" y="653" font-size="18" fill="#24415c">独立推导的精确算例；均匀三点分布；不是神经数据或分位数。</text></g></svg>