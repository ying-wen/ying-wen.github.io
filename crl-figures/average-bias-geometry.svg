<svg xmlns="http://www.w3.org/2000/svg" width="720" height="925" viewBox="0 0 720 925" role="img" aria-labelledby="crl-17vg0us-title crl-17vg0us-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-17vg0us-title">差分价值保留起点的影响</title><desc id="crl-17vg0us-desc">继续使用三状态MDP的策略B。规范h(0)=0，h(B)=10/11。有限窗口恒等式E累计奖励=Tg+h(0)-E h(S_T)由概率递推独立核算；虚线和曲线的间隙不是另一条奖励率。</desc><rect width="720" height="925" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">差分价值保留起点的影响</text><text x="28" y="84" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">仍使用策略 B，从选择点 0 出发</text><text x="28" y="116" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">橙线：E[累计奖励]　虚线：Tg</text><path d="M68 177L68 455" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M68 455L680 455" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="59" y="460" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M68 455L680 455" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="59" y="367.3333" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">4</text><path d="M68 362.3333L680 362.3333" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="59" y="274.6667" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">8</text><path d="M68 269.6667L680 269.6667" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="59" y="182" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">12</text><path d="M68 177L680 177" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="68" y="481" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="272" y="481" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><text x="476" y="481" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">8</text><text x="680" y="481" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">12</text><path d="M68 455L680 202.2727" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="7 6"/><polyline points="68,455 119,455 170,431.8333333333333 221,410.98333333333335 272,389.90166666666664 323,368.84316666666666 374,347.78235 425,326.721765 476,305.66115683333334 527,284.60055098333333 578,263.5399449016667 629,242.4793388431667 680,221.41873278235002" fill="none" stroke="#b65a28" stroke-width="3"/><path d="M689 202.2727L689 221.4187" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="68" y="515" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">起点带来的差额有界，斜率仍趋近 g</text><text x="28" y="577" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">减去每步 g 后，剩下什么？</text><path d="M232 644L486.5 644" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M493 644L483 649L483 639Z" fill="#b65a28"/><circle cx="210" cy="644" r="22" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="210" y="650" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="210" y="692" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h(0) = 0</text><circle cx="515" cy="644" r="22" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="515" y="650" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="515" y="692" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">h(B) = 10/11</text><text x="28" y="740" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">0 → B：R − g = −10/11</text><text x="28" y="773" font-size="22" fill="#258375" text-anchor="start" font-weight="400" opacity="1">h(B) − h(0) = +10/11</text><text x="28" y="806" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两项相加为 0：差分 Bellman 关系</text><text x="28" y="858" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">T = 12 时，Tg − E[累计奖励] = 0.826</text><text x="28" y="891" font-size="21" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">它等于 E[h(S₁₂)] − h(S₀)</text></g></svg>
