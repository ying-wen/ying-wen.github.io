<svg xmlns="http://www.w3.org/2000/svg" width="720" height="642" viewBox="0 0 720 642" role="img" aria-labelledby="crl-eyx6jz-title crl-eyx6jz-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-eyx6jz-title">相同预测误差，信息来源不同</title><desc id="crl-eyx6jz-desc">原创精确计算。Theta先验L/R各半，两通道输出均为-1/+1，预测均值0时更新前平方误差均1。条件于实际观察+1，路标把后验改成P(R)=1，随机屏幕保持P(R)=1/2。上方条高为关于Theta的概率，同一概率尺度；信息增益分别1 bit与0 bit。下方条长为下一次同类目标的Bayes均方预测误差：固定路标1变0，独立下一屏幕帧1保持1。路标下次读同一固定符号，屏幕下次读新的独立符号，未把重拟合当前噪声帧当作可迁移进展。</desc><rect width="720" height="642" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同预测误差，信息来源不同</text><text x="28" y="83" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">都观察到 +1；更新前平方误差都为 1</text><text x="28" y="132" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">固定路标 Z=+1</text><text x="83" y="174" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">观察前</text><path d="M28 288L139 288" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="41" y="248" width="30" height="40" rx="0" fill="#52687b" stroke="none" stroke-width="1.5" opacity="1"/><text x="56" y="237" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="56" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><rect x="98" y="248" width="30" height="40" rx="0" fill="#52687b" stroke="none" stroke-width="1.5" opacity="1"/><text x="113" y="237" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="113" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="257" y="174" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">观察后</text><path d="M202 288L313 288" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="215" y="288" width="30" height="0" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="230" y="277" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="230" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><rect x="272" y="208" width="30" height="80" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="287" y="197" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="287" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><path d="M152 240L181.8 240" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M187 240L179 244L179 236Z" fill="#258375"/><text x="28" y="351" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">关于 Θ 的信息：1 bit</text><text x="28" y="390" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">下一次同类目标的平方误差</text><text x="28" y="429" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新前</text><path d="M104 423L286 423" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="104" y="412" width="154" height="22" rx="0" fill="#aebbc5" stroke="none" stroke-width="1.5" opacity="1"/><text x="298" y="429" font-size="18" fill="#258375" text-anchor="end" font-weight="400" opacity="1">1</text><text x="28" y="470" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新后</text><path d="M104 464L286 464" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="104" y="453" width="0" height="22" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="298" y="470" font-size="18" fill="#258375" text-anchor="end" font-weight="400" opacity="1">0</text><text x="28" y="512" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">误差下降 LP = 1</text><text x="378" y="132" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">随机屏幕 Z=+1</text><text x="433" y="174" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">观察前</text><path d="M378 288L489 288" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="391" y="248" width="30" height="40" rx="0" fill="#52687b" stroke="none" stroke-width="1.5" opacity="1"/><text x="406" y="237" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="406" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><rect x="448" y="248" width="30" height="40" rx="0" fill="#52687b" stroke="none" stroke-width="1.5" opacity="1"/><text x="463" y="237" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="463" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="607" y="174" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">观察后</text><path d="M552 288L663 288" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="565" y="248" width="30" height="40" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="580" y="237" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="580" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><rect x="622" y="248" width="30" height="40" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="637" y="237" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="637" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><path d="M502 240L531.8 240" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M537 240L529 244L529 236Z" fill="#146ca1"/><text x="378" y="351" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">关于 Θ 的信息：0 bit</text><text x="378" y="390" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">下一次同类目标的平方误差</text><text x="378" y="429" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新前</text><path d="M454 423L636 423" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="454" y="412" width="154" height="22" rx="0" fill="#aebbc5" stroke="none" stroke-width="1.5" opacity="1"/><text x="648" y="429" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">1</text><text x="378" y="470" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新后</text><path d="M454 464L636 464" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="454" y="453" width="154" height="22" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="648" y="470" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">1</text><text x="378" y="512" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">误差下降 LP = 0</text><text x="28" y="577" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">概率条高：P(Θ=L/R)；误差条长：均方误差</text><text x="28" y="609" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">这里更新的是后验与预测均值；噪声分布已知</text></g></svg>
