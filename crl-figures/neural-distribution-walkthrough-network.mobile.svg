<svg xmlns="http://www.w3.org/2000/svg" width="360" height="965" viewBox="0 0 360 965" role="img" aria-labelledby="crl-12o5i0r-title crl-12o5i0r-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-12o5i0r-title">两个输入怎样共用一个非线性网络</title><desc id="crl-12o5i0r-desc">原创精确接单任务。一个输入到一个tanh隐单元，再到四个线性分位输出，共十个参数a,c,w1至w4,b1至b4；箭头为前向计算。初始a=c=.5，b各为1.5，w=(-.5,-.5,.5,.5)/tanh(1)。激活曲线的两个蓝点对应输入fixed=-1和floating=1，隐值分别0和约.762。下方同一回报轴显示fixed初始四点都为1.5，floating初始为1,1,2,2。每点质量.25，竖直错开仅避免重叠；青虚线为各动作真位置。改变权重为(-1,-1,1,1)/tanh(1)即能同时表示两真实分布，故本网络在两输入上的容量足够。</desc><rect width="360" height="965" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两个输入怎样共用一个非线性网络</text><text x="28" y="82" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">x_f=−1，x_v=+1；共用十个参数</text><circle cx="55" cy="230" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="55" y="236" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">x</text><path d="M79 230L120.5 230" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M127 230L117 235L117 225Z" fill="#146ca1"/><text x="104.5" y="210" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">a, c</text><circle cx="154" cy="230" r="25" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="154" y="236" font-size="22" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">h</text><text x="154" y="289" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">tanh</text><path d="M183 230L253.4038 159.5962" fill="none" stroke="#7854a2" stroke-width="1.8" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M258 155L254.4645 165.6066L247.3934 158.5355Z" fill="#7854a2"/><circle cx="282" cy="155" r="20" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="282" y="161" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">q1</text><path d="M183 230L251.8336 207.0555" fill="none" stroke="#7854a2" stroke-width="1.8" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M258 205L250.0943 212.9057L246.932 203.4189Z" fill="#7854a2"/><circle cx="282" cy="205" r="20" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="282" y="211" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">q2</text><path d="M183 230L251.8336 252.9445" fill="none" stroke="#7854a2" stroke-width="1.8" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M258 255L246.932 256.5811L250.0943 247.0943Z" fill="#7854a2"/><circle cx="282" cy="255" r="20" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="282" y="261" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">q3</text><path d="M183 230L253.4038 300.4038" fill="none" stroke="#7854a2" stroke-width="1.8" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M258 305L247.3934 301.4645L254.4645 294.3934Z" fill="#7854a2"/><circle cx="282" cy="305" r="20" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="282" y="311" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">q4</text><text x="28" y="355" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">h=tanh(ax+c)；qᵢ=bᵢ+wᵢh</text><path d="M85.8333 415L85.8333 560" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M85.8333 560L85.8333 565" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="85.8333" y="586" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><path d="M190 415L190 560" fill="