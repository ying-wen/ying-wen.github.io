<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1217" viewBox="0 0 360 1217" role="img" aria-labelledby="crl-1whrusb-title crl-1whrusb-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1whrusb-title">同一模型，预测怎样改善行动</title><desc id="crl-1whrusb-desc">原创精确模型计算，4×3网格、gamma=.9、进入终点奖励1、其余奖励−.04。左或上图对固定均匀随机策略求解(I−gamma P)v=r，起点价值−.263571389；橙箭头四方向等概率。右或下图对旧策略价值做一步贪心、并列依上右下左固定选取，再重新解新策略方程，起点新价值.51854。蓝框始终标同一起点。旧策略起点四个动作价值依上右下左为−.271375089、−.228481968、−.277214251、−.277214251，所以改善选右。下部三数分别为旧策略完整价值、只第一步选右以后沿用旧策略的价值、以后始终采用新策略的完整价值，不能将后两个当作同一对象。数字和策略箭头分开占据每格上下区域，全部使用同一色标。每个非终止格新策略值均不低于旧值；在本例恰好达到最短路线最优值。两策略预测残差低于1e−15，无训练。</desc><rect width="360" height="1217" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一模型，预测怎样改善行动</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先算旧策略，再选择并评价新策略</text><text x="40" y="115" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">vπ：四方向各 1/4</text><rect x="40" y="142" width="70" height="70" rx="0" fill="rgb(248,225,221)" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="75" y="166" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">-0.187</text><path d="M75 186L75 177.9" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M75 174L78 180L72 180Z" fill="#b65a28"/><path d="M78 189L86.1 189" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M90 189L84 192L84 186Z" fill="#b65a28"/><path d="M75 192L75 200.1" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M75 204L72 198L78 198Z" fill="#b65a28"/><path d="M72 189L63.9 189" fill="none" strok