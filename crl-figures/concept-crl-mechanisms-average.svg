<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860" role="img" aria-labelledby="title desc"><title id="title">扣掉共同奖励率，留下起点之间的差别</title><desc id="desc">确定性两状态环每两步奖励0、2，长期每步1。上方为循环和可数奖励；中部原始奖励脉冲减去水平基准后成为负1、正1；下方相对值从0升到1再回到0，恰好抵消每步中心化奖励。</desc><defs><marker id="teal" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#087e85"/></marker><marker id="gold" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#aa601b"/></marker><marker id="red" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a54742"/></marker><marker id="ink" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#18363d"/></marker></defs><rect width="1080" height="860" fill="#faf8f2"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="38" y="48" fill="#18363d" font-size="29" font-weight="700">扣掉共同奖励率，留下起点之间的差别</text><circle cx="142" cy="165" r="42" fill="#cce8df" stroke="#087e85" stroke-width="3"/><circle cx="407" cy="165" r="42" fill="#f4e2bd" stroke="#aa601b" stroke-width="3"/><text x="142" y="173" fill="#18363d" font-size="29" text-anchor="middle">0</text><text x="407" y="173" fill="#18363d" font-size="29" text-anchor="middle">1</text><path d="M176,133 Q274,68 374,133" fill="none" stroke="#18363d" stroke-width="3" marker-end="url(#ink)" /><text x="275" y="84" fill="#18363d" font-size="23" text-anchor="middle">R=0</text><path d="M374,196 Q274,260 176,196" fill="none" stroke="#18363d" stroke-width="3" marker-end="url(#ink)" /><text x="275" y="248" fill="#18363d" font-size="23" text-anchor="middle">R=2</text><text x="590" y="115" fill="#627679" font-size="23" >2 步</text><line x1="605" y1="147" x2="770" y2="147" stroke="#18363d" stroke-width="3" marker-end="url(#ink)" /><circle cx="853" cy="138" r="14" fill="#aa601b" stroke="none" stroke-width="2"/><circle cx="888" cy="138