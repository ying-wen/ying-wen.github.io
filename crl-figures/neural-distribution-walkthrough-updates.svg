<svg xmlns="http://www.w3.org/2000/svg" width="720" height="951" viewBox="0 0 720 951" role="img" aria-labelledby="crl-d1ykbb-title crl-d1ykbb-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-d1ykbb-title">一处误差下降，另一处预测被改写</title><desc id="crl-d1ykbb-desc">原创确定性四次共享网络更新。训练输入只有floating=1，目标固定为.5,.5,2.5,2.5，各点质量.25；pinball损失对16对取平均，步长.5，同时更新a,c,w,b。上部画四个输出头随写入次数0至4的实际计算，头1与3为实线，头2与4为虚线，蓝表示低两头、橙表示高两头，青水平虚线是真位置。fixed原本准确的四头展开，floating逐渐向真实端点展开。下部同一纵轴W1显示fixed从0升至.125，floating从.5降至约.233。两动作均值都保持1.5，浮动训练损失从.375降至约.295。连接离散点的线只帮助追踪，不表示点间运行；四次是受控期望梯度机制，不是随机训练性能实验。</desc><rect width="720" height="951" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一处误差下降，另一处预测被改写</text><text x="28" y="84" font-size="21" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">仅写 floating：冻结标签，α=.5</text><path d="M70 160L70 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M70 370L70 375" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="396" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M133.75 160L133.75 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M133.75 370L133.75 375" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="133.75" y="396" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M197.5 160L197.5 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M197.5 370L197.5 375" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="197.5" y="396" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><pa