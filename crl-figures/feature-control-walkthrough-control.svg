<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="crl-1p4d9gn-title crl-1p4d9gn-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1p4d9gn-title">共享更新改变动作与下一条经验</title><desc id="crl-1p4d9gn-desc">原创有限次实际Sarsa更新，使用相同环境、零初值、gamma1、alpha.6和3维单位范数动作块。epsilon0，初始并列选继续，B只有继续。首回合皆A到B奖励2、B到T奖励负1。A更新后继续值1.2；B更新后分离/两套normalized tiles/粗聚合分别1.2/.72/负.12，B的值分别负.6/负.36/负.12。空圆和实圆分别显示这两次写入后的A估计，数字轴相同，退出动作一直为0。到下一回合A，按新估计实际执行继续或退出：分离与tiles奖励2到B，聚合奖励0到T。这些箭头调用了同一真实转移表，而非假想模型查询或预先固定的后续轨迹。</desc><rect width="720" height="920" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">共享更新改变动作与下一条经验</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">首回合实际 A→B→T；α=.6</text><text x="28" y="117" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">到 B 后：A 暂不再访问，仍会被改写</text><text x="28" y="175" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">分离特征</text><path d="M94 228L354.8 228" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M126.6 223L126.6 233" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="126.6" y="255" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M289.6 223L289.6 233" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="289.6" y="255" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="322.2" cy="228" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="322.2" cy="228" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="94" y="277" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">q(A,继续)：1.2 → 1.2</text><text x="94" y="310" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">q(B)：0 → -0.6</text><circle cx="430" cy="248" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="430" y="255" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="666" cy="248" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="666" y="255" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M453 248L636.5 248" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M643 248L633 253L633 243Z" fill="#146ca1"/><text x="548" y="219" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">继续</text><text x="548" y="293" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">实际 R=2</text><text x="430" y="338" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">到 B；下一动作仍为继续</text><text x="28" y="379" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">两套 tile</text><path d="M94 432L354.8 432" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M126.6 427L126.6 437" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="126.6" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M289.6 427L289.6 437" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="289.6" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="322.2" cy="432" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M322.2 432L247.86 432" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M243.96 432L249.96 429L249.96 435Z" fill="#258375"/><circle cx="243.96" cy="432" r="5" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="94" y="481" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">q(A,继续)：1.2 → 0.72</text><text x="94" y="514" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">q(B)：0.6 → -0.36</text><circle cx="430" cy="452" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="430" y="459" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="666" cy="452" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="666" y="459" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M453 452L636.5 452" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M643 452L633 457L633 447Z" fill="#146ca1"/><text x="548" y="423" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">继续</text><text x="548" y="497" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">实际 R=2</text><text x="430" y="542" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">到 B；下一动作仍为继续</text><text x="28" y="583" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">粗状态聚合</text><path d="M94 636L354.8 636" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M126.6 631L126.6 641" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="126.6" y="663" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M289.6 631L289.6 641" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="289.6" y="663" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="322.2" cy="636" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M322.2 636L110.94 636" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M107.04 636L113.04 633L113.04 639Z" fill="#b54142"/><circle cx="107.04" cy="636" r="5" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><text x="94" y="685" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">q(A,继续)：1.2 → -0.12</text><text x="94" y="718" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">q(B)：1.2 → -0.12</text><circle cx="430" cy="656" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="430" y="663" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="666" cy="656" r="20" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="666" cy="656" r="15" fill="none" stroke="#52687b" stroke-width="2" opacity="1"/><text x="666" y="663" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">T</text><path d="M453 656L636.5 656" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M643 656L633 661L633 651Z" fill="#b65a28"/><text x="548" y="627" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">退出</text><text x="548" y="701" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">实际 R=0</text><text x="430" y="746" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">终止；这回合未见 B</text><text x="28" y="812" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">空圆：A 更新后；实圆：B 更新后</text><text x="28" y="847" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">线段标的是动作值，不是训练收益</text><text x="28" y="884" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">下一回合动作由这些估计实际选出</text></g></svg>
