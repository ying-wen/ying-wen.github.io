<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1750" viewBox="0 0 360 1750" role="img" aria-labelledby="crl-1rze11i-title crl-1rze11i-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1rze11i-title">分布更新与行动准则分别计算</title><desc id="crl-1rze11i-desc">原创短程确定计算。上部一个非终止真实转移字段和固定后继快照产生目标(.25,.25,.25,.25,0)；零logits给均匀.2，通过一次步长1的logit交叉熵下降，概率变为约(.209,.209,.209,.209,.163)，目标和后继不参与求导。下部是独立的行动准则比较：固定首款.5不变，浮动首款改.6，读取已知模型真实分布。期望1.6比1.5高，选择浮动并到v，末步0/4各半；收益下尾CVaR .5读最差一半，固定1.5比浮动.6高，选择固定并到f，末步2终止。紫透明条标浮动下尾质量。下部没有把一步未拟合分布当成真值，也不声称C51本身优化风险。</desc><rect width="360" height="1750" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">分布更新与行动准则分别计算</text><text x="28" y="84" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">样本 (s,浮动,.5,v,false)</text><text x="28" y="119" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">后继快照冻结；更新当前 s 的 logits</text><text x="28" y="157" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">更新前：logits 全 0</text><path d="M55 263L304 263" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M55 263L55 269" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="55" y="291" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M117.25 263L117.25 269" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="117.25" y="291" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M179.5 263L179.5 269" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="179.5" y="291" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</te