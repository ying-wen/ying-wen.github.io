ll="#146ca1" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="156.5" y="732" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">9</text><rect x="197" y="712" width="81" height="28" rx="0" fill="#258375" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="237.5" y="732" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">9</text><rect x="278" y="712" width="54" height="28" rx="0" fill="#b65a28" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="305" y="732" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="62" y="766" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">W=30；追加/检查各6次</text><text x="28" y="788" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">采样一次</text><rect x="62" y="802" width="54" height="28" rx="0" fill="#7854a2" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="89" y="822" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><rect x="116" y="802" width="54" height="28" rx="0" fill="#146ca1" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="143" y="822" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><rect x="170" y="802" width="27" height="28" rx="0" fill="#258375" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="183.5" y="822" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">3</text><rect x="197" y="802" width="54" height="28" rx="0" fill="#b65a28" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="224" y="822" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="62" y="856" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">W=21；追加/检查各6次</text><text x="28" y="924" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">紫：查询；蓝：后果展开</text><text x="28" y="955" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">青：后继动作值读取；橙：Q写入</text><text x="28" y="1030" font-size="16" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">只把 exit 改成0.82：go 真值仍0.81</text><path d="M75 1092L75 1262" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 1262L75 1267" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="75" y="1288" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">21</text><path d="M226.2 1092L226.2 1262" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M226.2 1262L226.2 1267" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="226.2" y="1288" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">30</text><path d="M327 1092L327 1262" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M327 1262L327 1267" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="327" y="1288" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">36</text><path d="M75 1262L327 1262" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M70 1262L75 1262" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="65" y="1267" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.81</text><path d="M75 1184.7273L327 1184.7273" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M70 1184.7273L75 1184.7273" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="65" y="1189.7273" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.815</text><path d="M75 1107.4545L327 1107.4545" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M70 1107.4545L75 1107.4545" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="65" y="1112.4545" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.82</text><path d="M75 1092L75 1262" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M75 1262L327 1262" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="327" y="1316" font-size="18" fill="#19354e" text-anchor="end" font-weight="400" opacity="1">可用基本预算 B</text><text x="75" y="1074" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">下一实际回报期望</text><path d="M75 1184.7273L159 1184.7273L159 1146.0909L226.2 1146.0909L226.2 1146.0909L243 1146.0909L243 1184.7273L327 1184.7273L327 1155.75" fill="none" stroke="#b54142" stroke-width="3"/><path d="M75 1107.4545L327 1107.4545" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 5"/><text x="28" y="1356" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">橙：期望备份选 exit；红：采样分支平均</text><text x="28" y="1395" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">纵轴0.810–0.821；有限序列精确枚举</text></g></svg>
