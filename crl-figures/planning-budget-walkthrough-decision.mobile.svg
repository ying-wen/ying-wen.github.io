<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1435" viewBox="0 0 360 1435" role="img" aria-labelledby="crl-1squ3hm-title crl-1squ3hm-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1squ3hm-title">预算怎样改变真正的选择</title><desc id="crl-1squ3hm-desc">同一四叶优先顺序，期望cross一次，采样cross独立n次以alpha_k=1/k平均，再备份go。W全期望=30；采样=16+5n。B21、26、31、36分别允许n1、2、3、4，精确枚举4^n后继序列，选择go概率分别1/2、3/4、1/2、11/16。B30全期望完成并必选go，采样只能完成n2并留4基本单位。上图画的是停止后真正首动作的概率，非训练曲线；模型和叶值在cross平均期间冻结。中部长度显示查询、展开后果、后继动作值读取、Q写入，合计30与21；静态列表追加/预算检查均6另计，样本选择1另计，队列0。下图只把exit奖励改.82，go真实回报仍.81：全期望选exit，采样可能误选go，使下一实际期望回报低于.82；下图纵轴范围.810..821。真实episode从exit有1步，从go有3步，真实转移在这些规划预算之外另计。原创有限算例和精确枚举。</desc><rect width="360" height="1435" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">预算怎样改变真正的选择</text><text x="28" y="86" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一后继优先日程；预算 B 截止</text><text x="28" y="120" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">先四个 collect，再 cross，最后 go</text><path d="M65 193L65 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M65 433L65 438" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="65" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">12</text><path d="M149.2143 193L149.2143 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M149.2143 433L149.2143 438" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="149.2143" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">21</text><path d="M233.4286 193L233.4286 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M233.4286 433L233.4286 438" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="233.4286" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">30</text><path d="M327 193L327 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M327 433L327 438" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="327" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">40</text><path d="M65 433L327 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M60 433L65 433" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="55" y="438" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M65 313L327 313" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M60 313L65 313" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="55" y="318" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M65 193L327 193" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M60 193L65 193" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="55" y="198" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M65 193L65 433" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M65 433L327 433" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="327" y="487" font-size="18" fill="#19354e" text-anchor="end" font-weight="400" opacity="1">可用基本预算 B</text><text x="65" y="175" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">选择 go 的概率</text><path d="M65 433