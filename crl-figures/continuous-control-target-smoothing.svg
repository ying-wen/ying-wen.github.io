<svg xmlns="http://www.w3.org/2000/svg" width="720" height="974" viewBox="0 0 720 974" role="img" aria-labelledby="crl-9kyslb-title crl-9kyslb-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-9kyslb-title">目标平滑如何削弱窄峰</title><desc id="crl-9kyslb-desc">原创构造计算，沿用两步定位器的旧经验。两个固定target critic都是真实末步Q加同中心同宽度的Gaussian形误差，振幅分别.8和.3；target actor输出1.4。紫色阴影为加上裁剪Normal噪声后的动作范围[1.2,1.6]，sigma=.15，clip=.2。蓝线是较小critic对裁剪噪声的期望，以2000分段Simpson积分并加两端概率原子计算。下部圆点共用标签数值轴。没有训练critic；没有声称该期望是真实策略价值。</desc><rect width="720" height="974" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">目标平滑如何削弱窄峰</text><text x="28" y="85" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一旧经验；只改变后继查询</text><path d="M80 139L80 399" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M80 399L80 404" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="80" y="425" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M230 139L230 399" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M230 399L230 404" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="230" y="425" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.2</text><path d="M380 139L380 399" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M380 399L380 404" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="380" y="425" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.4</text><path d="M530 139L530 399" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M530 399L530 404" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="530" y="425" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.6</text><path d="M680 139L680 399" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M680 399L680 404" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="680" y="425" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.8</text><path d="M80 391.973L680 391.973" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 391.973L80 391.973" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="396.973" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">-1.5</text><path d="M80 321.7027L680 321.7027" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 321.7027L80 321.7027" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="326.7027" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">-1</text><path d="M80 251.4324L680 251.4324" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 251.4324L80 251.4324" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="256.4324" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">-0.5</text><path d="M80 181.1622L680 181.1622" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 181.1622L80 181.1622" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="186.1622" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M80 139L80 399" fill="none" stroke="#19354e" stroke-width="