<svg xmlns="http://www.w3.org/2000/svg" width="720" height="776" viewBox="0 0 720 776" role="img" aria-labelledby="crl-1xcaj30-title crl-1xcaj30-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1xcaj30-title">MC 投向真值；TD 解投影后的 Bellman 固定点</title><desc id="crl-1xcaj30-desc">二状态交替，奖励0和1，gamma为1/2，特征1和3，均匀状态权重。横纵轴同单位、使用标明非零坐标起点的局部视窗，可表示空间为斜率3的直线。真实价值2/3、4/3的正交投影是MC；Bellman备份后再投影的固定点是TD。所有坐标和投影由精确公式计算，两个解没有被画成同一个点。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#19354e"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52687b"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c8d6e0"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#146ca1"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#258375"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b65a28"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7854a2"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b54142"/></marker><marker id="white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#ffffff"/></marker><marker id=