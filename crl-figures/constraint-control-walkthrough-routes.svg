<svg xmlns="http://www.w3.org/2000/svg" width="720" height="944" viewBox="0 0 720 944" role="img" aria-labelledby="crl-kydn2q-title crl-kydn2q-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-kydn2q-title">近似回报，不同可行性</title><desc id="crl-kydn2q-desc">原创已知配送CMDP精确算例。初始分布只在路口s，gamma .9；捷径以奖励9.2及成本1直接到吸收终点T，绕行以奖励0到l，下一步奖励10到T且两步成本均0。T双圆圈表示终止，之后零奖励零成本。风险区进入是任务规定成本事件，不表示实测碰撞。下方同一坐标显示p为捷径概率，Jr=9+.2p、Jc=p，绿色为Jc不超过.3的区域。圆点p.3对应回报9.06且可行，方点p.6对应9.12且不可行。回报纵轴截取8.98至9.22以展示近似收益，横轴为未归一化期望成本。</desc><rect width="720" height="944" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">近似回报，不同可行性</text><text x="28" y="85" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一起点；γ=.9；未归一化预算 .3</text><rect x="274" y="169" width="141" height="60" rx="0" fill="#f7e6e5" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="345" y="196" font-size="18" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">风险区</text><path d="M119 209L589.5 209" fill="none" stroke="#b54142" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M596 209L586 214L586 204Z" fill="#b54142"/><circle cx="95" cy="209" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="95" y="215" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">s</text><circle cx="621" cy="209" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="621" cy="209" r="16" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="621" y="215" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">T</text><circle cx="350" cy="324" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="350" y="330" font-size="18" fill="#146ca1" text-anchor="middle" font-w