<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1145" viewBox="0 0 360 1145" role="img" aria-labelledby="crl-1j4ni3-title crl-1j4ni3-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1j4ni3-title">交换坐标，看见分位数表示</title><desc id="crl-1j4ni3-desc">原创接单任务精算。左/上CDF在回报.5跳到.5，在2.5跳到1。右/下逆CDF在0&lt;tau&lt;=.5取.5，在.5&lt;tau&lt;=1取2.5；实心点为包含端点，空心点为不包含端点。紫色标出四个概率区间中点1/8、3/8、5/8、7/8，对应位置.5、.5、2.5、2.5，每点质量1/4。重合点合并后恢复二点真实分布。青虚线是固定回报1.5。此处真分位数由已知任务求得，尚未画学习估计。</desc><rect width="360" height="1145" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">交换坐标，看见分位数表示</text><text x="28" y="84" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一浮动回报：.5 / 2.5，各半</text><path d="M60 330L322 330" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M60 330L60 150" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M60 330L60 336" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="60" y="358" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M103.6667 330L103.6667 336" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="103.6667" y="358" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><path d="M191 330L191 336" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="191" y="358" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.5</text><path d="M278.3333 330L278.3333 336" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="278.3333" y="358" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2.5</text><path d="M322 330L322 336" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="322" y="358" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M55 330L60 330" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="50" y="335" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M55 240L60 240" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="50" y="245" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M55 150L60 150" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="50" y="155" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><text x="322" y="390" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">回报 z</text><text x="60" y="126" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">CDF：P(G ≤ z)</text><path d="M60 330L103.6667 330" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M103.6667 330L103.6667 240" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M103.6667 240L278.3333 240" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M278.3333 240L278.3333 150" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M278.3333 150L322 150" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="103.6667" cy="240" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="278.3333" cy="150" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M60 680L322 680" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path