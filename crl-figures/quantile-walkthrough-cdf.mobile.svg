b" text-anchor="start" font-weight="400" opacity="1">逆 CDF：分位位置</text><path d="M60 650L191 650" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M191 530L322 530" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="191" cy="650" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="191" cy="530" r="5" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><path d="M60 590L322 590" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><path d="M92.75 680L92.75 650" fill="none" stroke="#7854a2" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><circle cx="92.75" cy="650" r="6" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><path d="M158.25 680L158.25 650" fill="none" stroke="#7854a2" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><circle cx="158.25" cy="650" r="6" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><path d="M223.75 680L223.75 530" fill="none" stroke="#7854a2" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><circle cx="223.75" cy="530" r="6" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><path d="M289.25 680L289.25 530" fill="none" stroke="#7854a2" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><circle cx="289.25" cy="530" r="6" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="770" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">四个 midpoint：⅛，⅜，⅝，⅞</text><text x="28" y="806" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每个位置质量 ¼，重合时质量相加</text><path d="M60 990L322 990" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M60 990L60 880" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M60 990L60 996" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="60" y="1018" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M103.6667 990L103.6667 996" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="103.6667" y="1018" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><path d="M191 990L191 996" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="191" y="1018" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.5</text><path d="M278.3333 990L278.3333 996" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="278.3333" y="1018" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2.5</text><path d="M322 990L322 996" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="322" y="1018" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M55 990L60 990" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="50" y="995" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M55 935L60 935" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="50" y="940" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M55 880L60 880" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="50" y="885" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><text x="322" y="1050" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">回报 G</text><text x="60" y="856" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">等质量点合并后的分布</text><path d="M103.6667 990L103.6667 935" fill="none" stroke="#7854a2" stroke-width="6" stroke-linecap="round" opacity="1"/><circle cx="103.6667" cy="935" r="6" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="103.6667" y="920" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">½</text><path d="M278.3333 990L278.3333 935" fill="none" stroke="#7854a2" stroke-width="6" stroke-linecap="round" opacity="1"/><circle cx="278.3333" cy="935" r="6" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="278.3333" y="920" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">½</text><text x="28" y="1072" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">紫点：真分位；青虚线：固定 G=1.5</text><text x="28" y="1110" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">实心/空心点：跳跃两端的取值约定</text></g></svg>
