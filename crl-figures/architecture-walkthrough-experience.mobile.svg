<svg xmlns="http://www.w3.org/2000/svg" width="360" height="695" viewBox="0 0 360 695" role="img" aria-labelledby="crl-4846zf-title crl-4846zf-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-4846zf-title">先走两趟，得到四条经验</title><desc id="crl-4846zf-desc">原创确定性配送任务的实际采集轨迹。第一趟从S选近路一步到D得2；重置位置后走S到A到B到G，奖励0、0、6。两次任务终止均重返S，重置不计奖励或环境步，学习器保留。Q从零开始、步长1、折扣0.9，四次真实更新后S近、S远、A、B的Q分别为2、0、0、6。绘图只使用实际轨迹中已经观察的边。</desc><rect width="360" height="695" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先走两趟，得到四条经验</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">真实时钟 t=1…4；模型调用 k=0</text><path d="M74 145L264.5 145" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M271 145L261 150L261 140Z" fill="#146ca1"/><text x="172" y="120" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">t1: +2</text><path d="M50 169L50 254.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M50 261L45 251L55 251Z" fill="#146ca1"/><text x="115" y="218" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">t2: 0</text><path d="M74 285L141.5 285" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M148 285L138 290L138 280Z" fill="#146ca1"/><text x="112" y="255" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">t3: 0</text><path d="M196 285L264.5 285" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M271 285L261 290L261 280Z" fill="#146ca1"/><text x="234" y="255" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">t4: +6</text><circle cx="50" cy="145" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="50" y="151" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="295" cy="145" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="295" cy="145" r="16" fill="none" stroke="#146ca1" stroke-width="1" opacity="1"/><text x="295" y="151" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">D</text><circle cx="50" cy="285" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="50" y="291" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="172" cy="285" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="172" y="291" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="295" cy="285" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="295" cy="285" r="16" fill="none" stroke="#146ca1" stroke-width="1" opacity="1"/><text x="295" y="291" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="50" y="110" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">出发</text><text x="28" y="380" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">四次直接更新后的 Q</text><path d="M41 540L89 540" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="46" y="506" width="38" height="34" rx="2" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="65" y="494" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="65" y="570" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S近</text><path d="M117 540L165 540" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="141" y="528" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="141" y="570" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S远</text><path d="M193 540L241 540" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="217" y="528" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="217" y="570" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M269 540L317 540" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="274" y="438" width="38" height="102" rx="2" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="293" y="426" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="293" y="570" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="28" y="625" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">每条模型边：1 次真实观察</text><text x="28" y="660" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">双圈：送达终止；重返 S 不清空学习器</text></g></svg>
