<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1580" viewBox="0 0 360 1580" role="img" aria-labelledby="crl-1lku48g-title crl-1lku48g-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1lku48g-title">访问留下痕迹，误差沿痕迹更新</title><desc id="crl-1lku48g-desc">沿正文轨迹A B A B C终点，展示t=0、1、2、4的快照；累积迹e_t=.72e_(t-1)+onehot(S_t)。圆面积随资格变化；终点奖励前旧价值全为零，最后一次delta为1。橙条是alpha=.1的实际表格更新。收下终点奖励并使用旧迹后才清迹。</desc><rect width="360" height="1580" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">访问留下痕迹，误差沿痕迹更新</text><text x="28" y="83" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">路径：A → B → A → B → C → 终点</text><text x="28" y="115" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">γλ = 0.72；圆面积表示当前资格</text><text x="28" y="155" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">t = 0　访问 A</text><rect x="83" y="189" width="67" height="67" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="116.5" cy="222.5" r="24" fill="#258375" stroke="#258375" stroke-width="1" opacity="0.25"/><text x="116.5" y="228.5" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><rect x="150" y="189" width="67" height="67" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="183.5" cy="222.5" r="0" fill="#258375" stroke="#258375" stroke-width="1" opacity="0.25"/><text x="183.5" y="228.5" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><rect x="150" y="256" width="67" height="67" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="183.5" cy="289.5" r="0" fill="#258375" stroke="#258375" stroke-width="1" opacity="0.25"/><text x="183.5" y="295.5" font-size="18" fill="#19