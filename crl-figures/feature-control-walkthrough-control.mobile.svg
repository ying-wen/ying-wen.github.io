<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1297" viewBox="0 0 360 1297" role="img" aria-labelledby="crl-d8483l-title crl-d8483l-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-d8483l-title">共享更新改变动作与下一条经验</title><desc id="crl-d8483l-desc">原创有限次实际Sarsa更新，使用相同环境、零初值、gamma1、alpha.6和3维单位范数动作块。epsilon0，初始并列选继续，B只有继续。首回合皆A到B奖励2、B到T奖励负1。A更新后继续值1.2；B更新后分离/两套normalized tiles/粗聚合分别1.2/.72/负.12，B的值分别负.6/负.36/负.12。空圆和实圆分别显示这两次写入后的A估计，数字轴相同，退出动作一直为0。到下一回合A，按新估计实际执行继续或退出：分离与tiles奖励2到B，聚合奖励0到T。这些箭头调用了同一真实转移表，而非假想模型查询或预先固定的后续轨迹。</desc><rect width="360" height="1297" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">共享更新改变动作与下一条经验</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">首回合实际 A→B→T；α=.6</text><text x="28" y="117" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">到 B 后：A 暂不再访问，仍会被改写</text><text x="28" y="175" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">分离特征</text><path d="M48 228L307.2 228" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M80.4 223L80.4 233" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80.4" y="255" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M242.4 223L242.4 233" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="242.4" y="255" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="274.8" cy="228" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="274.8" cy="228" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="48" y="277" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">q(A,继续)：1.2 → 1.2</text><text x="48" y="310" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">q(B)：0 → -0.6</text><circle cx="54" cy="382" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="54" y="389" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="292" cy="382" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="292" y="389" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M77 382L262.5 382" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M269 382L259 387L259 377Z" fill="#146ca1"/><text x="173" y="353" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">继续</text><text x="173" y="427" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">实际 R=2</text><text x="28" y="472" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">到 B；下一动作仍为继续</text><text x="28" y="504" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">两套 tile</text><path d="M48 557L307.2 557" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M80.4 552L80.4 562" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80.4" y="584" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M242.4 552L242.4 562" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="242.4" y="584" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="274.8" cy="557" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M274.8 557L200.94 557" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M197.04 557L203.04 554L203.04 560Z" fill="#258375"/><circle cx="197.04" cy="557" r="5" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="48" y="606" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">q(A,继续)：1.2 → 0.72</text><text x="48" y="639" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">q(B)：0.6 → -0.36</text><circle cx="54" cy="711" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="54" y="718" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="292" cy="711" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="292" y="718" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M77 711L262.5 711" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M269 711L259 716L259 706Z" fill="#146ca1"/><text x="173" y="682" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">继续</text><text x="173" y="756" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">实际 R=2</text><text x="28" y="801" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">到 B；下一动作仍为继续</text><text x="28" y="833" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">粗状态聚合</text><path d="M48 886L307.2 886" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M80.4 881L80.4 891" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="80.4" y="913" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M242.4 881L242.4 891" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="242.4" y="913" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="274.8" cy="886" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M274.8 886L64.86 886" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M60.96 886L66.96 883L66.96 889Z" fill="#b54142"/><circle cx="60.96" cy="886" r="5" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><text x="48" y="935" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">q(A,继续)：1.2 → -0.12</text><text x="48" y="968" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">q(B)：1.2 → -0.12</text><circle cx="54" cy="1040" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="54" y="1047" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="292" cy="1040" r="20" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="292" cy="1040" r="15" fill="none" stroke="#52687b" stroke-width="2" opacity="1"/><text x="292" y="1047" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">T</text><path d="M77 1040L262.5 1040" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M269 1040L259 1045L259 1035Z" fill="#b65a28"/><text x="173" y="1011" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">退出</text><text x="173" y="1085" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">实际 R=0</text><text x="28" y="1130" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">终止；这回合未见 B</text><text x="28" y="1189" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">空圆：A 更新后；实圆：B 更新后</text><text x="28" y="1224" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">线段标的是动作值，不是训练收益</text><text x="28" y="1261" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">下一回合动作由这些估计实际选出</text></g></svg>
