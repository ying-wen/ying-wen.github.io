<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1060" viewBox="0 0 360 1060" role="img" aria-labelledby="crl-1qbemrq-title crl-1qbemrq-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1qbemrq-title">技能改变，旧模型怎样出错？</title><desc id="crl-1qbemrq-desc">同一2行3列网格，启动点左上，两终点G右上、F右下都只终止option。每步负1，到G额外加5。版本1右右，2步累计3并到G；版本2下右右，3步累计负3并到F。规划器暂取奖励率1、bias G4 F0，旧模型给备份5，实际新策略对应负6。圆环是本次技能停止位置。世界和终止规则不变，仅内部策略变化。</desc><rect width="360" height="1060" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="42" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">技能改变，旧模型怎样出错？</text><g transform="translate(24,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 技能版本 1</text><path d="M0 25L312 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><g data-pattern="gridworld"><rect x="45" y="57" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="119" y="57" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="193" y="57" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="45" y="131" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="119" y="131" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="193" y="131" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M82 94L149.5 94" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M156 94L146 99L146 89Z" fill="#146ca1"/><path d="M156 94L223.5 94" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M230 94L220 99L220 89Z" fill="#146ca1"/><circle cx="82" cy="94" r="12" fill="#146ca1" stroke="#ffffff" stroke-width="2.5" opacity="1"/></g><rect x="198" y="62" width="64" height="64" rx="3" fill="none" stroke="#258375" stroke-width="2" opacity="1"/><text x="230" y="101" font-size="24" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">G</text><rect x="198" y="136" width="64" height="64" rx="3" fill="none" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="230" y="175" font-size="24" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">F</text><circle cx="230" cy="94" r="30" fill="none" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="0" y="251" font-size="24" fill="#258375" text-anchor="start" font-weight="400" opacity="1">R=3</text><text x="156" y="251" font-size="23" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">τ=2</text><text x="312" y="251" font-size="23" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">→G</text></g><g transform="translate(24,401)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 改变内部策略</text><path d="M0 25L312 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><g data-pattern="gridworld"><rect x="45" y="57" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="119" y="57" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="193" y="57" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="45" y="131" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="119" y="131" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="193" y="131" width="74" height="74" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M82 9