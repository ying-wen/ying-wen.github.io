>沿用旧模型</text><path d="M167 121L267 121" fill="none" stroke="#7854a2" stroke-width="14" stroke-linecap="round" opacity="1" stroke-dasharray="12 22"/><circle cx="267" cy="121" r="6" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="312" y="91" font-size="25" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">5</text><text x="0" y="166" font-size="21" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">3 − 1×2 + 4</text><text x="0" y="207" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">实际新策略</text><path d="M167 243L47 243" fill="none" stroke="#146ca1" stroke-width="14" stroke-linecap="round" opacity="1"/><circle cx="47" cy="243" r="6" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="312" y="213" font-size="25" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">-6</text><text x="0" y="288" font-size="21" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">-3 − 1×3 + 0</text><path d="M167 82L167 265" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="167" y="303" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text></g></g></svg>
