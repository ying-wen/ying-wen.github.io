<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1244" viewBox="0 0 360 1244" role="img" aria-labelledby="crl-1g6q793-title crl-1g6q793-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1g6q793-title">完整回合改变下一次采样</title><desc id="crl-1g6q793-desc">沿用S0到S1再终止的两步任务。γ=0.5，固定ε=0.2，初始Q为零、初始策略均匀，改善时平局选B。给定均匀数(0.4,0.8)、(0.95,0.05)、(0.05,0.5)，程序按当回合冻结的π实际选择AB、BA、AA。圆为状态，箭头为真实转移，箭头上的字母及数字为动作及奖励。每回合下方是完整回报写入后的Q，橙色条宽是随后ε-greedy策略的A概率。三条回合轨迹各在其实际策略下的概率为0.25、0.01、0.09；这是一条可行输入序列，不是随机训练学习曲线。</desc><rect width="360" height="1244" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">完整回合改变下一次采样</text><text x="22" y="81" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">同一两步任务 · γ=0.5 · ε=0.2</text><text x="22" y="126" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">回合 1 · 使用 π0</text><text x="22" y="157" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">u = (0.4, 0.8)</text><circle cx="52" cy="208" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="52" y="214" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₀</text><circle cx="180" cy="208" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="214" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₁</text><circle cx="309" cy="208" r="22" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><circle cx="309" cy="208" r="17" fill="none" stroke="#19354e" stroke-width="1" opacity="1"/><text x="309" y="214" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">终</text><path d="M76 208L151.45 208" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M156 208L149 211.5L149 204.5Z" fill="#146ca1"/><text x="116" y="193" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">A / 2</text><path d="M204 208L280.45 208" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M285 208L278 211.5L278 204.5Z" fill="#146ca1"/><text x="244.5" y="193" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">B / 0</text><text x="22" y="248" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">采样时 A 概率：0.5 / 0.5</text><text x="22" y="281" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">G = (2, 0)</text><text x="22" y="314" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q₀(A,B) = (2, 0)</text><text x="22" y="342" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q₁(A,B) = (0, 0)</text><text x="22" y="376" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">π1 · S₀</text><rect x="22" y="388" width="129.6" height="18" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="151.6" y="388" width="14.4" height="18" rx="0" fill="#e2e7eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="22" y="431" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 0.9 · B 0.1</text><text x="194" y="376" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">π1 · S₁</text><rect x="194" y="388" width="14.4" height="18" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="208.4" y="388" width="129.6" height="18" rx="0" fill="#e2e7eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="194" y="431" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 0.1 · B 0.9</text><path d="M22 464L338 464" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-li