 font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">J</text><circle cx="180" cy="1092.75" r="4" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><circle cx="180" cy="1052.5" r="4" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><circle cx="180" cy="1012.25" r="4" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><path d="M162 1113L162 1002.2" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M162 997L166 1005L158 1005Z" fill="#146ca1"/><circle cx="180" cy="1133" r="13" fill="#146ca1" stroke="#ffffff" stroke-width="2.5" opacity="1"/><text x="180" y="1168" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C：c=+1</text><path d="M162 972L137.85 972" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M132 972L141 967.5L141 976.5Z" fill="#b65a28"/><path d="M108 995L80 1020" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M80 1020L80 1140" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M80 1140L156 1140" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="1205" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">hⱼ=+1，b⁺=1</text><text x="28" y="1237" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">门反馈 t=21</text><path d="M28 1292L332 1292" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="1326" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实际累计奖励 1；共 21 步</text><text x="28" y="1358" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">蓝色返回路：每次另花 1 步</text><text x="28" y="1390" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">初始化 1 次；环境 reset 0 次</text><text x="28" y="1422" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">灰路仍可返回；窗口没有终止</text></g></svg>
