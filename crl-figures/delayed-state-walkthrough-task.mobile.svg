<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1460" viewBox="0 0 360 1460" role="img" aria-labelledby="crl-1g4bdk3-title crl-1g4bdk3-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1g4bdk3-title">长走廊后，用本次提示选门</title><desc id="crl-1g4bdk3-desc">三次独立新模式的一个精确分支：提示+1、-1、+1恰好正确，D为4、8、4；ρ=1，初始b=-1/2。每条竖走廊上的灰点是D-1次中间观察，J是最后一次灰观察；各面板地图按版面排布，不使用空间距离度量时间。橙箭头为实际选门，未选门只画问号。第一奖励把b写成1，第二次实际选右得+1，而冻结b的同分支会选左得-1。前两条蓝色返回路线已经执行，各1步；第三条灰色返回路线仍可用。门反馈在t=5,15,21，窗口总奖励1，环境从未终止或reset。</desc><rect width="360" height="1460" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">长走廊后，用本次提示选门</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每次到 C，重新独立抽取门模式</text><text x="28" y="114" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">只显示实际选中的门后反馈</text><text x="28" y="155" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">第 1 次：D=4</text><path d="M108 232L252 232" fill="none" stroke="#c8d6e0" stroke-width="18" stroke-linecap="round" opacity="1"/><path d="M180 232L180 393" fill="none" stroke="#c8d6e0" stroke-width="18" stroke-linecap="round" opacity="1"/><rect x="86" y="210" width="44" height="44" rx="4" fill="#e7ebef" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="108" y="197" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><text x="108" y="239" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><rect x="230" y="210" width="44" height="44" rx="4" fill="#ffffff" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="252" y="197" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="252" y="239" font-size="20" fill="#b54142" text-anchor="middle" font-