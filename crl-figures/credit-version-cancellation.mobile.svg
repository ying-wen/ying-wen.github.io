<svg xmlns="http://www.w3.org/2000/svg" width="360" height="702" viewBox="0 0 360 702" role="img" aria-labelledby="crl-u83ry9-title crl-u83ry9-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-u83ry9-title">在线更新为何破坏直接相消</title><desc id="crl-u83ry9-desc">给定两次价值快照：v0(S0)=.2，v0(S1)=1，v1(S1)=1.4，终点价值0，gamma=.9，两步奖励0。两条色带表示TD误差中的同一后继状态项，其长度不同。残差gamma(v0(S1)-v1(S1))=-.36精确解释在线误差和与冻结回报目标的差别。</desc><rect width="360" height="702" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">在线更新为何破坏直接相消</text><text x="28" y="83" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一个后继状态，两次计算之间更新了参数</text><path d="M72 139L151.5 139" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M158 139L148 144L148 134Z" fill="#146ca1"/><path d="M198 139L280.5 139" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M287 139L277 144L277 134Z" fill="#146ca1"/><circle cx="52" cy="139" r="20" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="52" y="145" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">S₀</text><circle cx="178" cy="139" r="20" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="178" y="145" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">S₁</text><circle cx="307" cy="139" r="20" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="307" y="145" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">终点</text><text x="178" y="184" font-size="17" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">旧预测 1.0 → 新预测 1.4</text><text x="28" y="220" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">δ₀ 中的后继预测：+0.9 × 1.0</text><rect x="40" y="245" width="156.6" height="32" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="325" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">γδ₁ 中的当前预测：−0.9 × 1.4</text><rect x="40" y="350" width="219.24" height="32" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><path d="M196.6 235L196.6 396" fill="none" stroke="#19354e" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><rect x="196.6" y="350" width="62.64" height="32" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="425" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">同长部分相消，额外留下 −0.36</text><text x="28" y="484" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">令两步奖励均为 0，旧起点预测为 0.2</text><text x="28" y="523" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">冻结目标差：0 − 0.2 = −0.20</text><text x="28" y="562" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">在线误差和：0.7 + 0.9(−1.4) = −0.56</text><text x="28" y="615" font-size="22" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">−0.56 = −0.20 + (−0.36)</text><text x="28" y="663" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">前后预测相同，紫色余项为零</text></g></svg>
