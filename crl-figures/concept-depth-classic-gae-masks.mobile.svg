0" opacity="1">+1</text><text x="63" y="590" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V=.5</text><text x="297" y="590" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V′=1</text><path d="M297 627L69.5 627" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M63 627L73 622L73 632Z" fill="#146ca1"/><text x="34" y="657" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">bootstrap：b=1</text><path d="M297 688L69.5 688" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/><path data-arrow-mode="actual" d="M63 688L73 683L73 693Z" fill="#b65a28"/><path d="M175 679L175 697" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M184 679L184 697" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="34" y="718" font-size="17" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">接下一行：c=0</text><text x="34" y="761" font-size="24" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Â = 1.4</text><text x="326" y="761" font-size="17" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">δ=1.4</text><rect x="20" y="821" width="320" height="314" rx="8" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><text x="34" y="849" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">下一行仍是同一轨迹</text><circle cx="63" cy="895" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M81 895L271.5 895" fill="none" stroke="#146ca1" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M278 895L268 900L268 890Z" fill="#146ca1"/><circle cx="297" cy="895" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="180" y="883" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">+1</text><text x="63" y="932" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V=.5</text><text x="297" y="932" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V′=1</text><path d="M297 969L69.5 969" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M63 969L73 964L73 974Z" fill="#146ca1"/><text x="34" y="999" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">bootstrap：b=1</text><path d="M297 1030L69.5 1030" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M63 1030L73 1025L73 1035Z" fill="#b65a28"/><text x="34" y="1060" font-size="17" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">接下一行：c=1</text><text x="34" y="1103" font-size="24" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Â = 2.12</text><text x="326" y="1103" font-size="17" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">δ=1.4</text><text x="20" y="1203" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">蓝箭头：使用最后观测的 V′。</text><text x="20" y="1234" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">橙箭头：接入同轨迹的下一优势 1。</text><text x="20" y="1275" font-size="15" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">普通 batch 尾：保留 V′，后向 carry 从 0 起。</text></g></svg>
