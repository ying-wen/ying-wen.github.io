<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1310" viewBox="0 0 360 1310" role="img" aria-labelledby="crl-qpams3-title crl-qpams3-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-qpams3-title">GAE 有两条不同的接续路径</title><desc id="crl-qpams3-desc">给定当前奖励一、旧价值0.5、后继旧价值一、折扣0.9和lambda0.8。真正终止不自举也不接下一行，优势0.5；外部时间截断后重置保留最后观测的自举但不接新轨迹，优势1.4；同一轨迹下一优势为一时接续，优势2.12。蓝箭头为价值自举，橙箭头为样本递推，红双线切断相应路径。这是不同边界语义的给定数值对照。</desc><rect width="360" height="1310" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="20" y="38" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">GAE 有两条不同的接续路径</text><text x="20" y="76" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">R = 1 · V = 0.5 · V′ = 1</text><text x="20" y="104" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">γ = 0.9 · λ = 0.8</text><rect x="20" y="137" width="320" height="314" rx="8" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><text x="34" y="165" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">任务真正终止</text><circle cx="63" cy="211" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M81 211L271.5 211" fill="none" stroke="#146ca1" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M278 211L268 216L268 206Z" fill="#146ca1"/><circle cx="297" cy="211" r="13" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><circle cx="297" cy="211" r="18" fill="none" stroke="#52687b" stroke-width="2" opacity="1"/><text x="180" y="199" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">+1</text><text x="63" y="248" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">V=.5</text><text x="297" y="248" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">终止</text><pa