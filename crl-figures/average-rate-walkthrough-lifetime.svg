<svg xmlns="http://www.w3.org/2000/svg" width="720" height="658" viewBox="0 0 720 658" role="img" aria-labelledby="crl-157f141-title crl-157f141-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-157f141-title">斜率更高，有限时间未必领先</title><desc id="crl-157f141-desc">从同一启动状态E出发，启动2秒成本3也保留。蓝实线快环每2秒到账4，橙虚线慢环每4秒到账9。横轴真实秒，纵轴累计真实奖励；所有曲线都是确定性逐秒展开。12秒快环17、慢环15；18秒快环29、慢环33。长期斜率分别2与9/4。未完成的事件没有提前领取奖励或被改成终止。</desc><rect width="720" height="658" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">斜率更高，有限时间未必领先</text><path d="M28 82L55 82" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="66" y="88" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">快环：g = 2</text><path d="M323 82L350 82" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="7 4"/><text x="361" y="88" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">慢环：g = 9/4</text><path d="M74 156L74 442" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M74 442L74 447" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="74" y="468" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M139.5556 156L139.5556 442" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M139.5556 442L139.5556 447" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="139.5556" y="468" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M270.6667 156L270.6667 442" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M270.6667 442L270.6667 447" fill="n