<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="crl-1fe16t7-title crl-1fe16t7-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1fe16t7-title">截断梯度，不等于清空记忆</title><desc id="crl-1fe16t7-desc">固定递归系数0.5、输入系数theta0.2、输入一零零。完整前向记忆0.2、0.1、0.05，对theta的敏感度一、0.5、0.25。在第一步后detach保留全部记忆值，但在后续计算图上的敏感度为零；清零hidden则后两步记忆也为零。圆面积表示敏感度大小，零值不画圆。三种情况均保持参数不更新。</desc><rect width="360" height="1000" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="20" y="38" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">截断梯度，不等于清空记忆</text><text x="20" y="77" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">hₜ = 0.5 hₜ₋₁ + θ xₜ · θ = 0.2</text><text x="20" y="107" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">同一输入：1 → 0 → 0</text><text x="20" y="145" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">保留完整梯度</text><circle cx="60" cy="215" r="24" fill="#dcebf5" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="60" y="221" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.2</text><text x="60" y="180" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">h1</text><circle cx="60" cy="305" r="16" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="60" y="339" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M86 215L147.5 215" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M154 215L144 220L144 210Z" fill="#146ca1"/><circle cx="180" cy="215" r="24" fill="#dcebf5" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="221" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.1</text><text