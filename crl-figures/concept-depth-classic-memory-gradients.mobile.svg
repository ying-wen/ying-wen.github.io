ke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M274 725L264 730L264 720Z" fill="#146ca1"/><circle cx="300" cy="725" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="300" y="731" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="300" y="690" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">h3</text><path d="M200 815L273.5 815" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M280 815L270 820L270 810Z" fill="#b65a28"/><circle cx="300" cy="815" r="0" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="300" y="849" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M115 806L115 824" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M124 806L124 824" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="120" y="785" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">reset</text><path d="M115 716L115 734" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M124 716L124 734" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="120" y="709" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">置 0</text><text x="20" y="932" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">蓝色：记忆 h；橙色：E = ∂h/∂θ</text><text x="20" y="964" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">detach 保留数值，reset 改变后续数值。</text></g></svg>
