<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1340" viewBox="0 0 720 1340" role="img" aria-labelledby="crl-1m9j5ro-title crl-1m9j5ro-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1m9j5ro-title">快适应与慢学习：分别改变什么？</title><desc id="crl-1m9j5ro-desc">Hattori 等 2023 概率反转任务和三个干预的原创示意。左右口以区组安排概率提供奖励，未领取奖励保留但不累积份数；水滴表示实验者知道的奖励可用状态，并非小鼠能提前看见水。下方紫色区间为选择后 CaMKII 干预，红色区间为选择前 OFC 活动抑制。获得阶段与专家阶段分别比较，时间长度不按比例；未画任何实测结果。</desc><rect width="720" height="1340" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">快适应与慢学习：分别改变什么？</text><g transform="translate(28,88)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 左右舔口选择</text><path d="M0 17L316 17" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="51" cy="85" r="23" fill="#f5f8fb" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="265" cy="85" r="23" fill="#f5f8fb" stroke="#146ca1" stroke-width="2" opacity="1"/><path d="M51,69 C35,87 44,96 51,96 C58,96 67,87 51,69 Z" stroke="#258375" stroke-width="1.5" fill="#258375" stroke-linecap="round" stroke-linejoin="round"/><path d="M265,69 C249,87 258,96 265,96 C272,96 281,87 265,69 Z" stroke="#258375" stroke-width="1.5" fill="#258375" stroke-linecap="round" stroke-linejoin="round"/><text x="51" y="42" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">左口</text><text x="265" y="42" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">右口</text><ellipse cx="158" cy="169" rx="34" ry="47" fill="#f5f8fb" stroke="#52687b" stroke-width="2"/><circle cx="158" cy="119" r="24" fill="#f5f8fb" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="134" cy="104" r="11" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="182" cy="104" r="11" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="149" cy="115" r="2" fill="#19354e" stroke="none" stroke-width="2" opacity="1"/><circle cx="167" cy="115" r="2" fill="#19354e" stroke="none" stroke-width="2" opacity="1"/><path d="M115 145L201 145" fill="none" stroke="#52687b" stroke-width="5" stroke-linecap="round" opacity="1"/><path d="M136 100L84.3652 89.3169" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M78 88L88.8056 85.1298L86.7796 94.9224Z" fill="#b65a28"/><path d="M180 100L231.6348 89.3169" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M238 88L229.2204 94.9224L227.1944 85.1298Z" fill="#b65a28"/><text x="158" y="253" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">选择方向，观察有水或无水</text></g><g transform="translate(376,88)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 概率无提示反转</text><path d="M0 17L316 17" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="0" y="49" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">实验者设定：不向动物提示</text><text x="108.5" y="89" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">区组 1</text><rect x="48" y="124" width="121" height="22" rx="2" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="48" y="124" width="72.6" height="22" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="108.5" y="172" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.6</text><rect x="48" y="193" width="121" height="22" rx="2" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="48" y="193" width="12.1" height="22" rx="2" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="108.5" y="241" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.1</text><text x="255.5" y="89" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">区组 2</text><rect x="195" y="124" width="121" height="22" rx="2" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="195" y="124" width="12.1" height="22" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="255.5" y="172" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.1</text><rect x="195" y="193" width="121" height="22" rx="2" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="195" y="193" width="72.6" height="22" rx="2" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="255.5" y="241" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.6</text><text x="0" y="142" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">左</text><text x="0" y="211" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">右</text><text x="158" y="278" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">通常 60–80 次后，无提示反转</text></g><g transform="translate(28,421)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · 同一个口，奖励留下直到领取</text><path d="M0 17L664 17" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="0" y="47" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">同一右口：指定事件序列</text><path d="M30,90 L35,119 L65,119 L70,90" stroke="#52687b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="154" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">刚取空</text><path d="M84 101L196.5 101" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M203 101L193 106L193 96Z" fill="#52687b"/><path d="M218,90 L223,119 L253,119 L258,90" stroke="#52687b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M238,85 C222,103 231,112 238,112 C245,112 254,103 238,85 Z" stroke="#258375" stroke-width="1.5" fill="#258375" stroke-linecap="round" stroke-linejoin="round"/><text x="238" y="154" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">安排到水</text><path d="M272 101L384.5 101" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M391 101L381 106L381 96Z" fill="#52687b"/><path d="M406,90 L411,119 L441,119 L446,90" stroke="#52687b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M426,85 C410,103 419,112 426,112 C433,112 442,103 426,85 Z" stroke="#258375" stroke-width="1.5" fill="#258375" stroke-linecap="round" stroke-linejoin="round"/><text x="426" y="154" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">未选：水仍在</text><path d="M460 101L572.5 101" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M579 101L569 106L569 96Z" fill="#52687b"/><path d="M594,90 L599,119 L629,119 L634,90" stroke="#52687b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="614" y="154" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">选择：领取</text><text x="332" y="197" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">未领取的奖励保留，不增加份数</text></g><g transform="translate(28,672)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">4 · 三项干预，两个时间尺度</text><path d="M0 17L664 17" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><g transform="translate(0,64)"><text x="0" y="0" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">获得阶段 · 抑制 CaMKII</text><text x="0" y="28" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">跨会话重复，检验学习方式形成</text><path d="M32 97L630 97" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="32" cy="97" r="7" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="630" cy="97" r="7" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><rect x="45" y="74" width="233.88" height="45" rx="3" fill="#ede7f5" stroke="#7854a2" stroke-width="1.5" opacity="1"/><path d="M45 97L278.88 97" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="161.94" y="66" font-size="17" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">选择后 3 秒</text><text x="0" y="151" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">上次选择</text><text x="664" y="151" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">下次选择</text></g><g transform="translate(0,264)"><text x="0" y="0" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">专家阶段 · 抑制 CaMKII</text><text x="0" y="28" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">熟练后交替开启与关闭</text><path d="M32 97L630 97" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="32" cy="97" r="7" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="630" cy="97" r="7" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><rect x="45" y="74" width="233.88" height="45" rx="3" fill="#ede7f5" stroke="#7854a2" stroke-width="1.5" opacity="1"/><path d="M45 97L278.88 97" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="161.94" y="66" font-size="17" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">选择后 3 秒</text><text x="0" y="151" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">上次选择</text><text x="664" y="151" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">下次选择</text></g><g transform="translate(0,464)"><text x="0" y="0" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">专家阶段 · 降低 OFC 活动</text><text x="0" y="28" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">随机穿插试次，检验当前选择</text><path d="M32 97L630 97" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="32" cy="97" r="7" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="630" cy="97" r="7" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><rect x="45" y="74" width="573" height="45" rx="3" fill="#fae6e3" stroke="#b54142" stroke-width="1.5" opacity="1"/><path d="M45 97L618 97" fill="none" stroke="#b54142" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="331.5" y="66" font-size="17" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">选择前：间隔 + 准备</text><text x="0" y="151" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">上次选择</text><text x="664" y="151" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">下次选择</text></g></g></g></svg>
