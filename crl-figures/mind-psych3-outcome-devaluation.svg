<svg xmlns="http://www.w3.org/2000/svg" width="720" height="756" viewBox="0 0 720 756" role="img" aria-labelledby="crl-1rd347x-title crl-1rd347x-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1rd347x-title">没再按过，为什么少按了？</title><desc id="crl-1rd347x-desc">前三幅描绘结果贬值的时序：杠杆获得食物，在没有杠杆的情境把食物与不适配对，最后只测按压不给食物。实验还须设置其他食物贬值对照。第四幅为独立算例：已知动作确定到达食物，效用1变0；结果关系允许重算为0，只有旧动作缓存且没有相关更新则仍为1。虚线表示模型读取，不是实验中的再次取食。</desc><rect width="720" height="756" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">没再按过，为什么少按了？</text><g transform="translate(28,91)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 学习</text><path d="M0 18L204 18" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="7" y="40" width="190" height="172" rx="10" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M38 85L38 129" fill="none" stroke="#52687b" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M38 93L72 102" fill="none" stroke="#146ca1" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="72" cy="102" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M25 131L53 131" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M83 99L145.5 99" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M152 99L142 104L142 94Z" fill="#146ca1"/><path d="M144,107 Q166,133 188,107 Z" fill="#ffffff" stroke="#52687b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="156" cy="104" r="5" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><circle cx="166" cy="104" r="5" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><circle cx="176" cy="10