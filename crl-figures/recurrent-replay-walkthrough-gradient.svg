<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770" role="img" aria-labelledby="crl-190ayne-title crl-190ayne-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-190ayne-title">保留记忆数值，改变梯度路径</title><desc id="crl-190ayne-desc">原创精确非线性求导。蓝色前向节点以当前w=rho=0.8处理+1和四个0。灰区前缀t0至t3不计直接损失；完整反传仍穿过这些节点，detach版本在学习段t4入口将h3当常数。两者h4及终止动作R的平方损失相同，而w梯度为-0.9135506122和0，rho梯度为-6.6808061018和-1.9025627594。每个参数横线共用零点，长度与梯度绝对值成比例，w范围[-1,0]、rho范围[-7,0]。给定步长0.01的一次参数写入不重算已形成的活动。</desc><rect width="720" height="770" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">保留记忆数值，改变梯度路径</text><text x="28" y="84" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">前缀不计损失，仍需规定学习段入口的梯度</text><rect x="36" y="114" width="502" height="125" rx="8" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="47" y="138" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">重建前缀：t=0…3 不计直接损失</text><circle cx="80" cy="182" r="18" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="80" y="188" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">+1</text><text x="80" y="226" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h0=0.664</text><path d="M104 182L184.5 182" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M191 182L181 187L181 177Z" fill="#146ca1"/><circle cx="215" cy="182" r="18" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="215" y="188" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="215" y="226" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h1=0.4863</text><path d="M239 182L319.5 182" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M326 182L316 187L316 177Z" fill="#146ca1"/><path d="M215 291L100.5 291" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M94 291L104 286L104 296Z" fill="#7854a2"/><circle cx="350" cy="182" r="18" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="350" y="188" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="350" y="226" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h2=0.3705</text><path d="M374 182L454.5 182" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M461 182L451 187L451 177Z" fill="#146ca1"/><path d="M350 291L235.5 291" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M229 291L239 286L239 296Z" fill="#7854a2"/><circle cx="485" cy="182" r="18" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="485" y="188" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="485" y="226" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h3=0.288</text><path d="M509 182L589.5 182" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M596 182L586 187L586 177Z" fill="#146ca1"/><path d="M485 291L370.5 291" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M364 291L374 286L374 296Z" fill="#7854a2"/><circle cx="620" cy="182" r="18" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="620" y="188" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="620" y="226" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h4=0.2264</text><path d="M620 291L505.5 291" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M499 291L509 286L509 296Z" fill="#7854a2"/><text x="28" y="273" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">完整 BPTT</text><text x="28" y="343" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">t4 入口 detach</text><path d="M620 361L555 361" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="6 4"/><path d="M544 354L558 368" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M544 368L558 354" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="28" y="412" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">相同 h₄=0.2264；相同 Q(R)=0.3207；相同标签 −2</text><text x="44" y="472" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">∂ℓ / ∂w</text><path d="M60 520L305 520" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M81.1801 520L305 520" fill="none" stroke="#7854a2" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="81.1801" cy="520" r="5" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="44" y="549" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">完整：-0.9136</text><path d="M60 577L305 577" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="305" cy="577" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="44" y="606" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">入口 detach：0</text><text x="305" y="490" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="60" y="490" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">−1</text><text x="382" y="472" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">∂ℓ / ∂ρ</text><path d="M398 520L643 520" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M409.1718 520L643 520" fill="none" stroke="#7854a2" stroke-width="10" stroke-linecap="round" opacity="1"/><circle cx="409.1718" cy="520" r="5" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="382" y="549" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">完整：-6.6808</text><path d="M398 577L643 577" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M576.4103 577L643 577" fill="none" stroke="#7854a2" stroke-width="10" stroke-linecap="round" opacity="1" stroke-dasharray="6 4"/><circle cx="576.4103" cy="577" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="382" y="606" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">入口 detach：-1.9026</text><text x="643" y="490" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="398" y="490" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">−7</text><text x="28" y="660" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">完整 E₄=(0.1312, 0.9596)；入口 detach 后 E₄=(0, 0.2733)</text><text x="28" y="698" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">α=0.01：完整写入 (w,ρ)=(0.8091,0.8668)</text><text x="28" y="730" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">入口 detach 写入 (0.8,0.8190)；已形成的 h 不随写入重算</text></g></svg>
