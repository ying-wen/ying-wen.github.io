<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc"><title id="title">最小干预：纠正任务误差，不追踪唯一姿态</title><desc id="desc">目标线与三个精确计算的反馈动作。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#bd643f"/></marker></defs><rect width="920" height="520" fill="#fbfcfd"/><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" font-size="23" fill="#243f53">最小干预：纠正任务误差，不追踪唯一姿态</text><text x="30" y="69" font-size="17" fill="#243f53">一步、无噪声、无动作约束；目标只要求 x₁ + x₂ = 1</text><line x1="65" y1="435" x2="65" y2="105" stroke="#e1e7eb" stroke-width="2" /><line x1="65" y1="435" x2="395" y2="435" stroke="#e1e7eb" stroke-width="2" /><text x="57" y="458" font-size="14" fill="#243f53">0.0</text><text x="30" y="440" font-size="14" fill="#243f53">0.0</text><line x1="131" y1="435" x2="131" y2="105" stroke="#e1e7eb" stroke-width="2" /><line x1="65" y1="369" x2="395" y2="369" stroke="#e1e7eb" stroke-width="2" /><text x="123" y="458" font-size="14" fill="#243f53">0.2</text><text x="30" y="374" font-size="14" fill="#243f53">0.2</text><line x1="197" y1="435" x2="197" y2="105" stroke="#e1e7eb" stroke-width="2" /><line x1="65" y1="303" x2="395" y2="303" stroke="#e1e7eb" stroke-width="2" /><text x="189" y="458" font-size="14" fill="#243f53">0.4</text><text x="30" y="308" font-size="14" fill="#243f53">0.4</text><line x1="263" y1="435" x2="263" y2="105" stroke="#e1e7eb" stroke-width="2" /><line x1="65" y1="237" x2="395" y2="237" stroke="#e1e7eb" stroke-width="2" /><text x="255" y="458" font-size="14" fill="#243f53">0.6</text><text x="30" y="242" font-size="14" fill="#243f53">0.6</text><line x1="329" y1="435" x2="329" y2="105" stroke="#e1e7eb" stroke-width="2" /><line x1="65" y1="171" x2="395" y2="171" stroke="#e1e7eb" stroke-width="2" /><text x="321" y="458" font-size="14" fill="#243f53">0.8</text><text x="30" y="176" font-size="14" fill="#243f53">0.8</text><line x1="395" y1="435" x2="395" y2="105" stroke="#e1e7eb" stroke-width="2" /><line x1="65" y1="105" x2="395" y2="105" stroke="#e1e7eb" stroke-width="2" /><text x="387" y="458" font-size="14" fill="#243f53">1.0</text><text x="30" y="110" font-size="14" fill="#243f53">1.0</text><line x1="65" y1="105" x2="395" y2="435" stroke="#23817a" stroke-width="2" /><text x="415" y="444" font-size="18" fill="#243f53">x₁</text><text x="40" y="100" font-size="18" fill="#243f53">x₂</text><line x1="131" y1="369" x2="230" y2="270" stroke="#bd643f" stroke-width="2" marker-end="url(#arrow)"/><circle cx="131" cy="369" r="6" fill="#bd643f"/><text x="140" y="360" font-size="15" fill="#243f53">(0.2, 0.2)</text><line x1="329" y1="237" x2="263" y2="303" stroke="#bd643f" stroke-width="2" marker-end="url(#arrow)"/><circle cx="329" cy="237" r="6" fill="#bd643f"/><text x="338" y="228" font-size="15" fill="#243f53">(0.8, 0.6)</text><circle cx="362" cy="402" r="6" fill="#bd643f"/><text x="371" y="393" font-size="15" fill="#243f53">(0.9, 0.1)</text><text x="490" y="122" font-size="21" fill="#243f53">同一任务可以有许多成功状态</text><text x="490" y="165" font-size="18" fill="#243f53">(0.2, 0.2) → (0.5, 0.5)</text><text x="490" y="196" font-size="18" fill="#243f53">动作 = (0.3, 0.3)，代价 = 0.18</text><text x="490" y="249" font-size="18" fill="#243f53">(0.8, 0.6) → (0.6, 0.4)</text><text x="490" y="280" font-size="18" fill="#243f53">动作 = (−0.2, −0.2)，代价 = 0.08</text><text x="490" y="333" font-size="18" fill="#243f53">(0.9, 0.1) 已在目标线上</text><text x="490" y="364" font-size="18" fill="#243f53">无需纠正；动作和代价都为零</text><text x="490" y="418" font-size="17" fill="#23817a">沿绿色线的差异，在此任务中冗余</text><text x="28" y="493" font-size="16" fill="#243f53">解析教学例；不是生物运动数据。改变目标或约束后，冗余方向也会改变。</text></g></svg>
