<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1009" viewBox="0 0 720 1009" role="img" aria-labelledby="crl-a23ttk-title crl-a23ttk-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-a23ttk-title">无结果测试与有结果测试</title><desc id="crl-a23ttk-desc">依据 Yin 等2005实验3独立绘制的程序，两动作分别获得颗粒与蔗糖液，身份对调。贬值测试：1小时特异饱足后，向后部背内侧纹状体pDMS注入muscimol或ACSF，10分钟无食物测试后再做20分钟有食物测试。降级测试：再训练1天和降级训练3天后，测试前才注入药物或ACSF，再做5分钟无食物测试。降级学习时允许真实结果反馈。两项检验依论文顺序实施，中间有再训练；阶段图形宽度不表示历时，未画原实验结果。</desc><rect width="720" height="1009" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">无结果测试与有结果测试</text><text x="28" y="85" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先学左、右动作与两种结果</text><g transform="translate(28,121)"><rect x="0" y="0" width="312" height="148" rx="4" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M0 147L312 147" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M8 148L15 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M24 148L31 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M40 148L47 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M56 148L63 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M72 148L79 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M88 148L95 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M104 148L111 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M120 148L127 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d=