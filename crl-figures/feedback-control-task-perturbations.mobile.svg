0</text><text x="28" y="1233" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两个扰动的平方长度同为 0.08</text><text x="28" y="1264" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">固定规则只根据 e = 1−x₁−x₂ 选择动作</text></g></svg>
