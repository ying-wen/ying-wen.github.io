<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1298" viewBox="0 0 360 1298" role="img" aria-labelledby="crl-1izf46q-title crl-1izf46q-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1izf46q-title">相同扰动大小，不同校正动作</title><desc id="crl-1izf46q-desc">原创确定性精确算例，延续正文已有的一步最小动作平方和问题。两个分量无量纲，起点均为(.5,.5)。左或上加(.2,.2)后为(.7,.7)，误差e=−.4，动作(−.2,−.2)恢复(.5,.5)，动作平方和.08。右或下加(.2,−.2)后为(.7,.3)，误差0，动作0，保留该状态。两扰动平方长度均.08。横轴是三个有序事件，不表示等时长；蓝实线圆点为x1，青虚线方点为x2；相关条件两条分量轨迹重合。控制规则固定，没有跨试次参数更新。</desc><rect width="360" height="1298" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="38" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同扰动大小，不同校正动作</text><text x="28" y="83" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一起点 (0.5, 0.5)，任务 x₁+x₂=1</text><path d="M28 121L55 121" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="41.5" cy="121" r="4" fill="#146ca1" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="67" y="126" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">x₁</text><path d="M175 121L202 121" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="7 5"/><rect x="184.5" y="117" width="8" height="8" rx="0" fill="#258375" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="214" y="126" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">x₂</text><text x="28" y="185" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">任务相关扰动</text><text x="28" y="218" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">Δx = (0.2, 0.2)</text><path d="M67 505L318 505" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M62 505L67 505" fill="none" stroke="#19354e" stroke-width="2" s