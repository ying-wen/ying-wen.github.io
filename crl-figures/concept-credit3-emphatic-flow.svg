acity="1">t=0</text><text x="44" y="307" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2×1</text><rect x="309" y="119" width="46" height="116" rx="3" fill="#258375" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="332" y="105" font-size="23" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">4</text><text x="332" y="267" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=1</text><text x="332" y="307" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">4×1</text><rect x="597" y="177" width="46" height="58" rx="3" fill="#258375" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="620" y="163" font-size="23" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="620" y="267" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=2</text><text x="620" y="307" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1×2</text></g></g></svg>
