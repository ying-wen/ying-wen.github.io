<svg xmlns="http://www.w3.org/2000/svg" width="720" height="663" viewBox="0 0 720 663" role="img" aria-labelledby="crl-1fjq8rf-title crl-1fjq8rf-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1fjq8rf-title">奖励改变相对偏好与策略</title><desc id="crl-1fjq8rf-desc">三臂gradient bandit的两步可能历史，初始偏好全零、基线0、步长0.3。先选C并得1，使用旧均匀概率与旧基线，偏好变为-0.1、-0.1、0.2，C概率从1/3增加到约0.403；随后基线变为1。再次选C但得0，使用旧基线1产生负增量，C概率降至约0.340，随后平均奖励基线变为0.5。上部紫色带符号长度表示偏好，共用尺度；下部蓝柱表示概率，共用0到1尺度。未选动作的偏好也改变，但没有凭空获得它们的奖励估计。</desc><rect width="720" height="663" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">奖励改变相对偏好与策略</text><text x="22" y="82" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">α=0.3；两次都选 C，奖励先 1 后 0</text><text x="25" y="137" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">选择之前</text><text x="25" y="185" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">偏好 H</text><path d="M50 250L220 250" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><text x="40" y="255" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M78 250L78 250" fill="none" stroke="#7854a2" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="78" cy="250" r="4" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="78" y="235" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="78" y="324" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M142 250L142 250" fill="none" stroke="#7854a2" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="142" cy="250" r="4" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="142" y="235" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="142" y="324" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M206 250L206 250" fill="none" stroke="#7854a2" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="206" cy="250" r="4" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="206" y="235" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="206" y="324" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="25" y="367" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">选择概率 π</text><path d="M50 498L220 498" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><rect x="62" y="434.6667" width="32" height="63.3333" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="78" y="419.6667" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.333</text><text x="78" y="530" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><rect x="126" y="434.6667" width="32" height="63.3333" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="142" y="419.6667" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.333</text><text x="142" y="530" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><rect x="190" y="434.6667" width="32" height="63.3333" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="206" y="419.6667" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.333</text><text x="206" y="530" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="25" y="569" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">下一次的 B = 0</text><pa