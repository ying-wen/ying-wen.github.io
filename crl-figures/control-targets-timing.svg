<svg xmlns="http://www.w3.org/2000/svg" width="720" height="863" viewBox="0 0 720 863" role="img" aria-labelledby="crl-1vxjgdt-title crl-1vxjgdt-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1vxjgdt-title">等待、补齐与尾值的参数版本</title><desc id="crl-1vxjgdt-desc">原创确定性更新时序。n=2、alpha=.25、gamma=.9，轨迹A到B到C到终点T，奖励1、2、3。到达B的钟1等待；到达C的钟2先保存已选择finish，再读取Q版本0，A目标6.04、A估计2到3.01；到达T的钟3读Q版本1，更新B fast目标4.7、1到1.925；钟4不调用环境，只补齐C finish目标3、4到3.75，读Q版本2。任务已结束仍须处理等待的表项。若记录在非终止C截断，两步目标仍保留.81乘旧finish值4，得6.04；误将截断作为终止得2.8，少3.24。完整终止轨迹的普通Sarsa回报是5.23。若先把C的finish更新为3.75，再回头计算早应在钟2完成的A目标，得到5.8375，这是不同参数版本和更新时序。冻结目标推导与在线表更新需分别说明。</desc><rect width="720" height="863" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">等待、补齐与尾值的参数版本</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2-step Sarsa：选择边界动作，再更新</text><circle cx="96" cy="140" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="96" y="147" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="96" y="107" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">钟1</text><path d="M121 140L237.5 140" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M244 140L234 145L234 135Z" fill="#146ca1"/><text x="96" y="190" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R1=1</text><text x="96" y="237" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">等待</text><circle cx="270" cy="140" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="270" y="147" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="270" y="107" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">钟2</text><path d="M295 140L411.5 140" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M418 140L408 145L408 135Z" fill="#146ca1"/><text x="270" y="190" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R2=2</text><text x="270" y="237" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">更新 A</text><text x="270" y="272" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">目标 6.04</text><text x="270" y="305" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2 → 3.01</text><text x="270" y="338" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">读 Q⁽0⁾</text><circle cx="444" cy="140" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="444" cy="140" r="17" fill="none" stroke="#146ca1" stroke-width="1.5" opacity="1"/><text x="444" y="147" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="444" y="107" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">钟3</text><path d="M469 140L585.5 140" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M592 140L582 145L582 135Z" fill="#52687b"/><text x="444" y="190" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R3=3</text><text x="444" y="237" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">更新 B</text><text x="444" y="272" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">目标 4.7</text><text x="444" y="305" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">1 → 1.925</text><text x="444" y="338" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">读 Q⁽1⁾</text><circle cx="618" cy="140" r="22" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="618" y="147" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">·</text><text x="618" y="107" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">钟4</text><text x="618" y="190" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">不调用环境</text><text x="618" y="237" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">更新 C</text><text x="618" y="272" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">目标 3</text><text x="618" y="305" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">4 → 3.75</text><text x="618" y="338" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">读 Q⁽2⁾</text><rect x="190" y="365" width="162" height="6" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="271" y="402" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A 的两步窗口闭合</text><path d="M28 444L692 444" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="28" y="464" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">记录在 C 暂停：保留尾值</text><text x="28" y="502" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">1+.9×2+.81×4 = 6.04</text><text x="28" y="537" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">误作终止：丢掉3.24，只剩2.8</text><text x="28" y="586" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">任务在 T 终止：尾值为0</text><text x="28" y="624" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1+.9×2+.81×3 = 5.23</text><text x="28" y="676" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q 版本还决定读到哪个尾值</text><text x="28" y="714" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">钟2：C 的 finish 仍为4</text><text x="28" y="750" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">钟4：处理终止奖励后变为3.75</text><text x="28" y="786" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">晚用3.75算 A：5.8375 ≠ 6.04</text><text x="28" y="824" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">这改变了更新次序；非原来的目标</text></g></svg>
