<svg xmlns="http://www.w3.org/2000/svg" width="720" height="573" viewBox="0 0 720 573" role="img" aria-labelledby="crl-gaudxj-title crl-gaudxj-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-gaudxj-title">第二动作怎样影响早先奖励的权重</title><desc id="crl-gaudxj-desc">同一两步任务的四条轨迹AA、AB、BA、BB在行为策略下各有概率1/4。蓝色实心柱为完整轨迹普通重要性采样校正回报9、1.5、1.5、0；青色空心柱为逐决策重要性采样校正回报7.5、3、1.5、0。纵轴为单条轨迹的估计目标，灰虚线为真实价值3。两种目标的概率加权平均都是3，方差分别为12.375与7.875。</desc><rect width="720" height="573" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">第二动作怎样影响早先奖励的权重</text><path d="M66 370L686 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M61 370L66 370" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="56" y="375" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M66 295L686 295" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M61 295L66 295" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="56" y="300" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">3</text><path d="M66 220L686 220" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M61 220L66 220" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="56" y="225" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">6</text><path d="M66 145L686 145" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M61 145L66 145" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="56" y="150" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">9</text>