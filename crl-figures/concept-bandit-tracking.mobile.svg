<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1253" viewBox="0 0 360 1253" role="img" aria-labelledby="crl-1eeh90-title crl-1eeh90-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1eeh90-title">历史权重决定对新证据的反应</title><desc id="crl-1eeh90-desc">前四次B奖励为1、0、1、0，后四次全为1；在第五次访问前，B的真实奖励均值从0.5变为1。上部画八次更新后初值及各奖励的权重：样本平均每份1/8，常数步长0.5给初值1/256、新奖励1/2。下部为同一给定奖励流的精确更新轨迹；第8次后的样本均值0.75，常数步长0.95703125。横轴是B访问数，不是一般的环境步数。</desc><rect width="360" height="1253" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">历史权重决定对新证据的反应</text><text x="22" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一臂：1, 0, 1, 0 ｜ 1, 1, 1, 1</text><text x="22" y="115" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">初值 Q₁=0；常数步长 α=0.5</text><text x="22" y="157" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">样本均值：八次之后</text><path d="M46 316L332 316" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="52.9911" y="316" width="17.7956" height="0" rx="0" fill="#52687b" stroke="none" stroke-width="1.5" opacity="1"/><text x="61.8889" y="343" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">Q₁</text><rect x="84.7689" y="288.5" width="17.7956" height="27.5" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="93.6667" y="343" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">1</text><rect x="116.5467" y="288.5" width="17.7956" height="27.5" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="125.4444" y="343" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">2</text><rect x="148.3244" y="288.5" width="17.7956" height="27.5" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="157.2222" y="343" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">3</text><rect x="180.1022" y="288.5" width="17.7956" height="27.5" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="189" y="343" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">4</text><rect x="211.88" y="288.5" width="17.7956" height="27.5" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="220.7778" y="343" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">5</text><rect x="243.6578" y="288.5" width="17.7956" height="27.5" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="252.5556" y="343" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">6</text><rect x="275.4356" y="288.5" width="17.7956" height="27.5" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="284.3333" y="343" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">7</text><rect x="307.2133" y="288.5" width="17.7956" height="27.5" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="316.1111" y="343" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">8</text><text x="22" y="213" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0.5</text><text x="22" y="320" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0</text><path d="M46 206L332 206" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="22" y="378" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">每份奖励的权重都是 1/8</text><text x="22" y="431" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">常数步长：八次之后</text><path d="M46 590L332 590" fill="none