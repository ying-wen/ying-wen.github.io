<svg xmlns="http://www.w3.org/2000/svg" width="720" height="899" viewBox="0 0 720 899" role="img" aria-labelledby="crl-10blrm-title crl-10blrm-desc" data-crl-visual="v1" data-evidence-kind="measured"><title id="crl-10blrm-title">技能停止时，信用仍要传回去</title><desc id="crl-10blrm-desc">seed0、B2的真实第4和5步。增广坐标R:2:6和R:1:0的活动资格为0.8和1；最后TD残差0.98，增量0.196和0.245。奖励头用TD学习，完整回报另用于高层。</desc><rect width="720" height="899" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">技能停止时，信用仍要传回去</text><text x="28" y="82" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一次向右技能：6 → 0 → 1</text><path d="M163 116L233.3648 149.8859" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M233.3648 149.8859L250.7435 226.0269" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M250.7435 226.0269L202.0495 287.0872" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M202.0495 287.0872L123.9505 287.0872" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M123.9505 287.0872L75.2565 226.0269" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M75.2565 226.0269L92.6352 149.8859" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M92.6352 149.8859L163 116" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M109.7536 141.6421L140.0253 127.064" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M145.8816 124.2438L139.0413 133.0875L134.7025 124.0778Z" fill="#146ca1"/><path d="M180.1184 124.2438L210.3901 138.8219" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M216.2464 141.6421L205.0673 141.8081L209.4062 132.7984Z" fill="#146ca1"/><circle cx="163" cy="116" r="17" fill="#146ca1" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="163" y="122" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="233.3648" cy="149.8859" r="17" fill="#146ca1" stroke="#b65a28" stroke-width="3" opacity="1"/><text x="233.3648" y="155.8859" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="250.7435" cy="226.0269" r="17" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="250.7435" y="232.0269" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><circle cx="202.0495" cy="287.0872" r="17" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="202.0495" y="293.0872" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><circle cx="123.9505" cy="287.0872" r="17" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="123.9505" y="293.0872" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><circle cx="75.2565" cy="226.0269" r="17" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="75.2565" y="232.0269" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">5</text><circle cx="92.6352" cy="149.8859" r="17" fill="#146ca1" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="92.6352" y="155.8859" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="332" y="153" font-size="21" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">t = 4：−0.02；t = 5：+0.98</text><text x="332" y="190" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">到达 1 后停止，后继预测为 0</text><text x="332" y="227" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">α = 0.25，λ = 0.8</text><text x="28" y="356" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">最后的误差 δ = 0.98 传回两个坐标</text><path d="M360 458L189.3899 426.1913" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M183 425L193.747 421.9175L191.9142 431.7481Z" fill="#b65a28"/><path d="M360 458L530.6101 426.1913" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M537 425L528.0858 431.7481L526.253 421.9175Z" fill="#b65a28"/><circle cx="165" cy="400" r="26.8328" fill="#258375" stroke="#258375" stroke-width="2" opacity="0.25"/><text x="165" y="406" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.8</text><text x="165" y="458" font-size="17" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R:2:6</text><circle cx="555" cy="400" r="30" fill="#258375" stroke="#258375" stroke-width="2" opacity="0.25"/><text x="555" y="406" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="555" y="458" font-size="17" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R:1:0</text><circle cx="360" cy="490" r="25" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="360" y="496" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">δ</text><text x="28" y="542" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">圆面积：资格；箭头：本步误差的写入</text><text x="28" y="585" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">奖励预测的实际增量 αδe</text><text x="28" y="630" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">R:2:6</text><rect x="145" y="611" width="382.2" height="25" rx="1" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="535.2" y="630" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">0.196</text><text x="28" y="684" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">R:1:0</text><rect x="145" y="665" width="477.75" height="25" rx="1" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="630.75" y="684" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">0.245</text><text x="28" y="754" font-size="23" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">起点预测：0 → −0.005 → 0.191</text><text x="28" y="790" font-size="21" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">实得奖励：−0.02 + 0.98 = 0.96</text><text x="28" y="827" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0.191 是更新后的估计，并非完整回报</text><text x="28" y="865" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先完成最后写入，再清空这次技能的迹</text></g></svg>
