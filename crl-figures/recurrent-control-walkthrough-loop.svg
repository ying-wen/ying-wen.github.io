<svg xmlns="http://www.w3.org/2000/svg" width="720" height="651" viewBox="0 0 720 651" role="img" aria-labelledby="crl-11hzio1-title crl-11hzio1-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-11hzio1-title">递归参数写入，改变下一次行动</title><desc id="crl-11hzio1-desc">原创精确交互轨迹。两回合隐藏成功门均为左，入口均出现正提示；读者所见灰门问号不会把隐藏模式输入智能体。第一回合a=-0.5，岔口h=-0.5，选右失败R=-1，终点活动-0.75，随后更新a=0.25。第二回合重置活动和敏感度，正提示后h=0.25，选左成功R=1，终点活动1.0625，随后更新a=0.625。实线橙箭头是实际选门，蓝箭头是入口到岔口。终点双边框只表示终止。</desc><rect width="720" height="651" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">递归参数写入，改变下一次行动</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">入口提示消失后，活动决定选门</text><text x="28" y="113" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">灰门 ?：没有提供门后结果</text><text x="28" y="153" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">回合 1 · 写入前</text><path d="M79 268L265 268" fill="none" stroke="#c8d6e0" stroke-width="34" stroke-linecap="round" opacity="1"/><path d="M172 268L172 363" fill="none" stroke="#c8d6e0" stroke-width="34" stroke-linecap="round" opacity="1"/><rect x="52" y="238" width="54" height="60" rx="2" fill="#e7ebef" stroke="#52687b" stroke-width="2" opacity="1"/><rect x="56" y="242" width="46" height="52" rx="1" fill="none" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="79" y="225" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><text x="79" y="275" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><rect x="238" y="238" width="54" height="60" rx="2" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><rect x="242" y="242" width="46" height="52" rx="1" fill="none" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="265" y="225" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="265" y="275" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">−1</text><rect x="148" y="244" width="48" height="48" rx="6" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="172" y="274" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="172" cy="361" r="15" fill="#146ca1" stroke="#ffffff" stroke-width="2.5" opacity="1"/><text x="172" y="405" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C：提示 +1</text><path d="M172 340L172 304.5" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M172 298L177 308L167 308Z" fill="#146ca1"/><path d="M202 268L223.5 268" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M230 268L220 273L220 263Z" fill="#b65a28"/><text x="172" y="225" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">J</text><text x="36" y="450" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">a = -0.5 → 0.25</text><text x="36" y="480" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">hⱼ = -0.5；R = -1</text><text x="36" y="510" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">h终 = -0.75</text><text x="372" y="153" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">回合 2 · 学习后</text><path d="M423 268L609 268" fill="none" stroke="#c8d6e0" stroke-width="34" stroke-linecap="round" opacity="1"/><path d="M516 268L516 363" fill="none" stroke="#c8d6e0" stroke-width="34" stroke-linecap="round" opacity="1"/><rect x="396" y="238" width="54" height="60" rx="2" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><rect x="400" y="242" width="46" height="52" rx="1" fill="none" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="423" y="225" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><text x="423" y="275" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">+1</text><rect x="582" y="238" width="54" height="60" rx="2" fill="#e7ebef" stroke="#52687b" stroke-width="2" opacity="1"/><rect x="586" y="242" width="46" height="52" rx="1" fill="none" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="609" y="225" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="609" y="275" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><rect x="492" y="244" width="48" height="48" rx="6" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="516" y="274" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="516" cy="361" r="15" fill="#146ca1" stroke="#ffffff" stroke-width="2.5" opacity="1"/><text x="516" y="405" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C：提示 +1</text><path d="M516 340L516 304.5" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M516 298L521 308L511 308Z" fill="#146ca1"/><path d="M486 268L464.5 268" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M458 268L468 263L468 273Z" fill="#b65a28"/><text x="516" y="225" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">J</text><text x="380" y="450" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">a = 0.25 → 0.625</text><text x="380" y="480" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">hⱼ = 0.25；R = 1</text><text x="380" y="510" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">h终 = 1.0625</text><text x="28" y="583" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">同样正提示：右门失败 → 左门成功</text><text x="28" y="615" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">每回合 2 次转移；参数在终止后更新，下一回合重置活动</text></g></svg>
