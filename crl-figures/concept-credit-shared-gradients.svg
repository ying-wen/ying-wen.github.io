<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="975" viewBox="0 0 1080 975" role="img" aria-labelledby="title desc"><title id="title">共享一根权重，牵动多个预测</title><desc id="desc">上图从两个权重到小网格预测的连线表示固定特征共享，未访问D与A相连。下图用等比例坐标轴画出A和B的旧新输出梯度，以及同一衰减下两种最终资格向量。轴1和2分别为两个参数分量。</desc><defs><marker id="teal" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#087f83"/></marker><marker id="gold" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#ac621d"/></marker><marker id="ink" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#15323a"/></marker></defs><rect width="1080" height="975" fill="#faf8f2"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="40" y="48" font-size="30" fill="#15323a" font-weight="700">共享一根权重，牵动多个预测</text><text x="40" y="89" font-size="23" fill="#536b70" >固定特征共享</text><path d="M223,177 C420,177 570,136 723,136" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#teal)" data-role="shared-connection"/><path d="M223,177 C420,177 570,215 723,215" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#teal)" data-role="shared-connection"/><path d="M223,313 C420,313 570,215 723,215" fill="none" stroke="#ac621d" stroke-width="3" marker-end="url(#gold)" data-role="shared-connection"/><path d="M223,313 C420,313 570,294 723,294" fill="none" stroke="#ac621d" stroke-width="3" marker-end="url(#gold)" data-role="shared-connection"/><path d="M223,177 C420,177 570,373 723,373" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#teal)" data-role="shared-connection"/><circle cx="755" cy="136" r="30" fill="#d8ece4" stroke="#087f83" stroke-width="2"/><text x="755" y="144" font-size="24" fill="#15323a" text-anchor="middle">A</text><text x="815" y="144" font-size="23" fill="#15323a" >0.188</text><circle cx="755" cy="215" r="30" fill="#d8ece4" stroke="#087f83" stroke-width="2"/><text x="755" y="223" font-size="24" fill="#15323a" text-anchor="middle">B</text><text x="815" y="223" font-size="23" fill="#15323a" >0.3974</text><circle cx="755" cy="294" r="30" fill="#d8ece4" stroke="#087f83" stroke-width="2"/><text x="755" y="302" font-size="24" fill="#15323a" text-anchor="middle">C</text><text x="815" y="302" font-size="23" fill="#15323a" >0.2093</text><circle cx="755" cy="373" r="30" fill="#fffefb" stroke="#087f83" stroke-width="2"/><text x="755" y="381" font-size="24" fill="#15323a" text-anchor="middle">D</text><text x="815" y="381" font-size="23" fill="#ac621d" >0.188</text><circle cx="180" cy="177" r="42" fill="#d8ece4" stroke="none" stroke-width="2"/><text x="180" y="185" font-size="26" fill="#15323a" text-anchor="middle">w1</text><text x="180" y="246" font-size="21" fill="#087f83" text-anchor="middle">0.18803866</text><circle cx="180" cy="313" r="42" fill="#f6e7c9" stroke="none" stroke-width="2"/><text x="180" y="321" font-size="26" fill="#15323a" text-anchor="middle">w2</text><text x="180" y="382" font-size="21" fill="#ac621d" text-anchor="middle">0.2093248</text><text x="930" y="381" font-size="18" fill="#ac621d" >未访问</text><line x1="40" y1="416" x2="1040" y2="416" stroke="#cad8d5" stroke-width="2" /><text x="40" y="460" font-size="23" fill="#536b70" >参数改变，梯度会转向</text><text x="40" y="502" font-size="22" fill="#15323a" >v=θ<tspan font-size="75%" baseline-shift="sub">1</tspan> tanh(θ<tspan font-size="75%" baseline-shift="sub">2</tspan>u)</text><text x="465" y="502" font-size="22" fill="#15323a" >t=2：θ (1,1) → (2,0.5)</text><text x="180" y="555" font-size="23" fill="#15323a" text-anchor="middle">A：u=1</text><line x1="75" y1="803" x2="315" y2="803" stroke="#15323a" stroke-width="1.4" marker-end="url(#ink)" /><line x1="75" y1="803" x2="75" y2="573" stroke="#15323a" stroke-width="1.4" marker-end="url(#ink)" /><text x="326" y="810" font-size="17" fill="#536b70" text-anchor="middle">g<tspan font-size="75%" baseline-shift="sub">1</tspan></text><text x="75