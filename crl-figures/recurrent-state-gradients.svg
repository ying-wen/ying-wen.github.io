<svg xmlns="http://www.w3.org/2000/svg" width="720" height="864" viewBox="0 0 720 864" role="img" aria-labelledby="crl-1205ao-title crl-1205ao-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1205ao-title">保留记忆，不等于保留学习路径</title><desc id="crl-1205ao-desc">同一条四步序列的原创精确导数对照。每行蓝色活动相同：1,.5,.25,.125。橙色箭头是末端平方损失的反向状态导数，红色叉号是detach边界，浅灰线是被排除的路径。完整递归参数梯度为(-.65625,-.109375)；只反传最后两步为(-.4375,0)；每步detach为(-.21875,0)。最后两种方法均切断t=1的输入权重b路径，但保留当前递归权重a的直接贡献。仅学读出时a和b冻结，w的梯度为-.109375，alpha=.1时写入.0109375。所有梯度在同一旧参数点计算，不表示训练后的性能排序。</desc><rect width="720" height="864" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">保留记忆，不等于保留学习路径</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">固定参数和相同前向活动；只改变保留的导数路径</text><text x="28" y="111" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">蓝 → 活动   橙 ← 损失梯度   × 截断</text><text x="28" y="159" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">完整递归导数</text><path d="M128 194L255.5 194" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M262 194L252 199L252 189Z" fill="#146ca1"/><circle cx="110" cy="194" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="110" y="223" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="110" y="252" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=1</text><path d="M267 271L129.5 271" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M123 271L133 266L133 276Z" fill="#b65a28"/><path d="M298 194L425.5 194" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><pat