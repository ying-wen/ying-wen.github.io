nd" opacity="1"/><path d="M189 644L201 658" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M189 658L201 644" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M298 574L425.5 574" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M432 574L422 579L422 569Z" fill="#146ca1"/><circle cx="280" cy="574" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="280" y="603" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="280" y="632" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=2</text><path d="M293 651L437 651" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M359 644L371 658" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M359 658L371 644" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M468 574L595.5 574" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M602 574L592 579L592 569Z" fill="#146ca1"/><circle cx="450" cy="574" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="450" y="603" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.25</text><text x="450" y="632" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=3</text><path d="M463 651L607 651" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M529 644L541 658" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M529 658L541 644" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="620" cy="574" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="620" y="603" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.125</text><text x="620" y="632" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=4</text><path d="M620 674L620 659.5" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M620 653L625 663L615 663Z" fill="#b65a28"/><text x="654" y="676" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">∂L</text><text x="28" y="689" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">∂L/∂a = -0.21875</text><text x="358" y="689" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">∂L/∂b = 0</text><text x="28" y="738" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">b 只在 t=1 接收非零输入</text><text x="28" y="769" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">最后两步和每步截断仍保留 h₄=.125，却不再训练 t=1 的写入 b</text><text x="28" y="803" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">只学读出：Δa=Δb=0，Δw=.0109375</text><text x="28" y="833" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">读出对照用 α=.1；前三行固定 w=1</text></g></svg>
