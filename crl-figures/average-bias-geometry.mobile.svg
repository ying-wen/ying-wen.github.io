<svg xmlns="http://www.w3.org/2000/svg" width="360" height="891" viewBox="0 0 360 891" role="img" aria-labelledby="crl-e3ttqc-title crl-e3ttqc-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-e3ttqc-title">差分价值保留起点的影响</title><desc id="crl-e3ttqc-desc">继续使用三状态MDP的策略B。规范h(0)=0，h(B)=10/11。有限窗口恒等式E累计奖励=Tg+h(0)-E h(S_T)由概率递推独立核算；虚线和曲线的间隙不是另一条奖励率。</desc><rect width="360" height="891" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">差分价值保留起点的影响</text><text x="28" y="84" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">仍使用策略 B，从选择点 0 出发</text><text x="28" y="116" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">橙线：E[累计奖励]　虚线：Tg</text><path d="M50 177L50 421" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M50 421L320 421" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="41" y="426" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M50 421L320 421" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="41" y="344.6667" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">4</text><path d="M50 339.6667L320 339.6667" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="41" y="263.3333" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">8</text><path d="M50 258.3333L320 258.3333" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="41" y="182" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">12</text><path d="M50 177L320 177" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="50" y="447" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="140" y="447" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><text x="230" y="447" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">8</text><text x="320" y="447" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">12</text><path d="M50 421L320 199.1818" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="7 6"/><polyline points="50,421 72.5,421 95,400.6666666666667 117.5,382.3666666666667 140,363.86333333333334 162.5,345.38033333333334 185,326.8953 207.5,308.41047 230,289.92561966666665 252.5,271.4407713666667 275,252.95592286333334 297.5,234.47107438033333 320,215.9862258953" fill="none" stroke="#b65a28" stroke-width="3"/><path d="M329 199.1818L329 215.9862" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="50" y="481" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">起点带来的差额有界，斜率仍趋近 g</text><text x="28" y="543" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">减去每步 g 后，剩下什么？</text><path d="M114 610L236.5 610" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M243 610L233 615L233 605Z" fill="#b65a28"/><circle cx="92" cy="610" r="22" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="92" y="616" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="92" y="658" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h(0) = 0</text><circle cx="265" cy="610" r="22" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="265" y="616" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="265" y="658" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">h(B) = 10/11</text><text x="28" y="706" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">0 → B：R − g = −10/11</text><text x="28" y="739" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">h(B) − h(0) = +10/11</text><text x="28" y="772" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两项相加为 0：差分 Bellman 关系</text><text x="28" y="824" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">T = 12 时，Tg − E[累计奖励] = 0.826</text><text x="28" y="857" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">它等于 E[h(S₁₂)] − h(S₀)</text></g></svg>
