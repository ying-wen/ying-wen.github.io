<svg xmlns="http://www.w3.org/2000/svg" width="720" height="676" viewBox="0 0 720 676" role="img" aria-labelledby="crl-1icppf7-title crl-1icppf7-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1icppf7-title">长走廊后，用本次提示选门</title><desc id="crl-1icppf7-desc">三次独立新模式的一个精确分支：提示+1、-1、+1恰好正确，D为4、8、4；ρ=1，初始b=-1/2。每条竖走廊上的灰点是D-1次中间观察，J是最后一次灰观察；各面板地图按版面排布，不使用空间距离度量时间。橙箭头为实际选门，未选门只画问号。第一奖励把b写成1，第二次实际选右得+1，而冻结b的同分支会选左得-1。前两条蓝色返回路线已经执行，各1步；第三条灰色返回路线仍可用。门反馈在t=5,15,21，窗口总奖励1，环境从未终止或reset。</desc><rect width="720" height="676" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">长走廊后，用本次提示选门</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每次到 C 都是新的门模式；提示准确率 0.8</text><text x="28" y="114" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">三次提示恰好正确；这是一条分支，期望另行枚举</text><text x="28" y="162" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">第 1 次：D=4</text><path d="M58 239L202 239" fill="none" stroke="#c8d6e0" stroke-width="18" stroke-linecap="round" opacity="1"/><path d="M130 239L130 400" fill="none" stroke="#c8d6e0" stroke-width="18" stroke-linecap="round" opacity="1"/><rect x="36" y="217" width="44" height="44" rx="4" fill="#e7ebef" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="58" y="204" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><text x="58" y="246" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><rect x="180" y="217" width="44" height="44" rx="4" fill="#ffffff" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="202" y="204" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="202" y="246" font-size="20" fill="#b54142" text-anchor="m