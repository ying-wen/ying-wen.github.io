<svg xmlns="http://www.w3.org/2000/svg" width="720" height="793" viewBox="0 0 720 793" role="img" aria-labelledby="crl-tk48ji-title crl-tk48ji-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-tk48ji-title">保存活动和保存导数是两个选择</title><desc id="crl-tk48ji-desc">同一z=+1,c1=c2=+1分支，在t=2形成奖励活动并更新a之后，只改变学习器的边界操作。蓝线为保留和仅截断导数，二者活动完全相同；红虚线同时清活动与敏感度。三条程序都没有重置环境。t=4处保留、detach、清活动的敏感度分别9/16、5/8、1；对应样本损失梯度分别-459/1024、-255/512、-3/4。图形纵轴比较活动，数字比较不同导数对象。</desc><rect width="720" height="793" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">保存活动和保存导数是两个选择</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一奖励后：保留、只切导数、同时清活动</text><path d="M68 136L68 371" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M68 371L68 376" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="68" y="397" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M360 136L360 371" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M360 371L360 376" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="360" y="397" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M652 136L652 371" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M652 371L652 376" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="652" y="397" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M68 371L652 371" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M63 371L68 371" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="58" y="376" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">-1</text><path d="M68 266.5556L652 266.5556" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M63 266.5556L68 266.5556" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="58" y="271.5556" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M68 162.1111L652 162.1111" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M63 162.1111L68 162.1111" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="58" y="167.1111" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M68 136L68 371" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M68 371L652 371" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="652" y="425" font-size="18" fill="#19354e" text-anchor="end" font-weight="400" opacity="1">真实转移 t</text><text x="68" y="118" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">活动 h</text><path d="M68 344.8889L360 181.6944L652 245.3403" fill="none" stroke="#146ca1" stroke-width="3"/><circle cx="68" cy="344.8889" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="360" cy="181.6944" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="652" cy="245.3403" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M68 266.5556L360 162.1111L652 240.4444" fill="none" stroke="#b54142" stroke-width="3" stroke-dasharray="7 4"/><circle cx="68" cy="266.5556" r="4" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><circle cx="360" cy="162.1111" r="4" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><circle cx="652" cy="240.4444" r="4" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="440" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">● 蓝：保留与 detach 的活动重合</text><text x="28" y="471" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">● 红虚线：同时清空 h 与 S</text><circle cx="39" cy="520" r="6" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="56" y="526" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">保留 h、S</text><text x="244" y="526" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">hⱼ=0.2031   Sⱼ=0.5625   g=-0.4482</text><circle cx="39" cy="596" r="6" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="56" y="602" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">仅令 S=0</text><text x="244" y="602" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">hⱼ=0.2031   Sⱼ=0.625   g=-0.498</text><circle cx="39" cy="672" r="6" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><text x="56" y="678" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">令 h=S=0</text><text x="244" y="678" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">hⱼ=0.25   Sⱼ=1   g=-0.75</text><text x="28" y="750" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">相同活动与动作也可以有不同梯度；清活动还改变了前向计算</text></g></svg>
