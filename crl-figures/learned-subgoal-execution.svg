<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="crl-1vti9di-title crl-1vti9di-desc" data-crl-visual="v1" data-evidence-kind="measured"><title id="crl-1vti9di-title">失败的技能，也有必须学到的后果</title><desc id="crl-1vti9di-desc">对比每个候选3次或4次练习。3次后到C技能实际走SAX，模型记录失败到X奖励0.9；4次后实际走SBC，模型记录奖励0、时长2、终点C权重0.81。之后在C真实probe得2，规划选择C并实际部署SBCY。两者练习预算不同，不作为匹配预算效能比较。</desc><rect width="720" height="780" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">失败的技能，也有必须学到的后果</text><text x="28" y="82" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">冻结的是已学策略，不是理想成功路线</text><text x="28" y="121" font-size="22" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">每个候选练习 3 次</text><path d="M82.441 215.6161L168.1175 166.9521" fill="none" stroke="#b54142" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M172.639 164.3839L167.6584 171.8131L163.7073 164.8569Z" fill="#b54142"/><path d="M208.16 155L288.2 155" fill="none" stroke="#b54142" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M293.4 155L285.4 159L285.4 151Z" fill="#b54142"/><path d="M80.9484 236.6253L132.0986 276.193" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M136.2116 279.3747L127.4365 277.6437L132.3313 271.3159Z" fill="#c8d6e0"/><path d="M170.24 291L225 291" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M230.2 291L222.2 295L222.2 287Z" fill="#c8d6e0"/><path d="M257.2071 273.7696L302.2015 176.9461" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M304.3929 172.2304L304.649 181.171L297.3941 177.7996Z" fill="#c8d6e0"/><circle cx="65.92" cy="225" r="18" fill="#b54142" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="65.92" y="231" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="189.16" cy="155" r="18" fill="#b54142" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="189.16" y="161" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="312.4" cy="155" r="18" fill="#b54142" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="312.4" y="161" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">X</text><circle cx="312.4" cy="155" r="24" fill="none" stroke="#b54142" stroke-width="2" opacity="1"/><circle cx="151.24" cy="291" r="18" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="151.24" y="297" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="249.2" cy="291" r="18" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="249.2" y="297" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="28" y="343" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">实际停止在 X；没有到达 C</text><text x="28" y="377" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">技能外部奖励 0.9</text><text x="28" y="408" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">时长 2 步；终点权重 0.81</text><text x="28" y="445" font-size="19" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">规划后选 A；估计 0.9</text><text x="28" y="480" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">全程 24 个真实步</text><text x="28" y="509" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">另有 11 次允许的重置</text><text x="376" y="121" font-size="22" fill="#258375" text-anchor="start" font-weight="400" opacity="1">每个候选练习 4 次</text><path d="M430.441 215.6161L516.1175 166.9521" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M520.639 164.3839L515.6584 171.8131L511.7073 164.8569Z" fill="#c8d6e0"/><path d="M556.16 155L636.2 155" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M641.4 155L633.4 159L633.4 151Z" fill="#c8d6e0"/><path d="M428.9484 236.6253L480.0986 276.193" fill="none" stroke="#258375" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M484.2116 279.3747L475.4365 277.6437L480.3313 271.3159Z" fill="#258375"/><path d="M518.24 291L573 291" fill="none" stroke="#258375" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M578.2 291L570.2 295L570.2 287Z" fill="#258375"/><path d="M605.2071 273.7696L650.2015 176.9461" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M652.3929 172.2304L652.649 181.171L645.3941 177.7996Z" fill="#c8d6e0"/><circle cx="413.92" cy="225" r="18" fill="#258375" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="413.92" y="231" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="537.16" cy="155" r="18" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="537.16" y="161" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="660.4" cy="155" r="18" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="660.4" y="161" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">X</text><circle cx="499.24" cy="291" r="18" fill="#258375" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="499.24" y="297" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="597.2" cy="291" r="18" fill="#258375" stroke="#c8d6e0" stroke-width="1" opacity="1"/><text x="597.2" y="297" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">C</text><circle cx="597.2" cy="291" r="24" fill="none" stroke="#258375" stroke-width="2" opacity="1"/><text x="376" y="343" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">实际停止在 C；到达了 C</text><text x="376" y="377" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">技能外部奖励 0</text><text x="376" y="408" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">时长 2 步；终点权重 0.81</text><text x="376" y="445" font-size="19" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">规划后选 C；估计 1.62</text><text x="376" y="480" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">全程 31 个真实步</text><text x="376" y="509" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">另有 13 次允许的重置</text><text x="28" y="568" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">练习后，规划的选择真正成为行动</text><path d="M104 624L239.5 624" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M246 624L236 629L236 619Z" fill="#258375"/><path d="M284 624L419.5 624" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M426 624L416 629L416 619Z" fill="#258375"/><path d="M464 624L599.5 624" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M606 624L596 629L596 619Z" fill="#b65a28"/><circle cx="85" cy="624" r="18" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="85" y="630" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="265" cy="624" r="18" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="265" y="630" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="445" cy="624" r="18" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="445" y="630" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">C</text><circle cx="625" cy="624" r="18" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="625" y="630" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">Y</text><text x="28" y="678" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">S → B → C 是技能；C → Y 是随后动作</text><text x="28" y="712" font-size="21" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">奖励序列 0、0、2；折扣回报 1.62</text><text x="28" y="749" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">圆环标出技能实际终点；浅灰边已被观察</text></g></svg>
