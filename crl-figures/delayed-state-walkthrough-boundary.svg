<svg xmlns="http://www.w3.org/2000/svg" width="720" height="775" viewBox="0 0 720 775" role="img" aria-labelledby="crl-dk2akk-title crl-dk2akk-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-dk2akk-title">相同活动，不同信用路径</title><desc id="crl-dk2akk-desc">固定b=-1/2,ρ=1,正提示和D=4。中间五个蓝圈表示提示写入和四次灰观察计算，h一直是-1/2。左侧完整反传达到提示写入，S=1；右侧末尾K=2只覆盖最后两个灰观察节点，在边界处停止，S=0，但不改变活动。g在两者中分别为-3/2和0。下方是另一种状态构造：只保存最近W=2个信号，提示已经滑出，当前为(0,0)。它改变的是决策可见的信息，而不只是求导路径。</desc><rect width="720" height="775" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同活动，不同信用路径</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一前向活动；只改变末端损失能反传到哪里</text><text x="130" y="119" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">完整</text><text x="588" y="119" font-size="18" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">K=2</text><circle cx="360" cy="158" r="14" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="333" y="164" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">C</text><text x="384" y="164" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">−1/2</text><path d="M360 173L360 198.5" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M360 205L355 195L365 195Z" fill="#146ca1"/><circle cx="360" cy="220" r="14" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="333" y="226" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">0</text><text x="384" y="226" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">−1/2</text><path d="M130 215L130 170.2" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M130 165L134 173L126 173Z" fill="#7854a2"/><path d="M360 235L360 260.5" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M360 267L355 257L365 257Z" fill="#146ca1"/><circle cx="360" cy="282" r="14" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="333" y="288" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">0</text><text x="384" y="288" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">−1/2</text><path d="M130 277L130 232.2" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M130 227L134 235L126 235Z" fill="#7854a2"/><path d="M360 297L360 322.5" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M360 329L355 319L365 319Z" fill="#146ca1"/><circle cx="360" cy="344" r="14" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="333" y="350" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">0</text><text x="384" y="350" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">−1/2</text><path d="M130 339L130 294.2" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M130 289L134 297L126 297Z" fill="#7854a2"/><path d="M360 359L360 384.5" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M360 391L355 381L365 381Z" fill="#146ca1"/><circle cx="360" cy="406" r="14" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="333" y="412" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">J</text><text x="384" y="412" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">−1/2</text><path d="M130 401L130 356.2" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M130 351L134 359L126 359Z" fill="#7854a2"/><text x="360" y="135" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h</text><path d="M588 401L588 356.2" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M588 351L592 359L584 359Z" fill="#b54142"/><path d="M588 339L588 320" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M583 308L593 318" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M583 318L593 308" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M342 313L600 313" fill="none" stroke="#b54142" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/><text x="72" y="468" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">S=1，g=−3/2</text><text x="445" y="468" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">S=0，g=0</text><text x="28" y="507" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">K=2 只包含最后两次灰观察；提示写入位于边界以外</text><path d="M28 534L692 534" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="572" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">若决策状态只存最近 W=2 条观察，提示本身已经离开</text><rect x="90" y="605" width="50" height="50" rx="0" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="115" y="638" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">+1</text><path d="M110 625L120 635" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M110 635L120 625" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M147 630L343.8 630" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/><path data-arrow-mode="actual" d="M349 630L341 634L341 626Z" fill="#52687b"/><rect x="360" y="605" width="50" height="50" rx="0" fill="#f5f8fb" stroke="#146ca1" stroke-width="1.5" opacity="1"/><text x="385" y="638" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0</text><rect x="440" y="605" width="50" height="50" rx="0" fill="#f5f8fb" stroke="#146ca1" stroke-width="1.5" opacity="1"/><text x="465" y="638" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="115" y="690" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">已滑出</text><text x="425" y="690" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">当前状态</text><text x="28" y="731" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两种提示的最近观察状态相同；递归 h 原本仍可区分它们</text></g></svg>
