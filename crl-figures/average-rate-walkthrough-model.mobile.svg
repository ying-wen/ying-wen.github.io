<svg xmlns="http://www.w3.org/2000/svg" width="360" height="730" viewBox="0 0 360 730" role="img" aria-labelledby="crl-1i6cc60-title crl-1i6cc60-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1i6cc60-title">时长模型过时，规划动作也会错</title><desc id="crl-1i6cc60-desc">奖励和终点完全不变，仅B回H由3秒变4秒。紫色虚线旧模型仍预测完整慢环4秒得9，率2.25；橙色实线真实世界完整慢环5秒得9，率1.8。下方共用奖励每秒坐标，蓝虚线快环2不变。旧模型偏好慢环，更新时间后偏好快环。此图比较两个给定模型，不是训练曲线。</desc><rect width="360" height="730" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">时长模型过时，规划动作也会错</text><text x="28" y="86" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">只改变 B → H 的耗时</text><text x="28" y="130" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">旧模型</text><path d="M48 200L48 212" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="48" y="233" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M101.6 200L101.6 212" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="101.6" y="233" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M155.2 200L155.2 212" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="155.2" y="233" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M208.8 200L208.8 212" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="208.8" y="233" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M262.4 200L262.4 212" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="262.4" y="233" font-size="16" fill="#52687b" text-anchor="middle" fon