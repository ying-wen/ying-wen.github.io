<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1069" viewBox="0 0 360 1069" role="img" aria-labelledby="crl-bdfqxx-title crl-bdfqxx-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-bdfqxx-title">同一参数写入，不同后续经验</title><desc id="crl-bdfqxx-desc">原创精确对照。两种程序第一回合均右门失败，参数都从-0.5更新到0.25。第二回合当前贪心策略选左，得到奖励1和终点活动17/16；固定行为记录仍为右门，奖励-1和终点活动-15/16。两者更新后都为a=5/8，因为本例手工约束Q(a,d)=d*a*c和奖励R=d*Z，使更新简化为a+=(1-alpha)*a+alpha*Z*c。这是分析恒等式，隐藏Z没有作为学习器输入。记录奖励不能当作当前策略实际所得。</desc><rect width="360" height="1069" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一参数写入，不同后续经验</text><text x="28" y="82" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">第一回合相同；第二回合从 a=0.25 出发</text><text x="28" y="114" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">重放器按记录行动，当前贪心门仅供诊断</text><text x="28" y="153" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实际按当前估计选门</text><path d="M79 268L265 268" fill="none" stroke="#c8d6e0" stroke-width="34" stroke-linecap="round" opacity="1"/><path d="M172 268L172 363" fill="none" stroke="#c8d6e0" stroke-width="34" stroke-linecap="round" opacity="1"/><rect x="52" y="238" width="54" height="60" rx="2" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><rect x="56" y="242" width="46" height="52" rx="1" fill="none" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="79" y="225" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><text x="79" y="275" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">+1</text><rect x="238" y="238" width="54" height="60" rx="2" fill="#e7ebef" stroke="#52687b" stroke-width="2" opacity="1"/><rect x="242" y="242" width="46" height="52" rx="1" fill="none" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="265" y="225" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="265" y="275" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><rect x="148" y="244" width="48" height="48" rx="6" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="172" y="274" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="172" cy="361" r="15" fill="#146ca1" stroke="#ffffff" stroke-width="2.5" opacity="1"/><text x="172" y="405" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C：提示 +1</text><path d="M172 340L172 304.5" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M172 298L177 308L167 308Z" fill="#146ca1"/><path d="M142 268L120.5 268" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M114 268L124 263L124 273Z" fill="#b65a28"/><text x="172" y="225" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">J</text><text x="36" y="450" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">a = 0.25 → 0.625</text><text x="36" y="480" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">hⱼ = 0.25；R = 1</text><text x="36" y="510" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">h终 = 1.0625</text><text x="28" y="578" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">读取固定右门记录</text><path d="M79 693L265 693" fill="none" stroke="#c8d6e0" stroke-width="34" stroke-linecap="round" opacity="1"/><path d="M172 693L172 788" fill="none" stroke="#c8d6e0" stroke-width="34" stroke-linecap="round" opacity="1"/><rect x="52" y="663" width="54" height="60" rx="2" fill="#e7ebef" stroke="#52687b" stroke-width="2" opacity="1"/><rect x="56" y="667" width="46" height="52" rx="1" fill="none" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="79" y="650" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><text x="79" y="700" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><rect x="238" y="663" width="54" height="60" rx="2" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><rect x="242" y="667" width="46" height="52" rx="1" fill="none" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="265" y="650" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="265" y="700" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">−1</text><rect x="148" y="669" width="48" height="48" rx="6" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="172" y="699" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="172" cy="786" r="15" fill="#146ca1" stroke="#ffffff" stroke-width="2.5" opacity="1"/><text x="172" y="830" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C：提示 +1</text><path d="M172 765L172 729.5" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M172 723L177 733L167 733Z" fill="#146ca1"/><path d="M202 693L223.5 693" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M230 693L220 698L220 688Z" fill="#b65a28"/><text x="172" y="650" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">J</text><text x="36" y="875" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">a = 0.25 → 0.625</text><text x="36" y="905" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">hⱼ = 0.25；R = -1</text><text x="36" y="935" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">h终 = -0.9375</text><path d="M28 972L332 972" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="1000" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">相同 a⁺=0.625，不同奖励与活动</text><text x="28" y="1032" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">±h 和 ±1 的对称性使写入恰好相同</text></g></svg>
