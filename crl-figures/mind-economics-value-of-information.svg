<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc"><title id="title">信息何时值得获取？先看它能否改变行动</title><desc id="desc">决策树和正确率从0.5到1时的信息毛收益与净收益。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#bd643f"/></marker></defs><rect width="920" height="520" fill="#fbfcfd"/><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" font-size="23" fill="#243f53">信息何时值得获取？先看它能否改变行动</text><text x="28" y="71" font-size="17" fill="#243f53">A 确定得 6；B 以相同概率得 10 或 0；一次信息操作成本为 1</text><text x="32" y="124" font-size="20" fill="#243f53">立即选择</text><text x="32" y="157" font-size="18" fill="#243f53">A：6 &gt; E[B] = 5</text><text x="32" y="224" font-size="20" fill="#243f53">消息完全可靠（q = 1）</text><line x1="65" y1="255" x2="65" y2="342" stroke="#6d8294" stroke-width="2" /><line x1="65" y1="268" x2="125" y2="268" stroke="#6d8294" stroke-width="2" /><line x1="65" y1="342" x2="125" y2="342" stroke="#6d8294" stroke-width="2" /><text x="135" y="276" font-size="18" fill="#243f53">高，概率 ½ → 选 B，得 10</text><text x="135" y="350" font-size="18" fill="#243f53">低，概率 ½ → 选 A，得 6</text><text x="32" y="410" font-size="18" fill="#243f53">净收益 = ½×10 + ½×6 − 1 = 7</text><text x="32" y="443" font-size="18" fill="#23817a">相对立即选择的净增益：1</text><line x1="530" y1="407" x2="530" y2="89" stroke="#e1e7eb" stroke-width="2" /><text x="518" y="435" font-size="14" fill="#243f53">0.5</text><line x1="596" y1="407" x2="596" y2="89" stroke="#e1e7eb" stroke-width="2" /><text x="584" y="435" font-size="14" fill="#243f53">0.6</text><line x1="662" y1="407" x2="662" y2="89" stroke="#e1e7eb" stroke-width="2" /><text x="650" y="435" font-size="14" fill="#243f53">0.7</text><line x1="728" y1="407" x2="728" y2="89" stroke="#e1e7eb" stroke-width="2" /><text x="716" y="435" font-size="14" fill="#243f53">0.8</text><line x1="794" y1="407" x2="794" y2="89" stroke="#e1e7eb" stroke-width="2" /><text x="782" y="435" font-size="14" fill="#243f53">0.9</text><line x1="860" y1="407" x2="860" y2="89" stroke="#e1e7eb" stroke-width="2" /><text x="848" y="435" font-size="14" fill="#243f53">1.0</text><line x1="530" y1="407" x2="860" y2="407" stroke="#e1e7eb" stroke-width="2" /><text x="500" y="412" font-size="15" fill="#243f53">-1</text><line x1="530" y1="301" x2="860" y2="301" stroke="#798e9e" stroke-width="2" /><text x="500" y="306" font-size="15" fill="#243f53">0</text><line x1="530" y1="195" x2="860" y2="195" stroke="#e1e7eb" stroke-width="2" /><text x="500" y="200" font-size="15" fill="#243f53">1</text><line x1="530" y1="89" x2="860" y2="89" stroke="#e1e7eb" stroke-width="2" /><text x="500" y="94" font-size="15" fill="#243f53">2</text><polyline points="530,301 533.3,301 536.6,301 539.9,301 543.2,301 546.5,301 549.8000000000001,301 553.1,301 556.4,301 559.7,301 563,301 566.3000000000001,301 569.6,301 572.9,301 576.2,301 579.5,301 582.8,301 586.1,301 589.4,301 592.6999999999999,301 596,301 599.3,298.34999999999997 602.6,295.70000000000005 605.9,293.04999999999995 609.2,290.40000000000003 612.5,287.75 615.8,285.09999999999997 619.1,282.45000000000005 622.4,279.79999999999995 625.7,277.15000000000003 629,274.5 632.3,271.84999999999997 635.6,269.19999999999993 638.9,266.54999999999995 642.2,263.90000000000003 645.5,261.25 648.8,258.6 652.1,255.94999999999993 655.4,253.30000000000007 658.7,250.64999999999995 662,248 665.3,245.34999999999997 668.5999999999999,242.70000000000002 671.9,240.05000000000007 675.2,237.40000000000003 678.5,234.75 681.8,232.09999999999997 685.1,229.45000000000002 688.4,226.79999999999998 691.7,224.15000000000003 695,221.5 698.3,218.84999999999997 701.6,216.20000000000002 704.9,213.54999999999998 708.2,210.90000000000003 711.5,208.25 714.8,205.59999999999997 718.0999999999999,202.95000000000002 721.4000000000001,200.29999999999998 724.6999999999999,197.65000000000003 728,195 731.3,192.35000000000005 734.6,189.699999999999