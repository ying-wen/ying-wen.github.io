<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1575" viewBox="0 0 360 1575" role="img" aria-labelledby="crl-1qkw8bx-title crl-1qkw8bx-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1qkw8bx-title">估计与选择分数分开</title><desc id="crl-1qkw8bx-desc">三臂相同样本平均历史：A十次奖励中六次成功，B两次中一次成功，C一次失败。下一次为t=14，Q为0.6、0.5、0，计数10、2、1。UCB采用c=根号2，其选择分数约1.327、2.125、2.297，因此选C；ε=0.1的策略给A、B、C概率14/15、1/30、1/30。C得到一次奖励1后，t=15，C均值0.5、计数2；B与C分数同为约2.146，并列规则使UCB选B。两个面板使用相同分数刻度，紫斜纹为探索项而非价值估计或环境奖励。下方蓝柱为ε-greedy条件概率，不是收到的奖励；此时贪心动作仍为A。</desc><defs><pattern id="ucb-bonus" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#f0eaf7"/><path d="M-2 7L7-2M3 10L10 3" stroke="#7854a2" stroke-width="1.2"/></pattern></defs><rect width="360" height="1575" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">估计与选择分数分开</text><text x="22" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">已见：A 6/10，B 1/2，C 0/1</text><text x="22" y="114" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">蓝绿实柱：Q；紫斜纹：探索项</text><text x="25" y="160" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">t=14 · UCB 选 C</text><text x="25" y="203" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">选择分数 Q + 探索项</text><path d="M55 441L321 441" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="46" y="446" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M55 346L321 346" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="46" y="351" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M55 251L321 251" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="46" y="256" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">2</text><rect x="80" y="384" width="36" height="57" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><rect x="80" y="314.9819" width="36" height="69.0181" rx="0" fill="url(#ucb-bonus)" stroke="#7854a2" stroke-width="1" opacity="1"/><text x="98" y="301.9819" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">1.327</text><text x="98" y="471" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="98" y="507" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">N=10</text><text x="98" y="539" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=0.6</text><rect x="181" y="393.5" width="36" height="47.5" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><rect x="181" y="239.1708" width="36" height="154.3292" rx="0" fill="url(#ucb-bonus)" stroke="#7854a2" stroke-width="1" opacity="1"/><text x="199" y="226.1708" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">2.125</text><text x="199" y="471" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="199" y="507" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">N=2</text><text x="199" y="539" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=0.5</text><rect x="282" y="441" width="36" height="0" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><rect x="282" y="222.7456" width="36" height="218.2544" rx="0" fill="url(#ucb-bonus)" stroke="#7854a2" stroke-width="1" opacity="1"/><text x="300" y="209.7456" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">2.297</text><te