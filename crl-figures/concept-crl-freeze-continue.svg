<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1010" viewBox="0 0 720 1010" role="img" aria-labelledby="title desc"><title id="title">同一个起点，是否保留学习？</title><desc id="desc">左右两份检查点最初都选左。左边始终冻结，八圈收益零；右边得到第一个零后改选右，之后七次获得奖励一。箭头表示方向，圆点表示实际奖励。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif}</style><rect width="720" height="1010" fill="white"/><text x="28" y="42" font-size="26" fill="#19354e">同一个起点，是否保留学习？</text><text x="28" y="82" font-size="19" fill="#52687b">第 8 圈复制同一个检查点；随后进入 B（右边得奖）。</text><circle cx="360" cy="125" r="16" fill="#146ca1"/><path d="M345 138L174 204" fill="none" stroke="#146ca1" stroke-width="3" /><path d="M166 198L174 204L166 210" fill="none" stroke="#146ca1" stroke-width="3" transform="rotate(158.89516141507036 174 204)"/><path d="M375 138L535 204" fill="none" stroke="#146ca1" stroke-width="3" /><path d="M527 198L535 204L527 210" fill="none" stroke="#146ca1" stroke-width="3" transform="rotate(22.416147479343643 535 204)"/><text x="40" y="244" font-size="24" fill="#b65a28">停止更新</text><rect x="58" y="310" width="65" height="65" rx="20" fill="#f5f8fa" stroke="#b7cad7" stroke-width="2"/><text x="83" y="352" font-size="21" fill="#19354e">L</text><rect x="128" y="310" width="65" height="65" rx="20" fill="#eaf3f9" stroke="#b7cad7" stroke-width="2"/><text x="153" y="352" font-size="21" fill="#19354e">J</text><rect x="198" y="310" width="65" height="65" rx="20" fill="#f5f8fa" stroke="#b7cad7" stroke-width="2"/><text x="223" y="352" font-size="21" fill="#19354e">R</text><path d="M160 302Q125 267 90 302" fill="none" stroke="#146ca1" stroke-width="4"/><circle cx="90" cy="302" r="6" fill="#146ca1"/><text x="73" y="403" font-size="21" fill="#52687b">0</text><text x="213" y="403" font-size="21" fill="#258375">1</text><text x="42" y="450" font-size="19" fill="#52687b">第一圈：L，奖励 0</text><text x="50" y="507" font-size="17" fill="#52687b">1</text><path d="M114 500L86 500" fill="none" stroke="#b65a28" stroke-width="3" /><path d="