<svg xmlns="http://www.w3.org/2000/svg" width="720" height="916" viewBox="0 0 720 916" role="img" aria-labelledby="crl-17h6kd4-title crl-17h6kd4-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-17h6kd4-title">相同预测起点，特征尺度改变写入</title><desc id="crl-17h6kd4-desc">原创精确有限两回合Sarsa。相同两套normalized tile图，原特征单位范数，统一零初值。原尺度c1、alpha.6：第一步A继续值1.2、B终止更新后A值.72，下一次继续；特征全乘10但alpha仍.6：范数平方100，第一步A值120、B值60；terminal目标负1，第二次更新后A负1710、B负3600，下一次退出。乘10且alpha改.006：各事件的动作、目标、预测都与原尺度对应一致。条长以共同0到125价值轴展示第一步预测，仅为计算快照，不是训练表现曲线。alpha除以c平方的结论要求固定线性特征、相应权重变换及相同动作选择约定；任意逐维缩放不由单一标量步长修复。</desc><rect width="720" height="916" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同预测起点，特征尺度改变写入</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一 tiles；只改变幅度，再补偿步长</text><text x="28" y="116" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">零初值；第一条奖励 +2，旧尾值 0</text><text x="28" y="174" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">原尺度 c=1</text><text x="28" y="208" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">α=0.6；‖φ(A)‖²=1</text><path d="M42 258L678 258" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="42" y="244" width="6.1056" height="28" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="56.1056" y="235" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1.2</text><text x="42" y="292" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="347.28" y="292" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">60</text><text x="652.56" y="292" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">120</text><text x="28" y="328" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">第一步 q(A,继续)=1.2</text><text x="28" y="361" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">B 终止更新后：0.72</text><text x="438" y="361" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">再到 A：继续</text><text x="28" y="388" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">放大 c=10</text><text x="28" y="422" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">α=0.6；‖φ(A)‖²=100</text><path d="M42 472L678 472" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="42" y="458" width="610.56" height="28" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="1"/><text x="652.56" y="449" font-size="18" fill="#b54142" text-anchor="end" font-weight="400" opacity="1">120</text><text x="28" y="542" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">第一步 q(A,继续)=120</text><text x="28" y="575" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">B 终止更新后：-1710</text><text x="438" y="575" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">再到 A：退出</text><text x="28" y="602" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">c=10，α 除以100</text><text x="28" y="636" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">α=0.006；‖φ(A)‖²=100</text><path d="M42 686L678 686" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="42" y="672" width="6.1056" height="28" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="56.1056" y="663" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1.2</text><text x="28" y="756" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">第一步 q(A,继续)=1.2</text><text x="28" y="789" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">B 终止更新后：0.72</text><text x="438" y="789" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">再到 A：继续</text><text x="28" y="844" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">条长：第一步的动作值；同一数值轴</text><text x="28" y="879" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">倍率 c²=100；补偿后每步预测一致</text></g></svg>
