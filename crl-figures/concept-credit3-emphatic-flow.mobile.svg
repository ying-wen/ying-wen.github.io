<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1080" viewBox="0 0 360 1080" role="img" aria-labelledby="crl-up8kvw-title crl-up8kvw-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-up8kvw-title">关心起点，也要学习后继</title><desc id="crl-up8kvw-desc">目标策略沿A→B→C→A循环，行为在A、B前进概率分别.5、.25，C必回A。样本当前动作比率2、4、1，进入初态gamma0=0，此后gamma=.5。interest=(1,0,0)，cumulant是到达C的指示，样本值0、1、0。follow-on使用上一比率，值为1、1、2；lambda0时当前特征系数rho_t F_t为2、4、2。三根柱对应三个时刻各自的单热特征系数，不是同时存在的一支迹向量。</desc><rect width="360" height="1080" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="42" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">关心起点，也要学习后继</text><g transform="translate(24,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 一段实际经验</text><path d="M0 25L312 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="32" cy="77" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="32" y="84" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M55 77L126.5 77" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M133 77L123 82L123 72Z" fill="#146ca1"/><text x="32" y="128" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">i=1</text><text x="32" y="174" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">c1=0</text><text x="32" y="218" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">ρ=2</text><circle cx="156" cy="77" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="156" y="84" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M179 77L250.5 77" fill="none" stroke="#146ca1" stroke-wid