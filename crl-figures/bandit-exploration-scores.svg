07" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">N=2</text><text x="558.5" y="539" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=0.5</text><rect x="641" y="393.5" width="36" height="47.5" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><rect x="641" y="237.1665" width="36" height="156.3335" rx="0" fill="url(#ucb-bonus)" stroke="#7854a2" stroke-width="1" opacity="1"/><text x="659" y="224.1665" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">2.146</text><text x="659" y="471" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="659" y="507" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">N=2</text><text x="659" y="539" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=0.5</text><text x="385" y="590" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">ε=0.1 的选择概率</text><path d="M415 718L680 718" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><rect x="440" y="624.6667" width="36" height="93.3333" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="458" y="611.6667" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.933</text><text x="458" y="750" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><rect x="540.5" y="714.6667" width="36" height="3.3333" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="558.5" y="701.6667" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.033</text><text x="558.5" y="750" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><rect x="641" y="714.6667" width="36" height="3.3333" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="659" y="701.6667" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.033</text><text x="659" y="750" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">C</text><path d="M326 174L357.8 174" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M363 174L355 178L355 170Z" fill="#146ca1"/><text x="22" y="821" font-size="21" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">选 C 得 1：N(C) 从 1 到 2，Q(C) 从 0 到 0.5</text><text x="22" y="860" font-size="21" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">UCB：C → B；ε-greedy：最高概率仍给 A</text></g></svg>
