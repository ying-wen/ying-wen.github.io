<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1155" viewBox="0 0 360 1155" role="img" aria-labelledby="crl-1348xir-title crl-1348xir-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1348xir-title">特征图决定一次更新扩散到哪里</title><desc id="crl-1348xir-desc">原创精确算例。走廊A继续得2到B，B继续得负1到终止T，A退出得0到T，gamma1，真实动作值A继续1、退出0，B继续负1。完整任务只供读者分析，学习器每步只见实际状态动作奖励后继。特征坐标A=.30、B=.60，格宽.5，两套tiling按floor(s/.5+k/2)编号，A与B只共享tiling1的tile1。三种3维单位范数特征的内积分别0、.5、1；颜色方块表示活动分量，normalized tile的非零分量是1/sqrt2。此图显示真实特征支持与动作分块，无经验训练曲线。</desc><rect width="360" height="1155" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">特征图决定一次更新扩散到哪里</text><text x="28" y="82" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一走廊；读者的完整任务视图</text><circle cx="50" cy="146" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="50" y="153" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="177" cy="146" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="177" y="153" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="308" cy="146" r="20" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="308" cy="146" r="15" fill="none" stroke="#52687b" stroke-width="2" opacity="1"/><text x="308" y="153" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">T</text><path d="M73 146L147.5 146" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M154 146L144 151L144 141Z" fill="#146ca1"/><text x="113.5" y="126" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">+2</text><path d="M200 146L278.5 146" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M285 146L275 151L275 141Z" fill="#146ca1"/><text x="242.5" y="126" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">−1</text><path d="M50 169L50 214.5" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M50 221L45 211L55 211Z" fill="#b65a28"/><circle cx="50" cy="246" r="20" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="50" cy="246" r="15" fill="none" stroke="#52687b" stroke-width="2" opacity="1"/><text x="50" y="253" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="80" y="196" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">退出：0</text><text x="145" y="215" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">γ=1；T 真正终止</text><text x="145" y="249" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">真值 A:(1,0)</text><text x="145" y="281" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">真值 B:−1</text><text x="28" y="327" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">学习器只收到所选动作的后果</text><text x="28" y="359" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">下面横轴是特征坐标，不是额外状态</text><text x="28" y="396" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">tiling 0</text><rect x="28" y="410" width="152" height="28" rx="0" fill="#d8e9f4" stroke="#52687b" stroke-width="1.5" opacity="1"/><rect x="180" y="410" width="152" height="28" rx="0" fill="#e5e2f0" stroke="#52687b" stroke-width="1.5" opacity="1"/><path d="M119.2 405L119.2 443" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M210.4 405L210.4 443" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="