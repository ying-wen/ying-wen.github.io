<svg xmlns="http://www.w3.org/2000/svg" width="720" height="967" viewBox="0 0 720 967" role="img" aria-labelledby="crl-bimwwp-title crl-bimwwp-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-bimwwp-title">把同一个参数的两处作用分开看</title><desc id="crl-bimwwp-desc">原创概率面积图。两次独立动作抽样对应单位正方形的横、纵坐标；获奖矩形面积是p0乘(1−p1)。左图只增加第一处概率，竖条面积增加；右图只增加第二处概率，横条面积移去。彩色条取dp=.08便于看见，两个面板分别保持另一处固定。实际共享theta时在p0=p1=p处将两个偏导相加，再乘sigmoid导数p(1−p)与折扣gamma。下方精确梯度贡献为+.036784与−.074073，总计−.037289；不是有限条面积变化直接当作梯度。</desc><rect width="720" height="967" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">把同一个参数的两处作用分开看</text><text x="28" y="85" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">只有先选 1、再选 0 才获得奖励</text><circle cx="90" cy="126" r="12" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M108 126L315.5 126" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M322 126L312 131L312 121Z" fill="#b65a28"/><circle cx="340" cy="126" r="12" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><path d="M358 126L565.5 126" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M572 126L562 131L562 121Z" fill="#7854a2"/><circle cx="590" cy="126" r="15" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="590" y="132" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="90" y="163" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">第一步</text><text x="340" y="163" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">第二步</text><text x="590" y="163" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">奖励</text><text x="28" y="201" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">① 先只增加第一步的 p</text><rect x="54" y="230" width="260" height="260" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="54" y="230" width="173.7288" height="86.2712" rx="0" fill="#d5ebe5" stroke="none" stroke-width="1.5" opacity="1"/><rect x="227.7288" y="230" width="20.8" height="86.2712" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><path d="M227.7288 344.2712L243.9788 344.2712" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M248.5288 344.2712L241.5288 347.7712L241.5288 340.7712Z" fill="#b65a28"/><path d="M227.7288 223L227.7288 495" fill="none" stroke="#258375" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="5 5"/><path d="M248.5288 223L248.5288 495" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="66" y="259" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">获奖区域</text><text x="66" y="287" font-size="17" fill="#258375" text-anchor="start" font-weight="400" opacity="1">面积 = p(1−p)</text><text x="184" y="417.2" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">其余区域：奖励 0</text><path d="M54 490L314 490" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="54" y="516" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="314" y="516" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="227.7288" y="516" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">p</text><text x="42" y="237" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><text x="42" y="322.2712" font-size="16" fill="#258375" text-anchor="end" font-weight="400" opacity="1">1−p</text><text x="42" y="495" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><text x="54" y="555" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">新增竖条：(1−p) dp</text><text x="54" y="591" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">先选 1，更可能到达获奖分支</text><text x="380" y="201" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">② 再只增加第二步的 p</text><rect x="406" y="230" width="260" height="260" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="406" y="230" width="173.7288" height="86.2712" rx="0" fill="#d5ebe5" stroke="none" stroke-width="1.5" opacity="1"/><rect x="406" y="295.4712" width="173.7288" height="20.8" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><path d="M401 316.2712L671 316.2712" fill="none" stroke="#258375" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="5 5"/><path d="M401 295.4712L671 295.4712" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M605.7288 316.2712L605.7288 300.0212" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M605.7288 295.4712L609.2288 302.4712L602.2288 302.4712Z" fill="#7854a2"/><text x="418" y="259" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">获奖区域</text><text x="418" y="287" font-size="17" fill="#258375" text-anchor="start" font-weight="400" opacity="1">面积 = p(1−p)</text><text x="536" y="417.2" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">其余区域：奖励 0</text><path d="M406 490L666 490" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="406" y="516" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="666" y="516" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="579.7288" y="516" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">p</text><text x="394" y="237" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><text x="394" y="322.2712" font-size="16" fill="#258375" text-anchor="end" font-weight="400" opacity="1">1−p</text><text x="394" y="495" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><text x="406" y="555" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">移去横条：−p dp</text><text x="406" y="591" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">到达以后，选 0 的概率却减小</text><text x="54" y="660" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一参数：dp/dθ = p(1−p)</text><text x="54" y="693" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">再乘奖励的折扣 γ，得到两项贡献</text><text x="54" y="758" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">第一步</text><path d="M220 752L600 752" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M464.2857 739L464.2857 765" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M464.2857 752L558.9267 752" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M564.1267 752L556.1267 756L556.1267 748Z" fill="#b65a28"/><text x="564.1267" y="733" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">+0.036784</text><text x="54" y="819" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">第二步</text><path d="M220 813L600 813" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M464.2857 800L464.2857 826" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M464.2857 813L268.4307 813" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M263.2307 813L271.2307 809L271.2307 817Z" fill="#7854a2"/><text x="263.2307" y="794" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">−0.074073</text><text x="54" y="880" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">合计</text><path d="M220 874L600 874" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M464.2857 861L464.2857 887" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M464.2857 874L368.2716 874" fill="none" stroke="#19354e" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M363.0716 874L371.0716 870L371.0716 878Z" fill="#19354e"/><text x="363.0716" y="855" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">−0.037289</text><text x="54" y="932" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">p ≈ 0.668，γ = 0.5；合计为负</text></g></svg>
