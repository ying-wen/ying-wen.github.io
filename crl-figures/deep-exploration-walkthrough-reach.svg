<svg xmlns="http://www.w3.org/2000/svg" width="720" height="978" viewBox="0 0 720 978" role="img" aria-labelledby="crl-1pltcct-title crl-1pltcct-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1pltcct-title">随机假设要持续到信息到达</title><desc id="crl-1pltcct-desc">原创候选模型已知、真实模型未知的有限走廊精算。位置0到10与确定性左右转移已知，每格safe奖励.25后真终止，右端只在到达时抽一个Y，low成功率.2、high成功率.8。图中问号是未收到反馈，不能读取真theta。gamma1，每episode最多H次decision；此图用长度等于H。high采样模型选择连续right，low选择safe。每步独立重抽且未终止前q=.5不变，到达概率q的H次方；episode固定模型到达q。线和点是精确概率，非训练曲线。H10下固定模型平均实际动作5.5，每步重抽1023/512约1.998，最大预算相同而实际成本不同。旧公平左右几何诊断也恰好2的负H次方，但没有safe动作与后验消费者。</desc><rect width="720" height="978" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">随机假设要持续到信息到达</text><text x="28" y="86" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">位置可见；端点模型 low / high 未知</text><circle cx="63" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="63" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M82 144L96.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M101 144L94 147.5L94 140.5Z" fill="#b65a28"/><circle cx="120" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="120" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M139 144L153.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M158 144L151 147.5L151 140.5Z" fill="#b65a28"/><circle cx="177" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="177" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M196 144L210.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M215 144L208 147.5L208 140.5Z" fill="#b65a28"/><circle cx="234" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="234" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M253 144L267.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M272 144L265 147.5L265 140.5Z" fill="#b65a28"/><circle cx="291" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="291" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M310 144L324.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M329 144L322 147.5L322 140.5Z" fill="#b65a28"/><circle cx="348" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="348" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">5</text><path d="M367 144L381.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M386 144L379 147.5L379 140.5Z" fill="#b65a28"/><circle cx="405" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="405" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">6</text><path d="M424 144L438.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M443 144L436 147.5L436 140.5Z" fill="#b65a28"/><circle cx="462" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="462" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">7</text><path d="M481 144L495.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M500 144L493 147.5L493 140.5Z" fill="#b65a28"/><circle cx="519" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="519" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">8</text><path d="M538 144L552.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M557 144L550 147.5L550 140.5Z" fill="#b65a28"/><circle cx="576" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="576" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">9</text><path d="M595 144L609.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M614 144L607 147.5L607 140.5Z" fill="#b65a28"/><circle cx="633" cy="144" r="18" fill="#e7ebef" stroke="#52687b" stroke-width="2" opacity="1"/><text x="633" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">?</text><path d="M63 164L63 220.8" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M63 226L59 218L67 218Z" fill="#258375"/><circle cx="63" cy="247" r="18" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="63" cy="247" r="13" fill="none" stroke="#258375" stroke-width="2" opacity="1"/><text x="63" y="253" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="92" y="250" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">safe：.25 到账即终止</text><text x="28" y="290" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">普通一步：位置改变、奖励 0、q 不变</text><text x="28" y="326" font-size="19" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">到 x=10：抽一次 Y，才更新模型后验</text><text x="28" y="373" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一初始 q=.5，最多 H 次动作</text><path d="M83 419L83 673" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M83 673L83 678" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="83" y="699" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M277 419L277 673" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M277 673L277 678" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="277" y="699" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M471 419L471 673" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M471 673L471 678" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="471" y="699" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">7</text><path d="M665 419L665 673" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M665 673L665 678" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="665" y="699" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">10</text><path d="M83 673L665 673" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M78 673L83 673" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="73" y="678" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M83 546L665 546" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M78 546L83 546" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="73" y="551" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.25</text><path d="M83 419L665 419" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M78 419L83 419" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="73" y="424" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M83 419L83 673" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M83 673L665 673" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="665" y="727" font-size="18" fill="#19354e" text-anchor="end" font-weight="400" opacity="1">走廊长度 = 动作上限 H</text><text x="83" y="401" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">收到端点反馈的概率</text><path d="M83 419L147.6667 419L212.3333 419L277 419L341.6667 419L406.3333 419L471 419L535.6667 419L600.3333 419L665 419" fill="none" stroke="#7854a2" stroke-width="3"/><path d="M83 419L147.6667 546L212.3333 609.5L277 641.25L341.6667 657.125L406.3333 665.0625L471 669.0313L535.6667 671.0156L600.3333 672.0078L665 672.5039" fill="none" stroke="#b65a28" stroke-width="3" stroke-dasharray="6 4"/><circle cx="665" cy="419" r="5" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><rect x="660" y="667.5039" width="10" height="10" rx="0" fill="#b65a28" stroke="#b65a28" stroke-width="1.5" opacity="1"/><path d="M28 766L64 766" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="76" y="775" font-size="19" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">episode 固定模型：q=.5</text><path d="M28 804L64 804" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="6 4"/><text x="76" y="813" font-size="19" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">每步重抽模型：qᴴ=1/1024</text><text x="28" y="863" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">H=10：期望实际动作数</text><text x="28" y="901" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">固定模型 5.5；每步重抽 1.998</text><text x="28" y="938" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">safe 可能提早结束；比较须保留成本</text></g></svg>
