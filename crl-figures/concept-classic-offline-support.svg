<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" role="img" aria-labelledby="offline-support-title offline-support-desc"><title id="offline-support-title">固定数据的支持与 IQL 的三个更新路径</title><desc id="offline-support-desc">原创结构图与正文精确算例。上图是只含动作零的表格数据，未见动作估值不提供后果证据。下图是另一同频两动作数据：Q为零与二，expectile为一点五，逆温度为一，加权克隆概率为0.1192与0.8808。sg表示目标或权重停止梯度；后继V构造Q回归目标，优势权重仅训练actor。两图不是同一数据集，也不是训练曲线。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256fa3"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c96436"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3a7f68"/></marker></defs><rect width="1000" height="790" fill="#fbfcfa"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="52" y="58" font-size="35" fill="#203846" text-anchor="start">固定数据限制证据，IQL 分开三条更新</text><text x="55" y="112" font-size="26" fill="#203846" text-anchor="start">① 只记录 a₀ 的数据</text><circle cx="125" cy="224" r="32" fill="#fbfcfa" stroke="#203846" stroke-width="3"/><text x="125" y="233" font-size="29" fill="#203846" text-anchor="middle">s</text><path d="M155 210 Q235 146 333 166" fill="none" stroke="#256fa3" stroke-width="7" marker-end="url(#blue)"/><circle cx="365" cy="166" r="28" fill="#dceaf2" stroke="#256fa3" stroke-width="3"/><text x="365" y="176" font-size="26" fill="#203846" text-anchor="middle">a₀</text><path d="M397 166 L600 166" fill="none" stroke="#256fa3" stroke-width="7" marker-end="url(#blue)"/><circle cx="637" cy="166" r="32" fill="#dceaf2" stroke="#256fa3" stroke-width="3"/><text x="637" y="176" font-size="28" fill="#203846" text-anchor="middle">s′</text><text x="500" 