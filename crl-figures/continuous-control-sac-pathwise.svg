<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1105" viewBox="0 0 720 1105" role="img" aria-labelledby="crl-1hbdavs-title crl-1hbdavs-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1hbdavs-title">SAC：让样本沿动作回传</title><desc id="crl-1hbdavs-desc">原创单样本解析计算。两步定位器后继状态(.25,1)，物理动作[-2,2]，mean=.3，log std=-.7，固定基础噪声epsilon=.4，alpha=.2。末步使用精确Q以隔离actor路径；概率密度分别记录Gaussian、tanh和2倍动作单位。导数横条长度是有符号分量，同一轴；紫为熵，橙为负Q。mean和log std的合计分别约1.016877和.001986，固定epsilon中心差分独立核验。目标熵由归一化.1平移到.1+log2，保留相同温度残差。没有随机训练；单样本surprisal不是整个策略熵。</desc><rect width="720" height="1105" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">SAC：让样本沿动作回传</text><text x="28" y="85" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 固定 ε=.4，沿可微路径采样</text><circle cx="100" cy="151" r="26" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="100" y="158" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">u</text><text x="100" y="203" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">u</text><text x="100" y="235" font-size="19" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.4986</text><path d="M133 151L309.5 151" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M316 151L306 156L306 146Z" fill="#146ca1"/><circle cx="349" cy="151" r="26" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="349" y="158" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">z</text><text x="349" y="203" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">tanh u</text><text x="349" y="235" font-size="19" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.461</text><path d="M382 151L558.5 151" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M565 151L555 156L555 146Z" fill="#146ca1"/><circle cx="598" cy="151" r="26" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="598" y="158" font-size="21" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">a</text><text x="598" y="203" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">a=2 tanh u</text><text x="598" y="235" font-size="19" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.9221</text><text x="28" y="292" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 同一概率样本的 log-density</text><text x="28" y="335" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">Gaussian</text><text x="28" y="368" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">−0.2989</text><text x="257" y="335" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">tanh 后</text><text x="257" y="368" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">−0.06</text><text x="486" y="335" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">物理尺度 ×2</text><text x="486" y="368" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">−0.7531</text><text x="28" y="438" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · actor loss 的两条导数相加</text><text x="28" y="493" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">均值 m</text><path d="M359.6429 528L411.0161 528" fill="none" stroke="#7854a2" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="411.0161" cy="528" r="4" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="534" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">熵项 0.1844</text><path d="M359.6429 558L591.5423 558" fill="none" stroke="#b65a28" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="591.5423" cy="558" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="564" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">−Q 0.8325</text><path d="M359.6429 511L359.6429 575" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="28" y="600" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">合计 1.0169</text><text x="28" y="648" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">log σ</text><path d="M359.6429 683L314.1331 683" fill="none" stroke="#7854a2" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="314.1331" cy="683" r="4" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="689" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">熵项 −0.1634</text><path d="M359.6429 713L405.706 713" fill="none" stroke="#b65a28" stroke-width="9" stroke-linecap="round" opacity="1"/><circle cx="405.706" cy="713" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="719" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">−Q 0.1654</text><path d="M359.6429 666L359.6429 730" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="28" y="755" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">合计 0.002</text><text x="290" y="808" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">−.25</text><text x="359.6429" y="808" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="638.2143" y="808" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="28" y="864" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">4 · 熵目标必须随动作单位平移</text><text x="28" y="906" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">归一化：目标 .1</text><text x="28" y="943" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">物理单位：目标 0.7931</text><text x="28" y="988" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">同一残差 = 0.04</text><text x="28" y="1028" font-size="19" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">∂L / ∂log α = −0.008</text><text x="28" y="1067" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">下降这项损失，温度小幅增加</text></g></svg>
