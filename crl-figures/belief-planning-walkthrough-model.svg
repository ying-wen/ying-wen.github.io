<svg xmlns="http://www.w3.org/2000/svg" width="720" height="725" viewBox="0 0 720 725" role="img" aria-labelledby="crl-1ymyht5-title crl-1ymyht5-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1ymyht5-title">观测模型错误也会改变规划排序</title><desc id="crl-1ymyht5-desc">横轴给定三分类扫描模型q，两个误分类各(1-q)/2；纵轴是该模型的精确期望回报。仅画q在1/3到1，扫描价值为-0.9+4.5q，直接取左价值1不变。旧模型q=.4计算扫描.9故取左；用给定构造校准计数每行8个正确、两个各1个错误，最大似然q=.8，扫描2.7优于1。真实传感器始终q=.8，旧模型动作实际收益1，机会损失1.7。没有随机训练曲线；多次重复同一错误规划不改变模型。</desc><rect width="720" height="725" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">观测模型错误也会改变规划排序</text><text x="28" y="85" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">扫描后允许依信号取件</text><path d="M81 120L81 410" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M81 410L81 415" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="81" y="436" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1/3</text><path d="M139.5 120L139.5 410" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M139.5 410L139.5 415" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="139.5" y="436" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.4</text><path d="M315 120L315 410" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M315 410L315 415" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="315" y="436" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.6</text><path d="M490.5 120L490.5 410" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M490.5 410L490.5 415" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="490.5" y="436" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.8</text><path d="M666 120L666 410" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M666 410L666 415" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="666" y="436" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M81 368.5714L666 368.5714" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M76 368.5714L81 368.5714" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="71" y="373.5714" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M81 285.7143L666 285.7143" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M76 285.7143L81 285.7143" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="71" y="290.7143" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">2</text><path d="M81 202.8571L666 202.8571" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M76 202.8571L81 202.8571" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="71" y="207.8571" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">3</text><path d="M81 120L666 120" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M76 120L81 120" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="71" y="125" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">4</text><path d="M81 120L81 410" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M81 410L666 410" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="666" y="464" font-size="18" fill="#19354e" text-anchor="end" font-weight="400" opacity="1">模型中的扫描正确率 q</text><text x="81" y="102" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">期望回报</text><path d="M81 401.7143L110.25 389.2857L139.5 376.8571L168.75 364.4286L198 352L227.25 339.5714L256.5 327.1429L285.75 314.7143L315 302.2857L344.25 289.8571L373.5 277.4286L402.75 265L432 252.5714L461.25 240.1429L490.5 227.7143L519.75 215.2857L549 202.8571L578.25 190.4286L607.5 178L636.75 165.5714L666 153.1429" fill="none" stroke="#7854a2" stroke-width="3"/><path d="M81 368.5714L666 368.5714" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="7 4"/><path d="M139.5 410L139.5 376.8571" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><circle cx="139.5" cy="376.8571" r="6" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><text x="148.5" y="362.8571" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">旧模型 0.9</text><path d="M490.5 410L490.5 227.7143" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><circle cx="490.5" cy="227.7143" r="6" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="499.5" y="213.7143" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">校准模型 2.7</text><text x="658" y="356.5714" font-size="18" fill="#b65a28" text-anchor="end" font-weight="400" opacity="1">直接取左 = 1</text><circle cx="48" cy="493" r="12" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><path d="M67 493L116.5 493" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M123 493L113 498L113 488Z" fill="#b54142"/><rect x="139" y="483" width="24" height="20" rx="1" fill="#e8c390" stroke="#b65a28" stroke-width="1.5" opacity="1"/><path d="M151 483L151 503" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="184" y="499" font-size="19" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">取左</text><text x="28" y="536" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">旧 q=0.4：0.9 ＜ 1</text><circle cx="48" cy="598" r="12" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M67 598L116.5 598" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M123 598L113 603L113 593Z" fill="#146ca1"/><circle cx="150" cy="598" r="18" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="150" y="604" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">扫</text><text x="184" y="604" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">再选分支</text><text x="28" y="641" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">校准 q=0.8：2.7 ＞ 1</text><text x="28" y="681" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一真实任务：机会损失 1.7</text></g></svg>
