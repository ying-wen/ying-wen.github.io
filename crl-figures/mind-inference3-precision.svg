<svg xmlns="http://www.w3.org/2000/svg" width="720" height="746" viewBox="0 0 720 746" role="img" aria-labelledby="crl-1o7xkha-title crl-1o7xkha-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1o7xkha-title">同样读数，为什么判断变了？</title><desc id="crl-1o7xkha-desc">上下或左右两个条件的读数均为52与56毫米。只将视觉标准差从1变为4，触觉标准差保持3；绿色估计由52.4移向54.56。曲线是独立高斯噪声假设下的似然，不是参与者数据。</desc><rect width="720" height="746" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="38" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同样读数，为什么判断变了？</text><text x="20" y="78" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两个通道都在估计同一高度</text><path d="M155 131Q180 108 205 131Q180 154 155 131Z" fill="white" stroke="#146ca1" stroke-width="2"/><circle cx="180" cy="131" r="8" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M522 106h27q14 0 14 10h-22v30h22q0 10-14 10h-27" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round"/><text x="180" y="188" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">视觉：52 mm</text><text x="540" y="188" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">触觉：56 mm</text><rect x="160" y="205" width="40" height="52" rx="0" fill="#f5f8fb" stroke="#146ca1" stroke-width="1.5" opacity="1"/><rect x="520" y="201" width="40" height="56" rx="0" fill="#fcf1e9" stroke="#b65a28" stroke-width="1.5" opacity="1"/><text x="20" y="297" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">只改变视觉噪声</text><text x="24" y="346" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">σ视觉=1 · σ触觉=3 mm</text><path d="M70.6667 535L70.6667 540" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70.6667" y="561" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" o