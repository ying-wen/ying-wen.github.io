<svg xmlns="http://www.w3.org/2000/svg" width="720" height="656" viewBox="0 0 720 656" role="img" aria-labelledby="crl-1mhw4mb-title crl-1mhw4mb-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1mhw4mb-title">同一网格：终点与记录边界</title><desc id="crl-1mhw4mb-desc">原创已知模型精确算例。4列3行，墙(1,1)，终点G=(3,0)，起点S=(0,2)，四向动作；进入G奖励1，其他转移奖励−.04，撞墙或越界留原格。gamma=.9。给定路径S上、上、右、右、右；前两步蓝实线为给定记录，记录在P=(0,0)停止，模型里的后续用紫色虚线。五次转移奖励−.04、−.04、−.04、−.04、1。按该路线继续的P尾值.734，起点完整回报和保留尾值的截断目标均为.51854，误将记录结束作为任务终止则为−.076。G的价值为0。没有随机采样或训练。</desc><rect width="720" height="656" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一网格：终点与记录边界</text><text x="28" y="83" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">完整位置可观察；模型已知，γ=.9</text><rect x="36" y="117" width="76" height="76" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="112" y="117" width="76" height="76" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="188" y="117" width="76" height="76" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="264" y="117" width="76" height="76" rx="0" fill="rgb(255,255,255)" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="269" y="122" width="66" height="66" rx="0" fill="none" stroke="#258375" stroke-width="2" opacity="1"/><text x="302" y="144" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="302" y="179" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0</text><rect x="36" y="193" width="76" height="76" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="112" y="193" width="76" height="76" rx="0" fill="#19354e" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="188" y="193" width="76" height="76" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="264" y="193" width="76" height="76" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="36" y="269" width="76" height="76" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="39" y="272" width="70" height="70" rx="0" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><rect x="112" y="269" width="76" height="76" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="188" y="269" width="76" height="76" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="264" y="269" width="76" height="76" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M74 307L74 236.85" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M74 231L78.5 240L69.5 240Z" fill="#146ca1"/><path d="M74 231L74 160.85" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M74 155L78.5 164L69.5 164Z" fill="#146ca1"/><path d="M74 155L144.15 155" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M150 155L141 159.5L141 150.5Z" fill="#7854a2"/><path d="M150 155L220.15 155" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M226 155L217 159.5L217 150.5Z" fill="#7854a2"/><path d="M226 155L296.15 155" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M302 155L293 159.5L293 150.5Z" fill="#7854a2"/><circle cx="74" cy="307" r="12" fill="#146ca1" stroke="#ffffff" stroke-width="2" opacity="1"/><text x="95" y="313" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">S</text><circle cx="74" cy="155" r="13" fill="#ffffff" stroke="#7854a2" stroke-width="3" opacity="1"/><text x="74" y="161" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">P</text><text x="392" y="142" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">进入 G：R=1，后续为 0</text><text x="392" y="179" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">其他转移：R=−.04</text><text x="392" y="216" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">撞墙或越界：原格不动</text><text x="392" y="261" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">蓝实线：前两步记录</text><text x="392" y="295" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">紫虚线：模型中的后续</text><text x="392" y="329" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">P：记录停止，任务继续</text><text x="28" y="400" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">沿这条给定路径的转移奖励</text><circle cx="70" cy="462" r="7" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="70" y="441" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R1</text><text x="70" y="495" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">−.04</text><path d="M80 462L198 462" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="208" cy="462" r="7" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="208" y="441" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R2</text><text x="208" y="495" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">−.04</text><path d="M218 462L336 462" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><circle cx="346" cy="462" r="7" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="346" y="441" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R3</text><text x="346" y="495" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">−.04</text><path d="M356 462L474 462" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><circle cx="484" cy="462" r="7" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="484" y="441" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R4</text><text x="484" y="495" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">−.04</text><path d="M494 462L612 462" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><circle cx="622" cy="462" r="7" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="622" y="441" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R5</text><text x="622" y="495" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M277 428L277 500" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><text x="28" y="553" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">P 的路径尾值 = .734</text><text x="28" y="585" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">截断目标 = −.04 − .9×.04 + .9²×.734</text><text x="28" y="617" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">= .51854；误作终止只有 −.076</text></g></svg>
