<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1068" viewBox="0 0 720 1068" role="img" aria-labelledby="title desc"><title id="title">等若干步，或让后来的误差找到过去</title><desc id="desc">执行n=1、3、5的n-step TD和普通累积资格迹，比较一次轨迹的实际更新值和末步资格大小。</desc><style>text{font-family:system-ui,-apple-system,"Noto Sans CJK SC","PingFang SC",sans-serif} .strong{font-weight:650}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17324d"/></marker></defs><rect width="720" height="1068" fill="#ffffff"/><text x="28" y="40" font-size="26" fill="#17324d" text-anchor="start" class="strong">等若干步，或让后来的误差找到过去</text><text x="28" y="76" font-size="21" fill="#526579" text-anchor="start" >与 MC/TD 图相同的 5 步链；只运行第 1 回合，V₀=0</text><text x="28" y="110" font-size="20" fill="#526579" text-anchor="start" >下表是完成全部待更新目标后，各状态真正得到的值</text><text x="28" y="161" font-size="21" fill="#17324d" text-anchor="start" class="strong">更新规则</text><text x="240" y="161" font-size="22" fill="#17324d" text-anchor="middle" class="strong">S0</text><text x="333" y="161" font-size="22" fill="#17324d" text-anchor="middle" class="strong">S1</text><text x="426" y="161" font-size="22" fill="#17324d" text-anchor="middle" class="strong">S2</text><text x="519" y="161" font-size="22" fill="#17324d" text-anchor="middle" class="strong">S3</text><text x="612" y="161" font-size="22" fill="#17324d" text-anchor="middle" class="strong">S4</text><line x1="28" y1="224" x2="688" y2="224" stroke="#c6d2df" stroke-width="1" /><text x="28" y="203" font-size="21" fill="#17324d" text-anchor="start" >n=1</text><text x="240" y="203" font-size="21" fill="#526579" text-anchor="middle" >0</text><text x="333" y="203" font-size="21" fill="#526579" text-anchor="middle" >0</text><text x="426" y="203" font-size="21" fill="#526579" text-anchor="middle" >0</text><text x="519" y="203" font-size="21" fill="#526579" text-anchor="middle" >0</text><text x="612" y="203" font-size="21" fill="#146a9f" text-anchor="middle" >0.25</text><line x1="28" y1="285" x2="688" y2="285" stroke="#c6d2df" stroke-width="1" /><text x="28" y="264" font-size="21" fill="#17324d" text-anchor="start" >n=3</text><text x="240" y="264" font-size="21" fill="#526579" text-anchor="middle" >0</text><text x="333" y="264" font-size="21" fill="#526579" text-anchor="middle" >0</text><text x="426" y="264" font-size="21" fill="#146a9f" text-anchor="middle" >0.2025</text><text x="519" y="264" font-size="21" fill="#146a9f" text-anchor="middle" >0.225</text><text x="612" y="264" font-size="21" fill="#146a9f" text-anchor="middle" >0.25</text><line x1="28" y1="346" x2="688" y2="346" stroke="#c6d2df" stroke-width="1" /><text x="28" y="325" font-size="21" fill="#17324d" text-anchor="start" >n=5</text><text x="240" y="325" font-size="21" fill="#146a9f" text-anchor="middle" >0.164</text><text x="333" y="325" font-size="21" fill="#146a9f" text-anchor="middle" >0.1823</text><text x="426" y="325" font-size="21" fill="#146a9f" text-anchor="middle" >0.2025</text><text x="519" y="325" font-size="21" fill="#146a9f" text-anchor="middle" >0.225</text><text x="612" y="325" font-size="21" fill="#146a9f" text-anchor="middle" >0.25</text><line x1="28" y1="407" x2="688" y2="407" stroke="#c6d2df" stroke-width="1" /><text x="28" y="386" font-size="21" fill="#21715b" text-anchor="start" >TD(λ=0.8)</text><text x="240" y="386" font-size="21" fill="#21715b" text-anchor="middle" >0.0672</text><text x="333" y="386" font-size="21" fill="#21715b" text-anchor="middle" >0.0933</text><text x="426" y="386" font-size="21" fill="#21715b" text-anchor="middle" >0.1296</text><text x="519" y="386" font-size="21" fill="#21715b" text-anchor="middle" >0.18</text><text x="612" y="386" font-size="21" fill="#21715b" text-anchor="middle" >0.25</text><text x="28" y="463" font-size="23" fill="#17324d" text-anchor="start" class="strong">为什么起点的 n=3 仍是 0？</text><text x="28" y="500" font-size="21" fill="#17324d" text-anchor="start" >前三个奖励都是 0，第三步尾值也尚为 0。</text><text x="28" y="537" font-size="20" fill="#17324d" text-anchor="start" >n=5 含最终奖励，因此起点更新为 0.25×0.9⁴=0.164025。</text><rect x="28" y="571" width="664" height="143" rx="10" fill="#e5f1eb" stroke="#c6d2df"/><text x="46" y="607" font-size="21" fill="#17324d" text-anchor="start" >最后一步只有 δ₄=1；此前的误差全部为 0。</text><text x="46" y="643" font-size="21" fill="#17324d" text-anchor="start" >到达这一步时：e₄(Sᵢ)=(γλ)⁽⁴⁻ⁱ⁾=(0.72)⁽⁴⁻ⁱ⁾。</text><text x="46" y="680" font-size="21" fill="#21715b" text-anchor="start" >所以起点立即增加 0.25×0.72⁴=0.067185。</text><text x="28" y="757" font-size="22" fill="#21715b" text-anchor="start" class="strong">最后一步留下的资格 e₄(Sᵢ)</text><rect x="218" y="897.0639872" width="44" height="34.93601280000001" fill="#21715b"/><text x="240" y="887.0639872" font-size="20" fill="#21715b" text-anchor="middle" >0.269</text><text x="240" y="961" font-size="20" fill="#17324d" text-anchor="middle" >S0</text><rect x="311" y="883.47776" width="44" height="48.52224000000001" fill="#21715b"/><text x="333" y="873.47776" font-size="20" fill="#21715b" text-anchor="middle" >0.373</text><text x="333" y="961" font-size="20" fill="#17324d" text-anchor="middle" >S1</text><rect x="404" y="864.608" width="44" height="67.39200000000001" fill="#21715b"/><text x="426" y="854.608" font-size="20" fill="#21715b" text-anchor="middle" >0.518</text><text x="426" y="961" font-size="20" fill="#17324d" text-anchor="middle" >S2</text><rect x="497" y="838.4" width="44" height="93.60000000000001" fill="#21715b"/><text x="519" y="828.4" font-size="20" fill="#21715b" text-anchor="middle" >0.72</text><text x="519" y="961" font-size="20" fill="#17324d" text-anchor="middle" >S3</text><rect x="590" y="802" width="44" height="130" fill="#21715b"/><text x="612" y="792" font-size="20" fill="#21715b" text-anchor="middle" >1</text><text x="612" y="961" font-size="20" fill="#17324d" text-anchor="middle" >S4</text><line x1="208" y1="932" x2="657" y2="932" stroke="#c6d2df" stroke-width="2" /><text x="28" y="855" font-size="20" fill="#17324d" text-anchor="start" >越早参与预测，</text><text x="28" y="889" font-size="20" fill="#17324d" text-anchor="start" >留下的资格越小。</text><text x="28" y="1004" font-size="19" fill="#526579" text-anchor="start" >γ=0.9，α=0.25；1 回合/5 转移；n-step 终点后补齐目标。</text><text x="28" y="1037" font-size="19" fill="#526579" text-anchor="start" >此例每状态只出现一次；这个相等结果不证明一般在线等价。</text></svg>
