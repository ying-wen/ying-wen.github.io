<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="crl-yk67dt-title crl-yk67dt-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-yk67dt-title">一条成功轨迹之外，还有失败分支</title><desc id="crl-yk67dt-desc">原创精确概率计算，不是采样曲线。两回合的隐藏成功门独立等概率，提示条件准确率0.8。初始a=-0.5使第一回合逆提示选门：以概率0.8失败并更新a=0.25，下一回合成功率0.8；以概率0.2成功并更新a=-0.75，下一回合成功率0.2。条内宽度为各分支下一回合的条件成功或失败概率，旁注为第一次更新分支的概率。第二回合总成功概率0.8*0.8+0.2*0.2=0.68，期望奖励0.36；第一回合期望-0.6，两回合合计-0.24。仅评价明确的两回合预算与初始化。</desc><rect width="720" height="800" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一条成功轨迹之外，还有失败分支</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">完整枚举：两回合各有 4 种隐藏门—提示组合</text><text x="28" y="114" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">每回合提示正确概率 0.8</text><circle cx="90" cy="196" r="18" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="121" y="184" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">第一次更新后 a=0.25</text><text x="121" y="216" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">此分支概率 0.8</text><path d="M90 220L90 255.5" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M90 262L85 252L95 252Z" fill="#7854a2"/><rect x="72" y="273" width="460.8" height="49" rx="0" fill="#258375" stroke="#ffffff" stroke-width="1.5" opacity="1"/><rect x="532.8" y="273" width="115.2" height="49" rx="0" fill="#b54142" stroke="#ffffff" stroke-width="1.5" opacity="1"/><text x="302.4" y="304" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">+1</text><text x="590.4" y="304" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">−1</text><text x="72" y="351" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">下一回合：P(+1)=0.8</text><text x="72" y="381" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">联合成功概率 0.64</text><circle cx="90" cy="419" r="18" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="121" y="407" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">第一次更新后 a=-0.75</text><text x="121" y="439" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">此分支概率 0.2</text><path d="M90 443L90 478.5" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M90 485L85 475L95 475Z" fill="#7854a2"/><rect x="72" y="496" width="115.2" height="49" rx="0" fill="#258375" stroke="#ffffff" stroke-width="1.5" opacity="1"/><rect x="187.2" y="496" width="460.8" height="49" rx="0" fill="#b54142" stroke="#ffffff" stroke-width="1.5" opacity="1"/><text x="129.6" y="527" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">+1</text><text x="417.6" y="527" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">−1</text><text x="72" y="574" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">下一回合：P(+1)=0.2</text><text x="72" y="604" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">联合成功概率 0.04</text><path d="M28 656L692 656" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="694" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">P(第二次成功)=0.64+0.04=0.68</text><text x="28" y="728" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两回合期望奖励 −0.6、+0.36；总和仍为 −0.24</text><text x="28" y="762" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">下方失败分支保留：第一次提示误导，仍可能继续选错</text></g></svg>
