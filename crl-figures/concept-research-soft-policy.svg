<svg xmlns="http://www.w3.org/2000/svg" width="720" height="881" viewBox="0 0 720 881" role="img" aria-labelledby="crl-5unno7-title crl-5unno7-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-5unno7-title">最大熵控制如何改变行动分布？</title><desc id="crl-5unno7-desc">精确离散软策略，概率正比于exp(Q除以温度)。三组柱形图使用相同Q，仅温度为零点二、一、三，展示策略熵与价值偏好的权衡。</desc><rect width="720" height="881" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">最大熵控制如何改变行动分布？</text><text x="28" y="80" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">给定三个动作价值 Q=(0,1,2)，温度改变最优混合。</text><text x="28" y="154" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">τ=0.2</text><rect x="176" y="259.9939" width="65" height="0.0061" rx="5" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="208" y="293" font-size="19" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">a0</text><text x="208" y="240.9939" font-size="17" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.000045</text><rect x="322" y="259.0965" width="65" height="0.9035" rx="5" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="354" y="293" font-size="19" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">a1</text><text x="354" y="240.0965" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.007</text><rect x="468" y="125.9096" width="65" height="134.0904" rx="5" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="500" y="293" font-size="19" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">a2</text><text x="500" y="106.9096" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.993</text><path d="M140 260L636 260" fill="none" stroke="#c8d6e0" stroke-width=