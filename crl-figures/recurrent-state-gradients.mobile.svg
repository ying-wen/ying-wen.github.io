<svg xmlns="http://www.w3.org/2000/svg" width="360" height="975" viewBox="0 0 360 975" role="img" aria-labelledby="crl-rooard-title crl-rooard-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-rooard-title">保留记忆，不等于保留学习路径</title><desc id="crl-rooard-desc">同一条四步序列的原创精确导数对照。每行蓝色活动相同：1,.5,.25,.125。橙色箭头是末端平方损失的反向状态导数，红色叉号是detach边界，浅灰线是被排除的路径。完整递归参数梯度为(-.65625,-.109375)；只反传最后两步为(-.4375,0)；每步detach为(-.21875,0)。最后两种方法均切断t=1的输入权重b路径，但保留当前递归权重a的直接贡献。仅学读出时a和b冻结，w的梯度为-.109375，alpha=.1时写入.0109375。所有梯度在同一旧参数点计算，不表示训练后的性能排序。</desc><rect width="360" height="975" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">保留记忆，不等于保留学习路径</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">三种求导都保留同样的 h 数值</text><text x="28" y="111" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">蓝 → 活动   橙 ← 损失梯度   × 截断</text><text x="28" y="162" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">完整递归导数</text><path d="M73 197L113.5 197" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M120 197L110 202L110 192Z" fill="#146ca1"/><circle cx="55" cy="197" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="55" y="226" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="55" y="255" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=1</text><path d="M125 274L74.5 274" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M68 274L78 269L78 279Z" fill="#b65a28"/><path d="M156 197L196.5 197" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M203 197L193 202L193 192Z" fill="#146ca1"/><circle cx="138" cy="197" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="138" y="226" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="138" y="255" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=2</text><path d="M208 274L157.5 274" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M151 274L161 269L161 279Z" fill="#b65a28"/><path d="M239 197L279.5 197" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M286 197L276 202L276 192Z" fill="#146ca1"/><circle cx="221" cy="197" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="221" y="226" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.25</text><text x="221" y="255" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=3</text><path d="M291 274L240.5 274" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M234 274L244 269L244 279Z" fill="#b65a28"/><circle cx="304" cy="197" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="304" y="226" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.125</text><text x="304" y="255" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=4</text><path d="M304 297L304 282.5" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M304 276L309 286L299 286Z" fill="#b65a28"/><text x="329" y="299" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">∂L</text><text x="28" y="319" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">∂L/∂a = -0.65625</text><text x="28" y="347" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">∂L/∂b = -0.109375</text><text x="28" y="388" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">只反传最后 2 步</text><path d="M73 423L113.5 423" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M120 423L110 428L110 418Z" fill="#146ca1"/><circle cx="55" cy="423" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="55" y="452" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="55" y="481" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=1</text><path d="M68 500L125 500" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M156 423L196.5 423" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M203 423L193 428L193 418Z" fill="#146ca1"/><circle cx="138" cy="423" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="138" y="452" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="138" y="481" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=2</text><path d="M151 500L208 500" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M173.5 493L185.5 507" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M173.5 507L185.5 493" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M239 423L279.5 423" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M286 423L276 428L276 418Z" fill="#146ca1"/><circle cx="221" cy="423" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="221" y="452" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.25</text><text x="221" y="481" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=3</text><path d="M291 500L240.5 500" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M234 500L244 495L244 505Z" fill="#b65a28"/><circle cx="304" cy="423" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="304" y="452" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.125</text><text x="304" y="481" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=4</text><path d="M304 523L304 508.5" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M304 502L309 512L299 512Z" fill="#b65a28"/><text x="329" y="525" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">∂L</text><text x="28" y="545" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">∂L/∂a = -0.4375</text><text x="28" y="573" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">∂L/∂b = 0</text><text x="28" y="614" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每步 detach</text><path d="M73 649L113.5 649" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M120 649L110 654L110 644Z" fill="#146ca1"/><circle cx="55" cy="649" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="55" y="678" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="55" y="707" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=1</text><path d="M68 726L125 726" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M90.5 719L102.5 733" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M90.5 733L102.5 719" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M156 649L196.5 649" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M203 649L193 654L193 644Z" fill="#146ca1"/><circle cx="138" cy="649" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="138" y="678" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="138" y="707" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=2</text><path d="M151 726L208 726" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M173.5 719L185.5 733" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M173.5 733L185.5 719" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M239 649L279.5 649" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M286 649L276 654L276 644Z" fill="#146ca1"/><circle cx="221" cy="649" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="221" y="678" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.25</text><text x="221" y="707" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=3</text><path d="M234 726L291 726" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M256.5 719L268.5 733" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M256.5 733L268.5 719" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="304" cy="649" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="304" y="678" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.125</text><text x="304" y="707" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=4</text><path d="M304 749L304 734.5" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M304 728L309 738L299 738Z" fill="#b65a28"/><text x="329" y="751" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">∂L</text><text x="28" y="771" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">∂L/∂a = -0.21875</text><text x="28" y="799" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">∂L/∂b = 0</text><text x="28" y="849" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">b 只在 t=1 接收非零输入</text><text x="28" y="880" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">截断后 h₄=.125 仍在，b 的梯度消失</text><text x="28" y="914" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">只学读出：Δa=Δb=0，Δw=.0109375</text><text x="28" y="944" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">读出对照用 α=.1；前三行固定 w=1</text></g></svg>
