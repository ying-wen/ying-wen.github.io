<svg xmlns="http://www.w3.org/2000/svg" width="720" height="964" viewBox="0 0 720 964" role="img" aria-labelledby="title desc"><title id="title">没有访问 B，为什么 B 的预测也变了？</title><desc id="desc">实际运行固定线性特征的两个单步回报更新，与同经验的独立表格基线对比泛化和干扰。</desc><style>text{font-family:system-ui,-apple-system,"Noto Sans CJK SC","PingFang SC",sans-serif} .strong{font-weight:650}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17324d"/></marker></defs><rect width="720" height="964" fill="#ffffff"/><text x="28" y="40" font-size="26" fill="#17324d" text-anchor="start" class="strong">没有访问 B，为什么 B 的预测也变了？</text><text x="28" y="76" font-size="20" fill="#526579" text-anchor="start" >两种起点 A/B：执行唯一动作后得 +1/−1 并终止（γ=0）</text><text x="28" y="111" font-size="21" fill="#526579" text-anchor="start" >x(A)=(1,0)，x(B)=(0.8,0.6)；共享 w，步长 α=0.5</text><rect x="28" y="151" width="664" height="135" rx="10" fill="#edf4fa" stroke="#c6d2df"/><text x="46" y="183" font-size="23" fill="#17324d" text-anchor="start" class="strong">更新前</text><text x="46" y="219" font-size="20" fill="#17324d" text-anchor="start" >w=(0, 0)</text><text x="46" y="253" font-size="20" fill="#526579" text-anchor="start" >两个预测都为 0</text><line x1="357" y1="198" x2="573" y2="198" stroke="#c6d2df" stroke-width="2" /><line x1="465" y1="186" x2="465" y2="210" stroke="#c6d2df" stroke-width="1" /><text x="314" y="205" font-size="22" fill="#17324d" text-anchor="middle" >A</text><line x1="573" y1="186" x2="573" y2="210" stroke="#17324d" stroke-width="3" /><circle cx="465" cy="198" r="6" fill="#146a9f"/><text x="680" y="205" font-size="21" fill="#146a9f" text-anchor="end" >0</text><line x1="357" y1="250" x2="573" y2="250" stroke="#c6d2df" stroke-width="2" /><line x1="465" y1="238" x2="465" y2="262" stroke="#c6d2df" stroke-width="1" /><text x="314" y="257" font-size="22" fill="#17324d" text-anchor="middle" >B</text><line x1="357" y1="238" x2="357" y2="262" stroke="#17324d" stroke-width="3" /><circle cx="465" cy="250" r="6" fill="#b55220"/><text x="680" y="257" font-size="21" fill="#b55220" text-anchor="end" >0</text><rect x="28" y="304" width="664" height="135" rx="10" fill="#edf4fa" stroke="#c6d2df"/><text x="46" y="336" font-size="23" fill="#17324d" text-anchor="start" class="strong">观察 A 后</text><text x="46" y="372" font-size="20" fill="#17324d" text-anchor="start" >w=(0.5, 0)</text><text x="46" y="406" font-size="20" fill="#526579" text-anchor="start" >误差 = 1</text><line x1="357" y1="351" x2="573" y2="351" stroke="#c6d2df" stroke-width="2" /><line x1="465" y1="339" x2="465" y2="363" stroke="#c6d2df" stroke-width="1" /><text x="314" y="358" font-size="22" fill="#17324d" text-anchor="middle" >A</text><line x1="573" y1="339" x2="573" y2="363" stroke="#17324d" stroke-width="3" /><circle cx="519" cy="351" r="6" fill="#146a9f"/><text x="680" y="358" font-size="21" fill="#146a9f" text-anchor="end" >0.5</text><line x1="357" y1="403" x2="573" y2="403" stroke="#c6d2df" stroke-width="2" /><line x1="465" y1="391" x2="465" y2="415" stroke="#c6d2df" stroke-width="1" /><text x="314" y="410" font-size="22" fill="#17324d" text-anchor="middle" >B</text><line x1="357" y1="391" x2="357" y2="415" stroke="#17324d" stroke-width="3" /><circle cx="508.2" cy="403" r="6" fill="#b55220"/><text x="680" y="410" font-size="21" fill="#b55220" text-anchor="end" >0.4</text><rect x="28" y="457" width="664" height="135" rx="10" fill="#edf4fa" stroke="#c6d2df"/><text x="46" y="489" font-size="23" fill="#17324d" text-anchor="start" class="strong">观察 B 后</text><text x="46" y="525" font-size="20" fill="#17324d" text-anchor="start" >w=(-0.06, -0.42)</text><text x="46" y="559" font-size="20" fill="#526579" text-anchor="start" >误差 = -1.4</text><line x1="357" y1="504" x2="573" y2="504" stroke="#c6d2df" stroke-width="2" /><line x1="465" y1="492" x2="465" y2="516" stroke="#c6d2df" stroke-width="1" /><text x="314" y="511" font-size="22" fill="#17324d" text-anchor="middle" >A</text><line x1="573" y1="492" x2="573" y2="516" stroke="#17324d" stroke-width="3" /><circle cx="458.52" cy="504" r="6" fill="#146a9f"/><text x="680" y="511" font-size="21" fill="#146a9f" text-anchor="end" >-0.06</text><line x1="357" y1="556" x2="573" y2="556" stroke="#c6d2df" stroke-width="2" /><line x1="465" y1="544" x2="465" y2="568" stroke="#c6d2df" stroke-width="1" /><text x="314" y="563" font-size="22" fill="#17324d" text-anchor="middle" >B</text><line x1="357" y1="544" x2="357" y2="568" stroke="#17324d" stroke-width="3" /><circle cx="432.6" cy="556" r="6" fill="#b55220"/><text x="680" y="563" font-size="21" fill="#b55220" text-anchor="end" >-0.3</text><text x="28" y="650" font-size="20" fill="#526579" text-anchor="start" >● 当前预测；黑竖线是真实目标（A=+1，B=−1）</text><text x="28" y="690" font-size="20" fill="#146a9f" text-anchor="start" >A 的更新让 B 也增加：Δv(B)=α×误差×x(B)ᵀx(A)=0.4</text><text x="28" y="729" font-size="20" fill="#b55220" text-anchor="start" >B 的误差 −1.4 随后让 A 减少 0.56；它没有再次观察 A。</text><rect x="28" y="760" width="664" height="95" rx="10" fill="#edf4fa" stroke="#c6d2df"/><text x="46" y="794" font-size="20" fill="#17324d" text-anchor="start" >同样两次经验，表格基线：(0,0) → (0.5,0) → (0.5,−0.5)</text><text x="46" y="830" font-size="20" fill="#17324d" text-anchor="start" >共享表示能精确表达两目标：w*=(1,−3)。干扰≠不可表示。</text><text x="28" y="902" font-size="19" fill="#526579" text-anchor="start" >确定性两次更新展示；数据另保存24次交替访问，无需种子。</text><text x="28" y="935" font-size="19" fill="#526579" text-anchor="start" >固定目标与特征的梯度回归；不是深网、自举或持续学习实验。</text></svg>
