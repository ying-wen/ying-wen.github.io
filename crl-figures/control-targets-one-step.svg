<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1074" viewBox="0 0 720 1074" role="img" aria-labelledby="crl-1drnv56-title crl-1drnv56-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1drnv56-title">同一经验，延续目标怎样改变更新</title><desc id="crl-1drnv56-desc">原创冻结数据精确算例。A的go奖励1到B，实际已选B的fast。旧Q1(A,go)=2，B的fast/detour值1/5，行为概率.25/.75，gamma=.9、alpha=.25。Sarsa目标1.9，新值1.975；Expected Sarsa目标4.6，新值2.65；Q-learning目标5.5，新值2.875。Double额外Q2(B)=(4,2)，更新Q1时按Q1选detour、按Q2评价2，目标2.8、Q1新值2.2；交换角色目标1.9，公平硬币平均目标2.35。两张表固定，是提供给算例的估计而非独立无偏估计。横线以相同0到6价值尺度显示旧值空圆到新值实圆，target数字另列。没有环境采样或训练。</desc><rect width="720" height="1074" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一经验，延续目标怎样改变更新</text><text x="28" y="83" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一 A→B：实际下一动作 fast</text><circle cx="68" cy="175" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="68" y="182" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M93 175L231.5 175" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M238 175L228 180L228 170Z" fill="#146ca1"/><text x="165.5" y="150" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">go, R₁=1</text><circle cx="263" cy="175" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="263" y="182" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M284 167L438.5496 147.8013" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M445 147L435.6927 153.1946L434.4599 143.2709Z" fill="#146ca1"/><circle cx="483" cy="147" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="483" y="122" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">fast</text><text x="483" y="181" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">Q₁=1</text><path d="M278 193L439.4528 291.6119" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M445 295L433.8597 294.0546L439.0721 285.5205Z" fill="#b65a28"/><rect x="470" y="282" width="26" height="26" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="483" y="268" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">detour</text><text x="483" y="335" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">Q₁=5</text><text x="281" y="121" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">b=.25</text><text x="281" y="307" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">b=.75</text><text x="28" y="397" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">蓝圆：实际；橙方：旧表贪心</text><text x="28" y="431" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧 Q(A,go)=2；γ=.9，α=.25</text><text x="28" y="487" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">Sarsa</text><path d="M256 507L640 507" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="384" cy="507" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M384 507L382.92 507" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M382.4 507L383.2 506.6L383.2 507.4Z" fill="#146ca1"/><circle cx="382.4" cy="507" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="256" y="530" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="384" y="530" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="640" y="530" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="256" y="480" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">target 1.9 → 新值 1.975</text><text x="28" y="557" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">Expected</text><path d="M256 577L640 577" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="384" cy="577" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M384 577L421.7 577" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M425.6 577L419.6 580L419.6 574Z" fill="#258375"/><circle cx="425.6" cy="577" r="4" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="256" y="550" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">target 4.6 → 新值 2.65</text><text x="28" y="627" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">Q-learning</text><path d="M256 647L640 647" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="384" cy="647" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M384 647L436.1 647" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M440 647L434 650L434 644Z" fill="#b65a28"/><circle cx="440" cy="647" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="256" y="620" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">target 5.5 → 新值 2.875</text><text x="28" y="697" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">Double：更新 Q₁</text><path d="M256 717L640 717" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="384" cy="717" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M384 717L392.9 717" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M396.8 717L390.8 720L390.8 714Z" fill="#7854a2"/><circle cx="396.8" cy="717" r="4" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="256" y="690" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">target 2.8 → 新值 2.2</text><text x="28" y="791" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">Double 的另表评价</text><text x="28" y="826" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">Q₁ 的 detour 最大：5</text><path d="M290 844L453.5 844" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M460 844L450 849L450 839Z" fill="#7854a2"/><text x="375" y="875" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">同一动作索引</text><text x="28" y="909" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">Q₂(fast,detour)=(4,2)</text><text x="28" y="941" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">取 detour 的 2，target=1+.9×2</text><text x="28" y="973" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">交换角色 target=1.9；硬币均值2.35</text><text x="28" y="1009" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">Sarsa 对下一动作取均值 = 4.6</text><text x="28" y="1041" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">固定旧表的目标，不是训练收益</text></g></svg>
