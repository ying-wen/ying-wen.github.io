<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1072" viewBox="0 0 720 1072" role="img" aria-labelledby="title desc"><title id="title">模型之间的包含关系</title><desc id="desc">嵌套区域表示一组明确模型限制：一般历史交互包含平稳有限隐藏状态的POMDP，完全揭示状态得到有限MDP，再限制为一个状态和独立奖励得到标准bandit。示意图中的网格不表示所有问题都必须是网格世界。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif}</style><rect width="720" height="1072" fill="white"/><text x="28" y="42" font-size="26" fill="#19354e">模型之间的包含关系</text><rect x="24" y="92" width="672" height="876" rx="20" fill="#f7f9fb" stroke="#b7cad7" stroke-width="2"/><text x="42" y="126" font-size="24" fill="#19354e">一般历史交互</text><text x="42" y="156" font-size="18" fill="#52687b">已发生的经验 → 下一动作 → 新经验</text><circle cx="65" cy="209" r="15" fill="#146ca1"/><path d="M82 209L132 209" fill="none" stroke="#52687b" stroke-width="3" /><path d="M124 203L132 209L124 215" fill="none" stroke="#52687b" stroke-width="3" transform="rotate(0 132 209)"/><circle cx="151" cy="209" r="15" fill="#b65a28"/><path d="M168 209L218 209" fill="none" stroke="#52687b" stroke-width="3" /><path d="M210 203L218 209L210 215" fill="none" stroke="#52687b" stroke-width="3" transform="rotate(0 218 209)"/><circle cx="237" cy="209" r="15" fill="#146ca1"/><path d="M254 209L304 209" fill="none" stroke="#52687b" stroke-width="3" /><path d="M296 203L304 209L296 215" fill="none" stroke="#52687b" stroke-width="3" transform="rotate(0 304 209)"/><circle cx="323" cy="209" r="15" fill="#b65a28"/><path d="M340 209L390 209" fill="none" stroke="#52687b" stroke-width="3" /><path d="M382 203L390 209L382 215" fill="none" stroke="#52687b" stroke-width="3" transform="rotate(0 390 209)"/><circle cx="409" cy="209" r="15" fill="#146ca1"/><path d="M426 209L476 209" fill="none" stroke="#52687b" stroke-width="3" /><path d="M468 203L476 209L468 215" fill="none" stroke="#52687b" stroke-width="3" transform="rotate(0 476 209)"/><circle cx="495" cy="209" r="15" fill="#b65a28"/><path d="M512 209L562 209" fill="none" stroke="#52687b" stroke-width="3" /><path d="M554 203L562 209L554 215" fill="none" stroke="#52687b" stroke-width="3" transform="rotate(0 562 209)"/><circle cx="581" cy="209" r="15" fill="#146ca1"/><rect x="66" y="262" width="604" height="674" rx="20" fill="#eaf3f9" stroke="#b7cad7" stroke-width="2"/><text x="84" y="299" font-size="23" fill="#19354e">平稳、有限隐藏状态的 POMDP</text><text x="84" y="330" font-size="18" fill="#52687b">增加：有限潜在 Markov 模型</text><rect x="90" y="356" width="25" height="25" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="117" y="356" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="144" y="356" width="25" height="25" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="171" y="356" width="25" height="25" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="198" y="356" width="25" height="25" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="90" y="383" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="117" y="383" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="144" y="383" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="171" y="383" width="25" height="25" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="198" y="383" width="25" height="25" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="90" y="410" width="25" height="25" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="117" y="410" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="144" y="410" width="25" height="25" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="171" y="410" width="25" height="25" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="198" y="410" width="25" height="25" rx="3" fill="#bfcbd2" stroke="#819aab"/><circle cx="129.5" cy="395.5" r="8" fill="#146ca1"/><text x="257" y="389" font-size="20" fill="#19354e">只能看到局部</text><text x="257" y="421" font-size="18" fill="#52687b">历史有助于判断现在在哪里</text><rect x="116" y="462" width="528" height="442" rx="20" fill="#e5f2ee" stroke="#b7cad7" stroke-width="2"/><text x="134" y="499" font-size="23" fill="#19354e">平稳有限 MDP</text><text x="134" y="530" font-size="18" fill="#52687b">再增加：状态完全可见</text><rect x="143" y="552" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="170" y="552" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="197" y="552" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="224" y="552" width="25" height="25" rx="3" fill="#698394" stroke="#819aab"/><rect x="251" y="552" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="143" y="579" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="170" y="579" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="197" y="579" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="224" y="579" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="251" y="579" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="143" y="606" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="170" y="606" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="197" y="606" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="224" y="606" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><rect x="251" y="606" width="25" height="25" rx="3" fill="#fff" stroke="#819aab"/><circle cx="182.5" cy="591.5" r="8" fill="#146ca1"/><path d="M257.5 564.5h12m-6 -6v12" stroke="#258375" stroke-width="3"/><text x="311" y="585" font-size="18" fill="#52687b">同一世界，揭示完整状态</text><rect x="166" y="659" width="450" height="214" rx="20" fill="#fff7e9" stroke="#b7cad7" stroke-width="2"/><text x="184" y="696" font-size="22" fill="#19354e">平稳、独立拉臂的 bandit</text><text x="184" y="726" font-size="17" fill="#52687b">再增加：一个状态；动作不改变后续状态</text><rect x="203" y="751" width="65" height="64" rx="8" fill="white" stroke="#b65a28" stroke-width="2"/><circle cx="235" cy="783" r="11" fill="#b65a28"/><text x="216" y="844" font-size="17" fill="#19354e">臂 1</text><rect x="301" y="751" width="65" height="64" rx="8" fill="white" stroke="#b65a28" stroke-width="2"/><circle cx="333" cy="783" r="11" fill="#b65a28"/><text x="314" y="844" font-size="17" fill="#19354e">臂 2</text><rect x="399" y="751" width="65" height="64" rx="8" fill="white" stroke="#b65a28" stroke-width="2"/><circle cx="431" cy="783" r="11" fill="#b65a28"/><text x="412" y="844" font-size="17" fill="#19354e">臂 3</text><text x="28" y="1008" font-size="21" fill="#146ca1">向内：增加假设　　向外：放松假设</text><text x="28" y="1046" font-size="19" fill="#52687b">深度网络是求解方式；持续学习是学习与评价问题。</text></svg>
