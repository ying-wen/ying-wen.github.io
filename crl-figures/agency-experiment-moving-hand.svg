<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1893" viewBox="0 0 720 1893" role="img" aria-labelledby="crl-1fhpwi9-title crl-1fhpwi9-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1fhpwi9-title">移动橡胶手：时序、来源与朝向</title><desc id="crl-1fhpwi9-desc">依据Kalckert与Ehrsson2012年Methods与Figure1原创重绘。剖面示意显示木箱内的真实右手与箱顶戴同样乳胶手套的木制模型手，肩到模型腕间有毯子，细木杆连接两食指。实验1/2仅在主动且朝向相符时比较同步连接与木杆脱开后的约500毫秒异步；短竖线是顺序示意，没有表示实测运动轨迹。实验3/4四条件始终同步，交叉参与者主动点动或实验者带动，与模型手朝向相符或旋转180度；轮廓围绕橙色食指连接点旋转，保持其位置，上下双箭头表示点动。实验3用3分钟后的16条体验陈述，实验4闭眼用左食指在侧板指认右食指高度，比较诱导前后定位，每条件重复3次。图未编码参与者评分、漂移数值或效应量。</desc><rect width="720" height="1893" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">移动橡胶手：时序、来源与朝向</text><text x="28" y="78" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">“谁让它动”与“朝向是否相符”分开改</text><text x="28" y="121" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">箱顶模型手；箱内真实右手</text><rect x="60" y="190" width="600" height="145" rx="2" fill="#e4eaf0" stroke="#52687b" stroke-width="1.5" opacity="1"/><path d="M38 179L95 179" fill="none" stroke="#52687b" stroke-width="10" stroke-linecap="round" opacity="1"/><text x="28" y="149" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">毯子遮住肩到假手腕的空隙</text><rect x="474" y="166" width="91" height="20" rx="10" fill="#ffffff" stroke="#146ca1" stroke-width="1.5" opacity="1"/><path d="M555 171L613 161" fill="none" stroke="#146ca1" stroke-width="8" stroke-linecap="round" opacity="1"/><path d="M557 182L591 183" fill="none" stroke="#146ca1" stroke-width="6" stroke-linecap="round" opacity="1"/><rect x="474" y="283" width="91" height="20" rx="10" fill="none" stroke="#52687b" stroke-width="1.5" opacity="1"/><path d="M555 288L613 278" fill="none" stroke="#52687b" stroke-width="8" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><path d="M557 299L591 300" fill="none" stroke="#52687b" stroke-width="6" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><path d="M613 161L613 278" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="613" cy="161" r="7" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><circle cx="613" cy="278" r="7" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><path d="M633 267L633 222.55" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M633 218L636.5 225L629.5 225Z" fill="#b65a28"/><text x="28" y="368" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">细木杆穿过箱顶孔，连接两食指</text><text x="28" y="399" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">相同乳胶手套；真实手不可见</text><path d="M20 437L700 437" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="476" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实验 1／2：只改变运动时序</text><text x="28" y="523" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">同步：木杆保持连接</text><text x="28" y="581" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">真食指</text><path d="M101 575L336 575" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M119 561L119 589" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M184 561L184 589" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M249 561L249 589" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="28" y="641" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">模型指</text><path d="M101 635L336 635" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M119 621L119 649" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M184 621L184 649" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M249 621L249 649" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="28" y="686" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">自己的点动带动模型指</text><text x="374" y="523" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">异步：木杆脱开真实指套</text><text x="374" y="581" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">真食指</text><path d="M447 575L682 575" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M465 561L465 589" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M530 561L530 589" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M595 561L595 589" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="374" y="641" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">模型指</text><path d="M447 635L682 635" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M487 621L487 649" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M552 621L552 649" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M617 621L617 649" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="374" y="686" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">实验者约迟 500 ms 带动模型</text><text x="28" y="720" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两条件都主动、朝向相符</text><path d="M20 744L700 744" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="784" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实验 3／4：四条件全部同步</text><text x="28" y="836" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">主动 × 朝向相符</text><g transform="translate(177.45999999999998 986) rotate(0) scale(0.75 0.75)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" /><path d="M-19 14Q3 7 23 14" fill="none" stroke="#146ca1" stroke-width="1.2"/></g><circle cx="166.21" cy="937.25" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M230.46 1013L230.46 973.85" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M230.46 968L234.96 977L225.96 977Z" fill="#b65a28"/><path d="M250.46 968L250.46 1007.15" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M250.46 1013L245.96 1004L254.96 1004Z" fill="#b65a28"/><text x="28" y="1055" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">参与者点动，连接传递运动</text><text x="374" y="836" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">主动 × 旋转 180°</text><g transform="translate(500.96000000000004 888.5) rotate(180) scale(0.75 0.75)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" /><path d="M-19 14Q3 7 23 14" fill="none" stroke="#146ca1" stroke-width="1.2"/></g><circle cx="512.21" cy="937.25" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M576.46 1013L576.46 973.85" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1