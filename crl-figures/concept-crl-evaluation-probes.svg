<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1074" viewBox="0 0 720 1074" role="img" aria-labelledby="title desc"><title id="title">适应、保持、迁移、全程收益</title><desc id="desc">实际B段收益为零后一串七个一。冻结旧A任务诊断从一降到零。B段继续学习与从头学习都是七，迁移差为零。完整轨迹继续学习得二十二，冻结左策略十六。保持与迁移需要复制环境和学习器。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif}</style><rect width="720" height="1074" fill="white"/><text x="28" y="42" font-size="26" fill="#19354e">适应、保持、迁移、全程收益</text><text x="28" y="82" font-size="20" fill="#52687b">同一条生命期，四种不同的测量。</text><text x="28" y="131" font-size="22" fill="#19354e">① 适应：B 段真正发生的奖励</text><circle cx="75" cy="180" r="6" fill="#b65a28"/><text x="67" y="221" font-size="17" fill="#52687b">1</text><circle cx="155" cy="180" r="14" fill="#258375"/><text x="147" y="221" font-size="17" fill="#52687b">2</text><circle cx="235" cy="180" r="14" fill="#258375"/><text x="227" y="221" font-size="17" fill="#52687b">3</text><circle cx="315" cy="180" r="14" fill="#258375"/><text x="307" y="221" font-size="17" fill="#52687b">4</text><circle cx="395" cy="180" r="14" fill="#258375"/><text x="387" y="221" font-size="17" fill="#52687b">5</text><circle cx="475" cy="180" r="14" fill="#258375"/><text x="467" y="221" font-size="17" fill="#52687b">6</text><circle cx="555" cy="180" r="14" fill="#258375"/><text x="547" y="221" font-size="17" fill="#52687b">7</text><circle cx="635" cy="180" r="14" fill="#258375"/><text x="627" y="221" font-size="17" fill="#52687b">8</text><text x="28" y="261" font-size="17" fill="#52687b">圈次</text><text x="369" y="261" font-size="20" fill="#146ca1">总收益 7；第一圈失去 1</text><text x="28" y="337" font-size="22" fill="#19354e">② 保持：复制后，冻结在旧 A 测试</text><text x="119" y="379" font-size="19" fill="#19354e">学 B 前</text><text x="395" y="379" font-size="19" fill="#19354e">学 B 后</text><rect x="155" y="399" width="64" height="96" fill="#146ca1"/><path d="M120 495h390" stroke="#b7cad7" stroke-width="2"/><text x="176" y="530" font-size="23" fill="#146ca1">1</text><text x="452" y="530" font-size="23" fill="#b65a28">0</text><circle cx="459" cy="495" r="5" fill="#b65a28"/><text x="28" y="596" font-size="22" fill="#19354e">③ 迁移：进入 B 后，在相同预算内继续学</text><rect x="155" y="647" width="64" height="93" fill="#146ca1"/><rect x="432" y="647" width="64" height="93" fill="#258375"/><text x="128" y="779" font-size="19" fill="#146ca1">有 A 经验：7</text><text x="402" y="779" font-size="19" fill="#258375">从头开始：7</text><text x="291" y="718" font-size="21" fill="#19354e">差 = 0</text><text x="28" y="850" font-size="22" fill="#19354e">④ 生命期：原轨迹的奖励全部计入</text><rect x="167" y="885" width="440" height="31" fill="#146ca1"/><rect x="167" y="940" width="320" height="31" fill="#b65a28"/><text x="28" y="909" font-size="19" fill="#146ca1">继续更新</text><text x="28" y="964" font-size="19" fill="#b65a28">冻结策略</text><text x="617" y="910" font-size="21" fill="#146ca1">22</text><text x="498" y="965" font-size="21" fill="#b65a28">16</text><text x="28" y="1039" font-size="19" fill="#52687b">①④来自原轨迹；②③需要额外副本与诊断交互。</text></svg>
