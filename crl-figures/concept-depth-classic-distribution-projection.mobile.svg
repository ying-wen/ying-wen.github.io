<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1238" viewBox="0 0 360 1238" role="img" aria-labelledby="crl-gta3cf-title crl-gta3cf-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-gta3cf-title">C51：位置先变，再搬运概率</title><desc id="crl-gta3cf-desc">三个原子位置负一零一，质量0.2、0.5、0.3。奖励0.5、折扣0.5把位置变成零0.5一。中间的0.5质量等分给零和一，投影后概率为零0.45和0.55。柱高表示概率，颜色追踪来源，底部只放大中间原子的拆分。无支持裁剪时本例保持均值0.55。整数落点保留全部质量。</desc><rect width="360" height="1238" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="20" y="38" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">C51：位置先变，再搬运概率</text><text x="20" y="76" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">r = 0.5 · γ = 0.5 · 固定支持 [−1, 1]</text><text x="28" y="133" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 后继回报分布</text><path d="M52 298L308 298" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 243L308 243" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 188L308 188" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 298L308 298" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M52 298L52 303" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="52" y="326" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><path d="M180 298L180 303" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="180" y="326" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M308 298L308 303" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="308" y="326" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><rect x="42" y="254" width="20" height="44" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="52" y="244" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.2</text><rect x="170" y="188" width="20" height="110" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="180" y="178" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.5</text><rect x="298" y="232" width="20" height="66" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="308" y="222" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.3</text><text x="28" y="393" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · r + γz</text><path d="M52 558L308 558" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 503L308 503" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 448L308 448" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 558L308 558" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M52 558L52 563" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="52" y="586" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><path d="M180 558L180 563" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="180" y="586" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M308 558L308 563" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="308" y="586" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><rect x="170" y="514" width="20" height="44" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="180" y="504" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.2</text><rect x="234" y="448" width="20" height="110" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="244" y="438" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="244" y="586" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.5</text><rect x="298" y="492" width="20" height="66" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="308" y="482" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.3</text><text x="28" y="653" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · 投回固定格点</text><path d="M52 818L308 818" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 763L308 763" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 708L308 708" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 818L308 818" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M52 818L52 823" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="52" y="846" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><path d="M180 818L180 823" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="180" y="846" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M308 818L308 823" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="308" y="846" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="52" y="808" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0</text><rect x="170" y="774" width="20" height="44" rx="0" fill="#146ca1" stroke="#ffffff" stroke-width="1" opacity="1"/><rect x="170" y="719" width="20" height="55" rx="0" fill="#b65a28" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="180" y="709" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.45</text><rect x="298" y="763" width="20" height="55" rx="0" fill="#b65a28" stroke="#ffffff" stroke-width="1" opacity="1"/><rect x="298" y="697" width="20" height="66" rx="0" fill="#7854a2" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="308" y="687" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.55</text><text x="20" y="927" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">落在两格之间的质量怎样分？</text><circle cx="180" cy="983" r="24" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="180" y="990" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">.5</text><text x="180" y="951" font-size="17" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">位置 0.5</text><path d="M165 1008L86.3191 1063.264" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M81 1067L86.3093 1057.1607L92.057 1065.3439Z" fill="#b65a28"/><path d="M195 1008L273.6809 1063.264" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M279 1067L267.943 1065.3439L273.6907 1057.1607Z" fill="#b65a28"/><circle cx="69" cy="1092" r="17" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="69" y="1098" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">.25</text><text x="69" y="1131" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">位置 0</text><circle cx="291" cy="1092" r="17" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="291" y="1098" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">.25</text><text x="291" y="1131" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">位置 1</text><text x="20" y="1177" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">总质量 = 1；均值 = 0.55</text><text x="20" y="1208" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">恰好落在格点：整份质量留下。</text></g></svg>
