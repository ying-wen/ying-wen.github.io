<svg xmlns="http://www.w3.org/2000/svg" width="720" height="674" viewBox="0 0 720 674" role="img" aria-labelledby="crl-1d6rfka-title crl-1d6rfka-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1d6rfka-title">在线参数变化还需要一次补偿</title><desc id="crl-1d6rfka-desc">原创精确参数路径图，固定走廊与同一首步权重(1,0)。第二步TD误差为−1.8，保存的旧B预测是0而当前B预测是0.8。红箭头使用普通累积迹到(−0.17,−0.54)。紫箭头只使用Dutch迹的TD增量到(−0.026,−0.432)，橙箭头再加预测变化修正(0.136,−0.048)到(0.11,−0.48)。这个终点与逐前缀在线前向定义一致。箭头表示参数更新，不表示环境动作或性能排名。</desc><rect width="720" height="674" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">在线参数变化还需要一次补偿</text><text x="24" y="84" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">首步已经更新：w₁=(1,0)，v̂(B)=0.8</text><path d="M106 191.6667L606 191.6667" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M206 450L206 140" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="606" y="239.6667" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">参数 1</text><text x="206" y="124" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">参数 2</text><path d="M206 187.6667L206 195.6667" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="206" y="215.6667" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M539.3333 187.6667L539.3333 195.6667" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="539.3333" y="215.6667" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M206 191.6667L533.4833 191.6667" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M539.3333 191.