<svg xmlns="http://www.w3.org/2000/svg" width="360" height="817" viewBox="0 0 360 817" role="img" aria-labelledby="crl-7b17j2-title crl-7b17j2-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-7b17j2-title">状态和敏感度一起向前推进</title><desc id="crl-7b17j2-desc">原创四步精确算例。观察依次为1、0、0、0；h0=0，递归参数a=.5,b=1在整段固定。蓝色方块是输入，圆中的数字是时刻，圆大小辅助表示活动幅度，蓝箭头传递h。紫色通路是独立保存的状态对a、b的敏感度S，数值来自S_t=a S_{t-1}+(h_{t-1},o_t)。h依次为1,.5,.25,.125，S依次为(0,1),(1,.5),(1,.25),(.75,.125)。末端目标y=1是监督标签；只在第4步计算固定读出w=1的平方损失。没有奖励资格迹或随机训练。</desc><rect width="360" height="817" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">状态和敏感度一起向前推进</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">hₜ = a hₜ₋₁ + b oₜ；a=.5，b=1</text><text x="28" y="112" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">蓝：活动／信息  紫：参数敏感度</text><path d="M108 231L108 267.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M108 274L103 264L113 264Z" fill="#146ca1"/><text x="74" y="240" font-size="16" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">×a</text><path d="M252 209L252 265.5" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M252 272L247 262L257 262Z" fill="#7854a2"/><rect x="24" y="152" width="26" height="26" rx="2" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="1"/><text x="37" y="171" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M54 165L74.5 165" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M81 165L71 170L71 160Z" fill="#146ca1"/><circle cx="108" cy="165" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="108" y="172" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="108" y="214" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h=1</text><text x="252" y="159" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=0</text><text x="252" y="187" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=1</text><path d="M108 369L108 405.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M108 412L103 402L113 402Z" fill="#146ca1"/><text x="74" y="378" font-size="16" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">×a</text><path d="M252 347L252 403.5" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M252 410L247 400L257 400Z" fill="#7854a2"/><rect x="24" y="290" width="26" height="26" rx="2" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="37" y="309" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M54 303L74.5 303" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M81 303L71 308L71 298Z" fill="#146ca1"/><circle cx="108" cy="303" r="20.1924" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="108" y="310" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="108" y="352" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h=0.5</text><text x="252" y="297" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=1</text><text x="252" y="325" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=0.5</text><path d="M108 507L108 543.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M108 550L103 540L113 540Z" fill="#146ca1"/><text x="74" y="516" font-size="16" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">×a</text><path d="M252 485L252 541.5" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M252 548L247 538L257 538Z" fill="#7854a2"/><rect x="24" y="428" width="26" height="26" rx="2" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="37" y="447" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M54 441L74.5 441" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M81 441L71 446L71 436Z" fill="#146ca1"/><circle cx="108" cy="441" r="17.5" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="108" y="448" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">3</text><text x="108" y="490" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h=0.25</text><text x="252" y="435" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=1</text><text x="252" y="463" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=0.25</text><rect x="24" y="566" width="26" height="26" rx="2" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="37" y="585" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M54 579L74.5 579" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M81 579L71 584L71 574Z" fill="#146ca1"/><circle cx="108" cy="579" r="15.5962" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="108" y="586" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">4</text><text x="108" y="628" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h=0.125</text><text x="252" y="573" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=0.75</text><text x="252" y="601" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=0.125</text><text x="28" y="680" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">第 1 步的线索只出现一次</text><text x="28" y="711" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">第 4 步：ŷ=.125，收到目标 y=1</text><text x="28" y="742" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">随后才计算损失和一次参数写入</text><text x="28" y="781" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">数字 1–4 表示时刻；h₀=0，S₀=0</text></g></svg>
