<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="865" viewBox="0 0 1080 865" role="img" aria-labelledby="title desc"><title id="title">新单元先接上输出，再学输入</title><desc id="desc">四帧展示同一单ReLU单元。休眠时输入权重负1使当前输入无激活和梯度。回收后输入0.5、输出0；第一次SGD仅更新输出到0.05，第二次输入也更新到0.504875。小坐标图显示当前预激活在ReLU曲线上的位置。</desc><defs><marker id="teal" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#087e85"/></marker><marker id="gold" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#aa601b"/></marker><marker id="red" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a54742"/></marker><marker id="ink" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#18363d"/></marker></defs><rect width="1080" height="865" fill="#faf8f2"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="38" y="48" fill="#18363d" font-size="29" font-weight="700">新单元先接上输出，再学输入</text><text x="38" y="96" fill="#627679" font-size="22" >x=1，y=1，α=0.1</text><g data-role="neuron-frame" data-step="0"><text x="150" y="140" fill="#627679" font-size="23" text-anchor="middle">休眠</text><circle cx="150" cy="191" r="23" fill="#fffefa" stroke="#18363d" stroke-width="2"/><text x="150" y="199" fill="#18363d" font-size="23" text-anchor="middle">1</text><line x1="150" y1="215" x2="150" y2="314" stroke="#d9dfdc" stroke-width="3" /><text x="170" y="270" fill="#627679" font-size="18" >u=-1</text><circle cx="150" cy="348" r="33" fill="#d9dfdc" stroke="#627679" stroke-width="3"/><text x="150" y="356" fill="#18363d" font-size="22" text-anchor="middle">0</text><line x1="150" y1="382" x2="150" y2="467" stroke="#d9dfdc" stroke-width="5" /><text x="170" y="438" fill="#627679" font-size="18" >v=1</text><circle cx="150" cy="499" r="32" fill="#fffefa" stroke="#18363d" stroke-width="2"/><text x="150" y="507" fill="#18363d" font-size="18" text-anchor="middle">0</text><line x1="141" y1="280" x2="159" y2="298" stroke="#a54742" stroke-width="3" /><line x1="141" y1="298" x2="159" y2="280" stroke="#a54742" stroke-width="3" /><text x="150" y="570" fill="#627679" font-size="22" text-anchor="middle">L=0.5</text><line x1="76" y1="696" x2="246" y2="696" stroke="#cbd8d4" stroke-width="2" /><line x1="150" y1="715" x2="150" y2="610" stroke="#cbd8d4" stroke-width="2" /><path d="M76,696 H150 L225,621" fill="none" stroke="#627679" stroke-width="3"/><circle cx="90" cy="696" r="7" fill="#a54742" stroke="none" stroke-width="2"/><text x="150" y="750" fill="#627679" font-size="19" text-anchor="middle">ReLU</text></g><g data-role="neuron-frame" data-step="1"><text x="418" y="140" fill="#087e85" font-size="23" text-anchor="middle">回收瞬间</text><circle cx="418" cy="191" r="23" fill="#fffefa" stroke="#18363d" stroke-width="2"/><text x="418" y="199" fill="#18363d" font-size="23" text-anchor="middle">1</text><line x1="418" y1="215" x2="418" y2="314" stroke="#087e85" stroke-width="5" /><text x="438" y="270" fill="#087e85" font-size="18" >u=0.5</text><circle cx="418" cy="348" r="33" fill="#cce8df" stroke="#087e85" stroke-width="3"/><text x="418" y="356" fill="#18363d" font-size="22" text-anchor="middle">0.5</text><line x1="418" y1="382" x2="418" y2="467" stroke="#d9dfdc" stroke-width="2" stroke-dasharray="5 5"/><text x="438" y="438" fill="#627679" font-size="18" >v=0</text><circle cx="418" cy="499" r="32" fill="#fffefa" stroke="#18363d" stroke-width="2"/><text x="418" y="507" fill="#18363d" font-size="18" text-anchor="middle">0</text><line x1="410" y1="408" x2="426" y2="424" stroke="#627679" stroke-width="3" /><line x1="410" y1="424" x2="426" y2="408" stroke="#627679" stroke-width="3" /><line x1="380" y1="489" x2="380" y2="392" stroke="#aa601b" stroke-width="4" marker-end="url(#gold)" /><text x="418" y="570" fill="#087e85" font-size="22" text-anchor="middle">L=0.5</text><line x1="344" y1="696" x2="514" y2="696" stroke="#cbd8d4" stroke-width="2" /><