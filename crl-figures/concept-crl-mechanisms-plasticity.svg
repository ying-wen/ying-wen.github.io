"#087e85" font-size="23" text-anchor="middle">SGD 2</text><circle cx="954" cy="191" r="23" fill="#fffefa" stroke="#18363d" stroke-width="2"/><text x="954" y="199" fill="#18363d" font-size="23" text-anchor="middle">1</text><line x1="954" y1="215" x2="954" y2="314" stroke="#087e85" stroke-width="5" /><text x="974" y="270" fill="#087e85" font-size="18" >u=0.505</text><circle cx="954" cy="348" r="33" fill="#cce8df" stroke="#087e85" stroke-width="3"/><text x="954" y="356" fill="#18363d" font-size="22" text-anchor="middle">0.505</text><line x1="954" y1="382" x2="954" y2="467" stroke="#087e85" stroke-width="5" /><text x="974" y="438" fill="#087e85" font-size="18" >v=0.0988</text><circle cx="954" cy="499" r="32" fill="#fffefa" stroke="#18363d" stroke-width="2"/><text x="954" y="507" fill="#18363d" font-size="18" text-anchor="middle">0.0499</text><line x1="916" y1="489" x2="916" y2="392" stroke="#aa601b" stroke-width="4" marker-end="url(#gold)" /><line x1="916" y1="340" x2="916" y2="234" stroke="#aa601b" stroke-width="4" marker-end="url(#gold)" /><text x="954" y="570" fill="#087e85" font-size="22" text-anchor="middle">L=0.4514</text><line x1="880" y1="696" x2="1050" y2="696" stroke="#cbd8d4" stroke-width="2" /><line x1="954" y1="715" x2="954" y2="610" stroke="#cbd8d4" stroke-width="2" /><path d="M880,696 H954 L1029,621" fill="none" stroke="#627679" stroke-width="3"/><circle cx="984.2925" cy="665.7075" r="7" fill="#087e85" stroke="none" stroke-width="2"/><text x="954" y="750" fill="#627679" font-size="19" text-anchor="middle">ReLU</text></g><text x="40" y="803" fill="#aa601b" font-size="20" >金色：非零反向梯度</text><text x="615" y="803" fill="#627679" font-size="20" >虚线：输出连接仍为 0</text><line x1="38" y1="827" x2="1042" y2="827" stroke="#cbd8d4" stroke-width="2" /><text x="38" y="851" fill="#627679" font-size="16" >原创算例 · 数值由配套代码生成</text></g></svg>
