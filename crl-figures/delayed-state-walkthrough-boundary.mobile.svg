<svg xmlns="http://www.w3.org/2000/svg" width="360" height="775" viewBox="0 0 360 775" role="img" aria-labelledby="crl-qwz230-title crl-qwz230-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-qwz230-title">相同活动，不同信用路径</title><desc id="crl-qwz230-desc">固定b=-1/2,ρ=1,正提示和D=4。中间五个蓝圈表示提示写入和四次灰观察计算，h一直是-1/2。左侧完整反传达到提示写入，S=1；右侧末尾K=2只覆盖最后两个灰观察节点，在边界处停止，S=0，但不改变活动。g在两者中分别为-3/2和0。下方是另一种状态构造：只保存最近W=2个信号，提示已经滑出，当前为(0,0)。它改变的是决策可见的信息，而不只是求导路径。</desc><rect width="360" height="775" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同活动，不同信用路径</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一提示：b=−1/2，ρ=1，D=4</text><text x="65" y="119" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">完整</text><text x="297" y="119" font-size="18" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">K=2</text><circle cx="180" cy="158" r="14" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="153" y="164" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">C</text><text x="204" y="164" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">−1/2</text><path d="M180 173L180 198.5" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 205L175 195L185 195Z" fill="#146ca1"/><circle cx="180" cy="220" r="14" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="153" y="226" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">0</text><text x="204" y="226" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">−1/2</text><path d="M65 215L65 170.2" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opa