<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1005" viewBox="0 0 360 1005" role="img" aria-labelledby="crl-yxrdm0-title crl-yxrdm0-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-yxrdm0-title">一次回归牵动四个预测</title><desc id="crl-yxrdm0-desc">只有当前输入s的L动作参与损失。共享ReLU特征的两个参数从(1/2,1)更新到(3/4,9/8)，四个预测均改变。圆点是更新前，方点是更新后；箭头长度等于价值增量，所有轴均为0到3。后继L从1升到27/16，R从2降到21/16，贪心动作反转。</desc><rect width="360" height="1005" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次回归牵动四个预测</text><text x="24" y="76" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一条经验：s ─L, r=0→ s′</text><path d="M62 137L129.5 137" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M136 137L126 142L126 132Z" fill="#146ca1"/><path d="M184 137L255.5 137" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M262 137L252 142L252 132Z" fill="#146ca1"/><circle cx="42" cy="137" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="42" y="144" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">x</text><circle cx="160" cy="137" r="24" fill="#eef8f5" stroke="#258375" stroke-width="2" opacity="1"/><text x="160" y="144" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">h</text><circle cx="284" cy="137" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="284" y="144" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">vh</text><text x="160" y="98" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">ReLU(wx)</text><text x="222" y="123" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" o