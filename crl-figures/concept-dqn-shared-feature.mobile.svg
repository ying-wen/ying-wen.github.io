400" opacity="1">2</text><text x="176.25" y="797" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">21/16</text><text x="24" y="886" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">s′ 贪心动作：R → L</text><circle cx="28" cy="940" r="5" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="44" y="946" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新前</text><rect x="133" y="935" width="10" height="10" rx="0" fill="#258375" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="154" y="946" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新后</text><text x="24" y="981" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">θ：(1/2, 1) → (3/4, 9/8)</text></g></svg>
