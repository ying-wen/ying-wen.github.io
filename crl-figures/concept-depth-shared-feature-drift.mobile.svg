<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1025" viewBox="0 0 360 1025" role="img" aria-labelledby="crl-1pr1cf0-title crl-1pr1cf0-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1pr1cf0-title">表示变了，谁的答案也变</title><desc id="crl-1pr1cf0-desc">标量观测x=1，经编码器z=φx，φ从1更新为2。保持三个读出参数不变，预测2z由2到4，左动作值z由1到2而右动作值仍1.5，预测物理后继0.5z由0.5到1。环境未变。纯坐标缩放可把三个输入权重同时减半恢复答案，但一般非线性表示改变不一定有这样的可逆补偿。</desc><rect width="360" height="1025" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="42" font-size="24" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">表示变了，谁的答案也变</text><g transform="translate(24,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 同一观测，坐标改变</text><rect x="15" y="59" width="54" height="54" rx="5" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M23 67L23 105" fill="none" stroke="#19354e" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M33 67L33 105" fill="none" stroke="#19354e" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M43 67L43 105" fill="none" stroke="#19354e" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M53 67L53 105" fill="none" stroke="#19354e" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="42" y="144" font-size="19" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">x=1</text><path d="M77 87L121.5 87" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M128 87L118 92L118 82Z" fill="#19354e"/><path d="M143 157L312 157" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="153" y="119" width="34" height="38" rx="2" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="1"/><rect x="256" y="81" width="34" height="76" rx="2" fill="#258375" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="170" y="105" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="273" y="66" font-size="21" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M194 121L244.936 101.3405" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M251 99L243.4711 107.2654L239.8704 97.9361Z" fill="#b65a28"/><text x="0" y="209" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">仅更新编码器 φ：1 → 2</text><text x="0" y="246" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">辅助目标：z = 2</text><path d="M0 28L312 28" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/></g><g transform="translate(24,391)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 头部没更新，答案变了</text><text x="0" y="84" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">预测</text><path d="M86 77L285 77" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="185.5" cy="77" r="7" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="285" cy="77" r="7" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><path d="M195.5 62L269.5 62" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M276 62L266 67L266 57Z" fill="#b65a28"/><text x="185.5" y="106" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="285" y="106" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">4</text><text x="0" y="160" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">控制</text><path d="M86 153L285 153" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="185.5" cy="153" r="7" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="285" cy="153" r="7" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><path d="M235.25,138 v30" fill="none" stroke="#52687b" stroke-width="2" stroke-dasharray="4 3"/><text x="185.5" y="183" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">L:1</text><text x="285" y="183" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="235.25" y="130" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R:1.5</text><text x="0" y="236" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">模型</text><path d="M86 229L285 229" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="185.5" cy="229" r="9" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="285" cy="229" r="7" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><path d="M198.5 229L266.5 229" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M273 229L263 234L263 224Z" fill="#b65a28"/><text x="185.5" y="259" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="285" y="259" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M0 28L312 28" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/></g><g transform="translate(24,735)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · 已知缩放可同步补偿</text><text x="52" y="58" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">预测</text><text x="52" y="96" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2z</text><path d="M52 110L52 132.5" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M52 139L47 129L57 129Z" fill="#b65a28"/><text x="52" y="169" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">z</text><text x="52" y="212" font-size="21" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="157" y="58" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">控制</text><text x="157" y="96" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">z</text><path d="M157 110L157 132.5" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M157 139L152 129L162 129Z" fill="#b65a28"/><text x="157" y="169" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.5z</text><text x="157" y="212" font-size="21" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">(1, 1.5)</text><text x="265" y="58" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">模型</text><text x="265" y="96" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5z</text><path d="M265 110L265 132.5" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M265 139L260 129L270 129Z" fill="#b65a28"/><text x="265" y="169" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.25z</text><text x="265" y="212" font-size="21" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="156" y="255" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">所有输入权重 ÷ 2，原答案恢复</text><path d="M0 28L312 28" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/></g></g></svg>
