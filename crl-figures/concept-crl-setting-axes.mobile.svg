<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1060" viewBox="0 0 360 1060" role="img" aria-labelledby="crl-1qp4pwo-title crl-1qp4pwo-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1qp4pwo-title">模型之间的包含关系</title><desc id="crl-1qp4pwo-desc">手机版保持嵌套关系。每向内一层增加一个明确限制，并未把深度学习、持续学习画成与MDP互斥的环境类别。</desc><rect width="360" height="1060" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="20" y="34" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">模型之间的包含关系</text><rect x="12" y="70" width="336" height="853" rx="12" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="24" y="106" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一般历史交互</text><text x="24" y="137" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">经验 → 动作 → 新经验</text><circle cx="50" cy="172" r="9" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M63 172L92.5 172" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M99 172L89 177L89 167Z" fill="#52687b"/><circle cx="114" cy="172" r="9" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M127 172L156.5 172" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M163 172L153 177L153 167Z" fill="#52687b"/><circle cx="178" cy="172" r="9" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M191 172L220.5 172" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M227 172L217 177L217 167Z" fill="#52687b"/><circle cx="242" cy="172" r="9" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M255 172L284.5 172" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path dat