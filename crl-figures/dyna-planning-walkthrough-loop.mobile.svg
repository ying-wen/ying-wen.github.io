<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1390" viewBox="0 0 360 1390" role="img" aria-labelledby="crl-cnsm7c-title crl-cnsm7c-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-cnsm7c-title">计算改变行动与后续经验</title><desc id="crl-cnsm7c-desc">原创精确Dyna闭环。给定相同关闸后的两步观察，直接Q更新完成后：固定规划顺序exit,cross,go在第三次模型读取才把Qgo置0；先检查前驱的混合实现用一次优先级读取加一次备份读取，在第二次读取改Qgo。曲线为离散状态阶梯，青点线是0.6出口值。真实episode重置到S后，零规划再走S-A-D得到两次0；规划分支走S-B实际收到0.6，再做直接和模型学习。横轴没有计真实步和reset，不是算法性能曲线。</desc><rect width="360" height="1390" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">计算改变行动与后续经验</text><text x="28" y="83" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同样先读 S→A→D 两步真实经验</text><path d="M62 155L62 365" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M62 365L62 370" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="62" y="391" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M150.3333 155L150.3333 365" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M150.3333 365L150.3333 370" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="150.3333" y="391" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M238.6667 155L238.6667 365" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M238.6667 365L238.6667 370" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="238.6667" y="391" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M327 155L327 365" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linec