<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1370" viewBox="0 0 360 1370" role="img" aria-labelledby="crl-17ccyga-title crl-17ccyga-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-17ccyga-title">发现重开有收益，反复复查也有成本</title><desc id="crl-17ccyga-desc">原创固定预算精确运行。上图为关闸再重开时的累计真实环境奖励，线型区分贪心和年龄复查，颜色区分累计和近期估计。最终累计贪心23、近期贪心24、累计复查22、近期复查25。下图同尺度比较近期模型：关闸重开24对25，始终开放32对30，永久关闸24对20。没有把探索奖励或模型预测计入环境收益。每种控制器共同暖身奖励9、28交互步未画入比较期曲线；包含暖身的总预算124，总奖励各加9。预算末端按当时真实状态停止，不补齐最后一次回合或重置；完整轨迹及资源账见JSON。</desc><rect width="360" height="1370" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">发现重开有收益，反复复查也有成本</text><text x="28" y="82" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同样 96 个真实交互步：累计环境奖励</text><path d="M56 130L56 350" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M56 350L56 355" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="56" y="376" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M89.75 130L89.75 350" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M89.75 350L89.75 355" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="89.75" y="376" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">12</text><path d="M191 130L191 350" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M191 350L191 355" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="191" y="376" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">48</text><path d="M326 130L326 350" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-li