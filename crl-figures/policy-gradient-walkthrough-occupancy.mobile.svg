<svg xmlns="http://www.w3.org/2000/svg" width="360" height="852" viewBox="0 0 360 852" role="img" aria-labelledby="crl-1wb2446-title crl-1wb2446-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1wb2446-title">先前动作改变占用与后续贡献</title><desc id="crl-1wb2446-desc">原创精确四轨迹例。环境有s0、s1(0)、s1(1)，actor在三个状态共用theta=.7。第一步动作决定下一状态，第二步真正终止；仅10路径得1。线宽是条件动作概率，末端数字分别为奖励、动作序列和轨迹概率。节点下d是gamma=.5的折扣占用质量：1、.165906、.334094。下方同一有符号梯度轴给出起点+.036784、获奖可达状态−.074073及合计−.037289。箭头表示参数贡献，未乘步长。</desc><rect width="360" height="852" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先前动作改变占用与后续贡献</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一 logit；环境状态保留先前动作</text><path d="M180 157L90.0982 261.0968" fill="none" stroke="#146ca1" stroke-width="5.322685594822837" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M85 267L88.3025 253.9964L97.3844 261.8398Z" fill="#146ca1"/><text x="132.5" y="208" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">a=0</text><path d="M180 157L265.0607 260.9631" fill="none" stroke="#b65a28" stroke-width="7.677314405177163" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M270 267L257.7574 261.5119L267.0449 253.9131Z" fill="#b65a28"/><text x="225" y="208" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">a=1</text><circle cx="180" cy="145" r="17" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="117" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">s0</text><text x="217" y="151" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">d=1.000</text><circle cx="85" cy="285" r="17" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><tex