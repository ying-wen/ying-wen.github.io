<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1025" viewBox="0 0 360 1025" role="img" aria-labelledby="crl-1w31su3-title crl-1w31su3-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1w31su3-title">重复特征怎样改变信用</title><desc id="crl-1w31su3-desc">单个非终止状态S连续出现两次后终止，x=1、1、0，奖励1、2。alpha=.5,gamma=1,lambda=.5。首步权重.5，保存的下一预测0。第二步Dutch trace=.5+.75=1.25，delta=1.5，普通TD增量.9375，预测变化修正.0625，最终权重1.5。独立在线前向参照从回合初权重0，对两个位置分别用更新目标2做顺序回归，得到0→1→1.5。</desc><rect width="360" height="1025" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="42" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">重复特征怎样改变信用</text><g transform="translate(24,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 同一个特征出现两次</text><path d="M0 25L312 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="156" y="57" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">α=.5 · λ=.5 · γ=1</text><circle cx="25" cy="109" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="25" y="116" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="156" cy="109" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="156" y="116" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">S</text><rect x="267" y="89" width="40" height="40" rx="3" fill="#ffffff" stroke="#19354e" stroke-width="1.5" opacity="1"/><rect x="272" y="94" width="30" height="30" rx="2" fill="#ffffff" stroke="#19354e" stroke-width="1.5" opacity="1"/><text x="287" y="115" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">T</text><path d="M49 109L124.5 109" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M131 109L121 114L121 104Z" fill="#146ca1"/><text x="90.5" y="88" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">R=1</text><path d="M180 109L255.5 109" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M262 109L252 114L252 104Z" fill="#146ca1"/><text x="221.5" y="88" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">R=2</text><text x="25" y="153" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">x=1</text><text x="156" y="153" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">x=1</text><text x="287" y="153" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">x=0</text><text x="0" y="207" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">首步后：w=.5，旧预测=0</text></g><g transform="translate(24,355)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · Dutch trace 缩减重复资格</text><path d="M0 25L312 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="0" y="58" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">重复特征的第二次资格</text><rect x="0" y="90" width="90" height="38" rx="2" fill="#c8d6e0" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="90" y="90" width="135" height="38" rx="2" fill="#258375" stroke="#258375" stroke-width="1.5" opacity="1"/><rect x="225" y="90" width="45" height="38" rx="2" fill="#ffffff" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="45" y="157" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">.5</text><text x="157.5" y="157" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">.75</text><path d="M261 181L250.1172 141.2691" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M248.4 135L255.8642 143.3238L246.2195 145.9656Z" fill="#b54142"/><text x="312" y="206" font-size="18" fill="#b54142" text-anchor="end" font-weight="400" opacity="1">减去 .25</text><text x="0" y="206" font-size="23" fill="#258375" text-anchor="start" font-weight="400" opacity="1">e = 1.25</text><text x="0" y="249" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">灰：旧迹衰减；绿：本次加入</text></g><g transform="translate(24,657)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · 权重还要修正预测变化</text><path d="M0 25L312 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="0" y="64" width="85" height="36" rx="1" fill="#c8d6e0" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="42.5" y="130" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">.5</text><rect x="85" y="64" width="159.375" height="36" rx="1" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="1"/><text x="164.6875" y="130" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">.9375</text><rect x="244.375" y="64" width="10.625" height="36" rx="1" fill="#b65a28" stroke="#b65a28" stroke-width="1.5" opacity="1"/><path d="M249.6875 157L249.6875 112.5" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M249.6875 106L254.6875 116L244.6875 116Z" fill="#b65a28"/><text x="249.6875" y="183" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.0625</text><text x="312" y="89" font-size="24" fill="#258375" text-anchor="end" font-weight="400" opacity="1">1.5</text><text x="0" y="183" font-size="19" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">预测变化修正</text><path d="M0 218L312 218" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="0" y="253" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">在线前向参照：重算同一前缀</text><circle cx="30" cy="307" r="17" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="30" y="314" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M52 307L127.5 307" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M134 307L124 312L124 302Z" fill="#258375"/><circle cx="156" cy="307" r="17" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="156" y="314" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M178 307L253.5 307" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M260 307L250 312L250 302Z" fill="#258375"/><circle cx="282" cy="307" r="17" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="282" y="314" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">1.5</text><text x="93" y="284" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">目标 2</text><text x="219" y="284" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">目标 2</text></g></g></svg>
