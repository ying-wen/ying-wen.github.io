<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" role="img" aria-labelledby="title desc"><title id="title">何时可以把未来清零？</title><desc id="desc">三状态确定性任务的真实价值与采样边界目标。终止奖励保留，截断尾值不能自动清零。</desc><style>text{font-family:system-ui,-apple-system,"Noto Sans CJK SC","PingFang SC",sans-serif} .strong{font-weight:650}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17324d"/></marker></defs><rect width="720" height="630" fill="#ffffff"/><text x="28" y="40" font-size="26" fill="#17324d" text-anchor="start" class="strong">何时可以把未来清零？</text><text x="28" y="75" font-size="21" fill="#526579" text-anchor="start" >同一任务：A → B → 终止 T，只有最后一步奖励 1</text><rect x="40" y="116" width="162" height="115" rx="10" fill="#edf4fa" stroke="#c6d2df"/><text x="121" y="153" font-size="30" fill="#17324d" text-anchor="middle" class="strong">A</text><text x="121" y="190" font-size="21" fill="#17324d" text-anchor="middle" >真实 v = 0.9</text><line x1="206" y1="174" x2="272" y2="174" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/><text x="242" y="145" font-size="20" fill="#17324d" text-anchor="middle" >R=0</text><rect x="278" y="116" width="162" height="115" rx="10" fill="#edf4fa" stroke="#c6d2df"/><text x="359" y="153" font-size="30" fill="#17324d" text-anchor="middle" class="strong">B</text><text x="359" y="190" font-size="21" fill="#17324d" text-anchor="middle" >真实 v = 1</text><line x1="444" y1="174" x2="510" y2="174" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="145" font-size="20" fill="#17324d" text-anchor="middle" >R=1</text><rect x="516" y="116" width="162" height="115" rx="10" fill="#e5f1eb" stroke="#c6d2df"/><text x="597" y="153" font-size="30" fill="#17324d" text-anchor="middle" class="strong">T</text><text x="597" y="190" font-size="21" fill="#17324d" text-anchor="middle" >真实 v = 0</text><text x="28" y="280" font-size="23" fill="#21715b" text-anchor="start" >真正终止：到达 T 后不再有未来奖励</text><rect x="28" y="300" width="664" height="85" rx="10" fill="#e5f1eb" stroke="#c6d2df"/><text x="46" y="334" font-size="24" fill="#17324d" text-anchor="start" >B 的最后一步 target = 1 + 0 = 1</text><text x="46" y="366" font-size="20" fill="#17324d" text-anchor="start" >清零的是进入 T 之后的余项，不是刚收到的 1。</text><text x="28" y="428" font-size="23" fill="#146a9f" text-anchor="start" >采样截断：只记录 A → B，任务仍可继续</text><rect x="28" y="448" width="664" height="112" rx="10" fill="#edf4fa" stroke="#c6d2df"/><text x="46" y="482" font-size="20" fill="#17324d" text-anchor="start" >若当前 V(B)=0.4，A 的 target = 0 + 0.9×0.4 = 0.36</text><text x="46" y="516" font-size="20" fill="#17324d" text-anchor="start" >把截断误作终止会得到 0；完整真实回报则为 0.9。</text><text x="46" y="546" font-size="20" fill="#526579" text-anchor="start" >0.36 是含估计尾项的学习目标，不是真实价值。</text><text x="28" y="603" font-size="20" fill="#526579" text-anchor="start" >精确模型 · γ=0.9 · 无随机/无需种子 · 不包含控制学习</text></svg>
