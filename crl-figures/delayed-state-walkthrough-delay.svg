<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1034" viewBox="0 0 720 1034" role="img" aria-labelledby="crl-9utv3v-title crl-9utv3v-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-9utv3v-title">延迟怎样改变一次可用的更新</title><desc id="crl-9utv3v-desc">原创精确计算，D从1到16，b=-1/2,α=1,c=Z=+1，实际先选右得-1。上图纵轴为非零敏感度的以2为底对数，完整保持S=1，完整衰减S=2^-D；K=2在D=1仍有S=1，D&gt;=2时为0，零值在图外单独一行画叉号，未取log(0)。下图为同一样本更新后的b，共用坐标，橙虚线b=0是跟随与逆提示的分界。保持完整梯度总写b=1，衰减仅D=1写到正的1/8，D=4为-223/512；截断在D&gt;=2没有写入。衰减没有将精确实数状态中的正负提示合并。</desc><rect width="720" height="1034" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">延迟怎样改变一次可用的更新</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">固定 b=−1/2、α=1；同一正确正提示、实际右门失败</text><path d="M76 145L76 363" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M76 363L76 368" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="76" y="389" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M197.8 145L197.8 363" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M197.8 363L197.8 368" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="197.8" y="389" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M360.2 145L360.2 363" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M360.2 363L360.2 368" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="360.2" y="389" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">8</text><path d="M522.6 145L522.6 363" fill="none" stroke="#c8d6e0" stroke-width="