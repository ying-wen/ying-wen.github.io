<svg xmlns="http://www.w3.org/2000/svg" width="360" height="593" viewBox="0 0 360 593" role="img" aria-labelledby="crl-aswg1d-title crl-aswg1d-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-aswg1d-title">一次选择，只揭示一个动作的结果</title><desc id="crl-aswg1d-desc">在同一三动作任务中，已经四次选择B并观察奖励1、0、1、0，样本均值为0.5。第五次仍选B，得到奖励1，因此计数从4到5，估计从0.5到0.6。未选择的A与C本次潜在奖励画为问号，不给算法未观察的信息；其计数0与估计0仍是初始化。</desc><rect width="360" height="593" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次选择，只揭示一个动作的结果</text><text x="22" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">已见 B 的四次结果</text><circle cx="36" cy="121" r="17" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="36" y="127" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="84" cy="121" r="17" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="84" y="127" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="132" cy="121" r="17" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="132" y="127" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="180" cy="121" r="17" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="127" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0</text><rect x="25" y="157" width="70" height="70" rx="9" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="60" cy="189" r="19" fill="#f5f8fb" stroke="#52687b" stroke-width="2" opacity="1"/><text x="60" y="196" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="60" y="257" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">未选择</text><path d="M60 271L60 310.45" fill="none" stroke="#c8d6e0" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M60 315L56.5 308L63.5 308Z" fill="#c8d6e0"/><circle cx="60" cy="343" r="17" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="60" y="349" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><text x="60" y="386" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">结果未知</text><rect x="145" y="157" width="70" height="70" rx="9" fill="#fff4e7" stroke="#b65a28" stroke-width="1.5" opacity="1"/><circle cx="180" cy="189" r="19" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="180" y="196" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="180" y="257" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">本次选择</text><path d="M180 271L180 310.45" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 315L176.5 308L183.5 308Z" fill="#146ca1"/><circle cx="180" cy="343" r="17" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="349" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="180" y="386" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">观察 R=1</text><rect x="265" y="157" width="70" height="70" rx="9" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="300" cy="189" r="19" fill="#f5f8fb" stroke="#52687b" stroke-width="2" opacity="1"/><text x="300" y="196" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="300" y="257" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">未选择</text><path d="M300 271L300 310.45" fill="none" stroke="#c8d6e0" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M300 315L296.5 308L303.5 308Z" fill="#c8d6e0"/><circle cx="300" cy="343" r="17" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="300" y="349" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><text x="300" y="386" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">结果未知</text><path d="M22 424L338 424" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="22" y="457" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">只改变 B 的计数与估计</text><text x="22" y="492" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">N(B)：4 → 5</text><text x="22" y="526" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">Q(B)：0.5 → 0.6</text><text x="22" y="563" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A、C：仍是 N=0、Q=0 的初值</text></g></svg>
