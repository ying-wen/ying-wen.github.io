<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1350" viewBox="0 0 720 1350" role="img" aria-labelledby="crl-1y6lu4r-title crl-1y6lu4r-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1y6lu4r-title">局部变化怎样传回起点？</title><desc id="crl-1y6lu4r-desc">独立六状态确定性算例，折扣为1。初始 A-C-E 奖励4，B-D-F 奖励1。奖励交换后，两条旧终点访问预测可组合新奖励，得到A为1、B为4。中段转移交换后，旧访问预测失效，更新后的一步模型可重算正确价值。纯缓存起点标量在两种操作中均不更新。这里没有训练或人类测量数据。</desc><rect width="720" height="1350" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">局部变化怎样传回起点？</text><text x="28" y="83" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">终点奖励：进入时领取，随后结束</text><g transform="translate(28,129)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 原路线</text><path d="M66 58L245.5 58" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M252 58L242 63L242 53Z" fill="#146ca1"/><path d="M66 135L245.5 135" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M252 135L242 140L242 130Z" fill="#146ca1"/><path d="M300 58L481.5 58" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M488 58L478 63L478 53Z" fill="#146ca1"/><path d="M300 135L481.5 135" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M488 135L478 140L478 130Z" fill="#146ca1"/><circle cx="42" cy="58" r="21" fill="#ffffff" stroke="#c8d6e0" stroke-width="2" opacity="1"/><text x="42" y="64" font-size="19" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="42" cy="135" r="21" fill="#ffffff" stroke="#c8d6e0" stroke-width="2" opacity="1"/><text 