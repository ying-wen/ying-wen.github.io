<svg xmlns="http://www.w3.org/2000/svg" width="720" height="561" viewBox="0 0 720 561" role="img" aria-labelledby="crl-1u2g1gw-title crl-1u2g1gw-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1u2g1gw-title">状态和敏感度一起向前推进</title><desc id="crl-1u2g1gw-desc">原创四步精确算例。观察依次为1、0、0、0；h0=0，递归参数a=.5,b=1在整段固定。蓝色方块是输入，圆中的数字是时刻，圆大小辅助表示活动幅度，蓝箭头传递h。紫色通路是独立保存的状态对a、b的敏感度S，数值来自S_t=a S_{t-1}+(h_{t-1},o_t)。h依次为1,.5,.25,.125，S依次为(0,1),(1,.5),(1,.25),(.75,.125)。末端目标y=1是监督标签；只在第4步计算固定读出w=1的平方损失。没有奖励资格迹或随机训练。</desc><rect width="720" height="561" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">状态和敏感度一起向前推进</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">hₜ = a hₜ₋₁ + b oₜ；a=.5，b=1</text><text x="28" y="112" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">蓝色沿时间传递活动；紫色另外保存参数对活动的影响</text><path d="M127 202L239.5 202" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M246 202L236 207L236 197Z" fill="#146ca1"/><text x="186.5" y="185" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">×a</text><path d="M147 358L219.5 358" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M226 358L216 363L216 353Z" fill="#7854a2"/><rect x="87" y="128" width="26" height="26" rx="2" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="1"/><text x="100" y="147" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M100 158L100 169.475" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M100 175L95.75 166.5L104.25 166.5Z" fill="#146ca1"/><circle cx="100" cy="202" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="100" y="209" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="100" y="251" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h=1</text><text x="100" y="352" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=0</text><text x="100" y="380" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=1</text><path d="M300 202L412.5 202" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M419 202L409 207L409 197Z" fill="#146ca1"/><text x="359.5" y="185" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">×a</text><path d="M320 358L392.5 358" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M399 358L389 363L389 353Z" fill="#7854a2"/><rect x="260" y="128" width="26" height="26" rx="2" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="273" y="147" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M273 158L273 169.475" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M273 175L268.75 166.5L277.25 166.5Z" fill="#146ca1"/><circle cx="273" cy="202" r="20.1924" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="273" y="209" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="273" y="251" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h=0.5</text><text x="273" y="352" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=1</text><text x="273" y="380" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=0.5</text><path d="M473 202L585.5 202" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M592 202L582 207L582 197Z" fill="#146ca1"/><text x="532.5" y="185" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">×a</text><path d="M493 358L565.5 358" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M572 358L562 363L562 353Z" fill="#7854a2"/><rect x="433" y="128" width="26" height="26" rx="2" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="446" y="147" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M446 158L446 169.475" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M446 175L441.75 166.5L450.25 166.5Z" fill="#146ca1"/><circle cx="446" cy="202" r="17.5" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="446" y="209" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">3</text><text x="446" y="251" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h=0.25</text><text x="446" y="352" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=1</text><text x="446" y="380" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=0.25</text><rect x="606" y="128" width="26" height="26" rx="2" fill="#ffffff" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="619" y="147" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M619 158L619 169.475" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M619 175L614.75 166.5L623.25 166.5Z" fill="#146ca1"/><circle cx="619" cy="202" r="15.5962" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="619" y="209" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">4</text><text x="619" y="251" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h=0.125</text><text x="619" y="352" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=0.75</text><text x="619" y="380" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=0.125</text><text x="28" y="424" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">第 1 步的线索只出现一次</text><text x="28" y="455" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">第 4 步：ŷ=.125，收到目标 y=1</text><text x="28" y="486" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">随后才计算损失和一次参数写入</text><text x="28" y="525" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">数字 1–4 表示时刻；h₀=0，S₀=0</text></g></svg>
