<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2041" viewBox="0 0 360 2041" role="img" aria-labelledby="crl-7v8li9-title crl-7v8li9-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-7v8li9-title">多步：末端期望与逐层分支</title><desc id="crl-7v8li9-desc">原创冻结表精确算例，沿A go、B fast、C finish的同一给定轨迹。gamma=.9，奖励1、2、3，B的fast/detour旧Q1/5及概率.25/.75，C的finish/quit旧Q4/0及概率.75/.25。前两次转移后，2-step Sarsa读C的已选finish旧Q4，目标6.04；末端Expected只在C平均到3，目标5.23；2-step Tree Backup还在B保留未走detour旧Q5，按.75与已走fast的深目标4.7按.25加权，得到5.4325。三面板都使用同样状态、奖励和旧表，只改变动作分支处理。蓝实线表示已收奖励1、2的A到B到C前缀，Sarsa面板的C到finish蓝线仅表示已选动作，此时尚未收到R3。绿色实线是C的末端期望分支，紫色虚线是B未执行detour的旧预测读取；它们不表示额外执行动作。C叶端Q=4和Q=0为旧动作价值，不是终端奖励。真正终止后，3-step Sarsa目标5.23；3-step TB用C的采样finish奖励3替换旧4、保留未采quit旧0，再保留B未采detour旧5，目标5.280625。未采分支仍有自举，终止轨迹的Tree Backup不一般等于MC。</desc><rect width="360" height="2041" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">多步：末端期望与逐层分支</text><text x="28" y="82" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">已收奖励1、2；C 已选 finish</text><text x="180" y="128" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2-step Sarsa</text><circle cx="180" cy="188" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="195" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M180 212L180 253.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 260L175 250L185 250Z" fill="#146ca1"/><text x="198" y="242" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₁=1</text><circle cx="180" cy="285" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="292" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M180 309L180 367.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 374L175 364L185 364Z" fill="#146ca1"/><text x="198" y="331" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">fast</text><text x="198" y="365" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₂=2</text><circle cx="180" cy="399" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="406" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C</text><path d="M180 423L180 458.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 465L175 455L185 455Z" fill="#146ca1"/><circle cx="180" cy="478" r="11" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="180" y="511" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">finish</text><text x="180" y="535" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">Q=4</text><text x="180" y="565" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">目标 6.04</text><text x="180" y="626" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">只在末端 Expected</text><circle cx="180" cy="686" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="693" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M180 710L180 751.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 758L175 748L185 748Z" fill="#146ca1"/><text x="198" y="740" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₁=1</text><circle cx="180" cy="783" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="790" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M180 807L180 865.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 872L175 862L185 862Z" fill="#146ca1"/><text x="198" y="829" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">fast</text><text x="198" y="863" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₂=2</text><circle cx="180" cy="897" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="904" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C</text><path d="M168 920L128 964" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M192 920L232 964" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="128" cy="976" r="11" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="232" cy="976" r="11" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="128" y="949" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">.75</text><text x="232" y="949" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">.25</text><text x="128" y="1009" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">finish</text><text x="232" y="1009" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">quit</text><text x="128" y="1033" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=4</text><text x="232" y="1033" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=0</text><text x="180" y="1063" font-size="22" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">目标 5.23</text><text x="180" y="1124" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">2-step Tree Backup</text><circle cx="180" cy="1184" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="1191" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M180 1208L180 1249.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 1256L175 1246L185 1246Z" fill="#146ca1"/><text x="198" y="1238" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₁=1</text><circle cx="180" cy="1281" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="1288" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M180 1305L180 1363.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 1370L175 1360L185 1360Z" fill="#146ca1"/><text x="198" y="1327" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">fast .25</text><text x="198" y="1361" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₂=2</text><circle cx="180" cy="1395" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="1402" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C</text><path d="M158 1281L51 1320" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><rect x="40" y="1309" width="22" height="22" rx="0" fill="#ffffff" stroke="#7854a2" stroke-width="1.5" opacity="1"/><text x="51" y="1352" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">5</text><text x="59" y="1267" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">.75</text><text x="66" y="1376" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">旧 detour</text><path d="M168 1418L128 1462" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M192 1418L232 1462" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="128" cy="1474" r="11" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="232" cy="1474" r="11" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="128" y="1447" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">.75</text><text x="232" y="1447" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">.25</text><text x="128" y="1507" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">finish</text><text x="232" y="1507" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">quit</text><text x="128" y="1531" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=4</text><text x="232" y="1531" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=0</text><text x="180" y="1561" font-size="22" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">目标 5.4325</text><text x="28" y="1632" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">蓝实线：奖励前缀与已选动作</text><text x="28" y="1664" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₁=1、R₂=2；finish 已选，R₃ 未收</text><text x="28" y="1696" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">绿实线：C 的末端期望分支</text><text x="28" y="1728" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">紫虚线：B 未执行的 detour</text><text x="28" y="1760" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">叶端 Q 为旧预测值，不是奖励</text><text x="28" y="1806" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">C 的期望尾值：.75×4+.25×0=3</text><text x="28" y="1844" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">Tree Backup 的 B→C 深目标为4.7</text><text x="28" y="1882" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">A：1+.9×(.75×5+.25×4.7)</text><text x="28" y="1926" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">再收 R₃=3 并真正终止：</text><text x="28" y="1964" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">3-step Sarsa=5.23</text><text x="28" y="2002" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">3-step TB=5.280625</text></g></svg>
