<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1184" viewBox="0 0 360 1184" role="img" aria-labelledby="crl-nff7br-title crl-nff7br-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-nff7br-title">三个随机化与更新对象分开看</title><desc id="crl-nff7br-desc">原创两头表格机制探针，未实现Bootstrapped DQN网络训练。上方使用已生成真实端点记录r0、真终止d1，两个头的目标都为0，学习率.5，保存的经验训练mask为1,0。头1可训练残差f从.5到.1，头2的f.3不变；固定prior分别.3、负.1都不训练，总Q从.8到.4和.2到.2。行为选头与数据mask分开；浅条是更新前Q、深条是更新后Q，长度同用单位轴0到1。底部为另外明确给定的非终止快照：当前值两个均.5，r0、gamma1、mask均1；目标副本各为.8、.2，alpha.5得到.65、.35。目标箭头传递冻结值而非梯度。各头自己的TD bootstrap保留价值假设跨时间的对应；data bootstrap改变训练数据，prior在未充分观察处提供固定函数偏置。这些结构都不自动生成校准后验。</desc><rect width="360" height="1184" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">三个随机化与更新对象分开看</text><text x="28" y="86" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">取上一条实际端点记录：r=0，d=1</text><text x="28" y="121" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每条经验保存 mask；此处 m=(1,0)</text><circle cx="63" cy="185" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="63" y="191" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">9</text><path d="M83 185L266.5 185" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M273 185L263 190L263 180Z" fill="#146ca1"/><circle cx="293" cy="185" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="293" cy="185" r="13" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="293" y="191" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="178" y="227" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">right，终止 → 目标 0</text><path d="M178 239L178 289.8" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M178 295L174 287L182 287Z" fill="#146ca1"/><text x="178" y="320" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">头 1 · mask=1</text><text x="178" y="358" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">可训练 f：0.5 → 0.1</text><text x="178" y="393" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">固定 prior：0.3 → 0.3</text><path d="M50 454L306 454" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="50" y="424" width="204.8" height="10" rx="0" fill="#ded5ea" stroke="none" stroke-width="1.5" opacity="1"/><rect x="50" y="442" width="102.4" height="10" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="178" y="487" font-size="17" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">总 Q=f+prior：0.8 → 0.4</text><path d="M293 208L334 208" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><path d="M334 208L334 545" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><path d="M334 545L183.2 545" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><path data-arrow-mode="actual" d="M178 545L186 541L186 549Z" fill="#52687b"/><text x="178" y="570" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">头 2 · mask=0</text><text x="178" y="608" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">可训练 f：0.3 → 0.3</text><text x="178" y="643" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">固定 prior：−0.1 → −0.1</text><path d="M50 704L306 704" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="50" y="674" width="51.2" height="10" rx="0" fill="#ded5ea" stroke="none" stroke-width="1.5" opacity="1"/><rect x="50" y="692" width="51.2" height="10" rx="0" fill="#52687b" stroke="none" stroke-width="1.5" opacity="1"/><text x="178" y="737" font-size="17" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">总 Q=f+prior：0.2 → 0.2</text><text x="28" y="787" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">浅条：更新前；深条：更新后（轴 0…1）</text><path d="M28 809L332 809" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="835" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">TD bootstrap：每头读自己的目标副本</text><text x="28" y="872" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">另给非终止快照：r=0，γ=1，α=.5</text><text x="28" y="938" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">头 1</text><circle cx="103" cy="932" r="18" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="103" y="938" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.8</text><path d="M125 932L203.8 932" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M209 932L201 936L201 928Z" fill="#7854a2"/><text x="285" y="938" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.5 → 0.65</text><text x="28" y="1016" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">头 2</text><circle cx="103" cy="1010" r="18" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="103" y="1016" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.2</text><path d="M125 1010L203.8 1010" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M209 1010L201 1014L201 1006Z" fill="#7854a2"/><text x="285" y="1016" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.5 → 0.35</text><text x="28" y="1108" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">数据 mask ≠ TD bootstrap ≠ 固定 prior</text><text x="28" y="1145" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">这里只更新表格快照；没有神经训练</text></g></svg>
