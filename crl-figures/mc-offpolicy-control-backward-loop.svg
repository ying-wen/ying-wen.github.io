opacity="1">保存 b(Aₜ|Sₜ)：0.1，0.1</text><path d="M625 662L84.55 662" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M80 662L87 658.5L87 665.5Z" fill="#b65a28"/><text x="352.5" y="650" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">终止后反向处理</text><text x="22" y="703" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">t=0：未更新</text><text x="22" y="737" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">未来 B 偏离新目标 A</text><text x="365" y="703" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">t=1：G=0 · W=1</text><text x="365" y="737" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">Q=0 · C=1 · 停止</text><text x="22" y="771" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">下一版 b · S₀ · π=B</text><rect x="22" y="783" width="27.5" height="16" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="49.5" y="783" width="247.5" height="16" rx="0" fill="#e2e7eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="22" y="823" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 0.1 · B 0.9</text><text x="365" y="771" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">下一版 b · S₁ · π=A</text><rect x="365" y="783" width="299.7" height="16" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="664.7" y="783" width="33.3" height="16" rx="0" fill="#e2e7eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="365" y="823" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 0.9 · B 0.1</text><path d="M22 858L698 858" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="22" y="890" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">回合 3 · b2