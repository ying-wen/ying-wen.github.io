<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1151" viewBox="0 0 360 1151" role="img" aria-labelledby="crl-1v6jba2-title crl-1v6jba2-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1v6jba2-title">等待、补齐与尾值的参数版本</title><desc id="crl-1v6jba2-desc">原创确定性更新时序。n=2、alpha=.25、gamma=.9，轨迹A到B到C到终点T，奖励1、2、3。到达B的钟1等待；到达C的钟2先保存已选择finish，再读取Q版本0，A目标6.04、A估计2到3.01；到达T的钟3读Q版本1，更新B fast目标4.7、1到1.925；钟4不调用环境，只补齐C finish目标3、4到3.75，读Q版本2。任务已结束仍须处理等待的表项。若记录在非终止C截断，两步目标仍保留.81乘旧finish值4，得6.04；误将截断作为终止得2.8，少3.24。完整终止轨迹的普通Sarsa回报是5.23。若先把C的finish更新为3.75，再回头计算早应在钟2完成的A目标，得到5.8375，这是不同参数版本和更新时序。冻结目标推导与在线表更新需分别说明。</desc><rect width="360" height="1151" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">等待、补齐与尾值的参数版本</text><text x="28" y="82" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2-step Sarsa：选择边界动作，再更新</text><circle cx="56" cy="143" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="56" y="150" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M56 169L56 253.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M56 260L51 250L61 250Z" fill="#146ca1"/><text x="101" y="134" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">到达钟1</text><text x="101" y="166" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">已收到 R1=1</text><text x="101" y="202" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">等待第二条转移</text><circle cx="56" cy="288" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="56" y="295" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C</text><path d="M56 314L56 398.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M56 405L51 395L61 395Z" fill="#146ca1"/><text x="101" y="279" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">到达钟2</text><text x="101" y="311" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">已收到 R2=2</text><text x="101" y="347" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">A：目标 6.04</text><text x="101" y="379" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">2 → 3.01；Q⁽0⁾</text><circle cx="56" cy="433" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="56" cy="433" r="17" fill="none" stroke="#146ca1" stroke-width="1.5" opacity="1"/><text x="56" y="440" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">T</text><path d="M56 459L56 543.5" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M56 550L51 540L61 540Z" fill="#52687b"/><text x="101" y="424" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">到达钟3</text><text x="101" y="456" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">已收到 R3=3</text><text x="101" y="492" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">B：目标 4.7</text><text x="101" y="524" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1 → 1.925；Q⁽1⁾</text><circle cx="56" cy="578" r="22" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="56" y="585" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">·</text><text x="101" y="569" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">计算钟4：补齐</text><text x="101" y="601" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">不调用环境</text><text x="101" y="637" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">C：目标 3</text><text x="101" y="669" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">4 → 3.75；Q⁽2⁾</text><path d="M28 732L332 732" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="28" y="752" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">记录在 C 暂停：保留尾值</text><text x="28" y="790" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">1+.9×2+.81×4 = 6.04</text><text x="28" y="825" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">误作终止：丢掉3.24，只剩2.8</text><text x="28" y="874" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">任务在 T 终止：尾值为0</text><text x="28" y="912" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1+.9×2+.81×3 = 5.23</text><text x="28" y="964" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q 版本还决定读到哪个尾值</text><text x="28" y="1002" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">钟2：C 的 finish 仍为4</text><text x="28" y="1038" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">钟4：处理终止奖励后变为3.75</text><text x="28" y="1074" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">晚用3.75算 A：5.8375 ≠ 6.04</text><text x="28" y="1112" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">这改变了更新次序；非原来的目标</text></g></svg>
