<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1226" viewBox="0 0 360 1226" role="img" aria-labelledby="crl-r07d9j-title crl-r07d9j-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-r07d9j-title">基线控制方差，后继预测改变偏差</title><desc id="crl-r07d9j-desc">原创精确枚举，theta=.7、gamma=.5。第一面板横轴是获奖可达状态的动作无关基线，纵轴是单时刻条件方差；价值基线1−p=.331812与局部最优p=.668188用圆标记。第二面板共享方差单位，比较整回合梯度和的方差：零基线.004881、价值基线.006159、逐状态局部最优.006802；期望均为−.037289，差别包含协方差。第三面板只改变两个后继状态的critic误差差e：完整回报减MC基线的期望保持蓝虚线不变，一步TD期望沿橙线变化。e=.5时橙线为+.018139，反转真实梯度方向。终止价值为零、critic固定；不执行训练。</desc><rect width="360" height="1226" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">基线控制方差，后继预测改变偏差</text><text x="28" y="84" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">在 s1(1)：比较同一动作的局部方差</text><path d="M66 135L66 325" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M66 325L66 330" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="66" y="351" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M196 135L196 325" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M196 325L196 330" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="196" y="351" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><path d="M326 135L326 325" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M326 325L326 330" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="326" y="351" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M66 325L326 325" fill="none" stroke="#c8d6e