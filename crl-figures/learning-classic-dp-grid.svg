<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc"><title id="title">价值先算出来，策略再从价值中读出来</title><desc id="desc">真实执行同步价值迭代，显示第1、3、6轮的价值表和由当前价值提取的贪心策略。终点价值为零。</desc><style>text{font-family:system-ui,-apple-system,"Noto Sans CJK SC","PingFang SC",sans-serif} .strong{font-weight:650}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17324d"/></marker></defs><rect width="720" height="1160" fill="#ffffff"/><text x="28" y="40" font-size="26" fill="#17324d" text-anchor="start" class="strong">价值先算出来，策略再从价值中读出来</text><text x="28" y="76" font-size="20" fill="#526579" text-anchor="start" >已知 4×3 网格；灰格为墙，G 为真正终点（v(G)=0）</text><text x="28" y="107" font-size="20" fill="#526579" text-anchor="start" >进入 G 奖励 +1；其余转移 −0.04；撞墙/出界留在原格</text><text x="28" y="166" font-size="22" fill="#17324d" text-anchor="start" class="strong">同步扫描 1 轮后的 V1 与一步贪心动作</text><rect x="28" y="187" width="70" height="70" fill="hsl(204 50% 96%)" stroke="#c6d2df"/><text x="63" y="216" font-size="20" fill="#17324d" text-anchor="middle" >-0.04</text><text x="63" y="245" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="100" y="187" width="70" height="70" fill="hsl(204 50% 96%)" stroke="#c6d2df"/><text x="135" y="216" font-size="20" fill="#17324d" text-anchor="middle" >-0.04</text><text x="135" y="245" font-size="26" fill="#146a9f" text-anchor="middle" >→</text><rect x="172" y="187" width="70" height="70" fill="hsl(204 50% 74%)" stroke="#c6d2df"/><text x="207" y="216" font-size="20" fill="#17324d" text-anchor="middle" >1</text><text x="207" y="245" font-size="26" fill="#146a9f" text-anchor="middle" >→</text><rect x="244" y="187" width="70" height="70" fill="#d6ecdf" stroke="#c6d2df"/><text x="279" y="216" font-size="25" fill="#21715b" text-anchor="middle" >G</text><text x="279" y="244" font-size="20" fill="#21715b" text-anchor="middle" >v=0</text><rect x="28" y="259" width="70" height="70" fill="hsl(204 50% 96%)" stroke="#c6d2df"/><text x="63" y="288" font-size="20" fill="#17324d" text-anchor="middle" >-0.04</text><text x="63" y="317" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="100" y="259" width="70" height="70" fill="#c9ced4" stroke="#c6d2df"/><text x="135" y="301" font-size="22" fill="#526579" text-anchor="middle" >墙</text><rect x="172" y="259" width="70" height="70" fill="hsl(204 50% 96%)" stroke="#c6d2df"/><text x="207" y="288" font-size="20" fill="#17324d" text-anchor="middle" >-0.04</text><text x="207" y="317" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="244" y="259" width="70" height="70" fill="hsl(204 50% 74%)" stroke="#c6d2df"/><text x="279" y="288" font-size="20" fill="#17324d" text-anchor="middle" >1</text><text x="279" y="317" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="28" y="331" width="70" height="70" fill="hsl(204 50% 96%)" stroke="#c6d2df"/><text x="63" y="360" font-size="20" fill="#17324d" text-anchor="middle" >-0.04</text><text x="63" y="389" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="100" y="331" width="70" height="70" fill="hsl(204 50% 96%)" stroke="#c6d2df"/><text x="135" y="360" font-size="20" fill="#17324d" text-anchor="middle" >-0.04</text><text x="135" y="389" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="172" y="331" width="70" height="70" fill="hsl(204 50% 96%)" stroke="#c6d2df"/><text x="207" y="360" font-size="20" fill="#17324d" text-anchor="middle" >-0.04</text><text x="207" y="389" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="244" y="331" width="70" height="70" fill="hsl(204 50% 96%)" stroke="#c6d2df"/><text x="279" y="360" font-size="20" fill="#17324d" text-anchor="middle" >-0.04</text><text x="279" y="389" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><text x="348" y="227" font-size="21" fill="#17324d" text-anchor="start" >V₀ 全为 0。</text><text x="348" y="266" font-size="21" fill="#17324d" text-anchor="start" >只有一步能到 G 的格</text><text x="348" y="305" font-size="21" fill="#17324d" text-anchor="start" >先收到 +1。</text><text x="348" y="344" font-size="21" fill="#17324d" text-anchor="start" >远处仍主要是步成本。</text><text x="28" y="470" font-size="22" fill="#17324d" text-anchor="start" class="strong">同步扫描 3 轮后的 V3 与一步贪心动作</text><rect x="28" y="491" width="70" height="70" fill="hsl(204 50% 79.852%)" stroke="#c6d2df"/><text x="63" y="520" font-size="20" fill="#17324d" text-anchor="middle" >0.734</text><text x="63" y="549" font-size="26" fill="#146a9f" text-anchor="middle" >→</text><rect x="100" y="491" width="70" height="70" fill="hsl(204 50% 77.08%)" stroke="#c6d2df"/><text x="135" y="520" font-size="20" fill="#17324d" text-anchor="middle" >0.86</text><text x="135" y="549" font-size="26" fill="#146a9f" text-anchor="middle" >→</text><rect x="172" y="491" width="70" height="70" fill="hsl(204 50% 74%)" stroke="#c6d2df"/><text x="207" y="520" font-size="20" fill="#17324d" text-anchor="middle" >1</text><text x="207" y="549" font-size="26" fill="#146a9f" text-anchor="middle" >→</text><rect x="244" y="491" width="70" height="70" fill="#d6ecdf" stroke="#c6d2df"/><text x="279" y="520" font-size="25" fill="#21715b" text-anchor="middle" >G</text><text x="279" y="548" font-size="20" fill="#21715b" text-anchor="middle" >v=0</text><rect x="28" y="563" width="70" height="70" fill="hsl(204 50% 96%)" stroke="#c6d2df"/><text x="63" y="592" font-size="20" fill="#17324d" text-anchor="middle" >-0.108</text><text x="63" y="621" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="100" y="563" width="70" height="70" fill="#c9ced4" stroke="#c6d2df"/><text x="135" y="605" font-size="22" fill="#526579" text-anchor="middle" >墙</text><rect x="172" y="563" width="70" height="70" fill="hsl(204 50% 77.08%)" stroke="#c6d2df"/><text x="207" y="592" font-size="20" fill="#17324d" text-anchor="middle" >0.86</text><text x="207" y="621" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="244" y="563" width="70" height="70" fill="hsl(204 50% 74%)" stroke="#c6d2df"/><text x="279" y="592" font-size="20" fill="#17324d" text-anchor="middle" >1</text><text x="279" y="621" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="28" y="635" width="70" height="70" fill="hsl(204 50% 96%)" stroke="#c6d2df"/><text x="63" y="664" font-size="20" fill="#17324d" text-anchor="middle" >-0.108</text><text x="63" y="693" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="100" y="635" width="70" height="70" fill="hsl(204 50% 96%)" stroke="#c6d2df"/><text x="135" y="664" font-size="20" fill="#17324d" text-anchor="middle" >-0.108</text><text x="135" y="693" font-size="26" fill="#146a9f" text-anchor="middle" >→</text><rect x="172" y="635" width="70" height="70" fill="hsl(204 50% 79.852%)" stroke="#c6d2df"/><text x="207" y="664" font-size="20" fill="#17324d" text-anchor="middle" >0.734</text><text x="207" y="693" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="244" y="635" width="70" height="70" fill="hsl(204 50% 77.08%)" stroke="#c6d2df"/><text x="279" y="664" font-size="20" fill="#17324d" text-anchor="middle" >0.86</text><text x="279" y="693" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><text x="348" y="531" font-size="21" fill="#17324d" text-anchor="start" >非零收益继续向外传播。</text><text x="348" y="570" font-size="21" fill="#17324d" text-anchor="start" >每格都读取同一旧表，</text><text x="348" y="609" font-size="21" fill="#17324d" text-anchor="start" >不借用本轮刚改的值。</text><text x="348" y="648" font-size="21" fill="#17324d" text-anchor="start" >箭头用当前 V 做贪心。</text><text x="28" y="774" font-size="22" fill="#17324d" text-anchor="start" class="strong">同步扫描 6 轮后的 V6 与一步贪心动作</text><rect x="28" y="795" width="70" height="70" fill="hsl(204 50% 79.852%)" stroke="#c6d2df"/><text x="63" y="824" font-size="20" fill="#17324d" text-anchor="middle" >0.734</text><text x="63" y="853" font-size="26" fill="#146a9f" text-anchor="middle" >→</text><rect x="100" y="795" width="70" height="70" fill="hsl(204 50% 77.08%)" stroke="#c6d2df"/><text x="135" y="824" font-size="20" fill="#17324d" text-anchor="middle" >0.86</text><text x="135" y="853" font-size="26" fill="#146a9f" text-anchor="middle" >→</text><rect x="172" y="795" width="70" height="70" fill="hsl(204 50% 74%)" stroke="#c6d2df"/><text x="207" y="824" font-size="20" fill="#17324d" text-anchor="middle" >1</text><text x="207" y="853" font-size="26" fill="#146a9f" text-anchor="middle" >→</text><rect x="244" y="795" width="70" height="70" fill="#d6ecdf" stroke="#c6d2df"/><text x="279" y="824" font-size="25" fill="#21715b" text-anchor="middle" >G</text><text x="279" y="852" font-size="20" fill="#21715b" text-anchor="middle" >v=0</text><rect x="28" y="867" width="70" height="70" fill="hsl(204 50% 82.3468%)" stroke="#c6d2df"/><text x="63" y="896" font-size="20" fill="#17324d" text-anchor="middle" >0.621</text><text x="63" y="925" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="100" y="867" width="70" height="70" fill="#c9ced4" stroke="#c6d2df"/><text x="135" y="909" font-size="22" fill="#526579" text-anchor="middle" >墙</text><rect x="172" y="867" width="70" height="70" fill="hsl(204 50% 77.08%)" stroke="#c6d2df"/><text x="207" y="896" font-size="20" fill="#17324d" text-anchor="middle" >0.86</text><text x="207" y="925" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="244" y="867" width="70" height="70" fill="hsl(204 50% 74%)" stroke="#c6d2df"/><text x="279" y="896" font-size="20" fill="#17324d" text-anchor="middle" >1</text><text x="279" y="925" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="28" y="939" width="70" height="70" fill="hsl(204 50% 84.59212000000001%)" stroke="#c6d2df"/><text x="63" y="968" font-size="20" fill="#17324d" text-anchor="middle" >0.519</text><text x="63" y="997" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="100" y="939" width="70" height="70" fill="hsl(204 50% 82.3468%)" stroke="#c6d2df"/><text x="135" y="968" font-size="20" fill="#17324d" text-anchor="middle" >0.621</text><text x="135" y="997" font-size="26" fill="#146a9f" text-anchor="middle" >→</text><rect x="172" y="939" width="70" height="70" fill="hsl(204 50% 79.852%)" stroke="#c6d2df"/><text x="207" y="968" font-size="20" fill="#17324d" text-anchor="middle" >0.734</text><text x="207" y="997" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><rect x="244" y="939" width="70" height="70" fill="hsl(204 50% 77.08%)" stroke="#c6d2df"/><text x="279" y="968" font-size="20" fill="#17324d" text-anchor="middle" >0.86</text><text x="279" y="997" font-size="26" fill="#146a9f" text-anchor="middle" >↑</text><text x="348" y="835" font-size="21" fill="#17324d" text-anchor="start" >6 轮后 Bellman 残差为 0。</text><text x="348" y="874" font-size="21" fill="#17324d" text-anchor="start" >左下角最短需要 5 步：</text><text x="348" y="913" font-size="21" fill="#146a9f" text-anchor="start" >V = 0.51854</text><text x="348" y="952" font-size="21" fill="#17324d" text-anchor="start" >箭头不是事先手画路径。</text><text x="28" y="1100" font-size="20" fill="#526579" text-anchor="start" >γ=0.9 · 10 个非终止格 × 6 轮 = 60 次状态备份</text><text x="28" y="1132" font-size="19" fill="#526579" text-anchor="start" >真实交互 0；模型计算图。并列固定按 ↑→↓← 选；无需种子。</text></svg>
