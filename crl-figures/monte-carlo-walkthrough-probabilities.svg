<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="crl-4np8l0-title crl-4np8l0-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-4np8l0-title">旧经验需要旧行为概率</title><desc id="crl-4np8l0-desc">固定目标策略不变，旧AA轨迹在行为A概率0.5、0.5下采集；之后仅当前S1行为A概率改为0.25。蓝色用保存的采样分母，第二比率1.5，轨迹权重2.25，普通IS校正回报9。红色误用当前分母，第二比率3，权重4.5，校正回报18。观察到的奖励和目标策略相同；改变分母使它失去旧采样分布的概率比含义。</desc><rect width="720" height="470" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧经验需要旧行为概率</text><text x="22" y="84" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">已收集 AA：R₁=2，R₂=4，G₀=4</text><text x="22" y="121" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">π(A)=0.75；S₀ 的分母仍为 0.5</text><text x="28" y="185" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">保存采样记录</text><text x="28" y="228" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">S₁：分母使用的动作概率</text><rect x="28" y="243" width="151" height="24" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="179" y="243" width="151" height="24" rx="0" fill="#dce5ec" stroke="none" stroke-width="1.5" opacity="1"/><text x="103.5" y="294" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A 0.5</text><text x="254.5" y="294" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">B 0.5</text><path d="M179 312L179 343.8" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M179 349L175 341L183 341Z" fill="#146ca1"/><text x="179" y="381" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">ρ = 1.5 × 1.5 = 2.25</text><text x="179" y="420" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">ρG₀ = 9</text><path d="M360 175L360 458" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="390" y="185" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">误换成当前行为</text><text x="390" y="228" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">S₁：分母使用的动作概率</text><rect x="390" y="243" width="75.5" height="24" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="465.5" y="243" width="226.5" height="24" rx="0" fill="#dce5ec" stroke="none" stroke-width="1.5" opacity="1"/><text x="427.75" y="294" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A 0.25</text><text x="578.75" y="294" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">B 0.75</text><path d="M541 312L541 343.8" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M541 349L537 341L545 341Z" fill="#b54142"/><text x="541" y="381" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">ρ = 1.5 × 3 = 4.5</text><text x="541" y="420" font-size="22" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">ρG₀ = 18</text></g></svg>
