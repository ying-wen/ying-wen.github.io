<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1167" viewBox="0 0 720 1167" role="img" aria-labelledby="title desc"><title id="title">哪些条件可以独立放松？</title><desc id="desc">五行分别比较观察权限、外部重置、经验回放、世界是否等待计算、任务标签。每一行可独立选择，不形成互斥类别，也不把右侧全部规定为持续学习的必要条件。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif}</style><rect width="720" height="1167" fill="white"/><text x="28" y="42" font-size="26" fill="#19354e">哪些条件可以独立放松？</text><text x="28" y="80" font-size="20" fill="#52687b">每一行是一项选择，可以跨行组合。</text><text x="160" y="122" font-size="22" fill="#146ca1">额外提供的条件</text><text x="449" y="122" font-size="22" fill="#b65a28">撤去该条件</text><line x1="28" y1="148" x2="692" y2="148" stroke="#ccd8e1"/><text x="28" y="190" font-size="19" fill="#19354e">观察</text><path d="M365 226L419 226" fill="none" stroke="#52687b" stroke-width="3" /><path d="M411 220L419 226L411 232" fill="none" stroke="#52687b" stroke-width="3" transform="rotate(0 419 226)"/><line x1="28" y1="334" x2="692" y2="334" stroke="#ccd8e1"/><text x="28" y="376" font-size="19" fill="#19354e">重新开始</text><path d="M365 412L419 412" fill="none" stroke="#52687b" stroke-width="3" /><path d="M411 406L419 412L411 418" fill="none" stroke="#52687b" stroke-width="3" transform="rotate(0 419 412)"/><line x1="28" y1="520" x2="692" y2="520" stroke="#ccd8e1"/><text x="28" y="562" font-size="19" fill="#19354e">旧经验</text><path d="M365 598L419 598" fill="none" stroke="#52687b" stroke-width="3" /><path d="M411 592L419 598L411 604" fill="none" stroke="#52687b" stroke-width="3" transform="rotate(0 419 598)"/><line x1="28" y1="706" x2="692" y2="706" stroke="#ccd8e1"/><text x="28" y="748" font-size="19" fill="#19354e">计算时间</text><path d="M365 784L419 784" fill="none" stroke="#52687b" stroke-width="3" /><path d="M411 778L419 784L411 790" fill="none" stroke="#52687b" stroke-width="3" transform="rotate(0 419 784)"/><line x1="28" y1="892" x2="692" y2="892" stroke="#ccd8e1"/><text x="28" y="934" font-size="19" fill="#19354e">任务标识</text><path d="M365 970L419 970" fill="none" stroke="#52687b" stroke-width="3" /><path d="M411 964L419 970L411 976" fill="none" stroke="#52687b" stroke-width="3" transform="rotate(0 419 970)"/><rect x="151" y="174" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="181" y="174" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="211" y="174" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="241" y="174" width="28" height="28" rx="3" fill="#698394" stroke="#819aab"/><rect x="271" y="174" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="151" y="204" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="181" y="204" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="211" y="204" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="241" y="204" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="271" y="204" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="151" y="234" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="181" y="234" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="211" y="234" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="241" y="234" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="271" y="234" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><circle cx="195" cy="218" r="8" fill="#146ca1"/><path d="M279 188h12m-6 -6v12" stroke="#258375" stroke-width="3"/><rect x="444" y="174" width="28" height="28" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="474" y="174" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="504" y="174" width="28" height="28" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="534" y="174" width="28" height="28" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="564" y="174" width="28" height="28" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="444" y="204" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="474" y="204" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="504" y="204" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="534" y="204" width="28" height="28" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="564" y="204" width="28" height="28" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="444" y="234" width="28" height="28" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="474" y="234" width="28" height="28" rx="3" fill="#fff" stroke="#819aab"/><rect x="504" y="234" width="28" height="28" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="534" y="234" width="28" height="28" rx="3" fill="#bfcbd2" stroke="#819aab"/><rect x="564" y="234" width="28" height="28" rx="3" fill="#bfcbd2" stroke="#819aab"/><circle cx="488" cy="218" r="8" fill="#146ca1"/><text x="155" y="301" font-size="18" fill="#19354e">状态可见</text><text x="449" y="301" font-size="18" fill="#19354e">观测 + 记忆</text><circle cx="163" cy="386" r="6" fill="#146ca1"/><path d="M174 386L302 386" fill="none" stroke="#258375" stroke-width="3" /><path d="M294 380L302 386L294 392" fill="none" stroke="#258375" stroke-width="3" transform="rotate(0 302 386)"/><circle cx="163" cy="413" r="6" fill="#146ca1"/><path d="M174 413L302 413" fill="none" stroke="#258375" stroke-width="3" /><path d="M294 407L302 413L294 419" fill="none" stroke="#258375" stroke-width="3" transform="rotate(0 302 413)"/><circle cx="163" cy="440" r="6" fill="#146ca1"/><path d="M174 440L302 440" fill="none" stroke="#258375" stroke-width="3" /><path d="M294 434L302 440L294 446" fill="none" stroke="#258375" stroke-width="3" transform="rotate(0 302 440)"/><path d="M166 375C145 361 133 388 155 389" fill="none" stroke="#146ca1" stroke-width="3"/><path d="M454 391H587V421H473V451H597" fill="none" stroke="#b65a28" stroke-width="5"/><circle cx="454" cy="391" r="12" fill="#146ca1"/><circle cx="597" cy="451" r="12" fill="#b65a28"/><text x="151" y="490" font-size="18" fill="#19354e">可请求重置</text><text x="448" y="490" font-size="17" fill="#19354e">single-life：无外部重置</text><rect x="154" y="568" width="46" height="57" rx="4" fill="#edf5fa" stroke="#146ca1"/><circle cx="174" cy="596" r="5" fill="#146ca1"/><rect x="178" y="578" width="46" height="57" rx="4" fill="#edf5fa" stroke="#146ca1"/><circle cx="198" cy="606" r="5" fill="#146ca1"/><rect x="202" y="568" width="46" height="57" rx="4" fill="#edf5fa" stroke="#146ca1"/><circle cx="222" cy="596" r="5" fill="#146ca1"/><rect x="226" y="578" width="46" height="57" rx="4" fill="#edf5fa" stroke="#146ca1"/><circle cx="246" cy="606" r="5" fill="#146ca1"/><rect x="250" y="568" width="46" height="57" rx="4" fill="#edf5fa" stroke="#146ca1"/><circle cx="270" cy="596" r="5" fill="#146ca1"/><path d="M283 575C323 538 347 633 289 633" fill="none" stroke="#146ca1" stroke-width="3"/><rect x="449" y="611" width="20" height="9" fill="#258375" opacity="0.25"/><rect x="480" y="602" width="20" height="18" fill="#258375" opacity="0.4"/><rect x="511" y="593" width="20" height="27" fill="#258375" opacity="0.55"/><rect x="542" y="584" width="20" height="36" fill="#258375" opacity="0.7"/><rect x="573" y="575" width="20" height="45" fill="#258375" opacity="0.85"/><path d="M439 565L620 565" fill="none" stroke="#b65a28" stroke-width="3" /><path d="M612 559L620 565L612 571" fill="none" stroke="#b65a28" stroke-width="3" transform="rotate(0 620 565)"/><text x="151" y="679" font-size="17" fill="#19354e">可抽取旧 transition</text><text x="448" y="650" font-size="17" fill="#19354e">当前 transition → 统计量</text><text x="448" y="679" font-size="17" fill="#19354e">严格流式：不回放旧样本</text><circle cx="205" cy="780" r="32" fill="white" stroke="#146ca1" stroke-width="3"/><path d="M196 765v30m17 -30v30" stroke="#146ca1" stroke-width="6"/><circle cx="497" cy="780" r="32" fill="white" stroke="#b65a28" stroke-width="3"/><path d="M497 757v24l18 10" fill="none" stroke="#b65a28" stroke-width="3"/><rect x="254" y="763" width="18" height="32" rx="20" fill="#e5f2ee" stroke="#b7cad7" stroke-width="2"/><rect x="551" y="763" width="18" height="32" rx="20" fill="#fff1df" stroke="#b7cad7" stroke-width="2"/><rect x="279" y="763" width="18" height="32" rx="20" fill="#e5f2ee" stroke="#b7cad7" stroke-width="2"/><rect x="576" y="763" width="18" height="32" rx="20" fill="#fff1df" stroke="#b7cad7" stroke-width="2"/><rect x="304" y="763" width="18" height="32" rx="20" fill="#e5f2ee" stroke="#b7cad7" stroke-width="2"/><rect x="601" y="763" width="18" height="32" rx="20" fill="#fff1df" stroke="#b7cad7" stroke-width="2"/><text x="151" y="855" font-size="18" fill="#19354e">世界等待计算</text><text x="448" y="855" font-size="18" fill="#19354e">世界在计算期间继续</text><rect x="151" y="937" width="48" height="53" rx="20" fill="#eaf3f9" stroke="#b7cad7" stroke-width="2"/><text x="166" y="970" font-size="22" fill="#19354e">A</text><rect x="207" y="937" width="48" height="53" rx="20" fill="#fff1df" stroke="#b7cad7" stroke-width="2"/><text x="222" y="970" font-size="22" fill="#19354e">B</text><rect x="263" y="937" width="48" height="53" rx="20" fill="#eaf3f9" stroke="#b7cad7" stroke-width="2"/><text x="278" y="970" font-size="22" fill="#19354e">A</text><circle cx="470" cy="964" r="13" fill="#258375"/><text x="463" y="972" font-size="19" fill="white">1</text><circle cx="530" cy="964" r="13" fill="#b65a28"/><text x="523" y="972" font-size="19" fill="white">0</text><circle cx="590" cy="964" r="13" fill="#258375"/><text x="583" y="972" font-size="19" fill="white">1</text><text x="151" y="1036" font-size="18" fill="#19354e">任务 ID 已知</text><text x="448" y="1006" font-size="17" fill="#52687b">经验中的奖励</text><text x="448" y="1036" font-size="18" fill="#19354e">从后果推断变化</text><text x="28" y="1100" font-size="19" fill="#146ca1">评价还需另选：最终冻结能力，或整个学习过程的收益。</text><text x="28" y="1138" font-size="19" fill="#52687b">CRL 可以采用不同组合；右列不是统一的必要条件。</text></svg>
