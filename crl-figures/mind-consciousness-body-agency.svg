<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">所有权感与施动感的交叉分离</title>
  <desc id="desc">同步运动的橡胶手实验改变主动或被动运动，以及手的姿态一致或不一致。四个条件中，所有权感和施动感可以分离；图仅展示问卷均值的定性模式，不表示效应大小或每个人都会如此。</desc>
  <rect width="960" height="650" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172c45">
    <text x="36" y="47" font-size="27" font-weight="700">“属于我”与“由我控制”可以分开</text>
    <text x="36" y="79" font-size="18" fill="#52647b">Kalckert 与 Ehrsson（2012）· 实验流程示意，非原论文数据</text>
    <text x="324" y="129" text-anchor="middle" font-size="22" font-weight="700">橡胶手姿态一致</text>
    <text x="724" y="129" text-anchor="middle" font-size="22" font-weight="700">橡胶手姿态不一致</text>
    <text x="27" y="224" font-size="22" font-weight="700">主动</text><text x="27" y="255" font-size="22" font-weight="700">运动</text>
    <text x="27" y="420" font-size="22" font-weight="700">被动</text><text x="27" y="451" font-size="22" font-weight="700">运动</text>
    <rect x="132" y="150" width="384" height="172" rx="12" fill="#e6edf7"/>
    <rect x="532" y="150" width="384" height="172" rx="12" fill="#edf3ef"/>
    <rect x="132" y="345" width="384" height="172" rx="12" fill="#fff0de"/>
    <rect x="532" y="345" width="384" height="172" rx="12" fill="#edf0f4"/>
    <g text-anchor="middle" font-size="22">
      <text x="324" y="191" fill="#52647b" font-size="18">自己运动 · 姿态符合身体</text>
      <text x="324" y="239" fill="#234f82" font-weight="700">所有权感：有</text>
      <text x="324" y="277" fill="#306341" font-weight="700">施动感：有</text>
      <text x="724" y="191" fill="#52647b" font-size="18">自己运动 · 姿态不符合身体</text>
      <text x="724" y="239">所有权感：无</text>
      <text x="724" y="277" fill="#306341" font-weight="700">施动感：有</text>
      <text x="324" y="386" fill="#52647b" font-size="18">被动带动 · 姿态符合身体</text>
      <text x="324" y="434" fill="#234f82" font-weight="700">所有权感：有</text>
      <text x="324" y="472">施动感：无</text>
      <text x="724" y="386" fill="#52647b" font-size="18">被动带动 · 姿态不符合身体</text>
      <text x="724" y="434">所有权感：无</text>
      <text x="724" y="472">施动感：无</text>
    </g>
    <text x="480" y="558" text-anchor="middle" font-size="21" font-weight="700">共同条件：真实食指与橡胶食指同步运动</text>
    <text x="480" y="595" text-anchor="middle" font-size="18" fill="#52647b">“有／无”概括条件均值的定性模式，不是二元诊断或效应量。</text>
    <text x="480" y="624" text-anchor="middle" font-size="18" fill="#7b4b24">可分离不等于互不影响；这也不是自由意志或一般意识的测试。</text>
  </g>
</svg>
