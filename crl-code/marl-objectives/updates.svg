<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img">
<title>Same payoff, different policy update order</title>
<rect width="760" height="370" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="14" fill="#20394c">
<text x="80" y="28" font-size="18">Same payoff, different policy update order</text>
<path d="M 80 288.0 H 700" stroke="#dee6eb"/>
<text x="68" y="293.0" text-anchor="end">0</text>
<path d="M 80 230.5 H 700" stroke="#dee6eb"/>
<text x="68" y="235.5" text-anchor="end">0.25</text>
<path d="M 80 173.0 H 700" stroke="#dee6eb"/>
<text x="68" y="178.0" text-anchor="end">0.5</text>
<path d="M 80 115.5 H 700" stroke="#dee6eb"/>
<text x="68" y="120.5" text-anchor="end">0.75</text>
<path d="M 80 58.0 H 700" stroke="#dee6eb"/>
<text x="68" y="63.0" text-anchor="end">1</text>
<text x="80.0" y="310" text-anchor="middle">0</text>
<text x="235.0" y="310" text-anchor="middle">2</text>
<text x="390.0" y="310" text-anchor="middle">4</text>
<text x="545.0" y="310" text-anchor="middle">6</text>
<text x="700.0" y="310" text-anchor="middle">8</text>
<polyline points="80.000,288.000 157.500,288.000 235.000,288.000 312.500,288.000 390.000,288.000 467.500,288.000 545.000,288.000 622.500,288.000 700.000,288.000" fill="none" stroke="#245a81" stroke-width="2.5"/>
<text x="80" y="355" fill="#245a81">simultaneous</text>
<polyline points="80.000,288.000 157.500,58.000 235.000,58.000 312.500,58.000 390.000,58.000 467.500,58.000 545.000,58.000 622.500,58.000 700.000,58.000" fill="none" stroke="#a44725" stroke-width="2.5"/>
<text x="300" y="355" fill="#a44725">sequential</text>
<text x="390" y="330" text-anchor="middle">Update round</text>
<text x="18" y="175" transform="rotate(-90 18 175)" text-anchor="middle">Team reward</text>
</g></svg>