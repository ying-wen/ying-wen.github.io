<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1133" viewBox="0 0 360 1133" role="img" aria-labelledby="crl-rgihc4-title crl-rgihc4-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-rgihc4-title">重复访问留下三个后缀</title><desc id="crl-rgihc4-desc">一个新的 proper episodic 单状态任务：A每次奖励1，然后以1/2概率返回S、1/2概率真实终止；B奖励0并终止。行为在每步以1/2概率选A。动作均匀数0.1,0.2,0.3及转移均匀数0.8,0.7,0.2实际生成AAA后终止，这条轨迹概率1/64。三个(S,A)回报为3,2,1；普通首次访问纳入t=0，普通每次访问均值2。反向every-visit weighted-IS控制纳入t=2,1,0，权重1,2,4，C=1,3,7，Q(A)=1,5/3,17/7。条长正比于进入当前更新的W。三份回报属于同一回合、相关；图为原创机制计算，不是三个独立回合或学习曲线。</desc><rect width="360" height="1133" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">重复访问留下三个后缀</text><text x="22" y="81" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">同一回合三次 (S,A) · γ=1</text><circle cx="76" cy="130" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="76" y="136" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><text x="118" y="125" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">t=0 · G=3</text><path d="M76 153L76 222.45" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M76 227L72.5 220L79.5 220Z" fill="#146ca1"/><text x="104" y="198" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">A / r=1</text><circle cx="76" cy="250" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="76" y="256" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><text x="118" y="245" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">t=1 · G=2</text><path d="M76 273L76 342.45" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M76 347L72.5 340L79.5 340Z" fill="#146ca1"/><text x="104" y="318" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">A / r=1</text><circle cx="76" cy="370" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="76" y="376" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><text x="118" y="365" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">t=2 · G=1</text><path d="M76 393L76 462.45" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M76 467L72.5 460L79.5 460Z" fill="#146ca1"/><text x="104" y="438" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">A / r=1</text><circle cx="76" cy="490" r="21" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><circle cx="76" cy="490" r="16" fill="none" stroke="#19354e" stroke-width="2" opacity="1"/><text x="76" y="496" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">终</text><text x="22" y="565" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">反向纳入顺序：t=2 → 1 → 0</text><text x="22" y="627" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">t=2</text><rect x="84" y="608" width="50" height="22" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="144" y="627" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">W=1</text><text x="22" y="661" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">G=1 · C=1 · Q(A)=1</text><text x="22" y="741" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">t=1</text><rect x="84" y="722" width="100" height="22" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="194" y="741" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">W=2</text><text x="22" y="775" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">G=2 · C=3 · Q(A)=5/3</text><text x="22" y="855" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">t=0</text><rect x="84" y="836" width="200" height="22" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="294" y="855" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">W=4</text><text x="22" y="889" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">G=3 · C=7 · Q(A)=17/7</text><path d="M22 967L338 967" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="22" y="1002" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">首次访问：t=0，取 G₀=3</text><text x="22" y="1034" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">每次访问：(3+2+1)/3=2</text><text x="22" y="1066" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">加权控制：(4×3+2×2+1×1)/7</text><text x="22" y="1098" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">= 17/7；C=7 是权重和</text></g></svg>
