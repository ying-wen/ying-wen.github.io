<svg xmlns="http://www.w3.org/2000/svg" width="720" height="744" viewBox="0 0 720 744" role="img" aria-labelledby="crl-1g0ran0-title crl-1g0ran0-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1g0ran0-title">同一分岔的两种可获取经验</title><desc id="crl-1g0ran0-desc">原创有限任务规则图。智能体在J，Theta表示补给侧L或R，先验各半且全程固定。图中两条实际路径尽头遮住，不泄漏哪边是G。读固定路标或独立噪声屏幕均在J花1原始步、奖励0；路标-1表示左、+1表示右，屏幕符号与Theta独立。选路花1步，正确当步奖励1到G，G每步继续领取1且不终止；错误当步奖励0到D，并由观测知道Theta，随后再花4个0奖励恢复步回J。恢复圆点每个是一原始步，回J后选路仍要再花一步。评价H6步没有免费reset。</desc><rect width="720" height="744" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一分岔的两种可获取经验</text><text x="28" y="83" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">行动前：哪侧有补给仍被遮住</text><path d="M128 156L360 278" fill="none" stroke="#e9eef2" stroke-width="24" stroke-linecap="round" opacity="1"/><path d="M592 156L360 278" fill="none" stroke="#e9eef2" stroke-width="24" stroke-linecap="round" opacity="1"/><path d="M341 253L154.0586 180.3544" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M148 178L159.132 176.9617L155.5099 186.2826Z" fill="#b65a28"/><path d="M379 253L565.9414 180.3544" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M572 178L564.4901 186.2826L560.868 176.9617Z" fill="#b65a28"/><rect x="98" y="125" width="60" height="60" rx="3" fill="#dce2e7" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="128" y="164" font-size="28" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><text x="128" y="111" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">左 L</text><rect x="562" y="125" width="60" height="60" rx="3" fill="#dce2e7" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="592" y="164" font-size="28" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><text x="592" y="111" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">右 R</text><circle cx="360" cy="278" r="16" fill="#146ca1" stroke="#ffffff" stroke-width="2.5" opacity="1"/><text x="360" y="318" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">分岔 J</text><text x="360" y="211" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">各 1/2</text><text x="28" y="346" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">在 J 读标或看屏：各花 1 步，奖励 0</text><path d="M195 413L195 450" fill="none" stroke="#52687b" stroke-width="5" stroke-linecap="round" opacity="1"/><rect x="155" y="373" width="80" height="42" rx="2" fill="#e4f1ed" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="195" y="402" font-size="26" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">?</text><rect x="484" y="371" width="82" height="49" rx="6" fill="#eef1f5" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="525" y="403" font-size="26" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">−  +</text><path d="M512 426L538 426" fill="none" stroke="#52687b" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="195" y="475" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">固定路标</text><text x="525" y="475" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">独立重抽的屏幕</text><text x="195" y="508" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">−1 左 / +1 右</text><text x="525" y="508" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">±1 各半</text><circle cx="64" cy="589" r="24" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="64" y="596" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">G</text><path d="M83 574 C158 539 158 639 99 617" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round"/><path d="M99 617L87.0358 607.2791" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M83 604L91.7313 605.9403L86.6865 612.1492Z" fill="#258375"/><text x="166" y="596" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">每步奖励 +1</text><text x="28" y="650" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">选对当步 +1 到 G；G 不终止</text><circle cx="424" cy="589" r="24" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><text x="424" y="596" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">D</text><text x="402" y="549" font-size="16" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">走错：当步 0，随即知道正确侧</text><path d="M449 589L658 589" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="472" cy="589" r="6" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><text x="472" y="620" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="516" cy="589" r="6" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><text x="516" y="620" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="560" cy="589" r="6" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><text x="560" y="620" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="604" cy="589" r="6" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><text x="604" y="620" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="676" cy="589" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="676" y="596" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">J</text><text x="402" y="654" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">再花 4 个恢复步回 J</text><text x="28" y="708" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">H=6 只截取评价；没有 reset 操作</text></g></svg>
