<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1418" viewBox="0 0 360 1418" role="img" aria-labelledby="crl-eh8ulw-title crl-eh8ulw-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-eh8ulw-title">旧经验为什么得到新标签</title><desc id="crl-eh8ulw-desc">三个面板使用同一条经验：当前输入1，动作L，奖励0，后继输入2，未终止。蓝柱是在线后继价值，紫柱是目标后继价值，所有柱统一每价值单位47像素。橙色环按在线网络选择L或R，Double读取目标网相同动作的值，普通DQN读取目标网的最大值。一次在线更新后目标未变，但Double选择从R改L，标签1变1/2；硬复制后两种标签均为27/32。</desc><rect width="360" height="1418" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧经验为什么得到新标签</text><text x="24" y="76" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">经验不变；γ=1/2；柱高=后继价值</text><text x="20" y="124" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">① 更新前</text><text x="20" y="172" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">在线 Qθ</text><path d="M33 314L177 314" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="48" y="267" width="36" height="47" rx="0" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="0.78"/><text x="66" y="255" font-size="17" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="66" y="340" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><rect x="122" y="220" width="36" height="94" rx="0" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="0.78"/><text x="140" y="208" font-size="17" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="140" y="340" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><circle cx="140" cy="333" r="18" fill="none" stroke="#b65a28" stroke-width="2.5" opacity="1"/><text x="20" y="375" font-size="17" fill="#b65a2