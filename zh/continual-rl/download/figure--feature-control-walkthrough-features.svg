<svg xmlns="http://www.w3.org/2000/svg" width="720" height="851" viewBox="0 0 720 851" role="img" aria-labelledby="crl-51iab-title crl-51iab-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-51iab-title">特征图决定一次更新扩散到哪里</title><desc id="crl-51iab-desc">原创精确算例。走廊A继续得2到B，B继续得负1到终止T，A退出得0到T，gamma1，真实动作值A继续1、退出0，B继续负1。完整任务只供读者分析，学习器每步只见实际状态动作奖励后继。特征坐标A=.30、B=.60，格宽.5，两套tiling按floor(s/.5+k/2)编号，A与B只共享tiling1的tile1。三种3维单位范数特征的内积分别0、.5、1；颜色方块表示活动分量，normalized tile的非零分量是1/sqrt2。此图显示真实特征支持与动作分块，无经验训练曲线。</desc><rect width="720" height="851" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">特征图决定一次更新扩散到哪里</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一走廊；读者的完整任务视图</text><circle cx="82" cy="146" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="82" y="153" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="330" cy="146" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="330" y="153" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="576" cy="146" r="20" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="576" cy="146" r="15" fill="none" stroke="#52687b" stroke-width="2" opacity="1"/><text x="576" y="153" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">T</text><path d="M105 146L300.5 146" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M307 146L297 151L297 141Z" fill="#146ca1"/><text x="206" y="126" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">+2</text><path d="M353 146L546.5 146" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M553 146L543 151L543 141Z" fill="#146ca1"/><text x="453" y="126" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">−1</text><path d="M82 169L82 214.5" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M82 221L77 211L87 211Z" fill="#b65a28"/><circle cx="82" cy="246" r="20" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="82" cy="246" r="15" fill="none" stroke="#52687b" stroke-width="2" opacity="1"/><text x="82" y="253" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="112" y="196" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">退出：0</text><text x="329" y="215" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">γ=1；T 真正终止</text><text x="329" y="249" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">真值 A:(1,0)</text><text x="329" y="281" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">真值 B:−1</text><text x="28" y="327" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">学习器只收到所选动作的后果</text><text x="28" y="359" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">下面横轴是特征坐标，不是额外状态</text><text x="28" y="396" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">tiling 0</text><rect x="28" y="410" width="332" height="28" rx="0" fill="#d8e9f4" stroke="#52687b" stroke-width="1.5" opacity="1"/><rect x="360" y="410" width="332" height="28" rx="0" fill="#e5e2f0" stroke="#52687b" stroke-width="1.5" opacity="1"/><path d="M227.2 405L227.2 443" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M426.4 405L426.4 443" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="