0" opacity="1">¬A：一秒内完全不按</text><g transform="translate(24,643)"><path d="M15 30L15 50" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="15" y="78" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M109 30L109 50" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="109" y="78" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M203 30L203 50" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="203" y="78" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M297 30L297 50" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="297" y="78" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M15 40L297 40" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="19" y="32" width="86" height="16" rx="2" fill="#f6e7d4" stroke="none" stroke-width="1.5" opacity="1"/><path d="M47.9 17L47.9 30" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="62" y="1" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">有按压</text><rect x="113" y="32" width="86" height="16" rx="2" fill="#e6edf3" stroke="none" stroke-width="1.5" opacity="1"/><text x="156" y="1" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">无按压</text><rect x="207" y="32" width="86" height="16" rx="2" fill="#f6e7d4" stroke="none" stroke-width="1.5" opacity="1"/><path d="M235.9 17L235.9 30" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="250" y="1" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">有按压</text><text x="156" y="114" font-size="16" fill="#52687b" text-anchor="middle" font