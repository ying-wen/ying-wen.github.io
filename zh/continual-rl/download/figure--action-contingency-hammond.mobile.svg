<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1550" viewBox="0 0 360 1550" role="img" aria-labelledby="crl-q4txqb-title crl-q4txqb-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-q4txqb-title">关系降级时，按压后仍有水</title><desc id="crl-q4txqb-desc">依据 Hammond 1980 实验I独立绘制。未给动物提示的一秒窗口按是否至少按压一次分类，窗口末按预设条件概率投水。完成预训练后，从 .05/0 十四次切至 .05/.05 十八次，再恢复 .05/0 十七次，再降级十八次。所有阶段均有水反馈，不含另行无水的消退测试。图中一次投水只是装置能力示意，不代表该秒必然投水。阶段框宽度不代表历时。</desc><rect width="360" height="1550" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="37" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">关系降级时，按压后仍有水</text><text x="24" y="83" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一杠杆；水仍可在窗口末出现</text><g transform="translate(24,114)"><rect x="0" y="0" width="312" height="148" rx="4" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M0 147L312 147" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M8 148L15 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M24 148L31 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M40 148L47 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M56 148L63 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M72 148L79 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M88 148L95 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M104 148L111 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M120 148L127 155" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M136 148L143 155" fill="non