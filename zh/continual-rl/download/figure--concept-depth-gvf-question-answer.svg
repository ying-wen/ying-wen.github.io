<svg xmlns="http://www.w3.org/2000/svg" width="720" height="645" viewBox="0 0 720 645" role="img" aria-labelledby="crl-eali0t-title crl-eali0t-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-eali0t-title">同一经验，回答不同问题</title><desc id="crl-eali0t-desc">确定性右路能耗依次1、2、1，到达指示0、0、1。设计者指定策略沿右路和延续1、1、0。完整样本以MC步长1把起点的能耗答案改为4、到达答案改为1。左路的独立经验给能耗2、到达1。任务奖励每步为5倍到达减能耗，两路线总回报为3和1，因此选择左路。问题规格没有被这个答案更新自动发现。</desc><rect width="720" height="645" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一经验，回答不同问题</text><g transform="translate(28,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 同一段右路经验</text><circle cx="18" cy="75" r="16" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="18" y="82" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><path d="M37 75L201.8333 75" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M208.3333 75L198.3333 80L198.3333 70Z" fill="#146ca1"/><text x="122.6667" y="50" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">E=1</text><text x="122.6667" y="117" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">R=-1</text><circle cx="227.3333" cy="75" r="16" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="227.3333" y="82" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M246.3333 75L411.1667 75" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M417.6667 75L407.6667 80L407.6667 70Z" fill="#146ca1"/><text x="332" y="50" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">E=