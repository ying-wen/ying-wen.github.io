<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1178" viewBox="0 0 360 1178" role="img" aria-labelledby="crl-12ap0rm-title crl-12ap0rm-desc" data-crl-visual="v1" data-evidence-kind="measured"><title id="crl-12ap0rm-title">从轨迹样本恢复梯度</title><desc id="crl-12ap0rm-desc">原创精确概率与实际抽样结果。两步任务theta=.7、gamma=.5，目标动作1概率sigmoid(.7)，行为动作1概率.25。上方并列条是四条路径在两种策略下的精确概率。下方是Python标准库独立随机流seed2026与2027产生的20000个回合，自第10回合起画累计梯度均值，横轴为对数尺度，不平滑。蓝线使用目标策略数据，紫线和橙线使用同一批行为数据，分别用完整轨迹比率和错误的单动作比率。黑虚线是解析梯度−.037289；单动作比率的精确期望为+.055428。单种子抽样用于检查估计器，不是训练效果或比较算法性能。</desc><rect width="360" height="1178" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">从轨迹样本恢复梯度</text><text x="28" y="85" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一任务，换策略就改变轨迹频率</text><path d="M28 116L50 116" fill="none" stroke="#146ca1" stroke-width="5" stroke-linecap="round" opacity="1"/><text x="60" y="122" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">目标 π：p = 0.668</text><path d="M28 148L50 148" fill="none" stroke="#7854a2" stroke-width="5" stroke-linecap="round" opacity="1"/><text x="60" y="154" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">行为 b：p = 0.25</text><path d="M65 394L325 394" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M60 394L65 394" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="55" y="399" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M65 330.6667L325 330.6667" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M60 330.6667L65 330.6667" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="55" y="335.6667" font-size="16" fi