<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1044" viewBox="0 0 360 1044" role="img" aria-labelledby="crl-996yal-title crl-996yal-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-996yal-title">同样值得，却不是预期的结果</title><desc id="crl-996yal-desc">上部是Stalnaker等2019气味引导选择任务的原创建模示意：两个食槽，保持三滴数量而把葡萄味换成热带水果味。下部独立教学模型指定每滴两味效用同为1，价值误差0，结果身份计数误差为负3、正3。这些向量不是神经记录。</desc><rect width="360" height="1044" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="38" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同样值得，却不是预期的结果</text><g transform="translate(24,91)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 气味引导的选择</text><path d="M0 18L312 18" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="8" y="42" width="296" height="172" rx="12" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="156" cy="76" r="14" fill="#f5f8fb" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="156" y="112" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">闻气味</text><path d="M45,180 Q67,206 89,180 Z" fill="#ffffff" stroke="#52687b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="57" cy="177" r="5" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="1"/><circle cx="67" cy="177" r="5" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="1"/><circle cx="77" cy="177" r="5" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M223,180 Q245,206 267,180 Z" fill="#ffffff" stroke="#52687b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="235" cy="177" r="5" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><circle cx="245" cy="177" r="5" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><circle cx="255" cy="177" r="5" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><g transform="translate(156,166)"><g transform="scale(0.75)"><ellipse cx="0" cy="0" rx="26" ry="15" fill="#f5f8fb" stroke="#52687b" stroke-width="2"/><circle cx="23" cy="-5" r="13" fill="#f5f8fb" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="18" cy="-16" r="6" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="29" cy="-7" r="2" fill="#19354e" stroke="none" stroke-width="2" opacity="1"/><path d="M-25,1 C-48,-12 -53,19 -68,9" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 -2L44 -6" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M35 0L44 4" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/></g></g><path d="M134 143L94.0077 159.5186" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M88 162L95.3338 153.5611L99.1514 162.8037Z" fill="#146ca1"/><path d="M178 143L217.9923 159.5186" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M224 162L212.8486 162.8037L216.6662 153.5611Z" fill="#146ca1"/><text x="67" y="242" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">左食槽</text><text x="245" y="242" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">右食槽</text><text x="156" y="281" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">气味指定这一试次去哪边</text></g><g transform="translate(24,414)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 只改变结果身份</text><path d="M0 18L312 18" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="0" y="65" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">原来</text><text x="0" y="155" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">换味</text><path d="M95,44 C80,61 87,71 95,71 C103,71 110,61 95,44 Z" fill="#7854a2" stroke="#7854a2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M159,44 C144,61 151,71 159,71 C167,71 174,61 159,44 Z" fill="#7854a2" stroke="#7854a2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M223,44 C208,61 215,71 223,71 C231,71 238,61 223,44 Z" fill="#7854a2" stroke="#7854a2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M95,134 C80,151 87,161 95,161 C103,161 110,151 95,134 Z" fill="#b65a28" stroke="#b65a28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M159,134 C144,151 151,161 159,161 C167,161 174,151 159,134 Z" fill="#b65a28" stroke="#b65a28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M223,134 C208,151 215,161 223,161 C231,161 238,151 223,134 Z" fill="#b65a28" stroke="#b65a28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M157 87L157 109.5" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M157 116L152 106L162 106Z" fill="#52687b"/><text x="156" y="213" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">三滴 → 三滴：数量不变</text><text x="156" y="252" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">葡萄味 → 热带水果味</text></g><g transform="translate(24,706)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · 两个不同的预测误差</text><path d="M0 18L312 18" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="0" y="58" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">教学模型：每滴价值均为 1</text><path d="M57 104L255 104" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="156" cy="104" r="6" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="156" y="140" font-size="21" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">价值误差 = 0</text><path d="M156 171L156 259" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="57" y="183" width="99" height="22" rx="2" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="48" y="200" font-size="20" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">-3</text><rect x="156" y="230" width="99" height="22" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="264" y="247" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">+3</text><text x="168" y="199" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">少了葡萄</text><text x="144" y="246" font-size="18" fill="#b65a28" text-anchor="end" font-weight="400" opacity="1">多了热带水果</text><text x="156" y="302" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">身份预测仍然错了</text></g></g></svg>
