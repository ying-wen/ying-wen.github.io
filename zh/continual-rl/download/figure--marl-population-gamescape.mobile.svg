<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1447" viewBox="0 0 360 1447" role="img" aria-labelledby="crl-153x18m-title crl-153x18m-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-153x18m-title">胜过上一代，与扩大应对范围</title><desc id="crl-153x18m-desc">原创精确剪刀石头布矩阵与经验gamescape。只回应上一代时R到P到S再到R形成循环。固定参考对手R和P，三个收益点为(0,-1)、(1,0)、(-1,1)，遗漏的S坐标等于前两坐标之和取负。保留R是一点，增加P成线，增加S成三角形；重复R不扩张，均匀混合为原点。</desc><rect width="360" height="1447" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="37" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">胜过上一代，与扩大应对范围</text><text x="24" y="88" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 固定一列，就是一个目标</text><g transform="translate(24,122)"><text x="156" y="15" font-size="17" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">对手：石头 R / 布 P / 剪刀 S</text><text x="117" y="51" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="73" y="99" font-size="20" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">R</text><text x="171" y="51" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">P</text><text x="73" y="153" font-size="20" fill="#b65a28" text-anchor="end" font-weight="400" opacity="1">P</text><text x="225" y="51" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">S</text><text x="73" y="207" font-size="20" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">S</text><rect x="90" y="65" width="54" height="54" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="117" y="99" font-size="22" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><rect x="144" y="65" width="54" height="54" rx="0" fill="#fbebea" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="171" y="99" font-size="22