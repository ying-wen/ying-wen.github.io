<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1111" viewBox="0 0 360 1111" role="img" aria-labelledby="crl-3pyg57-title crl-3pyg57-desc" data-crl-visual="v1" data-evidence-kind="measured"><title id="crl-3pyg57-title">模型计算怎样改变后续行动</title><desc id="crl-3pyg57-desc">同一seed0的B0和B2实际记录，前9步状态动作奖励相同。t9处两行显示Q(1,L)、Q(1,R)，其差异包含此前的模型备份；非声称t9一次备份翻转排序。t10采取不同动作。下方虚线是t9,k9的模型期望备份，不是真实转移。</desc><rect width="360" height="1111" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">模型计算怎样改变后续行动</text><text x="28" y="83" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先走过相同的 9 步，再作不同选择</text><path d="M39 143L67.5 143" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M67.5 143L96 143" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M96 143L124.5 143" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M124.5 143L153 143" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M153 143L181.5 143" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M181.5 143L210 143" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M210 143L238.5 143" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M238.5 143L267 143" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M267 143L295.5 143" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="39" cy="143" r="9" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="39" y="148" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="39"