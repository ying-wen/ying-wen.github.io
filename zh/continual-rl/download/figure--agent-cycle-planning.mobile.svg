238.5" cy="143" r="9" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="238.5" y="148" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="238.5" y="176" font-size="12" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">7</text><circle cx="267" cy="143" r="9" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="267" y="148" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="267" y="176" font-size="12" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">8</text><circle cx="295.5" cy="143" r="9" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="295.5" y="148" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="295.5" y="176" font-size="12" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">9</text><text x="28" y="212" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">圆内：状态；圆下：真实时间 t</text><text x="28" y="260" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">每次完成后 0 次模型备份</text><text x="28" y="294" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">真实 t = 9，规划 k = 0</text><text x="332" y="316" font-size="14" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">差分 Q(1,·)</text><text x="28" y="341" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">L</text><path d="M108 319L108 352" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="89.6397" y="324" width="18.3603" height="22" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="120" y="341" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">-0.00367</text><text x="28" y="388" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">R</text><path d="M108 366L108 399" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="120" y="388" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0</text><circle cx="79" cy="440" r="20" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="79" y="446" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M104 440L248.5 440" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M255 440L245 445L245 435Z" fill="#146ca1"/><circle cx="280" cy="440" r="20" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="280" y="446" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="179.5" y="481" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">t = 10，执行 R</text><text x="28" y="522" font-size="19" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">每次完成后 2 次模型备份</text><text x="28" y="556" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">真实 t = 9，规划 k = 10</text><text x="332" y="578" font-size="14" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">差分 Q(1,·)</text><text x="28" y="603" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">L</text><path d="M108 581L108 614" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="108" y="586" width="82.13" height="22" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="202.13" y="603" font-size="17" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">0.01643</text><text x="28" y="650" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">R</text><path d="M108 628L108 661" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="120" y="650" font-size="17" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">0</text><circle cx="79" cy="702" r="20" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="79" y="708" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M104 702L248.5 702" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M255 702L245 707L245 697Z" fill="#7854a2"/><circle cx="280" cy="702" r="20" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="280" y="708" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="179.5" y="743" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">t = 10，执行 L</text><text x="28" y="807" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次模型备份怎样传播远处的收益</text><circle cx="65" cy="866" r="21" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="65" y="872" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M91 866L262.5 866" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M269 866L259 871L259 861Z" fill="#7854a2"/><circle cx="295" cy="866" r="21" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="295" y="872" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="178" y="850" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">L，预计 2 步</text><text x="28" y="922" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">奖励预测 -0.016，时间成本 g × 2</text><text x="28" y="955" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">终点价值 0.1876 → 目标 0.1175</text><text x="28" y="997" font-size="14.5" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q(1,L) ← Q(1,L) + 0.1[目标 − Q(1,L)]</text><text x="28" y="1040" font-size="15" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">虚线没有产生新奖励，也没有推进真实时间</text><text x="28" y="1077" font-size="15" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">选择差异来自此前累计备份；此图不比较性能</text></g></svg>
