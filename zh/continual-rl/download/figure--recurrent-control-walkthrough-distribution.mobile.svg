<svg xmlns="http://www.w3.org/2000/svg" width="360" height="877" viewBox="0 0 360 877" role="img" aria-labelledby="crl-1e9rhmn-title crl-1e9rhmn-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1e9rhmn-title">一条成功轨迹之外，还有失败分支</title><desc id="crl-1e9rhmn-desc">原创精确概率计算，不是采样曲线。两回合的隐藏成功门独立等概率，提示条件准确率0.8。初始a=-0.5使第一回合逆提示选门：以概率0.8失败并更新a=0.25，下一回合成功率0.8；以概率0.2成功并更新a=-0.75，下一回合成功率0.2。条内宽度为各分支下一回合的条件成功或失败概率，旁注为第一次更新分支的概率。第二回合总成功概率0.8*0.8+0.2*0.2=0.68，期望奖励0.36；第一回合期望-0.6，两回合合计-0.24。仅评价明确的两回合预算与初始化。</desc><rect width="360" height="877" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一条成功轨迹之外，还有失败分支</text><text x="28" y="82" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两回合独立抽取隐藏门与带噪提示</text><text x="28" y="114" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">每回合提示正确概率 0.8</text><circle cx="59" cy="196" r="18" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="90" y="184" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">第一次更新后 a=0.25</text><text x="90" y="216" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">此分支概率 0.8</text><path d="M59 220L59 255.5" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M59 262L54 252L64 252Z" fill="#7854a2"/><rect x="41" y="273" width="224" height="49" rx="0" fill="#258375" stroke="#ffffff" stroke-width="1.5" opacity="1"/><rect x="265" y="273" width="56" height="49" rx="0" fill="#b54142" stroke="#ffffff" stroke-width="1.5" opacity="1"/><text x="153" y="304" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">+1</text><text x="293" y="304" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">−1</text><text x="41" y="351" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">下一回合：P(+1)=0.8</text><text x="41" y="381" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">联合成功概率 0.64</text><circle cx="59" cy="496" r="18" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="90" y="484" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">第一次更新后 a=-0.75</text><text x="90" y="516" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">此分支概率 0.2</text><path d="M59 520L59 555.5" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M59 562L54 552L64 552Z" fill="#7854a2"/><rect x="41" y="573" width="56" height="49" rx="0" fill="#258375" stroke="#ffffff" stroke-width="1.5" opacity="1"/><rect x="97" y="573" width="224" height="49" rx="0" fill="#b54142" stroke="#ffffff" stroke-width="1.5" opacity="1"/><text x="69" y="604" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">+1</text><text x="209" y="604" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">−1</text><text x="41" y="651" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">下一回合：P(+1)=0.2</text><text x="41" y="681" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">联合成功概率 0.04</text><path d="M28 733L332 733" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="771" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">P(第二次成功)=0.64+0.04=0.68</text><text x="28" y="805" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">期望奖励：−0.6，+0.36；合计 −0.24</text><text x="28" y="839" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">第一次误导提示会留下 a=−0.75</text></g></svg>
