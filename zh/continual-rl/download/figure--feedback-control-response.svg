<svg xmlns="http://www.w3.org/2000/svg" width="720" height="953" viewBox="0 0 720 953" role="img" aria-labelledby="crl-y8toy7-title crl-y8toy7-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-y8toy7-title">固定反馈怎样应对同一个推移？</title><desc id="crl-y8toy7-desc">原创精确离散算例。每步0.1秒，x和u和d以厘米计；初始x0=x−1=0，仅d2=1，在0.2至0.3秒的转移末加入。圆形蓝线即时k=1.25，方形红虚线即时k=2.25，三角紫点线一步观测延迟k=1.25。上轴位置，下轴动作指令，所有条件共用相同坐标。延迟条件使用x[t−1]；控制器在动作前不知道d[t]。增益全程固定，没有参数训练，连接离散点的直线不表示连续时间轨迹。</desc><rect width="720" height="953" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">固定反馈怎样应对同一个推移？</text><text x="28" y="83" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">x′ = x + u + d；目标 x = 0</text><path d="M73 135L664 135" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M204.3333 135L204.3333 105.2" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M204.3333 100L208.3333 108L200.3333 108Z" fill="#b65a28"/><text x="216.3333" y="111" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">d₂ = +1 cm</text><path d="M28 180L55 180" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="41.5" cy="180" r="4" fill="#146ca1" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="67" y="185" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">即时 k=1.25</text><path d="M253 180L280 180" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 5"/><rect x="262.5" y="176" width="8" height="8" rx="0" fill="#b54142" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="292" y="185" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">过大 k=2.25</tex