<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1408" viewBox="0 0 720 1408" role="img" aria-labelledby="crl-1ccim8a-title crl-1ccim8a-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1ccim8a-title">预算怎样改变真正的选择</title><desc id="crl-1ccim8a-desc">同一四叶优先顺序，期望cross一次，采样cross独立n次以alpha_k=1/k平均，再备份go。W全期望=30；采样=16+5n。B21、26、31、36分别允许n1、2、3、4，精确枚举4^n后继序列，选择go概率分别1/2、3/4、1/2、11/16。B30全期望完成并必选go，采样只能完成n2并留4基本单位。上图画的是停止后真正首动作的概率，非训练曲线；模型和叶值在cross平均期间冻结。中部长度显示查询、展开后果、后继动作值读取、Q写入，合计30与21；静态列表追加/预算检查均6另计，样本选择1另计，队列0。下图只把exit奖励改.82，go真实回报仍.81：全期望选exit，采样可能误选go，使下一实际期望回报低于.82；下图纵轴范围.810..821。真实episode从exit有1步，从go有3步，真实转移在这些规划预算之外另计。原创有限算例和精确枚举。</desc><rect width="720" height="1408" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">预算怎样改变真正的选择</text><text x="28" y="86" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一后继优先日程；预算 B 截止</text><text x="28" y="120" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">先四个 collect，再 cross，最后 go</text><path d="M80 193L80 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M80 433L80 438" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="80" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">12</text><path d="M269.6429 193L269.6429 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M269.6429 433L269.6429 438" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="269.6429" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">21</text><path d="M375 193L375 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M375 433L375 438" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="375" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">26</text><path d="M459.2857 193L459.2857 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M459.2857 433L459.2857 438" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="459.2857" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">30</text><path d="M585.7143 193L585.7143 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M585.7143 433L585.7143 438" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="585.7143" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">36</text><path d="M670 193L670 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M670 433L670 438" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="670" y="459" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">40</text><path d="M80 433L670 433" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 433L80 433" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="438" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M80 313L670 313" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 313L80 313" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="318" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M80 193L670 193" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opaci