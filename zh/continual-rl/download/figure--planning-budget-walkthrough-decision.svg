rt" font-weight="400" opacity="1">下一实际回报期望</text><path d="M90 1157.7273L283.3333 1157.7273L283.3333 1119.0909L438 1119.0909L438 1119.0909L476.6667 1119.0909L476.6667 1157.7273L670 1157.7273L670 1128.75" fill="none" stroke="#b54142" stroke-width="3"/><path d="M90 1080.4545L670 1080.4545" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 5"/><text x="28" y="1329" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">橙：期望备份选 exit；红：采样分支平均</text><text x="28" y="1368" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">纵轴0.810–0.821；有限序列精确枚举</text></g></svg>
