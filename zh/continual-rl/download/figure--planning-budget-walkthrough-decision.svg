eight="400" opacity="1">B=26：采样3/4；B=30：全期望1</text><text x="28" y="600" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">抽样 n=2→3：方差降，选 go 概率降</text><text x="28" y="647" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">完整一轮的成本分解</text><text x="28" y="698" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">全期望</text><rect x="80" y="712" width="120" height="28" rx="0" fill="#7854a2" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="140" y="732" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><rect x="200" y="712" width="180" height="28" rx="0" fill="#146ca1" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="290" y="732" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">9</text><rect x="380" y="712" width="180" height="28" rx="0" fill="#258375" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="470" y="732" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">9</text><rect x="560" y="712" width="120" height="28" rx="0" fill="#b65a28" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="620" y="732" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="80" y="766" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">W=30；追加/检查各6次</text><text x="28" y="788" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">采样一次</text><rect x="80" y="802" width="120" height="28" rx="0" fill="#7854a2" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="140" y="822" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><rect x="200" y="802" width="120" height="28" rx="0" fill="#146ca1" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="260" y="822" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><rect x="320" y="802" width="60" height="28" rx="0" fill="#258375" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="350" y="822" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">3</text><rect x="380" y="802" width="120" height="28" rx="0" fill="#b65a28" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="440" y="822" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="80" y="856" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">W=21；追加/检查各6次</text><text x="28" y="924" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">紫：查询；蓝：后果展开；青：后继动作Q读取；橙：Q写入</text><text x="28" y="1003" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">只把 exit 改成0.82：go 真值仍0.81</text><path d="M90 1065L90 1235" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M90 1235L90 1240" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="90" y="1261" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">21</text><path d="M283.3333 1065L283.3333 1235" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M283.3333 1235L283.3333 1240" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="283.3333" y="1261" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">26</text><path d="M438 1065L438 1235" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M438 1235L438 1240" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="438" y="1261" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">30</text><path d="M476.6667 1065L476.6667 1235" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M476.6667