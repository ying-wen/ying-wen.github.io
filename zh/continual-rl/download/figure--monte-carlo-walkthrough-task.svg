<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="crl-uvcr0r-title crl-uvcr0r-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-uvcr0r-title">同一条两步路线，评价另一策略</title><desc id="crl-uvcr0r-desc">所有回合从S0出发，两种动作均到S1，再经两种动作真实终止。A和B在第一步给奖励2和0，第二步给奖励4和0。折扣0.5。两状态的行为A概率均为0.5，目标A概率均为0.75。动作改变奖励，不改变后继状态。下方条宽是动作概率；目标真值3由正文计算，图不是采样训练。</desc><rect width="720" height="560" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一条两步路线，评价另一策略</text><circle cx="76" cy="221" r="27" fill="#f5f8fb" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="76" y="228" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₀</text><circle cx="360" cy="221" r="27" fill="#f5f8fb" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="360" y="228" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₁</text><circle cx="646" cy="221" r="27" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><circle cx="646" cy="221" r="22" fill="none" stroke="#19354e" stroke-width="1.5" opacity="1"/><text x="646" y="228" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">终</text><path d="M98 221L190.1866 135.5353" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M194 132L190.8528 140.3723L185.4138 134.5056Z" fill="#b65a28"/><circle cx="218" cy="132" r="22" fill="#fff1e7" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="218" y="139" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M242 132L329.2824 217.3641" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M333 221L324.4838 218.266L330.0775 212.5467Z" fill="#146ca1"/><text x="218" y="89" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">R₁=2</text><path d="M98 221L190.1866 306.4647" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M194 310L185.4138 307.4944L190.8528 301.6277Z" fill="#b65a28"/><circle cx="218" cy="310" r="22" fill="#fff1e7" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="218" y="317" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M242 310L329.2824 224.6359" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M333 221L330.0775 229.4533L324.4838 223.734Z" fill="#146ca1"/><text x="218" y="368" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">R₁=0</text><path d="M382 221L475.1684 135.5156" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M479 132L475.8096 140.3559L470.401 134.4612Z" fill="#b65a28"/><circle cx="503" cy="132" r="22" fill="#fff1e7" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="503" y="139" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M527 132L615.2626 217.3845" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M619 221L610.469 218.3126L616.0313 212.5628Z" fill="#146ca1"/><text x="503" y="89" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">R₂=4</text><path d="M382 221L475.1684 306.4844" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M479 310L470.401 307.5388L475.8096 301.6441Z" fill="#b65a28"/><circle cx="503" cy="310" r="22" fill="#fff1e7" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="503" y="317" font-size="20" fill="#