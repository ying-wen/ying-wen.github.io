<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1672" viewBox="0 0 360 1672" role="img" aria-labelledby="crl-1plahx0-title crl-1plahx0-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1plahx0-title">学习过程与末次行为：排名反转</title><desc id="crl-1plahx0-desc">原创精确概率算例。J选择L或R，下一步强制返回；A与B各保持8圈，顺序A/B/A。A中L/R获奖概率.9/.1，B相反。胜留败换只按所选侧格奖励更新方向，初始左；返程零奖励不更新。48原始步期望收益18.48，固定左15.2。复制末态到固定A并停止方向更新，90%历史保留左，10%保留右；8圈期望收益6.56，固定左7.2。每个副本内方向固定，概率不是逐圈重新混合。曲线为全部随机历史的解析期望，无置信区间；诊断有16额外原始步，不回写主生命。</desc><rect width="360" height="1672" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">学习过程与末次行为：排名反转</text><text x="28" y="85" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一迷宫，奖励改为随机 0 / 1</text><text x="28" y="130" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">规律 A · 到侧格时得 1 的概率</text><rect x="41" y="156" width="46" height="46" rx="6" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="64" y="187" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><text x="64" y="233" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.9</text><rect x="158" y="156" width="46" height="46" rx="6" fill="#f5f8fb" stroke="#146ca1" stroke-width="1.5" opacity="1"/><text x="181" y="187" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">J</text><rect x="275" y="156" width="46" height="46" rx="6" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="298" y="187" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="298" y="233" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.1</text><path d="M151 170L98.5 170" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M92 170L102 165L102 175Z" fill="#146ca1"/><path d="M211 170L263.5 170" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M270 170L260 175L260 165Z" fill="#146ca1"/><path d="M92 193L144.5 193" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M151 193L141 198L141 188Z" fill="#52687b"/><path d="M270 193L217.5 193" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M211 193L221 188L221 198Z" fill="#52687b"/><text x="28" y="295" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">规律 B · 到侧格时得 1 的概率</text><rect x="41" y="321" width="46" height="46" rx="6" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="64" y="352" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><text x="64" y="398" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.1</text><rect x="158" y="321" width="46" height="46" rx="6" fill="#f5f8fb" stroke="#146ca1" stroke-width="1.5" opacity="1"/><text x="181" y="352" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">J</text><rect x="275" y="321" width="46" height="46" rx="6" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="298" y="352" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="298" y="398" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.9</text><path d="M151 335L98.5 335" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M92 335L102 330L102 340Z" fill="#146ca1"/><path d="M211 335L263.5 335" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round