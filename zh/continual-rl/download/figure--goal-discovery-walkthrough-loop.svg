<svg xmlns="http://www.w3.org/2000/svg" width="720" height="685" viewBox="0 0 720 685" role="img" aria-labelledby="crl-l9qf0w-title crl-l9qf0w-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-l9qf0w-title">一次发现有代价，知识由控制再使用</title><desc id="crl-l9qf0w-desc">原创确定性闭环。先执行到A的option及探测动作，两步真实回报0；记录A到Y后A不再是frontier，选择C。执行到C的option及探测动作，三步回报0.9平方乘2为1.62。外部规划在已学option模型R=0、B分别0.9和0.81之上接入V(A)=1、V(C)=2，比较0.9与1.62，并在新的真实送货回合复用C的option。上方两次探测加起来5原子步，下方部署另3步。</desc><rect width="720" height="685" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次发现有代价，知识由控制再使用</text><text x="28" y="83" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">目标选择改变下一次真实行动</text><text x="28" y="130" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1. 选择 A，到达后试 probe</text><circle cx="48" cy="188" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="48" y="194" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><path d="M68 188L161.5 188" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M168 188L158 193L158 183Z" fill="#b65a28"/><circle cx="188" cy="188" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="188" y="194" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M208 188L301.5 188" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M308 188L298 193L298 183Z" fill="#b65a28"/><circle cx="328" cy="188" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="328" y="194" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">Y</text><text x="28" y="237" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">A→Y：真实净奖励 0</text><text x="28" y="268" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">本次外部回报 = 0.00</text><text x="28" y="306" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 出队；下一候选只剩 C</text><text x="378" y="130" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2. 选择 C，到达后试 probe</text><circle cx="398" cy="188" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="398" y="194" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><path d="M418 188L464.8333 188" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M471.3333 188L461.3333 193L461.3333 183Z" fill="#b65a28"/><circle cx="491.3333" cy="188" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="491.3333" y="194" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M511.3333 188L558.1667 188" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M564.6667 188L554.6667 193L554.6667 183Z" fill="#b65a28"/><circle cx="584.6667" cy="188" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="584.6667" y="194" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">C</text><path d="M604.6667 188L651.5 188" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M658 188L648 193L648 183Z" fill="#b65a28"/><circle cx="678" cy="188" r="19" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="678" y="194" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">Y</text><text x="378" y="237" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">C→Y：真实奖励 2</text><text x="378" y="268" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">本次外部回报 = 1.62</text><text x="378" y="306" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">未试动作已清空</text><text x="28" y="361" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">下一次送货：谁读取学到的模型？</text><text x="28" y="395" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">外部折扣回报 R + B·V</text><text x="28" y="456" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">oA</text><rect x="140" y="440" width="220" height="22" rx="2" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="369" y="458" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">0.90</text><text x="28" y="516" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">oC</text><rect x="140" y="500" width="396" height="22" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="545" y="518" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1.62</text><text x="28" y="575" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">实际复用 oC，再做 probe：S→B→C→Y</text><text x="28" y="608" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">新增 3 原子步；外部回报 1.62</text><text x="28" y="642" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 的覆盖分数较高，第一次却没有外部收益</text></g></svg>
