 stroke-linecap="round" opacity="1"/><path d="M256.0971 290L463.9029 290" fill="none" stroke="#b65a28" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path d="M463.9029 290L463.9029 240" fill="none" stroke="#b65a28" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path d="M463.9029 240L468.7114 240" fill="none" stroke="#b65a28" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path d="M468.7114 240L468.7114 190" fill="none" stroke="#b65a28" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path d="M468.7114 190L645 190" fill="none" stroke="#b65a28" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path d="M28 483L56 483" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/><text x="68" y="488" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">真父回报：.5 / 2.5 各半</text><path d="M28 513L56 513" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="7 5"/><text x="68" y="518" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧目标：1,1,2,2</text><path d="M28 543L56 543" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="68" y="548" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">新目标：.928,.953,2.047,2.072</text><text x="28" y="580" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">父预测保持 1,1,2,2</text><path d="M75 640L645 640" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M75 640L75 645" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="75" y="668" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M170 640L170 645" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="170" y="668" font-size="16" fill="#52687b" text-anchor