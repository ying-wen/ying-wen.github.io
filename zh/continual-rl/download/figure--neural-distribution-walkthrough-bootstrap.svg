<svg xmlns="http://www.w3.org/2000/svg" width="720" height="894" viewBox="0 0 720 894" role="img" aria-labelledby="crl-arkx2g-title crl-arkx2g-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-arkx2g-title">后继被更新，父节点的目标随之移动</title><desc id="crl-arkx2g-desc">原创同一接单任务的独立两阶段计算。结算状态v的真实终止回报是0/4各半；另建同结构后继网络，fixed结算输入=-1初始输出2四次，floating结算输入=1初始输出1,1,3,3。对v的终止标签0,0,4,4做一次步长.5总体pinball写入，预测变为约.856,.906,3.094,3.144。父目标y=.5+.5z_v从1,1,2,2变为约.928,.953,2.047,2.072。CDF的蓝虚线是旧目标，橙实线是新目标，青短虚线是父真实分布，均使用同坐标。父当前预测1,1,2,2保持不动：目标对真分布W1由.5降至约.440，父原始pinball损失却从.125升至约.155。若仍读取旧target副本目标就不变；同步副本才产生新标签。本图没有对父目标路径反传，也没有继续父训练。</desc><rect width="720" height="894" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">后继被更新，父节点的目标随之移动</text><text x="28" y="82" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一接单：结算 v 的网络写入一次</text><text x="28" y="119" font-size="19" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">父预测不写；新标签来自后继新副本</text><path d="M75 190L75 390" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 390L75 395" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="75" y="416" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M170 190L170 390" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M170 390L170 395" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="170" y="416" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><path d="M360 190L360 390" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M360 390L360 395" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="360" y="416" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.5</text><path d="M550 190L550 390" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M550 390L550 395" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="550" y="416" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2.5</text><path d="M645 190L645 390" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M645 390L645 395" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="645" y="416" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M75 390L645 390" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M70 390L75 390" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="65" y="395" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M75 290L645 290" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M70 290L75 290" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="65" y="295" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M75 190L645 190" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M70 190L75 190" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="65" y="195" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M75 190L75 390" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M75 390L645 390" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="645" 