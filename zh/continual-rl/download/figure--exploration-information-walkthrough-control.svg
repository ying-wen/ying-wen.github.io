<svg xmlns="http://www.w3.org/2000/svg" width="720" height="848" viewBox="0 0 720 848" role="img" aria-labelledby="crl-1tjwys6-title crl-1tjwys6-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1tjwys6-title">信息经由后续行动产生收益</title><desc id="crl-1tjwys6-desc">原创完整六步轨迹枚举，Theta固定，先验各半，k4额外恢复步；圆表示每个原始环境步，数字为该步外部奖励。先读标且ThetaR：标、R、收、收、收、收，奖励0,1,1,1,1,1，共5；ThetaL镜像且收益相同。直接选L：ThetaL奖励六个1共6；ThetaR则L、返、返、返、返、R，奖励0,0,0,0,0,1共1，期望3.5。失败第一步后已经知道ThetaR，却要至第五步才回到J。先看屏幕不更新后验，剩五步最优是读标再选正确侧，奖励0,0,1,1,1,1，共4；屏幕+1/-1均如此。每条轨迹是指定世界中的精确执行，非随机训练。</desc><rect width="720" height="848" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">信息经由后续行动产生收益</text><text x="28" y="83" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">H=6；错误选路之后还要恢复 4 步</text><text x="28" y="132" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">先读路标，Θ=R</text><text x="692" y="132" font-size="20" fill="#258375" text-anchor="end" font-weight="400" opacity="1">Σr=5</text><text x="28" y="174" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">另一世界收益相同</text><circle cx="208" cy="180" r="19" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="208" y="186" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">标</text><text x="208" y="216" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="208" y="244" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t1</text><path d="M227 180L257.1 180" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M261 180L255 183L255 177Z" fill="#c8d6e0"/><circle cx="280" cy="180" r="19" fill="#e4f1ed" stroke="#258375" stroke-width="2" opacity="