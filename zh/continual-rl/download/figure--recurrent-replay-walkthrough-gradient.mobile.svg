<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1016" viewBox="0 0 360 1016" role="img" aria-labelledby="crl-38bog4-title crl-38bog4-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-38bog4-title">保留记忆数值，改变梯度路径</title><desc id="crl-38bog4-desc">原创非线性递归的精确导数。当前参数固定w=rho=0.8，输入+1,0,0,0,0。蓝色前向活动两种算法完全相同；紫色完整反传到入口标签，紫色虚线在学习段t4入口停止。入口活动h3被作为常数，因此dw从0.1312196290变为0，drho从0.9596106517变为0.2732783233。终止标签-2、所选记录动作R及Q(R)=0.3206655358固定；两条损失相同，但完整/截断参数梯度不同。横线长度同一参数内与梯度绝对值成比例；两个参数图使用各自明确的范围。</desc><rect width="360" height="1016" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">保留记忆数值，改变梯度路径</text><text x="28" y="84" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">前缀不计损失；入口是否求导另作约定</text><rect x="28" y="119" width="139" height="267" rx="8" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="197" y="130" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">完整反传</text><text x="236" y="375" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">detach</text><circle cx="68" cy="150" r="16" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="68" y="155" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">+1</text><text x="100" y="155" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">h0=0.664</text><path d="M68 170L68 196.8" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M68 202L64 194L72 194Z" fill="#146ca1"/><circle cx="68" cy="222" r="16" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="68" y="227" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="100" y="227" font-size="1