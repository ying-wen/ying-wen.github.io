<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1775" viewBox="0 0 360 1775" role="img" aria-labelledby="crl-1ldti9u-title crl-1ldti9u-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1ldti9u-title">结果贬值：改变的是哪一种食物？</title><desc id="crl-1ldti9u-desc">Adams 与 Dickinson 1981 实验 I 的原创程序示意。O1 为单杠杆按压所得食物，O2 在另外的日子直接提供。两组分别把 O1 或 O2 与 LiCl 配对，另一食物与盐水配对。三次两日循环后，间隔24小时，进行20分钟无食物杠杆测试。图未绘制实验结果。</desc><rect width="360" height="1775" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="37" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">结果贬值：改变的是哪一种食物？</text><text x="24" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 两组具有相同训练史</text><text x="180" y="120" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">动作所得 O₁</text><g transform="translate(24,140)"><path d="M8,150 L8,6 L304,6 L304,150 Z" stroke="#c8d6e0" stroke-width="2" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 151L304 151" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M16 151L24 160" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M32 151L40 160" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M48 151L56 160" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M64 151L72 160" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M80 151L88 160" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M96 151L104 160" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M112 151L120 160" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M128 151L136 160" fil