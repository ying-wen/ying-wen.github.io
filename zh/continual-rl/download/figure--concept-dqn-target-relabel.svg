<svg xmlns="http://www.w3.org/2000/svg" width="720" height="797" viewBox="0 0 720 797" role="img" aria-labelledby="crl-10r8a9t-title crl-10r8a9t-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-10r8a9t-title">旧经验为什么得到新标签</title><desc id="crl-10r8a9t-desc">三个面板使用同一条经验：当前输入1，动作L，奖励0，后继输入2，未终止。蓝柱是在线后继价值，紫柱是目标后继价值，所有柱统一每价值单位47像素。橙色环按在线网络选择L或R，Double读取目标网相同动作的值，普通DQN读取目标网的最大值。一次在线更新后目标未变，但Double选择从R改L，标签1变1/2；硬复制后两种标签均为27/32。</desc><rect width="720" height="797" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧经验为什么得到新标签</text><text x="24" y="76" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">经验不变；γ=1/2；柱高=后继价值</text><text x="28" y="126" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">① 更新前</text><text x="28" y="174" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">在线 Qθ</text><path d="M41 316L185 316" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="56" y="269" width="36" height="47" rx="0" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="0.78"/><text x="74" y="257" font-size="17" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="74" y="342" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><rect x="130" y="222" width="36" height="94" rx="0" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="0.78"/><text x="148" y="210" font-size="17" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="148" y="342" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><circle cx="148" cy="335" r="18" fill="none" stroke="#b65a28" stroke-width="2.5" opacity="1"/><text x="28" y="377" font-size="17" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">选择 R</text><text x="28" y="422" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">目标 Qθ⁻</text><path d="M41 564L185 564" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="56" y="517" width="36" height="47" rx="0" fill="#7854a2" stroke="#7854a2" stroke-width="1.5" opacity="0.78"/><text x="74" y="505" font-size="17" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="74" y="590" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><rect x="130" y="470" width="36" height="94" rx="0" fill="#7854a2" stroke="#7854a2" stroke-width="1.5" opacity="0.78"/><text x="148" y="458" font-size="17" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="148" y="590" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><circle cx="148" cy="583" r="18" fill="none" stroke="#b65a28" stroke-width="2.5" opacity="1"/><text x="28" y="625" font-size="17" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">Double 读取环中动作</text><text x="28" y="671" font-size="19" fill="#258375" text-anchor="start" font-weight="400" opacity="1">DQN：1</text><text x="28" y="706" font-size="19" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">Double：1</text><path d="M209 202L230.45 202" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M235 202L228 205.5L228 198.5Z" fill="#b54142"/><path d="M245 106L245 736" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="259" y="126" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">② 在线更新后</text><text x="259" y="174" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">在线 Qθ</text><path d="M272 316L416 316" fill="none" stroke="#c8d6e0" st