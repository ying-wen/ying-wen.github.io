ode="actual" d="M133 109L123 114L123 104Z" fill="#146ca1"/><text x="91.5" y="88" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">R=1</text><path d="M182 109L259.5 109" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M266 109L256 114L256 104Z" fill="#146ca1"/><text x="224.5" y="88" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">R=2</text><text x="25" y="153" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">x=1</text><text x="158" y="153" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">x=1</text><text x="291" y="153" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">x=0</text><text x="0" y="207" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">首步后：w=.5，旧预测=0</text></g><g transform="translate(376,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · Dutch trace 缩减重复资格</text><path d="M0 25L316 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="0" y="58" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">重复特征的第二次资格</text><rect x="0" y="90" width="91.3333" height="38" rx="2" fill="#c8d6e0" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="91.3333" y="90" width="137" height="38" rx="2" fill="#258375" stroke="#258375" stroke-width="1.5" opacity="1"/><rect x="228.3333" y="90" width="45.6667" height="38" rx="2" fill="#ffffff" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="45.6667" y="157" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">.5</text><text x="159.8333" y="157" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">.75</text><path d="M264.8667 181L253.8208 141.2626" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M252.08 135L259.5755 143.2956L249.9408 145.9738Z" fill="#b54142"/><text x="316" y="206" font-size="18" fill="#b54142" text-anchor="end" font-weight="400" opacity="1">减去 .25</text><text x="0" y="206" font-size="23" fill="#258375" text-anchor="start" font-weight="400" opacity="1">e = 1.25</text><text x="0" y="249" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">灰：旧迹衰减；绿：本次加入</text></g><g transform="translate(28,399)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · 权重还要修正预测变化</text><path d="M0 25L664 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="0" y="64" width="195" height="36" rx="1" fill="#c8d6e0" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="97.5" y="130" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">.5</text><rect x="195" y="64" width="365.625" height="36" rx="1" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="1"/><text x="377.8125" y="130" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">.9375</text><rect x="560.625" y="64" width="24.375" height="36" rx="1" fill="#b65a28" stroke="#b65a28" stroke-width="1.5" opacity="1"/><path d="M572.8125 157L572.8125 112.5" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M572.8125 106L577.8125 116L567.8125 116Z" fill="#b65a28"/><text x="572.8125" y="183" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.0625</text><text x="664" y="89" font-size="24" fill="#258375" text-anchor="end" font-weight="400" opacity="1">1.5</text><text x="0" y="183" font-size="19" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">预测变化修正</text><path d="M0 218L664 218" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/>