<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="crl-1ahng73-title crl-1ahng73-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1ahng73-title">只沿采样分支展开</title><desc id="crl-1ahng73-desc">冻结Q和目标策略，gamma=.9。首奖励1。下一状态动作0概率.25、旧Q2，动作1概率.75、旧Q4。实际采到动作0，再得奖励6并真正终止。Tree Backup只将动作0的旧Q2换成实际回报6，目标1+.9*(.25*6+.75*4)=5.05；完全采样的两步Sarsa目标6.4。虚线只表示读取未采样分支的旧预测，不是模拟了其后果。</desc><rect width="720" height="560" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">只沿采样分支展开</text><g transform="translate(28,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 哪条分支有新经验？</text><path d="M0 25L316 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="158" cy="62" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="158" y="68" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">Q?</text><path d="M158 85L158 128.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M158 135L153 125L163 125Z" fill="#146ca1"/><text x="177" y="116" font-size="19" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">R=1</text><circle cx="158" cy="158" r="19" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><text x="158" y="165" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><path d="M143 174L79.3359 218.2881" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M74 222L79.3537 212.1848L85.0644 220.3939Z" fill="#146ca1"/><path d="M173 174L243.5043 218.529" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="actual" d="M249 222L237.8751 220.8875L243.2151 212.4326Z" fill="#7854a2"/><text x="10" y="198" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">π=.25</text><text x="316" y="198" font-size="18" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">π=.75</text><circle cx="64" cy="240" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="259" cy="240" r="10" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="64" y="274" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">旧 Q=2</text><path d="M34 266L93 266" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="259" y="274" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">旧 Q=4</text><path d="M64 289L64 323.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M64 330L59 320L69 320Z" fill="#146ca1"/><text x="85" y="315" font-size="19" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">R=6</text><rect x="44" y="338" width="40" height="40" rx="3" fill="#ffffff" stroke="#19354e" stroke-width="1.5" opacity="1"/><rect x="49" y="343" width="30" height="30" rx="2" fill="#ffffff" stroke="#19354e" stroke-width="1.5" opacity="1"/><text x="64" y="364" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="259" y="327" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">没有这条</text><text x="259" y="352" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">分支的经验</text><text x="158" y="410" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">实线：采样；虚线：读取旧预测</text></g><g transform="translate(376,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 只替换这条分支</text><path d="M0 25L316 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="0" y="60" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">按目标策略给叶节点加权</text><rect x="0" y="100" width="67.0313" height="30" rx="2" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="1"/><rect x="67.0313" y="100" width="134.0625" height="30" rx="2" fill="#7854a2" stroke="#7854a2" stroke-width="1.5" opacity="1"/><text x="33.5156" y="154" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1.5</text><text x="134.0625" y="154" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">3</text><text x="0" y="191" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">.25×6 + .75×4 = 4.5</text><path d="M158 209L158 231.5" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M158 238L153 228L163 228Z" fill="#b65a28"/><text x="175" y="230" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">×.9，+1</text><text x="158" y="279" font-size="24" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Tree Backup = 5.05</text><path d="M0 313L316 313" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="0" y="354" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">只沿采样分支：</text><text x="0" y="394" font-size="23" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">1 + .9×6 = 6.4</text></g></g></svg>
