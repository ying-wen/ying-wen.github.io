<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670" role="img" aria-labelledby="crl-1ehsqo8-title crl-1ehsqo8-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1ehsqo8-title">Replay 复用经验；目标副本暂时固定标签</title><desc id="crl-1ehsqo8-desc">DQN流程结构，环境、优化、目标复制三种时钟分开。真实转移进入有限replay，随机minibatch分别给在线网络当前状态动作和目标网络后继状态。沿用正文给定输出2、目标后继2和6、奖励1、gamma0.9，DQN标签6.4。标签在这次求导中stop-gradient，梯度仅更新在线参数；目标参数每C次优化复制。迷宫仅为流程背景，网络输出不是这个迷宫学到的值。Double DQN在正文另以在线后继5和4选择动作0，目标评价2得到2.8。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#19354e"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52687b"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c8d6e0"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#146ca1"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#258375"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b65a28"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7854a2"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b54142"/></marker><marker id="white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start