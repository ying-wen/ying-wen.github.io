<svg xmlns="http://www.w3.org/2000/svg" width="360" height="718.5" viewBox="0 0 360 718.5" role="img" aria-labelledby="crl-13ku83z-title crl-13ku83z-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-13ku83z-title">投影残差为何指向增长</title><desc id="crl-13ku83z-desc">原创精确零奖励二状态算例。横纵坐标分别为sqrt(.9)v(A)和sqrt(.1)v(B)，两轴使用相同单位长度，所以紫色虚线是D_b正交投影在变换后的垂线。蓝圆为v=(1,2)，红圆为T_pi v=(1.8,1.8)，青方为Pi_D T_pi v=(99/65,198/65)。红箭头是Bellman残差，青箭头是投影残差；它们不代表环境动作。下方同一有符号方向轴显示w=1时TD均场方向+.68与半MSPBE负梯度−578/1625。辅助变量平衡h=34/65。方向还未乘步长。</desc><rect width="360" height="718.5" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">投影残差为何指向增长</text><text x="28" y="84" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">零奖励主例；w=1，Dᵦ=(.9,.1)</text><path d="M65 140L65 325.5" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M65 325.5L65 330.5" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="65" y="351.5" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M197.5 140L197.5 325.5" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M197.5 325.5L197.5 330.5" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="197.5" y="351.5" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M330 140L330 325.5" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M330 325.5L330 330.5" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="330" y="351.5" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M65 325.5L330 325.5" fill="none" stroke="#c8d6e0" 