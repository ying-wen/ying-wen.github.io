<svg xmlns="http://www.w3.org/2000/svg" width="720" height="919" viewBox="0 0 720 919" role="img" aria-labelledby="crl-jutzkm-title crl-jutzkm-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-jutzkm-title">三个随机化与更新对象分开看</title><desc id="crl-jutzkm-desc">原创两头表格机制探针，未实现Bootstrapped DQN网络训练。上方使用已生成真实端点记录r0、真终止d1，两个头的目标都为0，学习率.5，保存的经验训练mask为1,0。头1可训练残差f从.5到.1，头2的f.3不变；固定prior分别.3、负.1都不训练，总Q从.8到.4和.2到.2。行为选头与数据mask分开；浅条是更新前Q、深条是更新后Q，长度同用单位轴0到1。底部为另外明确给定的非终止快照：当前值两个均.5，r0、gamma1、mask均1；目标副本各为.8、.2，alpha.5得到.65、.35。目标箭头传递冻结值而非梯度。各头自己的TD bootstrap保留价值假设跨时间的对应；data bootstrap改变训练数据，prior在未充分观察处提供固定函数偏置。这些结构都不自动生成校准后验。</desc><rect width="720" height="919" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">三个随机化与更新对象分开看</text><text x="28" y="86" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">取上一条实际端点记录：r=0，d=1</text><text x="28" y="121" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每条经验保存 mask；此处 m=(1,0)</text><circle cx="101" cy="185" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="101" y="191" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">9</text><path d="M123 185L274.5 185" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M281 185L271 190L271 180Z" fill="#146ca1"/><circle cx="303" cy="185" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="303" cy="185" r="13" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="303" y="191" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="202" y="227" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">right，终止 → 目标 0</text><path d="M303 239L181.7378 293.8567" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M177 296L182.6402 289.0582L185.9375 296.3471Z" fill="#146ca1"/><text x="177" y="321" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">头 1 · mask=1</text><text x="177" y="359" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">可训练 f：0.5 → 0.1</text><text x="177" y="394" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">固定 prior：0.3 → 0.3</text><path d="M39 455L315 455" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="39" y="425" width="220.8" height="10" rx="0" fill="#ded5ea" stroke="none" stroke-width="1.5" opacity="1"/><rect x="39" y="443" width="110.4" height="10" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="177" y="488" font-size="19" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">总 Q=f+prior：0.8 → 0.4</text><path d="M303 239L528.9514 294.7542" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><path data-arrow-mode="actual" d="M534 296L525.2747 297.967L527.1912 290.1999Z" fill="#52687b"/><text x="534" y="321" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">头 2 · mask=0</text><text x="534" y="359" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">可训练 f：0.3 → 0.3</text><text x="534" y="394" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">固定 prior：−0.1 → −0.1</text><path d="M396 455L672 455" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="396" y="425" width="55.2" height="10" rx="0" fill="#ded5ea" stroke="none" stroke-width="1.5" opacity="1"/><rect x="396" y="443" width="55.2" height="10" rx="0" fill="#52687b" stroke="none" stroke-width="1.5" opacity="1"/><text x="534" y="488" font-size="19" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">总 Q=f+prior：0.2 → 0.2</text><text x="28" y="522" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">浅条：更新前；深条：更新后（轴 0…1）</text><path d="M28 544L692 544" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="570" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">TD bootstrap：每头读自己的目标副本</text><text x="28" y="607" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">另给非终止快照：r=0，γ=1，α=.5</text><text x="28" y="673" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">头 1</text><circle cx="155" cy="667" r="18" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="155" y="673" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.8</text><path d="M178 667L395.8 667" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M401 667L393 671L393 663Z" fill="#7854a2"/><text x="551" y="673" font-size="21" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.5 → 0.65</text><text x="28" y="751" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">头 2</text><circle cx="155" cy="745" r="18" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="155" y="751" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.2</text><path d="M178 745L395.8 745" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M401 745L393 749L393 741Z" fill="#7854a2"/><text x="551" y="751" font-size="21" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.5 → 0.35</text><text x="28" y="843" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">数据 mask ≠ TD bootstrap ≠ 固定 prior</text><text x="28" y="880" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">这里只更新表格快照；没有神经训练</text></g></svg>
