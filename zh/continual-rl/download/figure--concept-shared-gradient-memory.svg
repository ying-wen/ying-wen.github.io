<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="crl-102iesb-title crl-102iesb-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-102iesb-title">资格迹把过去的方向留到现在</title><desc id="crl-102iesb-desc">原创精确向量图。A到B到终点，奖励2、−1，gamma1、lambda0.5、alpha0.5。累积迹将旧A特征衰减为(0.5,0)并加上B特征(0.8,0.6)，得到(1.3,0.6)。Dutch迹将新B特征乘以1−0.5×0.5×0.8=0.8，得到(1.14,0.48)。两图坐标尺度一致。灰色实线为衰减历史，青色实线为新特征贡献，蓝或紫虚线是向量和，不表示模型生成数据。</desc><rect width="720" height="650" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">资格迹把过去的方向留到现在</text><path d="M141 105L331.15 105" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M337 105L328 109.5L328 100.5Z" fill="#146ca1"/><text x="239" y="88" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">+2</text><circle cx="118" cy="105" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="118" y="112" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M383 105L573.15 105" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M579 105L570 109.5L570 100.5Z" fill="#146ca1"/><text x="481" y="88" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">−1</text><circle cx="360" cy="105" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="360" y="112" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="602" cy="105" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="602" y="112" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">⊥</text><circle cx="602" cy="105" r="27" fill="none" stroke="#146ca1" stroke-width="1" opacity="1"/><text x="24" y="160" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">到达终点时：先衰减 A，再加入 B</text><text x="24" y="199" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">累积：新方向系数 1</text><path d="M61 452L296 452" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M61 452L61 242" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="296" y="500" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">迹分量 1</text><text x="61" y="226" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">迹分量 2</text><path d="M61 448L61 456" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="61" y="476" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M217.6667 448L217.6667 456" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="217.6667" y="476" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M57 295.2836L65 295.2836" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="52" y="300.2836" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M61 452L133.4833 452" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M139.3333 452L130.3333 456.5L130.3333 447.5Z" fill="#52687b"/><path d="M139.3333 452L259.9872 361.4809" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M264.6667 357.9701L260.168 366.9708L254.7669 359.7717Z" fill="#258375"/><path d="M61 452L259.3554 360.4223" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="actual" d="M264.6667 357.9701L258.3817 365.8282L254.6092 357.6571Z" fill="#146ca1"/><text x="100.1667" y="500" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5 x(A)</text><text x="256.6667" y="339.9701" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">(1.3, 0.6)</text><text x="24" y="530" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0.5 x(A) + x(B)</text><text x="371" y="199" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">Dutch：新方向系数 0.8</text><path d="M408 452L643 452" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M408 452L408 242" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="643" y="500" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">迹分量 1</text><text x="408" y="226" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">迹分量 2</text><path d="M408 448L408 456" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="408" y="476" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M564.6667 448L564.6667 456" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="564.6667" y="476" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M404 295.2836L412 295.2836" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="399" y="300.2836" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M408 452L480.4833 452" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M486.3333 452L477.3333 456.5L477.3333 447.5Z" fill="#52687b"/><path d="M486.3333 452L581.9205 380.2868" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M586.6 376.7761L582.1014 385.7768L576.7003 378.5776Z" fill="#258375"/><path d="M408 452L581.2087 379.0469" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="actual" d="M586.6 376.7761L580.0524 384.4167L576.559 376.1224Z" fill="#7854a2"/><text x="447.1667" y="500" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5 x(A)</text><text x="578.6" y="358.7761" font-size="18" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">(1.14, 0.48)</text><text x="371" y="530" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0.5 x(A) + 0.8 x(B)</text><text x="24" y="592" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实线首尾相接；虚线是合成梯度记忆</text><text x="24" y="624" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两条迹都保存参数方向，而非两份状态值</text></g></svg>
