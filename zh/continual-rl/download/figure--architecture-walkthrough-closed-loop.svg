<svg xmlns="http://www.w3.org/2000/svg" width="720" height="852" viewBox="0 0 720 852" role="img" aria-labelledby="crl-vs7bmo-title crl-vs7bmo-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-vs7bmo-title">相同计算量，不同后续数据</title><desc id="crl-vs7bmo-desc">两种调度共用四步采集后的Q和模型。真实时间t固定为4时，各做两次模型备份：采样顺序先S远再A得到Q为0和5.4，反向先A再S远得到5.4和4.86。随后暂停模型调用，按当前Q贪心行动并持续真实更新三步。前者连续选近路，观察奖励2、2、2；后者选远路，观察0、0、6。到t=7两侧模型调用均为2，外部奖励合计均为6；四条模型边的真实观察次数分别为4、1、1、1和1、2、2、2。图展示调度对行为和数据分配的影响，不把每回合价值与单位真实时间收益互换。</desc><rect width="720" height="852" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同计算量，不同后续数据</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先计算，再行动；新经验写回模型</text><text x="28" y="130" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">采样顺序</text><text x="28" y="164" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">t=4：两次模型调用</text><circle cx="52" cy="208" r="6" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="52" y="194" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">k=0</text><path d="M62 208L158.5 208" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M165 208L155 213L155 203Z" fill="#7854a2"/><circle cx="175" cy="208" r="6" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="175" y="194" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">k=1</text><text x="175" y="238" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">S远=0</text><path d="M185 208L281.5 208" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path d