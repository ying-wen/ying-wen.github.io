="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">旧 q=0.4：0.9 ＜ 1</text><circle cx="48" cy="598" r="12" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M67 598L116.5 598" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M123 598L113 603L113 593Z" fill="#146ca1"/><circle cx="150" cy="598" r="18" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="150" y="604" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">扫</text><text x="184" y="604" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">再选分支</text><text x="28" y="641" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">校准 q=0.8：2.7 ＞ 1</text><text x="28" y="681" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一真实任务：机会损失 1.7</text></g></svg>
