<svg xmlns="http://www.w3.org/2000/svg" width="360" height="725" viewBox="0 0 360 725" role="img" aria-labelledby="crl-1pc1ujl-title crl-1pc1ujl-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1pc1ujl-title">观测模型错误也会改变规划排序</title><desc id="crl-1pc1ujl-desc">横轴给定三分类扫描模型q，两个误分类各(1-q)/2；纵轴是该模型的精确期望回报。仅画q在1/3到1，扫描价值为-0.9+4.5q，直接取左价值1不变。旧模型q=.4计算扫描.9故取左；用给定构造校准计数每行8个正确、两个各1个错误，最大似然q=.8，扫描2.7优于1。真实传感器始终q=.8，旧模型动作实际收益1，机会损失1.7。没有随机训练曲线；多次重复同一错误规划不改变模型。</desc><rect width="360" height="725" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">观测模型错误也会改变规划排序</text><text x="28" y="85" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">扫描后允许依信号取件</text><path d="M95.6 120L95.6 410" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M95.6 410L95.6 415" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="95.6" y="436" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.4</text><path d="M172.4 120L172.4 410" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M172.4 410L172.4 415" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="172.4" y="436" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.6</text><path d="M249.2 120L249.2 410" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M249.2 410L249.2 415" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="249.2" y="436" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.8</text><path d="M326 120L326 410" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path 