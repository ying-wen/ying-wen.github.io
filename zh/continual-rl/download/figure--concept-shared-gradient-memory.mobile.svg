<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="crl-eilktt-title crl-eilktt-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-eilktt-title">资格迹把过去的方向留到现在</title><desc id="crl-eilktt-desc">原创精确向量图。A到B到终点，奖励2、−1，gamma1、lambda0.5、alpha0.5。累积迹将旧A特征衰减为(0.5,0)并加上B特征(0.8,0.6)，得到(1.3,0.6)。Dutch迹将新B特征乘以1−0.5×0.5×0.8=0.8，得到(1.14,0.48)。两图坐标尺度一致。灰色实线为衰减历史，青色实线为新特征贡献，蓝或紫虚线是向量和，不表示模型生成数据。</desc><rect width="360" height="1040" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">资格迹把过去的方向留到现在</text><path d="M71 105L147.15 105" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M153 105L144 109.5L144 100.5Z" fill="#146ca1"/><text x="112" y="88" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">+2</text><circle cx="48" cy="105" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="48" y="112" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M199 105L276.15 105" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M282 105L273 109.5L273 100.5Z" fill="#146ca1"/><text x="240.5" y="88" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">−1</text><circle cx="176" cy="105" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="176" y="112" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="305" cy="105" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="305" y="112" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">⊥</text><circle cx="305" cy="105" r="27" fill="none" stroke="#146ca1" stroke-width="1" opacity="1"/><text x="24" y="160" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">到达终点时：先衰减 A，再加入 B</text><text x="24" y="199" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">累积：新方向系数 1</text><path d="M61 452L296 452" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M61 452L61 242" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="296" y="500" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">迹分量 1</text><text x="61" y="226" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">迹分量 2</text><path d="M61 448L61 456" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="61" y="476" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M217.6667 448L217.6667 456" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="217.6667" y="476" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M57 295.2836L65 295.2836" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="52" y="300.2836" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M61 452L133.4833 452" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M139.3333 452L130.3333 456.5L130.3333 447.5Z" fill="#52687b"/><path d="M139.3333 452L259.9872 361.4809" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M264.6667 357.9701L260.168 366.9708L254.7669 359.7717Z" fill="#258375"/><path d="M61 452L259.3554 360.4223" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="actual" d="M264.6667 357.9701L258.3817 365.8282L254.6092 357.6571Z" fill="#146ca1"/><text x="100.1667" y="500" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5 x(A)</text><text x="256.6667" y="339.9701" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">(1.3, 0.6)</text><text x="24" y="530" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0.5 x(A) + x(B)</text><text x="24" y="589" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">Dutch：新方向系数 0.8</text><path d="M61 842L296 842" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M61 842L61 632" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="296" y="890" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">迹分量 1</text><text x="61" y="616" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">迹分量 2</text><path d="M61 838L61 846" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="61" y="866" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M217.6667 838L217.6667 846" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="217.6667" y="866" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M57 685.2836L65 685.2836" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="52" y="690.2836" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M61 842L133.4833 842" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M139.3333 842L130.3333 846.5L130.3333 837.5Z" fill="#52687b"/><path d="M139.3333 842L234.9205 770.2868" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M239.6 766.7761L235.1014 775.7768L229.7003 768.5776Z" fill="#258375"/><path d="M61 842L234.2087 769.0469" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="actual" d="M239.6 766.7761L233.0524 774.4167L229.559 766.1224Z" fill="#7854a2"/><text x="100.1667" y="890" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5 x(A)</text><text x="231.6" y="748.7761" font-size="18" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">(1.14, 0.48)</text><text x="24" y="920" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0.5 x(A) + 0.8 x(B)</text><text x="24" y="982" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实线首尾相接；虚线是合成梯度记忆</text><text x="24" y="1014" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两条迹都保存参数方向，而非两份状态值</text></g></svg>
