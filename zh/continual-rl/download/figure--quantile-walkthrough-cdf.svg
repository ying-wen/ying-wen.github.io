<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img" aria-labelledby="crl-t6m9g5-title crl-t6m9g5-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-t6m9g5-title">交换坐标，看见分位数表示</title><desc id="crl-t6m9g5-desc">原创接单任务精算。左/上CDF在回报.5跳到.5，在2.5跳到1。右/下逆CDF在0&lt;tau&lt;=.5取.5，在.5&lt;tau&lt;=1取2.5；实心点为包含端点，空心点为不包含端点。紫色标出四个概率区间中点1/8、3/8、5/8、7/8，对应位置.5、.5、2.5、2.5，每点质量1/4。重合点合并后恢复二点真实分布。青虚线是固定回报1.5。此处真分位数由已知任务求得，尚未画学习估计。</desc><rect width="720" height="830" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">交换坐标，看见分位数表示</text><text x="28" y="84" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一浮动回报：.5 / 2.5，各半</text><path d="M70 355L330 355" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M70 355L70 175" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M70 355L70 361" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="70" y="383" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M113.3333 355L113.3333 361" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="113.3333" y="383" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><path d="M200 355L200 361" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="200" y="383" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.5</text><path d="M286.6667 355L286.6667 361" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="286.6667" y="383" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2.5</text><path d="M330 355L330 361" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="330" y="383" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M65 355L70 355" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="60" y="360" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M65 265L70 265" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="60" y="270" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M65 175L70 175" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="60" y="180" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><text x="330" y="415" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">回报 z</text><text x="70" y="151" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">CDF：P(G ≤ z)</text><path d="M70 355L113.3333 355" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M113.3333 355L113.3333 265" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M113.3333 265L286.6667 265" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M286.6667 265L286.6667 175" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M286.6667 175L330 175" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="113.3333" cy="265" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="286.6667" cy="175" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M410 355L670 355" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d