und" opacity="1"/><path d="M70 675L70 681" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="70" y="703" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M167.5 675L167.5 681" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="167.5" y="703" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><path d="M362.5 675L362.5 681" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="362.5" y="703" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.5</text><path d="M557.5 675L557.5 681" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="557.5" y="703" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2.5</text><path d="M655 675L655 681" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="655" y="703" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M65 675L70 675" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="60" y="680" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M65 620L70 620" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="60" y="625" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M65 565L70 565" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="60" y="570" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><text x="655" y="735" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">回报 G</text><text x="70" y="541" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">等质量点合