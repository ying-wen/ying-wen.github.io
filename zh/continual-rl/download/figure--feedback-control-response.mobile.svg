<svg xmlns="http://www.w3.org/2000/svg" width="360" height="979" viewBox="0 0 360 979" role="img" aria-labelledby="crl-iklpez-title crl-iklpez-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-iklpez-title">固定反馈怎样应对同一个推移？</title><desc id="crl-iklpez-desc">原创精确离散算例。每步0.1秒，x和u和d以厘米计；初始x0=x−1=0，仅d2=1，在0.2至0.3秒的转移末加入。圆形蓝线即时k=1.25，方形红虚线即时k=2.25，三角紫点线一步观测延迟k=1.25。上轴位置，下轴动作指令，所有条件共用相同坐标。延迟条件使用x[t−1]；控制器在动作前不知道d[t]。增益全程固定，没有参数训练，连接离散点的直线不表示连续时间轨迹。</desc><rect width="360" height="979" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="38" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">固定反馈怎样应对同一个推移？</text><text x="28" y="83" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">x′ = x + u + d；目标 x = 0</text><path d="M59 135L330 135" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M119.2222 135L119.2222 105.2" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M119.2222 100L123.2222 108L115.2222 108Z" fill="#b65a28"/><text x="131.2222" y="111" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">d₂ = +1 cm</text><path d="M28 174L55 174" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="41.5" cy="174" r="4" fill="#146ca1" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="67" y="179" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">即时 k=1.25</text><path d="M28 205L55 205" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 5"/><rect x="37.5" y="201" width="8" height="8" rx="0" fill="#b54142" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="67" y="210" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">过大 k=2.25</text><p