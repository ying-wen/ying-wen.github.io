<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1270" viewBox="0 0 360 1270" role="img" aria-labelledby="crl-1v48ch2-title crl-1v48ch2-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1v48ch2-title">沿前驱传播变化</title><desc id="crl-1v48ch2-desc">原创原书§8.4确定性优先扫描时序。新A到D样本先更新模型，并以残差1把A:cross入队，尚未直接改Q。第一次弹出把Qcross从1改为0；读取模型S:go到A算残差0.9并入队；第二次弹出把Qgo从0.9改为0，S选择exit。每次模型读取都计费，含只计算优先级的那一次；共3次读取、2次价值备份、2次弹出。紫虚线表示模型关系，橙箭头表示随后选择。</desc><rect width="360" height="1270" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">沿前驱传播变化</text><text x="28" y="83" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">原书顺序：先模型、入队，再改 Q</text><text x="28" y="115" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">入队 cross：P=1</text><g transform="translate(60,140)"><path d="M46.4575 75.5053L87.0383 52.0933" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M91.5425 49.4947L86.6119 56.9572L82.6141 50.0278Z" fill="#c8d6e0"/><path d="M38.4971 101.9941L59.1774 143.3549" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M61.5029 148.0059L54.3475 142.6393L61.5029 139.0616Z" fill="#c8d6e0"/><path d="M122.3581 52.4437L164.7123 89.1507" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M168.6419 92.5563L159.9767 90.3396L165.2161 84.2941Z" fill="#b54142"/><path d="M133 11L151 29" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M133 29L151 11" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="30" cy="85" r="18" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text