<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1030" viewBox="0 0 360 1030" role="img" aria-labelledby="crl-1d3s6ve-title crl-1d3s6ve-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1d3s6ve-title">相同预测起点，特征尺度改变写入</title><desc id="crl-1d3s6ve-desc">原创精确有限两回合Sarsa。相同两套normalized tile图，原特征单位范数，统一零初值。原尺度c1、alpha.6：第一步A继续值1.2、B终止更新后A值.72，下一次继续；特征全乘10但alpha仍.6：范数平方100，第一步A值120、B值60；terminal目标负1，第二次更新后A负1710、B负3600，下一次退出。乘10且alpha改.006：各事件的动作、目标、预测都与原尺度对应一致。条长以共同0到125价值轴展示第一步预测，仅为计算快照，不是训练表现曲线。alpha除以c平方的结论要求固定线性特征、相应权重变换及相同动作选择约定；任意逐维缩放不由单一标量步长修复。</desc><rect width="360" height="1030" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同预测起点，特征尺度改变写入</text><text x="28" y="82" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一 tiles；只改变幅度，再补偿步长</text><text x="28" y="116" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">零初值；第一条奖励 +2，旧尾值 0</text><text x="28" y="174" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">原尺度 c=1</text><text x="28" y="208" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">α=0.6；‖φ(A)‖²=1</text><path d="M42 258L318 258" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="42" y="244" width="2.6496" height="28" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="52.6496" y="235" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1.2</text><text x="42" y="292" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="174.48" y="292" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">60</text><text x="306.96" y="292" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">120</text><text x="28" y="328" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">第一步 q(A,继续)=1.2</text><text x="28" y="361" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">B 终止更新后：0.72</text><text x="28" y="394" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">再到 A：继续，奖励2</text><text x="28" y="425" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">放大 c=10</text><text x="28" y="459" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">α=0.6；‖φ(A)‖²=100</text><path d="M42 509L318 509" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="42" y="495" width="264.96" height="28" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="1"/><text x="306.96" y="486" font-size="18" fill="#b54142" text-anchor="end" font-weight="400" opacity="1">120</text><text x="28" y="579" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">第一步 q(A,继续)=120</text><text x="28" y="612" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">B 终止更新后：-1710</text><text x="28" y="645" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">再到 A：退出，奖励0</text><text x="28" y="676" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">c=10，α 除以100</text><text x="28" y="710" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">α=0.006；‖φ(A)‖²=100</text><path d="M42 760L318 760" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="42" y="746" width="2.6496" height="28" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="52.6496" y="737" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1.2</text><text x="28" y="830" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">第一步 q(A,继续)=1.2</text><text x="28" y="863" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">B 终止更新后：0.72</text><text x="28" y="896" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">再到 A：继续，奖励2</text><text x="28" y="958" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">条长：第一步的动作值；同一数值轴</text><text x="28" y="993" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">倍率 c²=100；补偿后每步预测一致</text></g></svg>
