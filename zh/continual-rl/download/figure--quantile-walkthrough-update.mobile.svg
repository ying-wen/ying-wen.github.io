<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1018" viewBox="0 0 360 1018" role="img" aria-labelledby="crl-zkki36-title crl-zkki36-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-zkki36-title">同一目标，四个位置怎样移动</title><desc id="crl-zkki36-desc">原创精算。后继v的准确四点快照0、0、4、4冻结，一条非终止转移r=.5 gamma=.5生成目标.5、.5、2.5、2.5，不是四条新环境样本。残差矩阵行是当前四个分位水平，列是全部目标原子，负残差红色、正残差蓝色。当前theta为1、1、2、2。每头平均pinball梯度g为.375、.125、-.125、-.375；1/N²损失梯度是g/4，取表参数步长4后位置为.625、.875、2.125、2.375。上下同一回报坐标；每个标记质量.25，竖直错开只为显示重合点，箭头显示参数移动。一步后均值1.5、下尾CVaR.5=.75，仍未达到真分布。</desc><rect width="360" height="1018" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一目标，四个位置怎样移动</text><text x="28" y="82" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">冻结 v=(0,0,4,4)，r=.5，γ=.5</text><text x="28" y="117" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">目标 Y=(.5,.5,2.5,2.5)；共 16 对</text><text x="115" y="149" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="175" y="149" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="235" y="149" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">2.5</text><text x="295" y="149" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">2.5</text><text x="73" y="201" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.125</text><rect x="85" y="165" width="57" height="57" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="0.1"/><text x="115" y="201" font-size="18" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">-0.5</text><rect x="145" y="165" width="57" height="57" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="