<svg xmlns="http://www.w3.org/2000/svg" width="360" height="811" viewBox="0 0 360 811" role="img" aria-labelledby="crl-1o8geeb-title crl-1o8geeb-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1o8geeb-title">旧回报平均在预测谁？</title><desc id="crl-1o8geeb-desc">一个独立的固定策略诊断：条件于S0,A，回报只能为2或4。旧S1策略A概率0.5，分布概率0.5和0.5，真实q为3；预先规定的当前S1策略A概率0.9，分布概率0.1和0.9，真实q为3.8。独立各采一条然后等权平均，输出2、3、4的概率为0.05、0.5、0.45，期望3.4。横位置表示回报或均值，圆面积表示概率，橙色竖线表示期望。此图枚举全部四个有序批次；两策略预先冻结，未对自适应控制器进行条件无偏性声明。</desc><rect width="360" height="811" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧回报平均在预测谁？</text><text x="22" y="80" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">条件于 S₀,A；只抽样后续 S₁ 动作</text><text x="22" y="112" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">旧策略：S₁ 的 A 概率 0.5</text><path d="M81.6667 223L298.3333 223" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M81.6667 220L81.6667 229" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="81.6667" cy="164" r="25.4558" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="0.22"/><text x="81.6667" y="171" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="81.6667" y="252" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M298.3333 220L298.3333 229" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="298.3333" cy="164" r="25.4558" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="0.22"/><text x="298.3333" y="171" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="298.3333" y="252" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M190 211L190 234" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="22" y="288" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">期望 = 3</text><text x="22" y="326" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">当前策略：S₁ 的 A 概率 0.9</text><path d="M81.6667 437L298.3333 437" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M81.6667 434L81.6667 443" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="81.6667" cy="378" r="11.3842" fill="#258375" stroke="#258375" stroke-width="2" opacity="0.22"/><text x="81.6667" y="385" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.1</text><text x="81.6667" y="466" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M298.3333 434L298.3333 443" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="298.3333" cy="378" r="34.1526" fill="#258375" stroke="#258375" stroke-width="2" opacity="0.22"/><text x="298.3333" y="385" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.9</text><text x="298.3333" y="466" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M276.6667 425L276.6667 448" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="22" y="502" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">期望 = 3.8</text><text x="22" y="540" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">各取一条，再平均</text><path d="M81.6667 651L298.3333 651" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M81.6667 648L81.6667 657" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="81.6667" cy="592" r="8.0498" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="0.22"/><text x="81.6667" y="599" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.05</text><text x="81.6667" y="680" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M190 648L190 657" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="190" cy="592" r="25.4558" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="0.22"/><text x="190" y="599" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="190" y="680" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M298.3333 648L298.3333 657" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="298.3333" cy="592" r="24.1495" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="0.22"/><text x="298.3333" y="599" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.45</text><text x="298.3333" y="680" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M233.3333 639L233.3333 662" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="22" y="716" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">期望 = 3.4</text><text x="22" y="772" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">圆面积 ∝ 概率；橙线是期望</text></g></svg>
