<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1234" viewBox="0 0 720 1234" role="img" aria-labelledby="crl-1ns9zly-title crl-1ns9zly-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1ns9zly-title">actor 沿着什么方向改变动作？</title><desc id="crl-1ns9zly-desc">确定性actor等于标量参数theta；给定critic为负的动作与0.8之差的平方。theta为零时斜率1.6，步长0.1使动作变成0.16，给定critic值从负0.64升至负0.4096。橙切线是梯度方向，不是环境轨迹。下方真实行为取噪声0.3并执行动作0.3。另一行在replay后继状态上，target actor0.9加噪声3，先将噪声裁为0.2，再将动作1.1裁为1；两个target critic给3和2，奖励1及折扣0.9得到标签2.8。模型路径虚线，不额外调用环境。</desc><rect width="720" height="1234" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="38" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">actor 沿着什么方向改变动作？</text><text x="20" y="76" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">固定一个状态与 critic：Q(a) = −(a−.8)²</text><path d="M183.037 112L183.037 357" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M183.037 357L183.037 362" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="183.037" y="383" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M362.2963 112L362.2963 357" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M362.2963 357L362.2963 362" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="362.2963" y="383" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.4</text><path d="M541.5556 112L541.5556 357" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M541.5556 357L541.5556 362" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="541.5556" y="383" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0