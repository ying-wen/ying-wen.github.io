<svg xmlns="http://www.w3.org/2000/svg" width="360" height="684" viewBox="0 0 360 684" role="img" aria-labelledby="crl-1vonmic-title crl-1vonmic-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1vonmic-title">两条路线，共用一个物理时钟</title><desc id="crl-1vonmic-desc">原创确定性半MDP。启动E到H花2秒奖励负3。快环H到A花1秒奖励0，A到H花1秒奖励4。慢环H到B花1秒奖励0，B到H花3秒奖励9。水平长度严格按秒；每个实心小圆点代表1奖励，奖励在动作结束时到账。回H是自然转移，没有重置。</desc><rect width="360" height="684" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两条路线，共用一个物理时钟</text><text x="28" y="84" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">边上的数是「奖励，秒」</text><circle cx="48" cy="135" r="17" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="48" y="141" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">E</text><circle cx="182" cy="135" r="17" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="182" y="141" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">H</text><path d="M68 135L155.5 135" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M162 135L152 140L152 130Z" fill="#52687b"/><text x="115" y="116" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">−3，2</text><text x="206" y="141" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">仅启动一次</text><text x="28" y="200" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">快环</text><path d="M48 236L48 324" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="48" y="350" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M115 236L115 324" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="115" y="350" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M182 236L182 324" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="182" y="350" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M249 236L249 324" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="249" y="350" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M316 236L316 324" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="316" y="350" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M68 258L88.5 258" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M95 258L85 263L85 253Z" fill="#146ca1"/><path d="M135 258L155.5 258" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M162 258L152 263L152 253Z" fill="#146ca1"/><circle cx="48" cy="258" r="17" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="48" y="264" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">H</text><circle cx="115" cy="258" r="17" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="115" y="264" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="182" cy="258" r="17" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="182" y="264" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">H</text><text x="81.5" y="230" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0，1</text><text x="148.5" y="230" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">4，1</text><circle cx="170" cy="289" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="182" cy="289" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="194" cy="289" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="170" cy="301" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="384" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">4 奖励 / 2 秒 = 2 奖励/秒</text><text x="28" y="425" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">慢环</text><path d="M48 461L48 549" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="48" y="575" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M115 461L115 549" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="115" y="575" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M182 461L182 549" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="182" y="575" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M249 461L249 549" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="249" y="575" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M316 461L316 549" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="316" y="575" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M68 483L88.5 483" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M95 483L85 488L85 478Z" fill="#b65a28"/><path d="M135 483L289.5 483" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M296 483L286 488L286 478Z" fill="#b65a28"/><circle cx="48" cy="483" r="17" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="48" y="489" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">H</text><circle cx="115" cy="483" r="17" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="115" y="489" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="316" cy="483" r="17" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="316" y="489" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">H</text><text x="81.5" y="455" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">0，1</text><text x="215.5" y="455" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">9，3</text><circle cx="304" cy="514" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="316" cy="514" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="328" cy="514" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="304" cy="526" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="316" cy="526" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="328" cy="526" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="304" cy="538" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="316" cy="538" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="328" cy="538" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="609" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">9 奖励 / 4 秒 = 2.25 奖励/秒</text><text x="332" y="647" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">从 H 出发后的秒数</text></g></svg>
