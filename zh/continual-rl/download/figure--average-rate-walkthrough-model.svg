<svg xmlns="http://www.w3.org/2000/svg" width="720" height="730" viewBox="0 0 720 730" role="img" aria-labelledby="crl-o84ne8-title crl-o84ne8-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-o84ne8-title">时长模型过时，规划动作也会错</title><desc id="crl-o84ne8-desc">奖励和终点完全不变，仅B回H由3秒变4秒。紫色虚线旧模型仍预测完整慢环4秒得9，率2.25；橙色实线真实世界完整慢环5秒得9，率1.8。下方共用奖励每秒坐标，蓝虚线快环2不变。旧模型偏好慢环，更新时间后偏好快环。此图比较两个给定模型，不是训练曲线。</desc><rect width="720" height="730" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">时长模型过时，规划动作也会错</text><text x="28" y="86" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">只改变 B → H 的耗时</text><text x="28" y="130" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">旧模型</text><path d="M82 200L82 212" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="82" y="233" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M192.8 200L192.8 212" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="192.8" y="233" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M303.6 200L303.6 212" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="303.6" y="233" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M414.4 200L414.4 212" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="414.4" y="233" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M525.2 200L525.2 212" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="525.2" y="233" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M636 200L636 212" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="636" y="233" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">5</text><path d="M82 205L636 205" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="82" cy="174" r="17" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="82" y="180" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">H</text><path d="M102 174L166.3 174" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M172.8 174L162.8 179L162.8 169Z" fill="#7854a2"/><circle cx="192.8" cy="174" r="17" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="192.8" y="180" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M212.8 174L498.7 174" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M505.2 174L495.2 179L495.2 169Z" fill="#7854a2"/><circle cx="525.2" cy="174" r="17" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="525.2" y="180" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">H</text><text x="359" y="151" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">9 奖励，3 秒</text><text x="28" y="320" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">改变后的世界</text><path d="M82 390L82 402" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="82" y="423" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M192.8 390L192.8 402" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="192.8"