<svg xmlns="http://www.w3.org/2000/svg" width="360" height="955" viewBox="0 0 360 955" role="img" aria-labelledby="crl-l7yoxc-title crl-l7yoxc-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-l7yoxc-title">随机假设要持续到信息到达</title><desc id="crl-l7yoxc-desc">原创候选模型已知、真实模型未知的有限走廊精算。位置0到10与确定性左右转移已知，每格safe奖励.25后真终止，右端只在到达时抽一个Y，low成功率.2、high成功率.8。图中问号是未收到反馈，不能读取真theta。gamma1，每episode最多H次decision；此图用长度等于H。high采样模型选择连续right，low选择safe。每步独立重抽且未终止前q=.5不变，到达概率q的H次方；episode固定模型到达q。线和点是精确概率，非训练曲线。H10下固定模型平均实际动作5.5，每步重抽1023/512约1.998，最大预算相同而实际成本不同。旧公平左右几何诊断也恰好2的负H次方，但没有safe动作与后验消费者。</desc><rect width="360" height="955" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">随机假设要持续到信息到达</text><text x="28" y="86" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">位置可见；端点模型 low / high 未知</text><circle cx="49" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="49" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M68 144L94.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M99 144L92 147.5L92 140.5Z" fill="#b65a28"/><circle cx="118" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="118" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M137 144L163.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M168 144L161 147.5L161 140.5Z" fill="#b65a28"/><circle cx="187" cy="144" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="187" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M206 144L270.45 144" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M275 144L268 147.5L268 140.5Z" fill="#b65a28"/><circle cx="294" cy="144" r="18" fill="#e7ebef" stroke="#52687b" stroke-width="2" opacity="1"/><text x="294" y="150" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">?</text><text x="239" y="129" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">⋯</text><path d="M49 164L49 220.8" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M49 226L45 218L53 218Z" fill="#258375"/><circle cx="49" cy="247" r="18" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="49" cy="247" r="13" fill="none" stroke="#258375" stroke-width="2" opacity="1"/><text x="49" y="253" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="78" y="250" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">safe：.25 到账即终止</text><text x="28" y="290" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">普通一步：位置改变、奖励 0、q 不变</text><text x="28" y="326" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">到 x=10：抽一次 Y，才更新模型后验</text><text x="28" y="373" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一初始 q=.5，最多 H 次动作</text><path d="M62 419L62 650" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M62 650L62 655" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="62" y="676" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M148.3333 419L148.3333 650" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M148.3333 650L148.3333 655" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="148.3333" y="676" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M234.6667 419L234.6667 650" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M234.6667 650L234.6667 655" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="234.6667" y="676" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">7</text><path d="M321 419L321 650" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M321 650L321 655" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="321" y="676" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">10</text><path d="M62 650L321 650" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M57 650L62 650" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="52" y="655" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M62 534.5L321 534.5" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M57 534.5L62 534.5" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="52" y="539.5" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.25</text><path d="M62 419L321 419" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M57 419L62 419" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="52" y="424" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M62 419L62 650" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M62 650L321 650" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="321" y="704" font-size="18" fill="#19354e" text-anchor="end" font-weight="400" opacity="1">走廊长度 = 动作上限 H</text><text x="62" y="401" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">收到端点反馈的概率</text><path d="M62 419L90.7778 419L119.5556 419L148.3333 419L177.1111 419L205.8889 419L234.6667 419L263.4444 419L292.2222 419L321 419" fill="none" stroke="#7854a2" stroke-width="3"/><path d="M62 419L90.7778 534.5L119.5556 592.25L148.3333 621.125L177.1111 635.5625L205.8889 642.7813L234.6667 646.3906L263.4444 648.1953L292.2222 649.0977L321 649.5488" fill="none" stroke="#b65a28" stroke-width="3" stroke-dasharray="6 4"/><circle cx="321" cy="419" r="5" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><rect x="316" y="644.5488" width="10" height="10" rx="0" fill="#b65a28" stroke="#b65a28" stroke-width="1.5" opacity="1"/><path d="M28 743L64 743" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="76" y="752" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">episode 固定模型：q=.5</text><path d="M28 781L64 781" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="6 4"/><text x="76" y="790" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">每步重抽模型：qᴴ=1/1024</text><text x="28" y="840" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">H=10：期望实际动作数</text><text x="28" y="878" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">固定模型 5.5；每步重抽 1.998</text><text x="28" y="915" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">safe 可能提早结束；比较须保留成本</text></g></svg>
