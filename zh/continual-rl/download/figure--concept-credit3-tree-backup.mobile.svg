<svg xmlns="http://www.w3.org/2000/svg" width="360" height="990" viewBox="0 0 360 990" role="img" aria-labelledby="crl-qsjyc-title crl-qsjyc-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-qsjyc-title">只沿采样分支展开</title><desc id="crl-qsjyc-desc">冻结Q和目标策略，gamma=.9。首奖励1。下一状态动作0概率.25、旧Q2，动作1概率.75、旧Q4。实际采到动作0，再得奖励6并真正终止。Tree Backup只将动作0的旧Q2换成实际回报6，目标1+.9*(.25*6+.75*4)=5.05；完全采样的两步Sarsa目标6.4。虚线只表示读取未采样分支的旧预测，不是模拟了其后果。</desc><rect width="360" height="990" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="42" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">只沿采样分支展开</text><g transform="translate(24,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 哪条分支有新经验？</text><path d="M0 25L312 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="156" cy="62" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="156" y="68" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">Q?</text><path d="M156 85L156 128.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M156 135L151 125L161 125Z" fill="#146ca1"/><text x="175" y="116" font-size="19" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">R=1</text><circle cx="156" cy="158" r="19" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><text x="156" y="165" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><path d="M141 174L79.2839 218.2145" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M74 222L79.2172 212.1116L85.0411 220.2407Z" fill="#146ca1"/><path d="M171 174L239.5468 218.4628" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="actual" d="M245 222L233.8894 220.7529L239.3313 212.3633Z" fill="#7854a2"/><text x="10" y="198" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">π=.25</text><text x="312" y="198" font-size="18" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">π=.75</text><circle cx="64" cy="240" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="255" cy="240" r="10" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="64" y="274" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">旧 Q=2</text><path d="M34 266L93 266" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="255" y="274" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">旧 Q=4</text><path d="M64 289L64 323.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M64 330L59 320L69 320Z" fill="#146ca1"/><text x="85" y="315" font-size="19" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">R=6</text><rect x="44" y="338" width="40" height="40" rx="3" fill="#ffffff" stroke="#19354e" stroke-width="1.5" opacity="1"/><rect x="49" y="343" width="30" height="30" rx="2" fill="#ffffff" stroke="#19354e" stroke-width="1.5" opacity="1"/><text x="64" y="364" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="255" y="327" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">没有这条</text><text x="255" y="352" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">分支的经验</text><text x="156" y="410" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">实线：采样；虚线：读取旧预测</text></g><g transform="translate(24,553)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 只替换这条分支</text><path d="M0 25L312 25" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="0" y="60" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">按目标策略给叶节点加权</text><rect x="0" y="100" width="66.0938" height="30" rx="2" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="1"/><rect x="66.0938" y="100" width="132.1875" height="30" rx="2" fill="#7854a2" stroke="#7854a2" stroke-width="1.5" opacity="1"/><text x="33.0469" y="154" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1.5</text><text x="132.1875" y="154" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">3</text><text x="0" y="191" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">.25×6 + .75×4 = 4.5</text><path d="M156 209L156 231.5" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M156 238L151 228L161 228Z" fill="#b65a28"/><text x="173" y="230" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">×.9，+1</text><text x="156" y="279" font-size="24" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Tree Backup = 5.05</text><path d="M0 313L312 313" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="0" y="354" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">只沿采样分支：</text><text x="0" y="394" font-size="23" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">1 + .9×6 = 6.4</text></g></g></svg>
