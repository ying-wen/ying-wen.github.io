<svg xmlns="http://www.w3.org/2000/svg" width="720" height="570" viewBox="0 0 720 570" role="img" aria-labelledby="crl-4ma1dl-title crl-4ma1dl-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-4ma1dl-title">从经验提出一个到达问题</title><desc id="crl-4ma1dl-desc">原创精确算例。图只显示5条已观察转移；A、C处灰色未知动作没有显示真实终点，Y尚未观察。已知本地动作清单的非终止状态中，存在未试动作且从S数据支持可达的状态生成候选。每次只试一个动作，A距离1得分1/2，C距离2得分1/3。分数表示覆盖效率，不是外部奖励。</desc><rect width="720" height="570" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">从经验提出一个到达问题</text><text x="28" y="83" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">已观察 5 条转移；灰色 ? 为未知后果</text><g transform="translate(25,125)"><path d="M42.1791 131.2567L102.7452 82.8038" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M107.8209 78.7433L103.1357 88.8946L96.8887 81.0859Z" fill="#c8d6e0"/><path d="M41.828 159.171L98.2 206.6421" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M103.172 210.829L92.3022 208.2122L98.7435 200.5631Z" fill="#c8d6e0"/><path d="M147 65L251.5 65" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M258 65L248 70L248 60Z" fill="#c8d6e0"/><path d="M142 225L226.5 225" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M233 225L223 230L223 220Z" fill="#c8d6e0"/><path d="M258.3963 203.2637L275.6003 93.1583" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M276.6037 86.7363L280 97.3883L270.1199 95.8445Z" fill="#c8d6e0"/><circle cx="25" cy="145" r="22" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="25" y="151" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="125" cy="65" r="22" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="125" y="71" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="120" cy="225" r="22" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="120" y="231" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="255" cy="225" r="22" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="255" y="231" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">C</text><circle cx="280" cy="65" r="22" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="280" cy="65" r="17" fill="none" stroke="#52687b" stroke-width="1" opacity="1"/><text x="280" y="71" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">X</text><path d="M125 41L125 5" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="125" y="-6" font-size="22" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><path d="M255 249L255 285" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="255" y="306" font-size="22" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text></g><text x="28" y="475" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">虚线短桩只表示“可尝试的动作”</text><text x="28" y="502" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">Y 未观察，不进入候选集合</text><text x="390" y="145" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">候选由未试动作产生</text><text x="390" y="193" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">A：路程 1 + 探测 1 步</text><rect x="390" y="209" width="290" height="20" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="390" y="259" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">覆盖分数 = 1/2</text><text x="390" y="293" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">C：路程 2 + 探测 1 步</text><rect x="390" y="309" width="193.3333" height="20" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="390" y="359" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">覆盖分数 = 1/3</text><text x="390" y="415" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">先选 A：一条新记录 / 2 步</text><text x="390" y="447" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">覆盖分数的单位：记录 / 原子步</text></g></svg>
