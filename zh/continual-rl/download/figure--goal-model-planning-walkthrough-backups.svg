<svg xmlns="http://www.w3.org/2000/svg" width="720" height="895" viewBox="0 0 720 895" role="img" aria-labelledby="crl-1xbs86v-title crl-1xbs86v-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1xbs86v-title">模型改了，价值何时变</title><desc id="crl-1xbs86v-desc">精确同步Bellman备份轨迹。暖启动采用旧模型固定点，上路价值0.9、下路0.81。修正模型后第一轮把A价值从1置0，第二轮才把起点上路价值置0；策略转向下路，关闸后真实回报从0变成0.81。紫虚线旧模型规划始终偏好上路。每轮5次模型调用，真实新数据始终两步；下图由全知道路做只读精确评价，不计为新训练数据。</desc><rect width="720" height="895" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">模型改了，价值何时变</text><text x="28" y="83" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">从旧 Q 开始；每轮 5 次模型调用</text><path d="M28 114L55 114" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="7 4"/><text x="65" y="120" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">旧模型：上路</text><path d="M28 142L55 142" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="65" y="148" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">新模型：上路</text><path d="M28 170L55 170" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="2 5"/><text x="65" y="176" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">下路（两模型相同）</text><path d="M85 190L85 410" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M85 410L85 415" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="85" y="436" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M275 190L275 410" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M275 410L275 41