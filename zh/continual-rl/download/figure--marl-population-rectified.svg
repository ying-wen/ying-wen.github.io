<svg xmlns="http://www.w3.org/2000/svg" width="720" height="876" viewBox="0 0 720 876" role="img" aria-labelledby="crl-t6vt3c-title crl-t6vt3c-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-t6vt3c-title">安全混合不等于全部回应能力</title><desc id="crl-t6vt3c-desc">原创一步解析计算。圆盘博弈phi(v,w)=v1w2-v2w1；三点初始半径0.5、角度0和正负120度，均匀权重各三分之一。普通Nash响应目标处处为零；正部目标梯度采用零处零次梯度，步长0.6得到紫色三点。新旧均匀混合均为原点，故两种群相对游戏值零；A对旧B收益从0.2165增至0.2665。图为坐标窗，不表示单位圆盘的全部边界。</desc><rect width="720" height="876" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">安全混合不等于全部回应能力</text><text x="24" y="87" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 回应整个 Nash 混合</text><g transform="translate(24,106)"><path d="M16 182L300 182" fill="none" stroke="#c8d6e0" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M158 39L158 324" fill="none" stroke="#c8d6e0" stroke-width="1.5" stroke-linecap="round" opacity="1"/><circle cx="158" cy="182" r="105" fill="none" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><polygon points="263,182 105.5,91.0673 105.5,272.9327" fill="#f0f2f4" stroke="#52687b" stroke-width="2"/><circle cx="263" cy="182" r="6" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="275" y="171" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A</text><circle cx="105.5" cy="91.0673" r="6" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="117.5" y="80.0673" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">B</text><circle cx="105.5" cy="272.9327" r="6" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="117.5" y="261.9327" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">C</text><circle cx="158" cy="182" r="6" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="151" y="210" font-size="17" fill="#258375" text-anchor="end" font-weight="400" opacity="1">均值 0</text><text x="158" y="359" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">对均匀 Nash：目标为 0</text><text x="158" y="394" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">梯度为零，三点均不动</text></g><text x="378" y="87" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 回应正部收益目标</text><g transform="translate(378,106)"><path d="M16 182L300 182" fill="none" stroke="#c8d6e0" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M158 39L158 324" fill="none" stroke="#c8d6e0" stroke-width="1.5" stroke-linecap="round" opacity="1"/><circle cx="158" cy="182" r="105" fill="none" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><polygon points="263,182 105.5,91.0673 105.5,272.9327" fill="#f0f2f4" stroke="#52687b" stroke-width="2"/><polygon points="281.1865,171.5 87.3135,80.5673 105.5,293.9327" fill="#efe9f780" stroke="#7854a2" stroke-width="2"/><circle cx="263" cy="182" r="6" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M263 182L277.809 173.45" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M281.1865 171.5L277.4904 177.0981L274.4904 171.9019Z" fill="#7854a2"/><circle cx="281.1865" cy="171.5" r="5" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="293.1865" y="160.5" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">A</text><circle cx="105.5" cy="91.0673" r="6" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M105.5 91.0673L90.691 82.5173" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M87.3135 80.5673L94.0096 80.9693L91.0096 86.1654Z" fill="#7854a2"/><circle cx="87.3135" cy="80.5673" r="5" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="99.3135" y="69.5673" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">B</text><circle cx="105.5" cy="272.9327" r="6" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M105.5 272.9327L105.5 290.0327" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M105.5 293.9327L102.5 287.9327L108.5 287.9327Z" fill="#7854a2"/><circle cx="105.5" cy="293.9327" r="5" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="117.5" y="282.9327" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">C</text><circle cx="158" cy="182" r="6" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="151" y="210" font-size="17" fill="#258375" text-anchor="end" font-weight="400" opacity="1">均值 0</text><text x="158" y="359" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">成员各自响应正部目标</text><text x="158" y="394" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">紫箭头：一次解析更新</text></g><text x="28" y="587" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两组三点均匀混合都在原点</text><text x="28" y="631" font-size="22" fill="#258375" text-anchor="start" font-weight="400" opacity="1">相对种群游戏值：0 → 0</text><text x="28" y="676" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">点的半径：0.500 → 0.589</text><text x="28" y="719" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">A 对旧 B 的收益</text><text x="28" y="753" font-size="22" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">0.2165 → 0.2665</text><text x="28" y="805" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">保留旧点 + 新点：可选集合扩大</text><text x="28" y="842" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">初始半径 0.5；步长 0.6</text></g></svg>
