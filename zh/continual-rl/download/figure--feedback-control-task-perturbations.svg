<svg xmlns="http://www.w3.org/2000/svg" width="720" height="763" viewBox="0 0 720 763" role="img" aria-labelledby="crl-1v64tj2-title crl-1v64tj2-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1v64tj2-title">相同扰动大小，不同校正动作</title><desc id="crl-1v64tj2-desc">原创确定性精确算例，延续正文已有的一步最小动作平方和问题。两个分量无量纲，起点均为(.5,.5)。左或上加(.2,.2)后为(.7,.7)，误差e=−.4，动作(−.2,−.2)恢复(.5,.5)，动作平方和.08。右或下加(.2,−.2)后为(.7,.3)，误差0，动作0，保留该状态。两扰动平方长度均.08。横轴是三个有序事件，不表示等时长；蓝实线圆点为x1，青虚线方点为x2；相关条件两条分量轨迹重合。控制规则固定，没有跨试次参数更新。</desc><rect width="720" height="763" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同扰动大小，不同校正动作</text><text x="28" y="83" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一起点 (0.5, 0.5)，任务 x₁+x₂=1</text><path d="M28 121L55 121" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="41.5" cy="121" r="4" fill="#146ca1" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="67" y="126" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">x₁</text><path d="M195 121L222 121" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="7 5"/><rect x="204.5" y="117" width="8" height="8" rx="0" fill="#258375" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="234" y="126" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">x₂</text><text x="28" y="185" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">任务相关扰动</text><text x="28" y="218" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">Δx = (0.2, 0.2)</text><path d="M67 505L318 505" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M62 505L67 505" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="57" y="510" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M67 394.5L318 394.5" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M62 394.5L67 394.5" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="57" y="399.5" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M67 284L318 284" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M62 284L67 284" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="57" y="289" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M67 284L67 505" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M67 505L318 505" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="67" y="266" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">分量 / 无量纲</text><path d="M67 394.5L318 394.5" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><path d="M67 394.5L192.5 350.3L318 394.5" fill="none" stroke="#146ca1" stroke-width="4"/><circle cx="67" cy="394.5" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="192.5" cy="350.3" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="318" cy="394.5" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M67 394.5L192.5 350.3L318 394.5" fill="none" stroke="#258375" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="63" y="390.5" width="8" height="8" rx="0" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><rect x="188.5" y="346.3" width="8" height="8" rx="0" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><rect x="314" y="390.5" width="8" height="8" rx="0" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="67" y="535" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">扰动前</text><text x="192.5" y="535" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">扰动后</text><text x="318" y="535" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">动作后</text><text x="28" y="578" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">e：0 → -0.4 → 0</text><text x="28" y="610" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">u = (-0.2, -0.2)</text><text x="28" y="642" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">动作平方和：0.08</text><text x="380" y="185" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">冗余方向扰动</text><text x="380" y="218" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">Δx = (0.2, -0.2)</text><path d="M419 505L670 505" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M414 505L419 505" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="409" y="510" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M419 394.5L670 394.5" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M414 394.5L419 394.5" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="409" y="399.5" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M419 284L670 284" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M414 284L419 284" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="409" y="289" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M419 284L419 505" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M419 505L670 505" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="419" y="266" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">分量 / 无量纲</text><path d="M419 394.5L670 394.5" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><path d="M419 394.5L544.5 350.3L670 350.3" fill="none" stroke="#146ca1" stroke-width="4"/><circle cx="419" cy="394.5" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="544.5" cy="350.3" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="670" cy="350.3" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M419 394.5L544.5 438.7L670 438.7" fill="none" stroke="#258375" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="415" y="390.5" width="8" height="8" rx="0" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><rect x="540.5" y="434.7" width="8" height="8" rx="0" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><rect x="666" y="434.7" width="8" height="8" rx="0" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="419" y="535" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">扰动前</text><text x="544.5" y="535" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">扰动后</text><text x="670" y="535" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">动作后</text><text x="380" y="578" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">e：0 → 0 → 0</text><text x="380" y="610" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">u = (0, 0)</text><text x="380" y="642" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">动作平方和：0</text><text x="28" y="698" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两个扰动的平方长度同为 0.08</text><text x="28" y="729" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">固定规则只根据 e = 1−x₁−x₂ 选择动作</text></g></svg>
