<svg xmlns="http://www.w3.org/2000/svg" width="720" height="684" viewBox="0 0 720 684" role="img" aria-labelledby="crl-dlm4nw-title crl-dlm4nw-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-dlm4nw-title">两条路线，共用一个物理时钟</title><desc id="crl-dlm4nw-desc">原创确定性半MDP。启动E到H花2秒奖励负3。快环H到A花1秒奖励0，A到H花1秒奖励4。慢环H到B花1秒奖励0，B到H花3秒奖励9。水平长度严格按秒；每个实心小圆点代表1奖励，奖励在动作结束时到账。回H是自然转移，没有重置。</desc><rect width="720" height="684" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两条路线，共用一个物理时钟</text><text x="28" y="84" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">边上的数是「奖励，秒」</text><circle cx="80" cy="135" r="17" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="80" y="141" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">E</text><circle cx="364" cy="135" r="17" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="364" y="141" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">H</text><path d="M100 135L337.5 135" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M344 135L334 140L334 130Z" fill="#52687b"/><text x="222" y="116" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">−3，2</text><text x="388" y="141" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">仅启动一次</text><text x="28" y="200" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">快环</text><path d="M80 236L80 324" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="80" y="350" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M222 236L222 324" fill="none" s