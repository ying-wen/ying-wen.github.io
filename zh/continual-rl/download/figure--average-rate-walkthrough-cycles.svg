<text x="28" y="609" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">9 奖励 / 4 秒 = 2.25 奖励/秒</text><text x="692" y="647" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">从 H 出发后的秒数</text></g></svg>
