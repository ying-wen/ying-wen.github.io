t-weight="400" opacity="1">0，1</text><text x="293" y="230" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">4，1</text><circle cx="352" cy="289" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="364" cy="289" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="376" cy="289" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="352" cy="301" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="384" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">4 奖励 / 2 秒 = 2 奖励/秒</text><text x="28" y="425" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">慢环</text><path d="M80 461L80 549" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="80" y="575" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M222 461L222 549" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="222" y="575" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M364 461L364 549" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="364" y="575" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M506 461L506 549" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="506" y="575" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M648 461L648 549" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 4"/><text x="648" y="575" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M100 483L195.5 483" fill="no