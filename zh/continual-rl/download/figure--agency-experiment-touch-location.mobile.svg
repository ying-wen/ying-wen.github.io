<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1811" viewBox="0 0 360 1811" role="img" aria-labelledby="crl-b4lcof-title crl-b4lcof-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-b4lcof-title">橡胶手：体验与位置怎样分开测？</title><desc id="crl-b4lcof-desc">装置与程序示意，依据Botvinick与Cohen1998年原文p756，以及Rohde等2011年Methods和Figure1原创重绘。上部显示立屏遮住左手和两画笔刷触，读者看见的虚线真手不是参与者可见信息。后续实验用黑布遮住真手，通过半透镜切换可见假手与暗场白点；实验2定位时刷触暂停，以鼠标调整光点三次取平均。时间线只累计120秒刺激，紫色标记为暂停定位事件，未编码暂停耗时。另有40秒组；仅观看控制只用于10秒与120秒组且总为第三块。未绘制实验数据、所有感强度或漂移量。</desc><rect width="360" height="1811" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="20" y="39" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">橡胶手：体验与位置怎样分开测？</text><text x="20" y="78" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同步刷触后，分别询问体验与位置</text><text x="20" y="121" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1998：屏风遮住真实左手</text><rect x="26" y="158" width="308" height="245" rx="6" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="37" y="188" width="126" height="159" rx="2" fill="#e4eaf0" stroke="#52687b" stroke-width="1.5" opacity="1"/><g transform="translate(100 293) rotate(0) scale(-0.8 0.8)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#52687b" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M-19 14Q3 7 23 14" fill="none" stroke="#52687b" stroke-width="1.2"/></g><g transform="translate(260 293) rotate(0) scale(-0.8 0.8)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" /><path d="M-19 14Q3 7 23 14" fill="none" stroke="#146ca1" stroke-width="1.2"/></g><path d="M176.8 164L176.8 355" fill="none" stroke="#19354e" stroke-width="8" stroke-linecap="round" opacity="1"/><path d="M89 217L107 187" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M84 224L94 210" fill="none" stroke="#b65a28" stroke-width="8" stroke-linecap="round" opacity="1"/><path d="M249 217L267 187" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M244 224L254 210" fill="none" stroke="#b65a28" stroke-width="8" stroke-linecap="round" opacity="1"/><text x="100" y="376" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">真实左手</text><text x="260" y="376" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">橡胶左手</text><path d="M203.6 419Q221.6 402 239.6 419Q221.6 436 203.6 419Z" fill="#ffffff" stroke="#19354e" stroke-width="2"/><circle cx="221.6" cy="419" r="6" fill="#19354e" stroke="none" stroke-width="2" opacity="1"/><path d="M221.6 403L257.4143 340.5115" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M260 336L259.4924 344.9299L252.5515 340.9518Z" fill="#146ca1"/><path d="M221.6 403L176.8 355" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/><text x="138.4" y="420" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">屏风</text><text x="221.6" y="455" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">参与者只看见假手</text><text x="20" y="490" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">读者俯视示意；虚线真手在遮挡内</text><path d="M20 518L340 518" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="20" y="554" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2011：照明切换，把位置单独测出</text><text x="20" y="599" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">照明：看假手</text><rect x="28" y="633" width="304" height="163" rx="4" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><g transform="translate(196 759) rotate(0) scale(-0.82 0.82)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" /><path d="M-19 14Q3 7 23 14" fill="none" stroke="#146ca1" stroke-width="1.2"/></g><path d="M188 680L206 650" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M183 687L193 673" fill="none" stroke="#b65a28" stroke-width="8" stroke-linecap="round" opacity="1"/><text x="180" y="823" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">照明关闭后，假手消失</text><text x="20" y="856" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">黑布下真实手仍被刷触</text><text x="20" y="921" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">暗场：只看白点</text><rect x="28" y="955" width="304" height="163" rx="4" fill="#19354e" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="215.2" cy="1013" r="7" fill="#ffffff" stroke="none" stroke-width="2" opacity="1"/><path d="M132 1067L196.65 1067" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M201.2 1067L194.2 1070.5L194.2 1063.5Z" fill="#ffffff"/><text x="180" y="1094" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">调整光点的位置</text><text x="20" y="1178" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">刷触暂停；三次调整取平均</text><text x="20" y="1220" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两机械臂刷触；真手一直在黑布下</text><text x="20" y="1251" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">左右相隔 17 cm；光点经半透镜投射</text><path d="M20 1277L340 1277" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="20" y="1316" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实验 2：同为 120 秒刺激</text><text x="20" y="1349" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每组内比较同步和异步两块</text><text x="20" y="1395" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 × 120 秒后定位</text><path d="M32 1427L328 1427" fill="none" stroke="#146ca1" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="328" cy="1427" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M328 1434L328 1447" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="32" y="1477" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0</text><text x="328" y="1477" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">120 秒刺激</text><text x="20" y="1512" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">12 × 10 秒，各段后定位</text><path d="M32 1544L328 1544" fill="none" stroke="#146ca1" stroke-width="8" stroke-linecap="round" opacity="1"/><circle cx="56.6667" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M56.6667 1551L56.6667 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="81.3333" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M81.3333 1551L81.3333 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="106" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M106 1551L106 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="130.6667" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M130.6667 1551L130.6667 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="155.3333" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M155.3333 1551L155.3333 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="180" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M180 1551L180 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="204.6667" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M204.6667 1551L204.6667 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="229.3333" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M229.3333 1551L229.3333 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="254" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M254 1551L254 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="278.6667" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M278.6667 1551L278.6667 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="303.3333" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M303.3333 1551L303.3333 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="328" cy="1544" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><path d="M328 1551L328 1564" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="32" y="1594" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0</text><text x="328" y="1594" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">120 秒刺激</text><text x="20" y="1636" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">另有 3 × 40 秒组；图中未展开</text><circle cx="27" cy="1671" r="5" fill="#ffffff" stroke="#7854a2" stroke-width="2" opacity="1"/><text x="42" y="1677" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">定位暂停：时间另加</text><text x="20" y="1713" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">横向只累计刺激，不是总历时</text><text x="20" y="1748" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">仅观看：用于 10 秒与 120 秒组</text><text x="20" y="1779" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">它总在同步／异步之后进行</text></g></svg>
