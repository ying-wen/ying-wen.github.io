<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1161" viewBox="0 0 360 1161" role="img" aria-labelledby="crl-1kb348u-title crl-1kb348u-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1kb348u-title">报告交互：保留两层比较</title><desc id="crl-1kb348u-desc">原创测量路径示意，没有实测波形或效应大小。原始眼部视频清理、平滑及阈值检测后，在有报告条件中用于与按键校准；主动和被动条件都以连续眼部信号经血流响应卷积建立BOLD回归。橙色代表主动报告，蓝色代表被动观看；空心圆代表竞争、空心三角代表物理重放，两种形状都没有数量编码。每任务先计算竞争减重放，再计算主动与被动两个差异之差。大脑内部线条仅示外形，无活动定位。</desc><rect width="360" height="1161" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">报告交互：保留两层比较</text><text x="28" y="85" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一份眼部记录，承担两种用途</text><path d="M134 141 Q180 109 226 141 Q180 173 134 141Z" fill="#ffffff" stroke="#19354e" stroke-width="2"/><circle cx="180" cy="141" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="180" cy="141" r="6" fill="#19354e" stroke="none" stroke-width="2" opacity="1"/><text x="180" y="184" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">原始视频</text><path d="M180 195L180 225.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 232L175 222L185 222Z" fill="#146ca1"/><text x="28" y="265" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">剔除眨眼 / OKN快相</text><text x="28" y="302" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">插值、平滑、阈值检测</text><path d="M180 322L180 355.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 362L175 352L185 352Z" fill="#146ca1"/><text x="28" y="395" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">报告可用时：校准代理与按键的对应</text><circle cx="69" cy="449" r="12" fill="#ffffff" stroke="#b65a28" stroke-width="3" opacity="1"/><path d="M89 449L190.5 449" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M197 449L187 454L187 444Z" fill="#b65a28"/><rect x="212" y="435" width="52" height="28" rx="6" fill="#f5e4d8" stroke="#b65a28" stroke-width="1.5" opacity="1"/><circle cx="227" cy="449" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="249" cy="449" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="500" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">延迟在同一数据中选择</text><text x="28" y="551" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两种任务中：眼部信号与BOLD回归</text><path d="M29 613 Q75 581 121 613 Q75 645 29 613Z" fill="#ffffff" stroke="#19354e" stroke-width="2"/><circle cx="75" cy="613" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="75" cy="613" r="6" fill="#19354e" stroke="none" stroke-width="2" opacity="1"/><path d="M124 613L186.5 613" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M193 613L183 618L183 608Z" fill="#146ca1"/><ellipse cx="246" cy="613" rx="48" ry="34" fill="#f5f8fb" stroke="#146ca1" stroke-width="2"/><path d="M221 608 Q235 584 249 612 Q268 637 279 603" fill="none" stroke="#c8d6e0" stroke-width="3"/><text x="28" y="673" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">连续信号 → 血流响应卷积 → GLM</text><text x="28" y="739" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每种任务先扣除物理重放</text><text x="28" y="777" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">主动报告</text><circle cx="52" cy="807" r="12" fill="#ffffff" stroke="#b65a28" stroke-width="3" opacity="1"/><text x="103" y="813" font-size="25" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">−</text><path d="M140 793L154 819L126 819Z" fill="#ffffff" stroke="#b65a28" stroke-width="3"/><text x="177" y="813" font-size="25" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">=</text><text x="233" y="813" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">D主动</text><text x="52" y="849" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">竞争</text><text x="140" y="849" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">重放</text><text x="28" y="889" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">被动观看</text><circle cx="52" cy="919" r="12" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="103" y="925" font-size="25" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">−</text><path d="M140 905L154 931L126 931Z" fill="#ffffff" stroke="#146ca1" stroke-width="3"/><text x="177" y="925" font-size="25" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">=</text><text x="233" y="925" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">D被动</text><text x="52" y="961" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">竞争</text><text x="140" y="961" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">重放</text><text x="28" y="1056" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Δ = D主动 − D被动</text><text x="28" y="1099" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">圆/三角标条件；没有表示效应大小</text><text x="28" y="1131" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">比较的是差异的差异；不是原始活动</text></g></svg>
