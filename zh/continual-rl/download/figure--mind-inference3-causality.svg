<svg xmlns="http://www.w3.org/2000/svg" width="720" height="705" viewBox="0 0 720 705" role="img" aria-labelledby="crl-41d6m2-title crl-41d6m2-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-41d6m2-title">一起变化，不等于同一机制</title><desc id="crl-41d6m2-desc">两个二元结构模型均接收公平随机输入U。模型A中X=U且Y=U，模型B中X=U且Y=X。自然观察完全相同；把X强制置0后，Y为1的概率分别为0.5与0。圆点表示变量亮灭，不是神经记录。</desc><rect width="720" height="705" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="38" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一起变化，不等于同一机制</text><text x="20" y="77" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">X 与 Y 总一起亮起：谁影响谁？</text><text x="20" y="133" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">模型 A：共同输入</text><path d="M168 212L110.7468 265.5595" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M106 270L109.8869 259.5171L116.7185 266.8198Z" fill="#146ca1"/><path d="M192 212L249.2532 265.5595" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M254 270L243.2815 266.8198L250.1131 259.5171Z" fill="#146ca1"/><circle cx="180" cy="195" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="202" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">U</text><circle cx="93" cy="288" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="93" y="295" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">X</text><circle cx="267" cy="288" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="267" y="295" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">Y</text><text x="20" y="343" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">观察到的 (X,Y)</text><circle cx="101" cy="379" r="10" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="137" cy="379" r="10" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="119" y="413" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">概率 0.5</text><circle cx="224" cy="379" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="260" cy="379" r="10" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><text x="242" y="413" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">概率 0.5</text><path d="M20 437L330 437" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="20" y="471" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">强制关闭 X</text><rect x="65" y="496" width="56" height="43" rx="6" fill="#ffffff" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="93" y="525" font-size="19" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">X=0</text><circle cx="250" cy="518" r="12" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="284" cy="518" r="12" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><text x="267" y="553" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">Y 仍随 U</text><text x="20" y="580" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">P(Y=1 | do(X=0)) = 0.5</text><text x="370" y="133" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">模型 B：X 传给 Y</text><path d="M518 212L460.7468 265.5595" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M456 270L459.8869 259.5171L466.7185 266.8198Z" fill="#146ca1"/><path d="M467 288L586.5 288" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M593 288L583 293L583 283Z" fill="#146ca1"/><circle cx="530" cy="195" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="530" y="202" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">U</text><circle cx="443" cy="288" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="443" y="295" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">X</text><circle cx="617" cy="288" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="617" y="295" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">Y</text><text x="370" y="343" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">观察到的 (X,Y)</text><circle cx="451" cy="379" r="10" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="487" cy="379" r="10" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="469" y="413" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">概率 0.5</text><circle cx="574" cy="379" r="10" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="610" cy="379" r="10" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><text x="592" y="413" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">概率 0.5</text><path d="M370 437L680 437" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="370" y="471" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">强制关闭 X</text><rect x="415" y="496" width="56" height="43" rx="6" fill="#ffffff" stroke="#b54142" stroke-width="1.5" opacity="1"/><text x="443" y="525" font-size="19" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">X=0</text><path d="M477 518L588.5 518" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M595 518L585 523L585 513Z" fill="#146ca1"/><circle cx="617" cy="518" r="16" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="617" y="553" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">Y = 0</text><text x="370" y="580" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">P(Y=1 | do(X=0)) = 0</text><text x="20" y="664" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同样的观察，可有不同的干预结果。</text></g></svg>
