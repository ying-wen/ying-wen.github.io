<svg xmlns="http://www.w3.org/2000/svg" width="720" height="831" viewBox="0 0 720 831" role="img" aria-labelledby="crl-hhv92j-title crl-hhv92j-desc" data-crl-visual="v1" data-evidence-kind="measured"><title id="crl-hhv92j-title">到达一次，不等于学会从起点到达</title><desc id="crl-hhv92j-desc">同一默认运行中到达C子任务的三个真实更新。t20起点值仍0，t21到达C将B的值更新为1，t24重新从S到B后起点lower值变为0.9。数据直接取自教学脚本。</desc><rect width="720" height="831" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">到达一次，不等于学会从起点到达</text><text x="28" y="83" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实际走到目标，起点还未必知道怎样去</text><text x="28" y="124" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">t = 20：S → B</text><path d="M112 172L321.5 172" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M328 172L318 177L318 167Z" fill="#146ca1"/><path d="M372 172L581.5 172" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M588 172L578 177L578 167Z" fill="#c8d6e0"/><circle cx="90" cy="172" r="21" fill="#f5f8fb" stroke="#19354e" stroke-width="1" opacity="1"/><text x="90" y="179" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="350" cy="172" r="21" fill="#f5f8fb" stroke="#19354e" stroke-width="1" opacity="1"/><text x="350" y="179" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="610" cy="172" r="21" fill="#258375" stroke="#19354e" stroke-width="1" opacity="1"/><text x="610" y="179" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="220" y="152" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">c = 0</text><text x="28" y="235" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q(S, lower)</text><path d="M205 215L205 242" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="214" y="235" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0</text><text x="28" y="273" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q(B, forward)</text><path d="M205 253L205 280" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="214" y="273" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0</text><text x="28" y="323" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">先离开 S，此时后继估计仍为 0</text><text x="28" y="338" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">t = 21：B → C</text><path d="M112 386L321.5 386" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M328 386L318 391L318 381Z" fill="#c8d6e0"/><path d="M372 386L581.5 386" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M588 386L578 391L578 381Z" fill="#146ca1"/><circle cx="90" cy="386" r="21" fill="#f5f8fb" stroke="#19354e" stroke-width="1" opacity="1"/><text x="90" y="393" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="350" cy="386" r="21" fill="#f5f8fb" stroke="#19354e" stroke-width="1" opacity="1"/><text x="350" y="393" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="610" cy="386" r="21" fill="#258375" stroke="#19354e" stroke-width="1" opacity="1"/><text x="610" y="393" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="480" y="366" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">c = 1</text><text x="28" y="449" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q(S, lower)</text><path d="M205 429L205 456" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="214" y="449" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0</text><text x="28" y="487" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q(B, forward)</text><path d="M205 467L205 494" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="205" y="469" width="320" height="22" rx="1" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="534" y="487" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1</text><text x="28" y="537" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">到达 C 的信号只更新刚才的 B</text><text x="28" y="552" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">t = 24：S → B</text><path d="M112 600L321.5 600" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M328 600L318 605L318 595Z" fill="#146ca1"/><path d="M372 600L581.5 600" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M588 600L578 605L578 595Z" fill="#c8d6e0"/><circle cx="90" cy="600" r="21" fill="#f5f8fb" stroke="#19354e" stroke-width="1" opacity="1"/><text x="90" y="607" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="350" cy="600" r="21" fill="#f5f8fb" stroke="#19354e" stroke-width="1" opacity="1"/><text x="350" y="607" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="610" cy="600" r="21" fill="#258375" stroke="#19354e" stroke-width="1" opacity="1"/><text x="610" y="607" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="220" y="580" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">c = 0</text><text x="28" y="663" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q(S, lower)</text><path d="M205 643L205 670" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="205" y="645" width="288" height="22" rx="1" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="502" y="663" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0.9</text><text x="28" y="701" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q(B, forward)</text><path d="M205 681L205 708" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="205" y="683" width="320" height="22" rx="1" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="534" y="701" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1</text><text x="28" y="751" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">再次访问 S → B，才读到已学的 1</text><text x="28" y="770" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">单步 Q-learning；α = 1，γ = 0.9</text><text x="28" y="803" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">条长：当前动作价值；蓝箭头：本次真实动作</text></g></svg>
