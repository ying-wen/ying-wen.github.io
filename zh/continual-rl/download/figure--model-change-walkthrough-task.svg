<svg xmlns="http://www.w3.org/2000/svg" width="720" height="601" viewBox="0 0 720 601" role="img" aria-labelledby="crl-q2g60h-title crl-q2g60h-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-q2g60h-title">道路改变，却没有人发来通知</title><desc id="crl-q2g60h-desc">原创六地点运输任务，读者可见的真实地图。目标始终为X；进入X奖励1，进入Y奖励0，均结束本次送货。上下路线原为2和3物理步。只有A出口改变：交互时钟12之前通X，12至48之前通Y，48以后恢复X。环境变化在动作前生效，学习器只收到所执行动作的后果，不接收阶段标签。每次终点到S重置占1真实交互步、奖励0；本次回合价值在终点截断。共同暖身8次上路、1次下路共28交互步；随后每种控制器同样运行96步。</desc><rect width="720" height="601" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">道路改变，却没有人发来通知</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">读者的完整地图；智能体只收真实转移</text><g transform="translate(22,105)"><path d="M42.801 135.4355L112.1683 78.6805" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M117.199 74.5645L112.6256 84.7666L106.2932 77.0271Z" fill="#146ca1"/><path d="M41.7213 165.7923L93.5531 214.7446" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M98.2787 219.2077L87.5754 215.9765L94.4417 208.7064Z" fill="#146ca1"/><path d="M138 235L230.5 235" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M237 235L227 240L227 230Z" fill="#146ca1"/><path d="M283 235L316 235" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M316 235L316 60" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M316 60L306.9 60" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M303 60L309 57L309 63Z" fill="#146ca1"/><path d="M158 60L250.5 60" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M257 60L247 65L247 55Z" fill="#258375"/><path d="M154.5417 72.1293L254.9356 134.4428" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M260.4583 137.8707L249.3251 136.8452L254.5987 128.3488Z" fill="#b54142"/><circle cx="25" cy="150" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="25" y="156" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="135" cy="60" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="135" y="66" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="115" cy="235" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="115" y="241" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="260" cy="235" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="260" y="241" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">C</text><circle cx="280" cy="60" r="21" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="280" cy="60" r="16" fill="none" stroke="#258375" stroke-width="1" opacity="1"/><text x="280" y="66" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">X</text><circle cx="280" cy="150" r="21" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><circle cx="280" cy="150" r="16" fill="none" stroke="#b54142" stroke-width="1" opacity="1"/><text x="280" y="156" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">Y</text><text x="190" y="37" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">开</text><text x="189" y="129" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">关</text><text x="280" y="18" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">奖励 1</text><text x="280" y="194" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">奖励 0</text><text x="25" y="290" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每条道路 1 步；终点尾值 0</text><text x="25" y="322" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">X / Y → S：重置再花 1 步</text></g><text x="392" y="135" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一个 A 出口，三段真实时间</text><rect x="392" y="157" width="6" height="46" rx="2" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="410" y="179" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">0 ≤ t &lt; 12</text><text x="672" y="179" font-size="18" fill="#258375" text-anchor="end" font-weight="400" opacity="1">A → X</text><path d="M395 209L395 217.75" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M395 221L392.5 216L397.5 216Z" fill="#52687b"/><rect x="392" y="224" width="6" height="46" rx="2" fill="#b54142" stroke="none" stroke-width="1.5" opacity="1"/><text x="410" y="246" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">12 ≤ t &lt; 48</text><text x="672" y="246" font-size="18" fill="#b54142" text-anchor="end" font-weight="400" opacity="1">A → Y</text><path d="M395 276L395 284.75" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M395 288L392.5 283L397.5 283Z" fill="#52687b"/><rect x="392" y="291" width="6" height="46" rx="2" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="410" y="313" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">48 ≤ t &lt; 96</text><text x="672" y="313" font-size="18" fill="#258375" text-anchor="end" font-weight="400" opacity="1">A → X</text><text x="392" y="387" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">变化时刻只交给环境</text><text x="392" y="417" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">模型没有变化通知</text><text x="28" y="485" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">真实观察：S → A → Y</text><text x="28" y="519" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">只改被观察的模型行；规划再把这个版本送到下一次选择。</text><text x="28" y="562" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">暖身 28 步 + 比较 96 步；重置计入真实时间，规划另计模型行调用</text></g></svg>
