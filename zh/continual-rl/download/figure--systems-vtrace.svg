<svg xmlns="http://www.w3.org/2000/svg" width="720" height="584" viewBox="0 0 720 584" role="img" aria-labelledby="crl-toxwo6-title crl-toxwo6-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-toxwo6-title">V-trace：误差怎样向前传回</title><desc id="crl-toxwo6-desc">两步给定轨迹，奖励1和2，折扣.9和0，旧值.4,.8,0，动作比率.5和1.5，截断上限1。局部加权TD误差.66和1.2。末步目标2；首步目标1.6。不是训练曲线。</desc><rect width="720" height="584" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">V-trace：误差怎样向前传回</text><text x="24" y="84" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧 V：0.4 → 0.8 → 0</text><circle cx="102" cy="160" r="29" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="102" y="167" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₀</text><path d="M134 160L321.5 160" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M328 160L318 165L318 155Z" fill="#146ca1"/><text x="231" y="137" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">r=1</text><circle cx="360" cy="160" r="29" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="360" y="167" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₁</text><path d="M392 160L579.5 160" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M586 160L576 165L576 155Z" fill="#146ca1"/><text x="489" y="137" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">r=2</text><circle cx="618" cy="160" r="29" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="618" cy="160" r="23" fill="none" stroke="#146ca1" stroke-width="1" opacity="1"/><text x="618" y="167" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="102" y="220" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">δ₀ = .66</text><text x="360" y="220" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">δ₁ = 1.2</text><path d="M360 265L108.5 265" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M102 265L112 260L112 270Z" fill="#b65a28"/><text x="231" y="253" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">× .9 × .5</text><text x="24" y="333" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先修正右端：v₁ = .8 + 1.2 = 2</text><text x="24" y="381" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">再把后续修正传回左端：</text><text x="24" y="422" font-size="23" fill="#258375" text-anchor="start" font-weight="400" opacity="1">v₀ = .4 + .66 + .54 = 1.6</text><text x="24" y="477" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">c₀=.5 控制后续误差的传播</text><text x="24" y="512" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">ρ₀=.5 已乘在本步 δ₀ 中</text><text x="24" y="554" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">新 target ≠ 已更新的网络输出</text></g></svg>
