<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1361" viewBox="0 0 360 1361" role="img" aria-labelledby="crl-4edv8b-title crl-4edv8b-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-4edv8b-title">DQN：一条旧经验经过四种时间</title><desc id="crl-4edv8b-desc">按配套 train_dqn 的计数条件解析生成事件图，不运行网络。第33、35、99、101个环境转移后分别执行第1、2、34、35次梯度更新；第34和100步不优化。跟踪出生在第1步的e1，其年龄为32、33、34、98、99、100个环境步。第100步后把在线版本theta34复制为目标，此前目标保持theta0。假设图示优化batch包含e1，只说明可发生的抽样路径，不宣称记录了随机训练样本。</desc><rect width="360" height="1361" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="20" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">DQN：一条旧经验经过四种时间</text><text x="20" y="80" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一条 e₁，出生时刻 τ=1</text><text x="20" y="112" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">环境步 t 向下；省略段显式断开</text><text x="20" y="153" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">经验／年龄</text><text x="144" y="153" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">在线更新</text><text x="260" y="153" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">目标</text><text x="20" y="193" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">t=33</text><rect x="33" y="209" width="46" height="32" rx="2" fill="#ffffff" stroke="#146ca1" stroke-width="1.5" opacity="1"/><text x="56" y="231" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">e33</text><text x="20" y="272" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">e₁ 年龄 32</text><path d="M56 285L56 307.45" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M56 312L52.5 305L59.5 305Z" fill="#146ca1"/><path d="M118