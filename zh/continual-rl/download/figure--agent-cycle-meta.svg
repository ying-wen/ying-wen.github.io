<svg xmlns="http://www.w3.org/2000/svg" width="720" height="839" viewBox="0 0 720 839" role="img" aria-labelledby="crl-16hudsr-title crl-16hudsr-desc" data-crl-visual="v1" data-evidence-kind="measured"><title id="crl-16hudsr-title">元学习把后来的结果传给学习规则</title><desc id="crl-16hudsr-desc">同一seed0的6,R两次执行。t5保留旧beta的局部敏感度h=.191；t7开始下次执行并缓存预测.191；t9实得.96形成延迟梯度-.146879。更新当前beta后下一次alpha=.2518427457；当前执行alpha始终.25。局部导数冻结起始表、路径和目标，不是终身奖励梯度。</desc><rect width="720" height="839" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">元学习把后来的结果传给学习规则</text><text x="28" y="82" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先记录怎样学，再看下次实际后果</text><path d="M131 180L327.5 180" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M334 180L324 185L324 175Z" fill="#258375"/><path d="M386 180L582.5 180" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M589 180L579 185L579 175Z" fill="#b65a28"/><circle cx="105" cy="180" r="24" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="105" y="186" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">t = 5</text><circle cx="360" cy="180" r="24" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="360" y="186" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">t = 7</text><circle cx="615" cy="180" r="24" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="615" y="186" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">t = 9</text><text x="105" y="245" font-size="19" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">保留局部敏感度</text><text x="105" y="274" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">h = 0.191</text><text x="360" y="245" font-size="19" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">再次从 6 执行 R</text><text x="360" y="274" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">缓存旧预测 0.191</text><text x="615" y="245" font-size="19" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">收下完整新回报</text><text x="615" y="274" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">G = 0.96</text><text x="28" y="333" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">后来的回报，评价先前留下的预测</text><path d="M85 503L666 503" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="73" y="508" font-size="15" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M85 503L666 503" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="73" y="443" font-size="15" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M85 438L666 438" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="73" y="378" font-size="15" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M85 373L666 373" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="121" y="478.17" width="66" height="24.83" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="154" y="466.17" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.191</text><text x="154" y="531" font-size="17" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">旧预测</text><rect x="436" y="378.2" width="66" height="124.8" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="469" y="366.2" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">0.96</text><text x="469" y="531" font-size="17" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">新回报</text><text x="28" y="595" font-size="24" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">误差 × 旧敏感度</text><text x="28" y="633" font-size="23" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">(0.191 − 0.96) × 0.191 = -0.146879</text><text x="28" y="677" font-size="23" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">β ← β − 0.05 × 梯度；α = exp(β)</text><text x="28" y="719" font-size="27" fill="#258375" text-anchor="start" font-weight="400" opacity="1">下次步长：0.25 → 0.251843</text><text x="28" y="764" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">本次执行已用 0.25；改变从下次开始</text><text x="28" y="801" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">这里求局部预测更新的导数，未穿过规划</text></g></svg>
