<svg xmlns="http://www.w3.org/2000/svg" width="360" height="892" viewBox="0 0 360 892" role="img" aria-labelledby="crl-1giz6rh-title crl-1giz6rh-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1giz6rh-title">同一条两步路线，评价另一策略</title><desc id="crl-1giz6rh-desc">所有回合从S0出发，两种动作均到S1，再经两种动作真实终止。A和B在第一步给奖励2和0，第二步给奖励4和0。折扣0.5。两状态的行为A概率均为0.5，目标A概率均为0.75。动作改变奖励，不改变后继状态。下方条宽是动作概率；目标真值3由正文计算，图不是采样训练。</desc><rect width="360" height="892" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一条两步路线，评价另一策略</text><circle cx="180" cy="106" r="27" fill="#f5f8fb" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="113" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₀</text><path d="M180 134L89.4382 189.2903" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M85 192L89.7437 184.4173L93.9124 191.2453Z" fill="#b65a28"/><circle cx="85" cy="216" r="22" fill="#fff1e7" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="85" y="223" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="85" y="258" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">R₁=2</text><path d="M85 274L175.3006 316.774" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 319L171.0578 319.1903L174.4824 311.9604Z" fill="#146ca1"/><path d="M180 134L270.5618 189.2903" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M275 192L266.0876 191.2453L270.2563 184.4173Z" fill="#b65a28"/><circle cx="275" cy="216" r="22" fill="#fff1e7" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="275" y="223" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="275" y="258" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">R₁=0</text><path d="M275 274L184.6994 316.774" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 319L185.5176 311.9604L188.9422 319.1903Z" fill="#146ca1"/><circle cx="180" cy="346" r="27" fill="#f5f8fb" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="353" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₁</text><path d="M180 374L89.4382 429.2903" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M85 432L89.7437 424.4173L93.9124 431.2453Z" fill="#b65a28"/><circle cx="85" cy="456" r="22" fill="#fff1e7" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="85" y="463" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="85" y="498" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">R₂=4</text><path d="M85 514L175.3006 556.774" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 559L171.0578 559.1903L174.4824 551.9604Z" fill="#146ca1"/><path d="M180 374L270.5618 429.2903" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M275 432L266.0876 431.2453L270.2563 424.4173Z" fill="#b65a28"/><circle cx="275" cy="456" r="22" fill="#fff1e7" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="275" y="463" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="275" y="498" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">R₂=0</text><path d="M275 514L184.6994 556.774" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M180 559L185.5176 551.9604L188.9422 559.1903Z" fill="#146ca1"/><circle cx="180" cy="586" r="27" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><circle cx="180" cy="586" r="22" fill="none" stroke="#19354e" stroke-width="1.5" opacity="1"/><text x="180" y="593" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">终</text><text x="22" y="641" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">G₀ = R₁ + 0.5 R₂</text><text x="22" y="688" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两个状态：行为 b</text><rect x="22" y="703" width="158" height="24" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="180" y="703" width="158" height="24" rx="0" fill="#dce5ec" stroke="none" stroke-width="1.5" opacity="1"/><text x="101" y="754" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A 0.5</text><text x="259" y="754" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">B 0.5</text><text x="22" y="789" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两个状态：目标 π</text><rect x="22" y="804" width="237" height="24" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="259" y="804" width="79" height="24" rx="0" fill="#dce5ec" stroke="none" stroke-width="1.5" opacity="1"/><text x="140.5" y="855" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A 0.75</text><text x="298.5" y="855" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">B 0.25</text></g></svg>
