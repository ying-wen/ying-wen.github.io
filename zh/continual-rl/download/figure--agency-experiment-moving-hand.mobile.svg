<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2669" viewBox="0 0 360 2669" role="img" aria-labelledby="crl-1hi6rsx-title crl-1hi6rsx-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1hi6rsx-title">移动橡胶手：时序、来源与朝向</title><desc id="crl-1hi6rsx-desc">依据Kalckert与Ehrsson2012年Methods与Figure1原创重绘。剖面示意显示木箱内的真实右手与箱顶戴同样乳胶手套的木制模型手，肩到模型腕间有毯子，细木杆连接两食指。实验1/2仅在主动且朝向相符时比较同步连接与木杆脱开后的约500毫秒异步；短竖线是顺序示意，没有表示实测运动轨迹。实验3/4四条件始终同步，交叉参与者主动点动或实验者带动，与模型手朝向相符或旋转180度；轮廓围绕橙色食指连接点旋转，保持其位置，上下双箭头表示点动。实验3用3分钟后的16条体验陈述，实验4闭眼用左食指在侧板指认右食指高度，比较诱导前后定位，每条件重复3次。图未编码参与者评分、漂移数值或效应量。</desc><rect width="360" height="2669" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="20" y="39" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">移动橡胶手：时序、来源与朝向</text><text x="20" y="78" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">“谁让它动”与“朝向是否相符”分开改</text><text x="20" y="121" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">箱顶模型手；箱内真实右手</text><rect x="52" y="190" width="256" height="145" rx="2" fill="#e4eaf0" stroke="#52687b" stroke-width="1.5" opacity="1"/><path d="M30 179L87 179" fill="none" stroke="#52687b" stroke-width="10" stroke-linecap="round" opacity="1"/><text x="20" y="149" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">毯子遮住肩到假手腕的空隙</text><rect x="122" y="166" width="91" height="20" rx="10" fill="#ffffff" stroke="#146ca1" stroke-width="1.5" opacity="1"/><path d="M203 171L261 161" fill="none" stroke="#146ca1" stroke-width="8" stroke-linecap="round" opacity="1"/><path d="M205 182L239 183" fill="none" stroke="#146ca1" stroke-width="6" stroke-linecap="round" opacity="1"/><rect x="122" y="283" width="91" height="20" rx="10" fill="none" stroke="#52687b" stroke-width="1.5" opacity="1"/><path d="M203 288L261 278" fill="none" stroke="#52687b" stroke-width="8" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><path d="M205 299L239 300" fill="none" stroke="#52687b" stroke-width="6" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><path d="M261 161L261 278" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="261" cy="161" r="7" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><circle cx="261" cy="278" r="7" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><path d="M281 267L281 222.55" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M281 218L284.5 225L277.5 225Z" fill="#b65a28"/><text x="20" y="368" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">细木杆穿过箱顶孔，连接两食指</text><text x="20" y="399" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">相同乳胶手套；真实手不可见</text><path d="M20 437L340 437" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="20" y="476" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实验 1／2：只改变运动时序</text><text x="20" y="523" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">同步：木杆保持连接</text><text x="20" y="581" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">真食指</text><path d="M93 575L330 575" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M111 561L111 589" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M176.6667 561L176.6667 589" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M242.3333 561L242.3333 589" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="20" y="641" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">模型指</text><path d="M93 635L330 635" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M111 621L111 649" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M176.6667 621L176.6667 649" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M242.3333 621L242.3333 649" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="20" y="686" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">自己的点动带动模型指</text><text x="20" y="743" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">异步：木杆脱开真实指套</text><text x="20" y="801" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">真食指</text><path d="M93 795L330 795" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M111 781L111 809" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M176.6667 781L176.6667 809" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M242.3333 781L242.3333 809" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="20" y="861" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">模型指</text><path d="M93 855L330 855" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M133 841L133 869" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M198.6667 841L198.6667 869" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M264.3333 841L264.3333 869" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="20" y="906" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">实验者约迟 500 ms 带动模型</text><text x="20" y="928" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两条件都主动、朝向相符</text><path d="M20 952L340 952" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="20" y="992" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实验 3／4：四条件全部同步</text><text x="20" y="1044" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">主动 × 朝向相符</text><g transform="translate(170.39999999999998 1194) rotate(0) scale(0.75 0.75)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" /><path d="M-19 14Q3 7 23 14" fill="none" stroke="#146ca1" stroke-width="1.2"/></g><circle cx="159.15" cy="1145.25" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M223.4 1221L223.4 1181.85" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M223.4 1176L227.9 1185L218.9 1185Z" fill="#b65a28"/><path d="M243.4 1176L243.4 1215.15" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M243.4 1221L238.9 1212L247.9 1212Z" fill="#b65a28"/><text x="20" y="1263" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">参与者点动，连接传递运动</text><text x="20" y="1328" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">主动 × 旋转 180°</text><g transform="translate(147.89999999999998 1380.5) rotate(180) scale(0.75 0.75)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" /><path d="M-19 14Q3 7 23 14" fill="none" stroke="#146ca1" stroke-width="1.2"/></g><circle cx="159.15" cy="1429.25" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M223.4 1505L223.4 1465.85" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M223.4 1460L227.9 1469L218.9 1469Z" fill="#b65a28"/><path d="M243.4 1460L243.4 1499.15" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M243.4 1505L238.9 1496L247.9 1496Z" fill="#b65a28"/><text x="20" y="1547" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">参与者点动，连接传递运动</text><text x="20" y="1612" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">被动 × 朝向相符</text><g transform="translate(170.39999999999998 1762) rotate(0) scale(0.75 0.75)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" /><path d="M-19 14Q3 7 23 14" fill="none" stroke="#146ca1" stroke-width="1.2"/></g><circle cx="159.15" cy="1713.25" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M223.4 1789L223.4 1749.85" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M223.4 1744L227.9 1753L218.9 1753Z" fill="#146ca1"/><path d="M243.4 1744L243.4 1783.15" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M243.4 1789L238.9 1780L247.9 1780Z" fill="#146ca1"/><text x="20" y="1831" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">参与者放松，实验者拉动连接</text><text x="20" y="1896" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">被动 × 旋转 180°</text><g transform="translate(147.89999999999998 1948.5) rotate(180) scale(0.75 0.75)"><path d="M-21 36L-22 2L-36 -15Q-42 -30 -33 -32L-21 -17L-21 -57Q-21 -70 -11 -70L-9 -27L-9 -78Q-9 -90 1 -90L4 -26L4 -66Q4 -78 14 -76L16 -22L16 -46Q16 -58 25 -54L29 1L22 37Z" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" /><path d="M-19 14Q3 7 23 14" fill="none" stroke="#146ca1" stroke-width="1.2"/></g><circle cx="159.15" cy="1997.25" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M223.4 2073L223.4 2033.85" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M223.4 2028L227.9 2037L218.9 2037Z" fill="#146ca1"/><path d="M243.4 2028L243.4 2067.15" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M243.4 2073L238.9 2064L247.9 2064Z" fill="#146ca1"/><text x="20" y="2115" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">参与者放松，实验者拉动连接</text><path d="M20 2158L340 2158" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="20" y="2195" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两种读数分别回答不同问题</text><text x="20" y="2233" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实验 3：3 分钟后问卷</text><text x="20" y="2266" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">所有感／能动性，各 4 条陈述</text><text x="20" y="2299" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">另有各 4 条控制陈述</text><text x="20" y="2359" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">实验 4：闭眼指认高度</text><path d="M51 2389L51 2483" fill="none" stroke="#52687b" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M51 2395L60 2395" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M51 2407L60 2407" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M51 2419L60 2419" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M51 2431L60 2431" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M51 2443L60 2443" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M51 2455L60 2455" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M51 2467L60 2467" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M131 2464L64.1737 2428.7305" fill="none" stroke="#146ca1" stroke-width="5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M59 2426L69.0599 2426.2211L64.859 2434.1806Z" fill="#146ca1"/><text x="157" y="2431" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">左食指</text><text x="77" y="2519" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">指自己感觉右食指所在处</text><text x="20" y="2557" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">诱导前 → 诱导 → 诱导后</text><text x="20" y="2590" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">每条件 3 次；取高度变化均值</text><text x="20" y="2637" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">橙点：旋转时位置保持的模型食指</text></g></svg>
