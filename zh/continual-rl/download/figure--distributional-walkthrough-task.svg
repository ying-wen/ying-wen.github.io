="#146ca1" text-anchor="start" font-weight="400" opacity="1">Var(G)=1</text><text x="28" y="765" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">柱高＝概率质量；横轴＝折扣回报</text><text x="28" y="800" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">已知浮动概率 .5，结果仍会随机</text></g></svg>
