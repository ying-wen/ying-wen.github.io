<svg xmlns="http://www.w3.org/2000/svg" width="720" height="831" viewBox="0 0 720 831" role="img" aria-labelledby="crl-1fghho7-title crl-1fghho7-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1fghho7-title">同一个接单问题，两条回报分布</title><desc id="crl-1fghho7-desc">原创已知两步接单任务。s选固定或浮动，首款均.5，gamma .5；f末步奖励2，v末步奖励0或4各半，全部进入双圆终止T，后续回报0。固定总回报1.5；浮动.5或2.5各半，均值同1.5、方差1。柱高编码真实概率质量，橙虚线是均值。图没有表示未知参数的后验，也没有随机训练。</desc><rect width="720" height="831" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一个接单问题，两条回报分布</text><text x="28" y="85" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两步结算：γ=.5，末步后真正终止</text><circle cx="70" cy="195" r="19" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="70" y="201" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">s</text><circle cx="300" cy="135" r="19" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="300" y="141" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">f</text><circle cx="615" cy="135" r="19" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="615" cy="135" r="14" fill="none" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="615" y="141" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">T</text><path d="M90 188L271.702 141.608" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M278 140L269.5477 147.3184L267.0739 137.6292Z" fill="#258375"/><path d="M321 135L586.5 135" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M593 135L583 140L583 130Z" fill="#258375"/><text x="180" y="132" font-size="18" fill="#258375" text-anchor="mid