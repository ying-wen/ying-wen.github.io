<svg xmlns="http://www.w3.org/2000/svg" width="360" height="891" viewBox="0 0 360 891" role="img" aria-labelledby="crl-1rz135s-title crl-1rz135s-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1rz135s-title">越长的后缀，越少的匹配</title><desc id="crl-1rz135s-desc">单独的长后缀诊断延长决策数：γ=1，中间奖励为0，最后真实终止奖励为1，目标固定为每步A，行为每步独立以0.9概率选A。横轴h为尚需纠正的决策数；上图匹配概率0.9的h次方，下图在全匹配时的完整IS权重0.9的负h次方。任一不匹配使完整权重为0。程序精确计算h=1,2,5,10,20,50的点并以直线连接，不插值拟合。h=50匹配概率约0.00515，非零权重约194.03，100独立回合的期望匹配数约0.515。两图纵轴不同且明确标注；曲线显示固定目标的概率诊断，不是控制学习速度的实测。</desc><rect width="360" height="891" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">越长的后缀，越少的匹配</text><text x="22" y="80" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">固定目标总选 A · 行为每步选 A 概率 0.9</text><circle cx="46" cy="120" r="12" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="46" y="153" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M60 120L95.1 120" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M99 120L93 123L93 117Z" fill="#146ca1"/><circle cx="113" cy="120" r="12" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="113" y="153" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M127 120L162.1 120" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M166 120L160 123L160 117Z" fill="#146ca1"/><circle cx="180" cy="120" r="12" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="180" y="153" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M194 120L229.1 120" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap=