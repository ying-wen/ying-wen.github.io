<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="crl-e8we86-title crl-e8we86-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-e8we86-title">真实后果改变随机模型</title><desc id="crl-e8we86-desc">同一道路的独立平稳随机变体，G、D、B均真正终止。先真实探索exit得0.6，再规定四次go与cross探索，cross记录D,G,G,G；不是当前贪心策略自然生成的访问。蓝时间线上的圆是实际后果，条长表示joint reward/successor counts归一化后的质量。G计数依次0,1,2,3，cross总计数1,2,3,4，成功比例和奖励均值依次0,1/2,2/3,3/4。紫虚线是模型可能后果，橙线仅用于其他图标实际经过的路；图中没有给学习器真实概率。原创精确记录和计数计算。</desc><rect width="720" height="700" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">真实后果改变随机模型</text><text x="28" y="86" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">终点 G、D、B；γ=0.9</text><g transform="translate(220,132)"><path d="M43.3834 95.072L117.577 76.2092" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M122.6166 74.928L115.8489 80.7758L113.8777 73.0225Z" fill="#c8d6e0"/><path d="M38.8938 113.3482L111.2338 178.1813" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M115.1062 181.6518L106.479 179.2913L111.8183 173.3337Z" fill="#c8d6e0"/><path d="M160.4615 62.3077L226.7385 34.6923" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M231.5385 32.6923L225.6923 39.4615L222.6154 32.0769Z" fill="#7854a2"/><path d="M158.7831 80.8779L228.8533 126.2938" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M233.2169 129.1221L224.3281 128.1275L228.6793 121.4143Z" fill="#7854a2"/><circle cx="24" cy="100" r="19" fill="#ffffff" stroke="#52687b" stroke-widt