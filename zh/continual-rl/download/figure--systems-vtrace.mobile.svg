<svg xmlns="http://www.w3.org/2000/svg" width="360" height="584" viewBox="0 0 360 584" role="img" aria-labelledby="crl-1fvz36m-title crl-1fvz36m-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1fvz36m-title">V-trace：误差怎样向前传回</title><desc id="crl-1fvz36m-desc">两步给定轨迹，奖励1和2，折扣.9和0，旧值.4,.8,0，动作比率.5和1.5，截断上限1。局部加权TD误差.66和1.2。末步目标2；首步目标1.6。不是训练曲线。</desc><rect width="360" height="584" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">V-trace：误差怎样向前传回</text><text x="24" y="84" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧 V：0.4 → 0.8 → 0</text><circle cx="52" cy="160" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="52" y="167" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₀</text><path d="M84 160L141.5 160" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M148 160L138 165L138 155Z" fill="#146ca1"/><text x="116" y="137" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">r=1</text><circle cx="180" cy="160" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="167" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₁</text><path d="M212 160L269.5 160" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M276 160L266 165L266 155Z" fill="#146ca1"/><text x="244" y="137" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">r=2</text><circle cx="308" cy="160" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="308" cy="160" r="17" fill="none" stroke="#146ca1" stroke-width="1" opacity="1"/><text x="308" y="167" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="52" y="220" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">δ₀ = .66</text><text x="180" y="220" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">δ₁ = 1.2</text><path d="M180 265L58.5 265" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M52 265L62 260L62 270Z" fill="#b65a28"/><text x="116" y="253" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">× .9 × .5</text><text x="24" y="333" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先修正右端：v₁ = .8 + 1.2 = 2</text><text x="24" y="381" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">再把后续修正传回左端：</text><text x="24" y="422" font-size="19" fill="#258375" text-anchor="start" font-weight="400" opacity="1">v₀ = .4 + .66 + .54 = 1.6</text><text x="24" y="477" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">c₀=.5 控制后续误差的传播</text><text x="24" y="512" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">ρ₀=.5 已乘在本步 δ₀ 中</text><text x="24" y="554" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">新 target ≠ 已更新的网络输出</text></g></svg>
