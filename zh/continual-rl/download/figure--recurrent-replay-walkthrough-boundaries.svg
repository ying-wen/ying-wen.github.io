<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="crl-5wf0nr-title crl-5wf0nr-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-5wf0nr-title">burn-in 何时恢复，何时仍失败</title><desc id="crl-5wf0nr-desc">原创条件机制图。上图在同一全零后缀上比较当前参数前缀状态与两种初始化；起点为正负tanh(0.8)或零。rho=0.8使tanh更新对h全局Lipschitz常数至多0.8，存储初始化误差缩小但负号保持。rho=1.2不满足该收缩条件，正负状态在8步后仍相距超过1.3；未宣称所有非收缩网络都失败。下图比较两个准确入口标签+1和-1；它们均在采样片段外，零起点只读三个相同灰观察，因此都形成h=0并平局取左。两个隐藏位置等概率时该固定选择的期望奖励为(4-2)/2=1，完整标签历史得到4。</desc><rect width="720" height="960" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">burn-in 何时恢复，何时仍失败</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一灰前缀：burn-in 的效果取决于状态动力学</text><path d="M80 150L80 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M80 370L80 375" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="80" y="396" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M219.5 150L219.5 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M219.5 370L219.5 375" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="219.5" y="396" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M359 150L359 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M359 370L359 375" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="359" y="396" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M498.5 150L498.5 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M498.5 370L498.5 375" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="498.5" y="396" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">6</text><path d="M638 150L638 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M638 370L638 375" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="638" y="396" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">8</text><path d="M80 370L638 370" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 370L80 370" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="375" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M80 296.6667L638 296.6667" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 296.6667L80 296.6667" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="301.6667" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M80 223.3333L638 223.3333" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 223.3333L80 223.3333" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="228.3333" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M80 150L638 150" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 150L80 150" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="70" y="155" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1.5</text><path d="M80 150L80 370" fill="none" stroke="#19354e" stro