><text x="224" y="848" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">零初始化 + 相同灰片段 → 取左</text><text x="28" y="888" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两种隐藏位置各半，入口标签各自准确：</text><text x="28" y="920" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">零起点固定取左的平均奖励为 1；完整历史为 4</text></g></svg>
