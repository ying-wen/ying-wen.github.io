ext x="68" y="484" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">ρ=0.8：零状态起点</text><path d="M28 509L56 509" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="3 5"/><text x="68" y="514" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">ρ=1.2：旧存储状态起点</text><text x="28" y="564" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">ρ=0.8 的误差缩小，但旧状态的错误符号一直保留</text><text x="28" y="628" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">片段外的标签，零起点无法恢复</text><circle cx="92" cy="701" r="20" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="92" y="707" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">+1</text><path d="M113 667L127 681" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M113 681L127 667" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M122 701L212.1 701" fill="none" stroke="#52687b" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="4 4"/><path data-arrow-mode="actual" d="M216 701L210 704L210 698Z" fill="#52687b"/><rect x="224" y="681" width="65" height="40" rx="2" fill="#e7ebef" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="256.5" y="707" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><rect x="301" y="681" width="65" height="40" rx="2" fill="#e7ebef" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="333.5" y="707" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><rect x="378" y="681" width="65" height="40" rx="2" fill="#e7ebef" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="410.5" y="707" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M447 701L561.45 701" fill="none" stroke="#146ca