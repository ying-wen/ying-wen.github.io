<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1218" viewBox="0 0 720 1218" role="img" aria-labelledby="crl-r984rv-title crl-r984rv-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-r984rv-title">同一条轨迹，什么时候更新谁？</title><desc id="crl-r984rv-desc">解析执行同一条 A 到 B 到真终点的轨迹，奖励依次为0和1。第一回合第一步 TD 只更新 A 但增量为0，MC等待；到终点后 TD 的B为0.1而A仍为0，MC的A为0.09、B为0.1。第二回合第一步 TD 从旧B读到0.1，使A成为0.009，MC仍等待。蓝箭头为刚发生的真实转移，橙箭头为构造目标的方向，不是环境倒行。</desc><rect width="720" height="1218" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一条轨迹，什么时候更新谁？</text><text x="24" y="79" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">γ=0.9，α=0.1，初值全为 0</text><text x="24" y="109" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">蓝箭头：新转移　橙箭头：目标回传</text><path d="M24 137L696 137" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="24" y="168" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">① 第一回合：刚观察 A → B</text><text x="32" y="194" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">TD(0)</text><path d="M107 295L146.45 295" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M151 295L144 298.5L144 291.5Z" fill="#c8d6e0"/><path d="M203 295L242.45 295" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M247 295L240 298.5L240 291.5Z" fill="#c8d6e0"/><path d="M107 295L145.8 295" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M151 295L143 299L143 291Z" fill="#146ca1"/><text x="129" y="280" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">r=0</tex