<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1170" viewBox="0 0 360 1170" role="img" aria-labelledby="crl-1lieve-title crl-1lieve-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1lieve-title">队列怎样让数据变旧</title><desc id="crl-1lieve-desc">六个刻度，先到达两段再消费一段。无界队列消费轨迹编号0到5，最后年龄为3、剩6段；容量为2时每次丢弃最旧项，消费编号0、2、4、6、8、10，最后年龄为0、剩1段、累计丢弃5段。颜色为数据产生刻度；无训练。</desc><rect width="360" height="1170" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">队列怎样让数据变旧</text><text x="24" y="80" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每刻到达 2 段，消费 1 段</text><text x="24" y="123" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">无界 FIFO</text><text x="24" y="189" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0</text><rect x="53" y="168" width="38" height="29" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="72" y="189" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="104" y="189" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">年龄 0</text><rect x="202" y="170" width="10" height="24" rx="0" fill="#c8d6e0" stroke="none" stroke-width="1.5" opacity="1"/><text x="202" y="218" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">等候 1 / 丢弃 0</text><text x="24" y="253" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">1</text><rect x="53" y="232" width="38" height="29" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="72" y="253" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="104" y="253" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">年龄