<svg xmlns="http://www.w3.org/2000/svg" width="720" height="506" viewBox="0 0 720 506" role="img" aria-labelledby="crl-1y32k0n-title crl-1y32k0n-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1y32k0n-title">一次选择，只揭示一个动作的结果</title><desc id="crl-1y32k0n-desc">在同一三动作任务中，已经四次选择B并观察奖励1、0、1、0，样本均值为0.5。第五次仍选B，得到奖励1，因此计数从4到5，估计从0.5到0.6。未选择的A与C本次潜在奖励画为问号，不给算法未观察的信息；其计数0与估计0仍是初始化。</desc><rect width="720" height="506" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次选择，只揭示一个动作的结果</text><text x="22" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">已见 B 的四次结果</text><circle cx="288" cy="75" r="17" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="288" y="81" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="336" cy="75" r="17" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="336" y="81" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="384" cy="75" r="17" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="384" y="81" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="432" cy="75" r="17" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="432" y="81" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0</text><rect x="110" y="129" width="70" height="70" rx="9" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="145" cy="161" r="19" fill="#f5f8fb" stroke="#52687b" stroke-width="2" opacity="1"/><text x="145" y="168" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="145" y="229" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">未选择</text><path d="M145 243L145 282.45" fill="none" stroke="#c8d6e0" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M145 287L141.5 280L148.5 280Z" fill="#c8d6e0"/><circle cx="145" cy="315" r="17" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="145" y="321" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><text x="145" y="358" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">结果未知</text><rect x="325" y="129" width="70" height="70" rx="9" fill="#fff4e7" stroke="#b65a28" stroke-width="1.5" opacity="1"/><circle cx="360" cy="161" r="19" fill="#b65a28" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="360" y="168" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="360" y="229" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">本次选择</text><path d="M360 243L360 282.45" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M360 287L356.5 280L363.5 280Z" fill="#146ca1"/><circle cx="360" cy="315" r="17" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="360" y="321" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="360" y="358" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">观察 R=1</text><rect x="540" y="129" width="70" height="70" rx="9" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="575" cy="161" r="19" fill="#f5f8fb" stroke="#52687b" stroke-width="2" opacity="1"/><text x="575" y="168" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="575" y="229" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">未选择</text><path d="M575 243L575 282.45" fill="none" stroke="#c8d6e0" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M575 287L571.5 280L578.5 280Z" fill="#c8d6e0"/><circle cx="575" cy="315" r="17" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="575" y="321" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><text x="575" y="358" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">结果未知</text><path d="M22 396L698 396" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="22" y="433" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">N(B)：4 → 5</text><text x="270" y="433" font-size="21" fill="#258375" text-anchor="start" font-weight="400" opacity="1">Q(B)：0.5 → 0.6</text><text x="22" y="474" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A、C 没有新证据；N=0、Q=0 仍是初始化</text></g></svg>
