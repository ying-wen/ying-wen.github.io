<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1088" viewBox="0 0 720 1088" role="img" aria-labelledby="crl-15qlz6o-title crl-15qlz6o-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-15qlz6o-title">支持空洞怎样传到起点</title><desc id="crl-15qlz6o-desc">原创固定两步MDP算例。起点唯一动作go以奖励0到s；s的三动作全部终止。日志只含a0、a1各两次，奖励0、2；未见a2的终端后果用问号遮住。四完整episode共八条transition。下图显示给定Q(a2)=4怎样让旧go经验的max自举标签变3.6。蓝色两行是获得额外在线权限后，假设确定终端新反馈为−2、表格步长1，则Q(a2)改为−2，max标签改为1.8。新增反馈只是声明的反事实计算，没有执行环境采样。</desc><rect width="720" height="1088" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">支持空洞怎样传到起点</text><text x="28" y="85" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一任务；只记录两个末步动作</text><circle cx="83" cy="219" r="25" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="83" y="226" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">起点</text><circle cx="260" cy="219" r="25" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="260" y="226" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">s</text><path d="M111 219L225.5 219" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M232 219L222 224L222 214Z" fill="#146ca1"/><text x="165" y="185" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">go · r=0</text><text x="165" y="254" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4 次</text><path d="M286 207L591.68 133.5192" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M598 132L589.4456 139.1988L587.1083 129.4758Z" fill="#146ca1"/><rect x="601" y="108" width="48" height="48" rx="0" fill="#ffffff" strok