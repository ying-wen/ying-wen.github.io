<svg xmlns="http://www.w3.org/2000/svg" width="720" height="823" viewBox="0 0 720 823" role="img" aria-labelledby="crl-1tayjpp-title crl-1tayjpp-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1tayjpp-title">后续策略改变，旧回报平均在预测谁？</title><desc id="crl-1tayjpp-desc">一个独立的固定策略诊断：条件于S0,A，回报只能为2或4。旧S1策略A概率0.5，分布概率0.5和0.5，真实q为3；预先规定的当前S1策略A概率0.9，分布概率0.1和0.9，真实q为3.8。独立各采一条然后等权平均，输出2、3、4的概率为0.05、0.5、0.45，期望3.4。横位置表示回报或均值，圆面积表示概率，橙色竖线表示期望。此图枚举全部四个有序批次；两策略预先冻结，未对自适应控制器进行条件无偏性声明。</desc><rect width="720" height="823" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">后续策略改变，旧回报平均在预测谁？</text><text x="22" y="80" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">条件于 S₀,A；只抽样后续 S₁ 动作</text><text x="22" y="112" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">旧策略：S₁ 的 A 概率 0.5</text><path d="M146.6667 223L613.3333 223" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M146.6667 220L146.6667 229" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="146.6667" cy="164" r="25.4558" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="0.22"/><text x="146.6667" y="171" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="146.6667" y="252" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M613.3333 220L613.3333 229" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="613.3333" cy="164" r="25.4558" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="0.22"/><text x="613.3333" y="171" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="613.3333" y="252" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M380 211L380 234" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="380" y="288" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">期望 = 3</text><text x="22" y="330" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">当前策略：S₁ 的 A 概率 0.9</text><path d="M146.6667 441L613.3333 441" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M146.6667 438L146.6667 447" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="146.6667" cy="382" r="11.3842" fill="#258375" stroke="#258375" stroke-width="2" opacity="0.22"/><text x="146.6667" y="389" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.1</text><text x="146.6667" y="470" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M613.3333 438L613.3333 447" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="613.3333" cy="382" r="34.1526" fill="#258375" stroke="#258375" stroke-width="2" opacity="0.22"/><text x="613.3333" y="389" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.9</text><text x="613.3333" y="470" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M566.6667 429L566.6667 452" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="566.6667" y="506" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">期望 = 3.8</text><text x="22" y="548" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">各取一条，再平均</text><path d="M146.6667 659L613.3333 659" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M146.6667 656L146.6667 665" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="146.6667" cy="600" r="8.0498" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="0.22"/><text x="146.6667" y="607" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.05</text><text x="146.6667" y="688" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M380 656L380 665" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="380" cy="600" r="25.4558" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="0.22"/><text x="380" y="607" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="380" y="688" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">3</text><path d="M613.3333 656L613.3333 665" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="613.3333" cy="600" r="24.1495" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="0.22"/><text x="613.3333" y="607" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.45</text><text x="613.3333" y="688" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M473.3333 647L473.3333 670" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="473.3333" y="724" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">期望 = 3.4</text><text x="22" y="784" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">横坐标：回报或两条回报均值；圆面积正比于概率；橙线标期望</text></g></svg>
