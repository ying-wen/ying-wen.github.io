<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img" aria-labelledby="crl-yoowcx-title crl-yoowcx-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-yoowcx-title">看见一盏灯，怎样知道位置？</title><desc id="crl-yoowcx-desc">原创两房间隐状态算例。圆面积表示信念，不揭示物体实际位置。等待一步的转移矩阵为0.9,0.1和0.2,0.8。模型将先验0.6和0.4搬运为0.62和0.38。灯亮在左室的条件概率0.8，在右室为0.2；十个图标显示概率比例，不是额外采集的十个样本。灯亮后联合概率0.496和0.076同除证据0.572，得到0.86713和0.13287。四步是先验、动态预测、实际观测及条件化。</desc><rect width="720" height="830" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="38" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">看见一盏灯，怎样知道位置？</text><text x="20" y="76" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">物体在左室或右室；位置不可见。</text><text x="28" y="109" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">① 当前的信念</text><rect x="52" y="158" width="96" height="104" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M88 262L112 262" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="100" cy="210" r="27.8855" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="0.25"/><text x="100" y="216" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.6</text><text x="100" y="289" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">左室</text><rect x="227" y="158" width="96" height="104" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M263 262L287 262" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="275" cy="210" r="22.7684" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="0.25"/><text x="275" y="216" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.4</text><text x="275" y="289" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">右室</text><text x="28" y="335" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">圆面积 ∝ 位置概率</text><text x="378" y="109" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">② 等待一步：预测位置</text><path d="M450 175L450 297.8" fill="none" stroke="#146ca1" stroke-width="8.64" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="imagined" d="M450 303L446 295L454 295Z" fill="#146ca1"/><rect x="416" y="223.5" width="46" height="25" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="438" y="242.5" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.54</text><path d="M450 175L620.8029 299.9301" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="imagined" d="M625 303L616.1814 301.5056L620.9044 295.0485Z" fill="#146ca1"/><rect x="551.7261" y="256" width="46" height="25" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="573.7261" y="275" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.06</text><path d="M625 175L454.1971 299.9301" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="imagined" d="M450 303L454.0956 295.0485L458.8186 301.5056Z" fill="#258375"/><rect x="542.8089" y="199" width="46" height="25" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="564.8089" y="218" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.08</text><path d="M625 175L625 297.8" fill="none" stroke="#258375" stroke-width="5.120000000000001" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="imagined" d="M625 303L621 295L629 295Z" fill="#258375"/><rect x="591" y="223.5" width="46" height="25" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="613" y="242.5" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.32</text><circle cx="450" cy="163" r="11" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="450" y="142" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.6</text><circle cx="450" cy="320" r="22.0472" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="0.2"/><text x="450" y="327" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.62</text><text x="450" y="365" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">左室</text><circle cx="625" cy="163" r="11" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="625" y="142" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.4</text><circle cx="625" cy="320" r="17.2604" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="0.2"/><text x="625" y="327" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.38</text><text x="625" y="365" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">右室</text><text x="378" y="402" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">虚线：模型搬运概率，并非观察。</text><text x="28" y="461" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">③ 实际看到：指示灯亮</text><circle cx="188" cy="506" r="14" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M180 526L196 526" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M161 496L154.25 491" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M215 496L221.75 491" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="49" y="546" width="102" height="76" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="68" cy="571" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="84" cy="571" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="100" cy="571" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="116" cy="571" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="132" cy="571" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="68" cy="592" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="84" cy="592" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="100" cy="592" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="116" cy="592" r="5" fill="#c8d6e0" stroke="none" stroke-width="2" opacity="1"/><circle cx="132" cy="592" r="5" fill="#c8d6e0" stroke="none" stroke-width="2" opacity="1"/><text x="100" y="654" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">左室时亮 8/10</text><rect x="224" y="546" width="102" height="76" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><circle cx="243" cy="571" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="259" cy="571" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="275" cy="571" r="5" fill="#c8d6e0" stroke="none" stroke-width="2" opacity="1"/><circle cx="291" cy="571" r="5" fill="#c8d6e0" stroke="none" stroke-width="2" opacity="1"/><circle cx="307" cy="571" r="5" fill="#c8d6e0" stroke="none" stroke-width="2" opacity="1"/><circle cx="243" cy="592" r="5" fill="#c8d6e0" stroke="none" stroke-width="2" opacity="1"/><circle cx="259" cy="592" r="5" fill="#c8d6e0" stroke="none" stroke-width="2" opacity="1"/><circle cx="275" cy="592" r="5" fill="#c8d6e0" stroke="none" stroke-width="2" opacity="1"/><circle cx="291" cy="592" r="5" fill="#c8d6e0" stroke="none" stroke-width="2" opacity="1"/><circle cx="307" cy="592" r="5" fill="#c8d6e0" stroke="none" stroke-width="2" opacity="1"/><text x="275" y="654" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">右室时亮 2/10</text><text x="28" y="698" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">橙点：给定位置时，灯亮的概率。</text><text x="378" y="461" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">④ 用灯光更新信念</text><rect x="402" y="518" width="96" height="104" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M438 622L462 622" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="450" cy="570" r="33.5232" fill="#258375" stroke="#258375" stroke-width="2" opacity="0.25"/><text x="450" y="576" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.8671</text><text x="450" y="649" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">左室</text><rect x="577" y="518" width="96" height="104" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M613 622L637 622" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="625" cy="570" r="13.1223" fill="#258375" stroke="#258375" stroke-width="2" opacity="0.25"/><text x="625" y="576" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.1329</text><text x="625" y="649" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">右室</text><text x="378" y="681" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">.496 + .076 = .572</text><text x="378" y="717" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两份联合概率，同除 .572。</text><text x="20" y="789" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">观测改变的是信念，不是把物体搬到左室。</text></g></svg>
