<svg xmlns="http://www.w3.org/2000/svg" width="720" height="609" viewBox="0 0 720 609" role="img" aria-labelledby="crl-1s5n32k-title crl-1s5n32k-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1s5n32k-title">先提出问题，再学习到达办法</title><desc id="crl-1s5n32k-desc">原创同步记录备份。C是第二次自动选择的目标。第一轮将B到C内部成功值写成1，S仍为0；第二轮S到B的值成为0.9并确定策略。小图仅画已知原路，省略已知A探测支路和未试C探测。首次到达C停止的规则由设计给定，未训练任意终止函数。真实外部reward始终0，时长2使option后果模型的端点折扣为0.81；内部目标答案0.9不能写进外部奖励模型。</desc><rect width="720" height="609" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先提出问题，再学习到达办法</text><text x="28" y="83" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">已选 g=C：对旧记录做同步备份</text><text x="25" y="120" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">第 1 轮：B 先读到 C 的成功</text><g transform="translate(25,145)"><path d="M42.1791 131.2567L102.7452 82.8038" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M107.8209 78.7433L103.1357 88.8946L96.8887 81.0859Z" fill="#c8d6e0"/><path d="M41.828 159.171L98.2 206.6421" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M103.172 210.829L92.3022 208.2122L98.7435 200.5631Z" fill="#c8d6e0"/><path d="M147 65L251.5 65" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M258 65L248 70L248 60Z" fill="#c8d6e0"/><path d="M142 225L226.5 225" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M233 225L223 230L223 220Z" fill="#c8d6e0"/><path d="M258.3963 203.2637L275.6003 93.1583" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M2