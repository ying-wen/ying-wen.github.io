<svg xmlns="http://www.w3.org/2000/svg" width="360" height="974" viewBox="0 0 360 974" role="img" aria-labelledby="crl-12wrefb-title crl-12wrefb-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-12wrefb-title">目标平滑如何削弱窄峰</title><desc id="crl-12wrefb-desc">原创构造计算，沿用两步定位器的旧经验。两个固定target critic都是真实末步Q加同中心同宽度的Gaussian形误差，振幅分别.8和.3；target actor输出1.4。紫色阴影为加上裁剪Normal噪声后的动作范围[1.2,1.6]，sigma=.15，clip=.2。蓝线是较小critic对裁剪噪声的期望，以2000分段Simpson积分并加两端概率原子计算。下部圆点共用标签数值轴。没有训练critic；没有声称该期望是真实策略价值。</desc><rect width="360" height="974" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">目标平滑如何削弱窄峰</text><text x="28" y="85" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一旧经验；只改变后继查询</text><path d="M64 139L64 399" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M64 399L64 404" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="64" y="425" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M130 139L130 399" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M130 399L130 404" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="130" y="425" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.2</text><path d="M196 139L196 399" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M196 399L196 404" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="196" y="425" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.4</text><path d="M262 139L262 399" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M262 399L262 404" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="262" y="425" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.6</text><path d="M328 139L328 399" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M328 399L328 404" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="328" y="425" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.8</text><path d="M64 391.973L328 391.973" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M59 391.973L64 391.973" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="54" y="396.973" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">-1.5</text><path d="M64 321.7027L328 321.7027" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M59 321.7027L64 321.7027" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="54" y="326.7027" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">-1</text><path d="M64 251.4324L328 251.4324" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M59 251.4324L64 251.4324" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="54" y="256.4324" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">-0.5</text><path d="M64 181.1622L328 181.1622" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M59 181.1622L64 181.1622" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="54" y="186.1622" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M64 139L64 399" fill="none" stroke="#19354e" stroke-wid