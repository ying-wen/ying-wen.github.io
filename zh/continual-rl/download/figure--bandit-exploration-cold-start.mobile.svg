<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1031" viewBox="0 0 360 1031" role="img" aria-labelledby="crl-1ecp7lh-title crl-1ecp7lh-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1ecp7lh-title">初值怎样改变下一动作</title><desc id="crl-1ecp7lh-desc">同一三臂Bernoulli任务的两个六步机制轨迹。两者均用贪心、常数步长0.5、字母先后并列规则。零初值六次都选A并收到零；初值1.5使动作序列成为A、B、C、B、C、C，收到0、1、1、0、1、0。各臂奖励按预先给定的访问前缀返回，但选择器只读取实际选择的结果。末尾水平青线长表示价值估计，共用0到1.5的尺度；图仅解释初始化影响，不比较期望累计表现。</desc><rect width="360" height="1031" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">初值怎样改变下一动作</text><text x="22" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每次：贪心选择，再用 α=0.5 更新</text><text x="22" y="112" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">并列选字母在前的动作；只显示收到的奖励</text><text x="22" y="146" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">Q₁=(0,0,0)</text><text x="65" y="177" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=1</text><circle cx="65" cy="211" r="22" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="65" y="218" font-size="20" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="65" y="250" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">R=0</text><path d="M90 211L150.45 211" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M155 211L148 214.5L148 207.5Z" fill="#b65a28"/><text x="180" y="177" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=2</text><circle cx="180" cy="211" r="22" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="180" y="218" font-size="20" fill="#b65a28" text-anchor="middl