<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="crl-l67ocf-title crl-l67ocf-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-l67ocf-title">表示变了，谁的答案也变</title><desc id="crl-l67ocf-desc">标量观测x=1，经编码器z=φx，φ从1更新为2。保持三个读出参数不变，预测2z由2到4，左动作值z由1到2而右动作值仍1.5，预测物理后继0.5z由0.5到1。环境未变。纯坐标缩放可把三个输入权重同时减半恢复答案，但一般非线性表示改变不一定有这样的可逆补偿。</desc><rect width="720" height="720" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">表示变了，谁的答案也变</text><g transform="translate(28,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 同一观测，坐标改变</text><rect x="15" y="59" width="54" height="54" rx="5" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M23 67L23 105" fill="none" stroke="#19354e" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M33 67L33 105" fill="none" stroke="#19354e" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M43 67L43 105" fill="none" stroke="#19354e" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M53 67L53 105" fill="none" stroke="#19354e" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="42" y="144" font-size="19" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">x=1</text><path d="M77 87L121.5 87" fill="none" stroke="#19354e" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M128 87L118 92L118 82Z" fill="#19354e"/><path d="M143 157L316 157" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="153" y="119" width="34" height="38" rx="2" fill="#146ca1" stroke="#146ca1" stroke-width="1.5" opacity="1"/><rect x="260" y="81" width="34" height="76" rx="2" fill="#258375" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="170" y="105" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="277" y="66" font-size="21" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M194 121L248.8855 101.2052" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M255 99L247.2894 107.0961L243.8968 97.6892Z" fill="#b65a28"/><text x="0" y="209" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">仅更新编码器 φ：1 → 2</text><text x="0" y="246" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">辅助目标：z = 2</text><path d="M0 28L316 28" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/></g><g transform="translate(376,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 头部没更新，答案变了</text><text x="0" y="84" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">预测</text><path d="M86 77L289 77" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="187.5" cy="77" r="7" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="289" cy="77" r="7" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><path d="M197.5 62L273.5 62" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M280 62L270 67L270 57Z" fill="#b65a28"/><text x="187.5" y="106" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="289" y="106" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">4</text><text x="0" y="160" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">控制</text><path d="M86 153L289 153" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="187.5" cy="153" r="7" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="289" cy="153" r="7" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><path d="M238.25,138 v30" fill="none" stroke="#52687b" stroke-width="2" stroke-dasharray="4 3"/><text x="187.5" y="183" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">L:1</text><text x="289" y="183" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="238.25" y="130" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R:1.5</text><text x="0" y="236" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">模型</text><path d="M86 229L289 229" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="187.5" cy="229" r="9" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="289" cy="229" r="7" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><path d="M200.5 229L270.5 229" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M277 229L267 234L267 224Z" fill="#b65a28"/><text x="187.5" y="259" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="289" y="259" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M0 28L316 28" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/></g><g transform="translate(28,425)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · 已知缩放可同步补偿</text><text x="90" y="58" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">预测</text><text x="90" y="96" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2z</text><path d="M90 110L90 132.5" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M90 139L85 129L95 129Z" fill="#b65a28"/><text x="90" y="169" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">z</text><text x="90" y="212" font-size="21" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="332" y="58" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">控制</text><text x="332" y="96" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">z</text><path d="M332 110L332 132.5" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M332 139L327 129L337 129Z" fill="#b65a28"/><text x="332" y="169" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.5z</text><text x="332" y="212" font-size="21" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">(1, 1.5)</text><text x="574" y="58" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">模型</text><text x="574" y="96" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5z</text><path d="M574 110L574 132.5" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M574 139L569 129L579 129Z" fill="#b65a28"/><text x="574" y="169" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.25z</text><text x="574" y="212" font-size="21" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="332" y="255" font-size="21" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">所有输入权重 ÷ 2，原答案恢复</text><path d="M0 28L664 28" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/></g></g></svg>
