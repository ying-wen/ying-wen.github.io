<svg xmlns="http://www.w3.org/2000/svg" width="360" height="997" viewBox="0 0 360 997" role="img" aria-labelledby="crl-18evnra-title crl-18evnra-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-18evnra-title">一次更新怎样牵动两个预测？</title><desc id="crl-18evnra-desc">原创精确计算。上方为两步走廊，奖励加2和减1，折扣1。左图特征有相同单位长度，内积0.8由虚线投影显示。右图以A、B预测为两条坐标轴，圆点0、1、2表示从零开始在完整回报可用后按A、B顺序进行MC回归的预测，方框是真值(1,−1)。第一步让A更准却使B更差，均匀半平方误差从0.5增加到0.5525。坐标与箭头均由脚本数值生成；不是学习曲线。</desc><rect width="360" height="997" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次更新怎样牵动两个预测？</text><path d="M71 106L147.15 106" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M153 106L144 110.5L144 101.5Z" fill="#146ca1"/><text x="112" y="89" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">+2</text><circle cx="48" cy="106" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="48" y="113" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M199 106L276.15 106" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M282 106L273 110.5L273 101.5Z" fill="#146ca1"/><text x="240.5" y="89" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">−1</text><circle cx="176" cy="106" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="176" y="113" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><circle cx="305" cy="106" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="305" y="113" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">⊥</text><circle cx="305" cy="106" r="27" fill="none" stroke="#146ca1" stroke-width="1" opacity="1"/><text x="24" y="159" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">γ=1；完整回报 G(A)=1，G(B)=−1</text><text x="24" y="205" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">共享方向：两个单位特征</text><path d="M60 483L290 483" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M60 483L60 253" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="290" y="531" font-size="18" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">x₁</text><text x="60" y="237" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">x₂</text><path d="M60 479L60 487" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="60" y="507" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M236.9231 479L236.9231 487" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="236.9231" y="507" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M56 306.0769L64 306.0769" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="51" y="311.0769" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M60 483L231.0731 483" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M236.9231 483L227.9231 487.5L227.9231 478.5Z" fill="#146ca1"/><path d="M60 483L196.8585 380.3562" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M201.5385 376.8462L197.0385 385.8462L191.6385 378.6462Z" fill="#258375"/><path d="M201.5385 376.8462L201.5385 483" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 5"/><text x="