t-anchor="end" font-weight="400" opacity="1">0.2</text><path d="M76 510L690 510" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M71 510L76 510" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="66" y="515" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.4</text><path d="M76 510L76 725" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M76 725L690 725" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="76" y="492" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">|∂h/∂η|</text><path d="M76 724.7373L85.5938 724.6627L95.1875 724.5671L104.7813 724.4443L114.375 724.2867L123.9688 724.0846L133.5625 723.8254L143.1563 723.493L152.75 723.0671L162.3438 722.5216L171.9375 721.8234L181.5313 720.9306L191.125 719.7902L200.7188 718.3359L210.3125 716.4846L219.9063 714.134L229.5 711.1585L239.0938 707.4074L248.6875 702.7027L258.2813 696.8405L267.875 689.5971L277.4688 680.7422L287.0625 670.0629L296.6563 657.4036L306.25 642.7214L315.8438 626.1583L325.4375 608.1208L335.0313 589.3457L344.625 570.9243L354.2188 554.2457L363.8125 540.8384L373.4063 532.116L383 529.0865L392.5938 532.116L402.1875 540.8384L411.7813 554.2457L421.375 570.9243L430.9688 589.3457L440.5625 608.1208L450.1563 626.1583L459.75 642.7214L469.3438 657.4036L478.9375 670.0629L488.5313 680.7422L498.125 689.5971L507.7188 696.8405L517.3125 702.7027L526.9063 707.4074L536.5 711.1585L546.0938 714.134L555.6875 716.4846L565.2813 718.3359L574.875 719.7902L584.4688 720.9306L594.0625 721.8234L603.6563 722.5216L613.25 723.0671L622.8438 723.493L632.4375 723.8254L642.0313 724.0846L651.625 724.2867L661.2188 724.4443L670.8125 724.5671L680.4063 724.6627L690 724.7373" fill="none" stroke="#7854a2" stroke-width="3"/><text x="360" y="775" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">门参数 η（固定边界的扫描）</text><text x="28" y="824" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">两端 g(1−g) 很小；完整梯度到达，也可能更新缓慢</text><text x="28" y="861" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">表达能力：|h旧|≤1 且 g&gt;1/2 时，总能跟随新提示</text><text x="28" y="899" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">本图改变初始化；没有改变记忆维度或反传窗口</text></g></svg>
