<svg xmlns="http://www.w3.org/2000/svg" width="360" height="957" viewBox="0 0 360 957" role="img" aria-labelledby="crl-29uao-title crl-29uao-desc" data-crl-visual="v1" data-evidence-kind="measured"><title id="crl-29uao-title">元学习把后来的结果传给学习规则</title><desc id="crl-29uao-desc">同一seed0的6,R两次执行。t5保留旧beta的局部敏感度h=.191；t7开始下次执行并缓存预测.191；t9实得.96形成延迟梯度-.146879。更新当前beta后下一次alpha=.2518427457；当前执行alpha始终.25。局部导数冻结起始表、路径和目标，不是终身奖励梯度。</desc><rect width="360" height="957" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">元学习把后来的结果传给学习规则</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先记录怎样学，再看下次实际后果</text><path d="M90 173L263.8756 234.8224" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M270 237L258.9028 238.361L262.2529 228.9388Z" fill="#258375"/><path d="M270 283L96.1244 344.8224" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M90 347L97.7471 338.9388L101.0972 348.361Z" fill="#b65a28"/><circle cx="90" cy="150" r="24" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="90" y="156" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">t = 5</text><circle cx="270" cy="260" r="24" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="270" y="266" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">t = 7</text><circle cx="90" cy="370" r="24" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="90" y="376" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">t = 9</text><text x="137" y="143" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">保留局部敏感度</text><text x="137" y="172" font-size="17" fill="#258375" text-anchor="start" font-weight="400" opacity="1">h = 0.191</text><text x="28" y="253" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">再次从 6 执行 R</text><text x="28" y="282" font-size="17" fill="#258375" text-anchor="start" font-weight="400" opacity="1">缓存旧预测 0.191</text><text x="137" y="363" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">收下完整新回报</text><text x="137" y="392" font-size="17" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">G = 0.96</text><text x="28" y="451" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">后来的回报，评价先前留下的预测</text><path d="M58 621L306 621" fill="none" stroke="#19354e" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="46" y="626" font-size="15" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M58 621L306 621" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="46" y="561" font-size="15" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.5</text><path d="M58 556L306 556" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="46" y="496" font-size="15" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">1</text><path d="M58 491L306 491" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="94" y="596.17" width="44" height="24.83" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="116" y="584.17" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.191</text><text x="116" y="649" font-size="17" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">旧预测</text><rect x="216" y="496.2" width="44" height="124.8" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="238" y="484.2" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">0.96</text><text x="238" y="649" font-size="17" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">新回报</text><text x="28" y="713" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">误差 × 旧敏感度</text><text x="28" y="751" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">(0.191 − 0.96) × 0.191 = -0.146879</text><text x="28" y="795" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">β ← β − 0.05 × 梯度；α = exp(β)</text><text x="28" y="837" font-size="21" fill="#258375" text-anchor="start" font-weight="400" opacity="1">下次步长：0.25 → 0.251843</text><text x="28" y="882" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">本次执行已用 0.25；改变从下次开始</text><text x="28" y="919" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">这里求局部预测更新的导数，未穿过规划</text></g></svg>
