<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1079" viewBox="0 0 360 1079" role="img" aria-labelledby="crl-8lr1bc-title crl-8lr1bc-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-8lr1bc-title">相同预测误差，信息来源不同</title><desc id="crl-8lr1bc-desc">原创精确计算。Theta先验L/R各半，两通道输出均为-1/+1，预测均值0时更新前平方误差均1。条件于实际观察+1，路标把后验改成P(R)=1，随机屏幕保持P(R)=1/2。上方条高为关于Theta的概率，同一概率尺度；信息增益分别1 bit与0 bit。下方条长为下一次同类目标的Bayes均方预测误差：固定路标1变0，独立下一屏幕帧1保持1。路标下次读同一固定符号，屏幕下次读新的独立符号，未把重拟合当前噪声帧当作可迁移进展。</desc><rect width="360" height="1079" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同预测误差，信息来源不同</text><text x="28" y="83" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">都观察到 +1；更新前平方误差都为 1</text><text x="28" y="132" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">固定路标 Z=+1</text><text x="83" y="174" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">观察前</text><path d="M28 288L139 288" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="41" y="248" width="30" height="40" rx="0" fill="#52687b" stroke="none" stroke-width="1.5" opacity="1"/><text x="56" y="237" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="56" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><rect x="98" y="248" width="30" height="40" rx="0" fill="#52687b" stroke="none" stroke-width="1.5" opacity="1"/><text x="113" y="237" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="113" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><text x="257" y="174" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">观察后</text><path d="M202 288L313 288" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="215" y="288" width="30" height="0" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="230" y="277" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="230" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">L</text><rect x="272" y="208" width="30" height="80" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="287" y="197" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="287" y="313" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><path d="M152 240L181.8 240" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M187 240L179 244L179 236Z" fill="#258375"/><text x="28" y="351" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">关于 Θ 的信息：1 bit</text><text x="28" y="390" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">下一次同类目标的平方误差</text><text x="28" y="429" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新前</text><path d="M104 423L286 423" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="104" y="412" width="154" height="22" rx="0" fill="#aebbc5" stroke="none" stroke-width="1.5" opacity="1"/><text x="298" y="429" font-size="18" fill="#258375" text-anchor="end" font-weight="400" opacity="1">1</text><text x="28" y="470" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新后</text><path d="M104 464L286 464" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="104" y="453" width="0" height="22" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/>