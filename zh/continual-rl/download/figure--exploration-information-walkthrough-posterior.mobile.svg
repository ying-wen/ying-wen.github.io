city="1">0.5</text><text x="287" y="741" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">R</text><path d="M152 668L181.8 668" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M187 668L179 672L179 664Z" fill="#146ca1"/><text x="28" y="779" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">关于 Θ 的信息：0 bit</text><text x="28" y="818" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">下一次同类目标的平方误差</text><text x="28" y="857" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新前</text><path d="M104 851L286 851" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="104" y="840" width="154" height="22" rx="0" fill="#aebbc5" stroke="none" stroke-width="1.5" opacity="1"/><text x="298" y="857" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">1</text><text x="28" y="898" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新后</text><path d="M104 892L286 892" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="104" y="881" width="154" height="22" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="298" y="898" font-size="18" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">1</text><text x="28" y="940" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">误差下降 LP = 0</text><text x="28" y="1014" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">条高：侧别概率；条长：均方误差</text><text x="28" y="1046" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">更新后验与均值；噪声分布已知</text></g></svg>
