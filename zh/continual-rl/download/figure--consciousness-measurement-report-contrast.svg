<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1018" viewBox="0 0 720 1018" role="img" aria-labelledby="crl-2kg7yd-title crl-2kg7yd-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-2kg7yd-title">报告交互：保留两层比较</title><desc id="crl-2kg7yd-desc">原创测量路径示意，没有实测波形或效应大小。原始眼部视频清理、平滑及阈值检测后，在有报告条件中用于与按键校准；主动和被动条件都以连续眼部信号经血流响应卷积建立BOLD回归。橙色代表主动报告，蓝色代表被动观看；空心圆代表竞争、空心三角代表物理重放，两种形状都没有数量编码。每任务先计算竞争减重放，再计算主动与被动两个差异之差。大脑内部线条仅示外形，无活动定位。</desc><rect width="720" height="1018" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">报告交互：保留两层比较</text><text x="28" y="85" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一份眼部记录，承担两种用途</text><path d="M66 141 Q112 109 158 141 Q112 173 66 141Z" fill="#ffffff" stroke="#19354e" stroke-width="2"/><circle cx="112" cy="141" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="112" cy="141" r="6" fill="#19354e" stroke="none" stroke-width="2" opacity="1"/><text x="112" y="184" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">原始视频</text><path d="M168 141L251.5 141" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M258 141L248 146L248 136Z" fill="#146ca1"/><text x="282" y="124" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">剔除眨眼 / OKN快相</text><text x="282" y="160" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">插值、平滑、阈值检测</text><text x="28" y="252" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">报告可用时：校准代理与按键的对应</text><circle cx="98" cy="306" r="12" fill="#ffffff" stroke="#b65a28" stroke-width="3" opacity="1"/><path d="M119 306L256.5 306" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M263 306L253 311L253 301Z" fill="#b65a28"/><rect x="282" y="292" width="52" height="28" rx="6" fill="#f5e4d8" stroke="#b65a28" stroke-width="1.5" opacity="1"/><circle cx="297" cy="306" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><circle cx="319" cy="306" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="358" y="357" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">延迟在同一数据中选择</text><text x="28" y="408" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">两种任务中：眼部信号与BOLD回归</text><path d="M80 470 Q126 438 172 470 Q126 502 80 470Z" fill="#ffffff" stroke="#19354e" stroke-width="2"/><circle cx="126" cy="470" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="126" cy="470" r="6" fill="#19354e" stroke="none" stroke-width="2" opacity="1"/><path d="M183 470L474.5 470" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M481 470L471 475L471 465Z" fill="#146ca1"/><ellipse cx="534" cy="470" rx="48" ry="34" fill="#f5f8fb" stroke="#146ca1" stroke-width="2"/><path d="M509 465 Q523 441 537 469 Q556 494 567 460" fill="none" stroke="#c8d6e0" stroke-width="3"/><text x="231" y="530" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">连续信号 → 血流响应卷积 → GLM</text><text x="28" y="596" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每种任务先扣除物理重放</text><text x="28" y="634" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">主动报告</text><circle cx="214" cy="664" r="12" fill="#ffffff" stroke="#b65a28" stroke-width="3" opacity="1"/><text x="310" y="670" font-size="25" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">−</text><path d="M347 650L361 676L333 676Z" fill="#ffffff" stroke="#b65a28" stroke-width="3"/><text x="384" y="670" font-size="25" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">=</text><text x="520" y="670" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">D主动</text><text x="214" y="706" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">竞争</text><text x="347" y="706" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">重放</text><text x="28" y="746" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">被动观看</text><circle cx="214" cy="776" r="12" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="310" y="782" font-size="25" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">−</text><path d="M347 762L361 788L333 788Z" fill="#ffffff" stroke="#146ca1" stroke-width="3"/><text x="384" y="782" font-size="25" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">=</text><text x="520" y="782" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">D被动</text><text x="214" y="818" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">竞争</text><text x="347" y="818" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">重放</text><text x="28" y="913" font-size="25" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Δ = D主动 − D被动</text><text x="28" y="956" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">圆/三角标条件；没有表示效应大小</text><text x="28" y="988" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">比较的是差异的差异；不是原始活动</text></g></svg>
