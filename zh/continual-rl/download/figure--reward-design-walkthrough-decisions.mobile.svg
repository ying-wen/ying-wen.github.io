<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1083" viewBox="0 0 360 1083" role="img" aria-labelledby="crl-1d0tysh-title crl-1d0tysh-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1d0tysh-title">奖励改变后，控制器选哪条路</title><desc id="crl-1d0tysh-desc">已知任务模型，对所有可行轨迹作精确求解。横轴是各奖励信号下相对第2步送达的折扣训练回报差，同尺度比较。橙圆为第3步送达，紫方为超时，零线为第2步送达。各行箭头给出真实执行决策，并用独立原任务奖励评价：原奖励选早送达0.9；代理奖金选超时0；正确势差仍选早送达0.9；错误保留终端门口势选超时0；省去塑形折扣选迟送达0.81。正确势差减去所有路径同一起点势1，所以差值不变。此图是精确规划决策，不是训练曲线或学习速度证据。</desc><rect width="360" height="1083" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">奖励改变后，控制器选哪条路</text><text x="28" y="84" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相对“第2步送达”的训练回报差</text><text x="68" y="119" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><text x="115.2727" y="119" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="209.8182" y="119" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="304.3636" y="119" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M68 126L68 968" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><path d="M115.2727 126L115.2727 968" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M209.8182 126L209.8182 968" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><path d="M304.3636 126L304.3636 968" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><rect x="25" y="132" width="311" height="28" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="153" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">原任务奖励</text><text x="28" y="180" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">→ 第2步送达；真回报 0.9</text><path d="M115.2727 218L111.0182 218" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="111.0182" cy="218" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="101.0182" y="224" font-size="16" fill="#b65a28" text-anchor="end" font-weight="400" opacity="1">-0.09</text><path d="M115.2727 259L72.7273 259" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><rect x="68.7273" y="255" width="8" height="8" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="62.7273" y="265" font-size="16" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">-0.9</text><rect x="25" y="299" width="311" height="28" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="320" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">门口占用奖金</text><text x="28" y="347" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">→ 等待至超时；真回报 0</text><path d="M115.2727 385L238.6545 385" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="238.6545" cy="385" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="238.6545" y="375" font-size="16" fill="#b65a28" text-anchor="end" font-weight="400" opacity="1">+2.61</text><path d="M115.2727 426L315.2364 426" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><rect x="311.2364" y="422" width="8" height="8" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="315.2364" y="416" font-size="16" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">+4.23</text><rect x="25" y="466" width="311" height="28" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="487" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">正确势差塑形</text><text x="28" y="514" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">→ 第2步送达；真回报 0.9</text><path d="M115.2727 552L111.0182 552" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="111.0182" cy="552" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="101.0182" y="558" font-size="16" fill="#b65a28" text-anchor="end" font-weight="400" opacity="1">-0.09</text><path d="M115.2727 593L72.7273 593" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><rect x="68.7273" y="589" width="8" height="8" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="62.7273" y="599" font-size="16" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">-0.9</text><rect x="25" y="633" width="311" height="28" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="654" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">遗漏超时边界</text><text x="28" y="681" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">→ 等待至超时；真回报 0</text><path d="M115.2727 719L111.0182 719" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="111.0182" cy="719" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="101.0182" y="725" font-size="16" fill="#b65a28" text-anchor="end" font-weight="400" opacity="1">-0.09</text><path d="M115.2727 760L176.1127 760" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><rect x="172.1127" y="756" width="8" height="8" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="176.1127" y="750" font-size="16" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">+1.287</text><rect x="25" y="800" width="311" height="28" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="821" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">遗漏塑形折扣</text><text x="28" y="848" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">→ 第3步送达；真回报 0.81</text><path d="M115.2727 886L123.7818 886" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="123.7818" cy="886" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="123.7818" y="876" font-size="16" fill="#b65a28" text-anchor="end" font-weight="400" opacity="1">+0.18</text><path d="M115.2727 927L85.4909 927" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><rect x="81.4909" y="923" width="8" height="8" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="75.4909" y="933" font-size="16" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">-0.63</text><text x="28" y="1008" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">橙圆：第3步送达；紫方：超时</text><text x="28" y="1043" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">向右超过0，才胜过尽早送达</text></g></svg>
