<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1110" viewBox="0 0 360 1110" role="img" aria-labelledby="crl-1m3r94e-title crl-1m3r94e-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1m3r94e-title">真实后果改变随机模型</title><desc id="crl-1m3r94e-desc">同一道路的独立平稳随机变体，G、D、B均真正终止。先真实探索exit得0.6，再规定四次go与cross探索，cross记录D,G,G,G；不是当前贪心策略自然生成的访问。蓝时间线上的圆是实际后果，条长表示joint reward/successor counts归一化后的质量。G计数依次0,1,2,3，cross总计数1,2,3,4，成功比例和奖励均值依次0,1/2,2/3,3/4。紫虚线是模型可能后果，橙线仅用于其他图标实际经过的路；图中没有给学习器真实概率。原创精确记录和计数计算。</desc><rect width="360" height="1110" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">真实后果改变随机模型</text><text x="28" y="86" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">终点 G、D、B；γ=0.9</text><g transform="translate(26,132)"><path d="M43.3834 95.072L117.577 76.2092" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M122.6166 74.928L115.8489 80.7758L113.8777 73.0225Z" fill="#c8d6e0"/><path d="M38.8938 113.3482L111.2338 178.1813" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M115.1062 181.6518L106.479 179.2913L111.8183 173.3337Z" fill="#c8d6e0"/><path d="M160.4615 62.3077L226.7385 34.6923" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M231.5385 32.6923L225.6923 39.4615L222.6154 32.0769Z" fill="#7854a2"/><path d="M158.7831 80.8779L228.8533 126.2938" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M233.2169 129.1221L224.3281 128.1275L228.6793 121.4143Z" fill="#7854a2"/><circle cx="24" cy="100" r="19" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="24" y="106" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><circle cx="142" cy="70" r="19" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><text x="142" y="76" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">A</text><circle cx="250" cy="25" r="19" fill="#e1f3ed" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="250" cy="25" r="15" fill="none" stroke="#52687b" stroke-width="1" opacity="1"/><text x="250" y="31" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">G</text><circle cx="250" cy="140" r="19" fill="#fae8e8" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="250" cy="140" r="15" fill="none" stroke="#52687b" stroke-width="1" opacity="1"/><text x="250" y="146" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">D</text><circle cx="130" cy="195" r="19" fill="#e1f3ed" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="130" cy="195" r="15" fill="none" stroke="#52687b" stroke-width="1" opacity="1"/><text x="130" y="201" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">B</text><text x="78" y="65" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">go: 0</text><text x="27" y="191" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">exit: 0.6</text><text x="245" y="-7" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">r=1</text><text x="250" y="181" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">r=0</text></g><text x="28" y="375" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">实际 cross 后果 → 联合计数模型</text><path d="M48 430L48 940" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="48" cy="440" r="19" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><text x="48" y="446" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">D</text><text x="88" y="418" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">N=1；G 计数=0</text><rect x="88" y="437" width="0" height="23" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><rect x="88" y="437" width="225" height="23" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="1"/><text x="88" y="491" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">p̂(G)=0</text><text x="88" y="521" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">奖励均值 0</text><circle cx="48" cy="590" r="19" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="48" y="596" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="88" y="568" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">N=2；G 计数=1</text><rect x="88" y="587" width="112.5" height="23" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><rect x="200.5" y="587" width="112.5" height="23" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="1"/><text x="88" y="641" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">p̂(G)=1/2</text><text x="88" y="671" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">奖励均值 1/2</text><circle cx="48" cy="740" r="19" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="48" y="746" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="88" y="718" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">N=3；G 计数=2</text><rect x="88" y="737" width="150" height="23" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><rect x="238" y="737" width="75" height="23" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="1"/><text x="88" y="791" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">p̂(G)=2/3</text><text x="88" y="821" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">奖励均值 2/3</text><circle cx="48" cy="890" r="19" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="48" y="896" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="88" y="868" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">N=4；G 计数=3</text><rect x="88" y="887" width="168.75" height="23" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><rect x="256.75" y="887" width="56.25" height="23" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="1"/><text x="88" y="941" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">p̂(G)=3/4</text><text x="88" y="971" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">奖励均值 3/4</text><text x="28" y="1026" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">青段：G、奖励1；红段：D、奖励0</text><text x="28" y="1060" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">先探索 exit，再规定四次 go/cross</text></g></svg>
