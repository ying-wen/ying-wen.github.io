<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="crl-1nz6o16-title crl-1nz6o16-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1nz6o16-title">一次更新，哪些邻居会改变？</title><desc id="crl-1nz6o16-desc">两套错位网格、格宽一、无哈希碰撞。在状态0.25更新误差一，每个活动权重增加0.1。四个探测点共享一、二、一、零个活动tile，预测分别增加0.1、0.2、0.1、0。每幅图使用同一坐标区间，着色表示此次被更新的tile。</desc><rect width="720" height="490" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="38" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一次更新，哪些邻居会改变？</text><text x="28" y="76" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">s = 0.25 · δ = 1 · α = 0.1</text><text x="35" y="128" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">网格 1</text><rect x="35" y="142" width="72" height="42" rx="0" fill="#ffffff" stroke="#146ca1" stroke-width="1.5" opacity="1"/><rect x="107" y="142" width="144" height="42" rx="0" fill="#dcebf5" stroke="#146ca1" stroke-width="1.5" opacity="1"/><rect x="251" y="142" width="72" height="42" rx="0" fill="#ffffff" stroke="#146ca1" stroke-width="1.5" opacity="1"/><circle cx="143" cy="163" r="7" fill="#19354e" stroke="#ffffff" stroke-width="2" opacity="1"/><text x="35" y="204" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">网格 2</text><rect x="35" y="218" width="144" height="42" rx="0" fill="#d9eee7" stroke="#258375" stroke-width="1.5" opacity="1"/><rect x="179" y="218" width="144" height="42" rx="0" fill="#ffffff" stroke="#258375" stroke-width="1.5" opacity="1"/><circle cx="143" cy="239" r="7" fill="#19354e" stroke="#ffffff" stroke-width="2" opacity="1"/><path d="M143 115L143 275" fill="none" stroke="#19354e" stroke-width="1.5" stroke-linecap="round" opacity="1" stroke-dasharray="3 5"/><text x="35" y="289" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-0.5</text><text x="107" y="289" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="179" y="289" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="251" y="289" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="323" y="289" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.5</text><text x="35" y="325" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每个着色 tile：Δw = 0.1</text><text x="35" y="356" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">同一位置，每套网格激活一格。</text><text x="389" y="116" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">邻居的预测会改变多少？</text><path d="M410 314L685 314" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="400" y="319" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M410 248L685 248" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="400" y="253" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.1</text><path d="M410 182L685 182" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="400" y="187" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0.2</text><path d="M410 170L410 314" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M410 314L685 314" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M410 248H478.75L478.75 182H547.5L547.5 248H616.25L616.25 314H685" fill="none" stroke="#b65a28" stroke-width="4"/><circle cx="444.375" cy="248" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="444.375" y="345" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-0.25</text><circle cx="513.125" cy="182" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="513.125" y="345" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.25</text><circle cx="581.875" cy="248" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="581.875" y="345" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.75</text><circle cx="650.625" cy="314" r="5" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="650.625" y="345" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1.25</text><text x="410" y="377" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">共享 tile 数</text><text x="444.375" y="405" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="513.125" y="405" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="581.875" y="405" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="650.625" y="405" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="389" y="455" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">重叠越多，同次改变越大。</text></g></svg>
