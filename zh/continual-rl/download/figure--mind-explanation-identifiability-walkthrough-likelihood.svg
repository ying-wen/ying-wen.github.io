<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1129" viewBox="0 0 720 1129" role="img" aria-labelledby="crl-1fycxj4-title crl-1fycxj4-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1fycxj4-title">唯一交点与有限数据的宽峰</title><desc id="crl-1fycxj4-desc">原创精确计算。上图蓝实线为一次反馈概率sigmoid(1)的所有alpha beta组合；青虚线为两次反馈概率sigmoid(1.8)的组合，两者在A(.2,5)交叉，B(.5,2)仅在蓝线。下图人为给定各100轮、左选择73和86次，每个alpha用二项计数似然重新优化beta。纵轴为最大对数似然与该剖面的差，忽略不随参数变化的组合系数。只使用第一次条件时每个alpha均可通过beta达到同一最优似然，所以蓝线为零；双条件虽唯一最优，但alpha=.5的剖面损失仅约.265。橙点是(.174896,5.686948)的最大值，非真值恢复结果；曲线不是置信带。</desc><rect width="720" height="1129" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">唯一交点与有限数据的宽峰</text><text x="28" y="84" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">上：已知概率的等值曲线</text><path d="M150.5217 142L150.5217 425" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M150.5217 425L150.5217 430" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="150.5217" y="451" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.2</text><path d="M346.8261 142L346.8261 425" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M346.8261 425L346.8261 430" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="346.8261" y="451" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><path d="M674 142L674 425" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M674 425L674 430" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="674" y="451" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text>