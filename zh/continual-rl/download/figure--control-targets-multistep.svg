<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1043" viewBox="0 0 720 1043" role="img" aria-labelledby="crl-u794hg-title crl-u794hg-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-u794hg-title">多步：末端期望与逐层分支</title><desc id="crl-u794hg-desc">原创冻结表精确算例，沿A go、B fast、C finish的同一给定轨迹。gamma=.9，奖励1、2、3，B的fast/detour旧Q1/5及概率.25/.75，C的finish/quit旧Q4/0及概率.75/.25。前两次转移后，2-step Sarsa读C的已选finish旧Q4，目标6.04；末端Expected只在C平均到3，目标5.23；2-step Tree Backup还在B保留未走detour旧Q5，按.75与已走fast的深目标4.7按.25加权，得到5.4325。三面板都使用同样状态、奖励和旧表，只改变动作分支处理。蓝实线表示已收奖励1、2的A到B到C前缀，Sarsa面板的C到finish蓝线仅表示已选动作，此时尚未收到R3。绿色实线是C的末端期望分支，紫色虚线是B未执行detour的旧预测读取；它们不表示额外执行动作。C叶端Q=4和Q=0为旧动作价值，不是终端奖励。真正终止后，3-step Sarsa目标5.23；3-step TB用C的采样finish奖励3替换旧4、保留未采quit旧0，再保留B未采detour旧5，目标5.280625。未采分支仍有自举，终止轨迹的Tree Backup不一般等于MC。</desc><rect width="720" height="1043" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">多步：末端期望与逐层分支</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">已收奖励1、2；C 已选 finish</text><text x="117" y="128" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2-step Sarsa</text><circle cx="117" cy="188" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="117" y="195" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M117 212L117 253.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M117 260L112 250L122 250Z" fill="#146ca1"/><text x="135" y="242" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₁=1</text><circle cx="117" cy="285" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="117" y="292" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M117 309L117 367.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M117 374L112 364L122 364Z" fill="#146ca1"/><text x="135" y="331" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">fast</text><text x="135" y="365" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₂=2</text><circle cx="117" cy="399" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="117" y="406" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C</text><path d="M117 423L117 458.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M117 465L112 455L122 455Z" fill="#146ca1"/><circle cx="117" cy="478" r="11" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="117" y="511" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">finish</text><text x="117" y="535" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">Q=4</text><text x="117" y="565" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">目标 6.04</text><text x="349" y="128" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">只在末端 Expected</text><circle cx="349" cy="188" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="349" y="195" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M349 212L349 253.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M349 260L344 250L354 250Z" fill="#146ca1"/><text x="367" y="242" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₁=1</text><circle cx="349" cy="285" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="349" y="292" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M349 309L349 367.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M349 374L344 364L354 364Z" fill="#146ca1"/><text x="367" y="331" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">fast</text><text x="367" y="365" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₂=2</text><circle cx="349" cy="399" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="349" y="406" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C</text><path d="M337 422L297 466" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M361 422L401 466" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="297" cy="478" r="11" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="401" cy="478" r="11" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="297" y="451" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">.75</text><text x="401" y="451" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">.25</text><text x="297" y="511" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">finish</text><text x="401" y="511" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">quit</text><text x="297" y="535" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=4</text><text x="401" y="535" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=0</text><text x="349" y="565" font-size="22" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">目标 5.23</text><text x="581" y="128" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">2-step Tree Backup</text><circle cx="581" cy="188" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="581" y="195" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M581 212L581 253.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M581 260L576 250L586 250Z" fill="#146ca1"/><text x="599" y="242" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₁=1</text><circle cx="581" cy="285" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="581" y="292" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M581 309L581 367.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M581 374L576 364L586 364Z" fill="#146ca1"/><text x="599" y="331" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">fast .25</text><text x="599" y="365" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₂=2</text><circle cx="581" cy="399" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="581" y="406" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">C</text><path d="M559 285L499 324" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><rect x="488" y="313" width="22" height="22" rx="0" fill="#ffffff" stroke="#7854a2" stroke-width="1.5" opacity="1"/><text x="499" y="356" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">5</text><text x="507" y="271" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">.75</text><text x="514" y="380" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">旧 detour</text><path d="M569 422L529 466" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M593 422L633 466" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="529" cy="478" r="11" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="633" cy="478" r="11" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="529" y="451" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">.75</text><text x="633" y="451" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">.25</text><text x="529" y="511" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">finish</text><text x="633" y="511" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">quit</text><text x="529" y="535" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=4</text><text x="633" y="535" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Q=0</text><text x="581" y="565" font-size="22" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">目标 5.4325</text><text x="28" y="634" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">蓝实线：奖励前缀与已选动作</text><text x="28" y="666" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">R₁=1、R₂=2；finish 已选，R₃ 未收</text><text x="28" y="698" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">绿实线：C 的末端期望分支</text><text x="28" y="730" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">紫虚线：B 未执行的 detour</text><text x="28" y="762" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">叶端 Q 为旧预测值，不是奖励</text><text x="28" y="808" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">C 的期望尾值：.75×4+.25×0=3</text><text x="28" y="846" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">Tree Backup 的 B→C 深目标为4.7</text><text x="28" y="884" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">A：1+.9×[.75×5+.25×(2+.9×3)]</text><text x="28" y="928" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">再收 R₃=3 并真正终止：</text><text x="28" y="966" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">3-step Sarsa=5.23</text><text x="28" y="1004" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">3-step TB=5.280625</text></g></svg>
