<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1217" viewBox="0 0 360 1217" role="img" aria-labelledby="crl-1ujp4i6-title crl-1ujp4i6-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1ujp4i6-title">支持空洞怎样传到起点</title><desc id="crl-1ujp4i6-desc">原创固定两步MDP算例。起点唯一动作go以奖励0到s；s的三动作全部终止。日志只含a0、a1各两次，奖励0、2；未见a2的终端后果用问号遮住。四完整episode共八条transition。下图显示给定Q(a2)=4怎样让旧go经验的max自举标签变3.6。蓝色两行是获得额外在线权限后，假设确定终端新反馈为−2、表格步长1，则Q(a2)改为−2，max标签改为1.8。新增反馈只是声明的反事实计算，没有执行环境采样。</desc><rect width="360" height="1217" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">支持空洞怎样传到起点</text><text x="28" y="85" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一任务；只记录两个末步动作</text><circle cx="63" cy="135" r="25" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="63" y="142" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">起点</text><circle cx="63" cy="305" r="25" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="63" y="312" font-size="21" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">s</text><path d="M63 163L63 270.5" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M63 277L58 267L68 267Z" fill="#146ca1"/><text x="102" y="199" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">go · r=0</text><text x="102" y="232" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">4 次</text><path d="M89 293L248.4562 195.3935" fill="none" stroke="#146ca1" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M254 192L248.0814 201.4853L242.8606 192.9563Z" fill="#146ca1"/><rect x="257" y="168" width="48" height="48" rx="0" fill="#ffffff" stroke="#146c