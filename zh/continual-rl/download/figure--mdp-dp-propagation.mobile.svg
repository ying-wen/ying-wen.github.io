<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1663" viewBox="0 0 360 1663" role="img" aria-labelledby="crl-11cx3v4-title crl-11cx3v4-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-11cx3v4-title">相同计算预算，不同传播前沿</title><desc id="crl-11cx3v4-desc">原创已知模型计算，与MDP章使用同一个4×3网格、奖励、终止和gamma=.9。V0全零。左或上图同步更新读冻结旧表，右或下图逐状态原地更新按到G最短步数从近到远排序、同距按行优先。10次backup时同步只有终点相邻格值为1、其余−.04；原地近先已经得到最优固定点，起点.51854。30次backup时同步起点−.1084、残差.729；近先仍为.51854、残差0。同步10次残差.9。每次状态backup枚举4个确定性后果；一对图budget相同，10次是40后果查询，30次是120。色标在全部地图固定，负值浅红、零白、正值青，数值3位小数。近先排序使用已知图和额外准备计算，该成本未计入backup数；本任务的最短路线依赖结构使一轮足够，这不是一般异步DP速度结论。无真实交互。</desc><rect width="360" height="1663" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同计算预算，不同传播前沿</text><text x="28" y="82" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每一对：相同状态 backup 数</text><text x="40" y="121" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">同步：10 次</text><rect x="40" y="143" width="70" height="70" rx="0" fill="rgb(254,249,248)" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="75" y="185" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">-0.04</text><rect x="110" y="143" width="70" height="70" rx="0" fill="rgb(254,249,248)" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="145" y="185" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">-0.04</text><rect x="180" y="143" width="70" height="70" rx="0" fill="rgb(151,208,192)" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><text x="215" y="185" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">1</text><rect x="250" y="143" width="70" height="70" rx="0" fill="rgb(255,255,255)" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="255" y=