<svg xmlns="http://www.w3.org/2000/svg" width="720" height="893" viewBox="0 0 720 893" role="img" aria-labelledby="crl-1xodxt4-title crl-1xodxt4-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1xodxt4-title">基线控制方差，后继预测改变偏差</title><desc id="crl-1xodxt4-desc">原创精确枚举，theta=.7、gamma=.5。第一面板横轴是获奖可达状态的动作无关基线，纵轴是单时刻条件方差；价值基线1−p=.331812与局部最优p=.668188用圆标记。第二面板共享方差单位，比较整回合梯度和的方差：零基线.004881、价值基线.006159、逐状态局部最优.006802；期望均为−.037289，差别包含协方差。第三面板只改变两个后继状态的critic误差差e：完整回报减MC基线的期望保持蓝虚线不变，一步TD期望沿橙线变化。e=.5时橙线为+.018139，反转真实梯度方向。终止价值为零、critic固定；不执行训练。</desc><rect width="720" height="893" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">基线控制方差，后继预测改变偏差</text><text x="28" y="84" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">在 s1(1)：比较同一动作的局部方差</text><path d="M75 135L75 325" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M75 325L75 330" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="75" y="351" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M212.5 135L212.5 325" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M212.5 325L212.5 330" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="212.5" y="351" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><path d="M350 135L350 325" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M350 325L350 330" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="350" y="351" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M75 325L350 325" fill="none" str