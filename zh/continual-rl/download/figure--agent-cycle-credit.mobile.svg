8" stroke="none" stroke-width="1.5" opacity="1"/><text x="294.05" y="694" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">0.245</text><text x="28" y="764" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">起点预测：0 → −0.005 → 0.191</text><text x="28" y="800" font-size="17" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">实得奖励：−0.02 + 0.98 = 0.96</text><text x="28" y="837" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">0.191 是更新后的估计，并非完整回报</text><text x="28" y="875" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先完成最后写入，再清空这次技能的迹</text></g></svg>
