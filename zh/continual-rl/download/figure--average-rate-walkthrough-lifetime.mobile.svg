<svg xmlns="http://www.w3.org/2000/svg" width="360" height="668" viewBox="0 0 360 668" role="img" aria-labelledby="crl-30a0nm-title crl-30a0nm-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-30a0nm-title">斜率更高，有限时间未必领先</title><desc id="crl-30a0nm-desc">从同一启动状态E出发，启动2秒成本3也保留。蓝实线快环每2秒到账4，橙虚线慢环每4秒到账9。横轴真实秒，纵轴累计真实奖励；所有曲线都是确定性逐秒展开。12秒快环17、慢环15；18秒快环29、慢环33。长期斜率分别2与9/4。未完成的事件没有提前领取奖励或被改成终止。</desc><rect width="360" height="668" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">斜率更高，有限时间未必领先</text><path d="M28 82L55 82" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="66" y="88" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">快环：g = 2</text><path d="M28 114L55 114" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="7 4"/><text x="66" y="120" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">慢环：g = 9/4</text><path d="M60 156L60 451" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M60 451L60 456" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="60" y="477" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M146.6667 156L146.6667 451" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M146.6667 451L146.6667 456" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="146.6667" y="477" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">6</text><path d="M233.3333 156L233.3333 451" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M233.3333 451L233.3333 456" fill="none"