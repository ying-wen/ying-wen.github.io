<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1498" viewBox="0 0 720 1498" role="img" aria-labelledby="crl-8rxump-title crl-8rxump-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-8rxump-title">均值相同，尾部读数仍会改变</title><desc id="crl-8rxump-desc">原创精确总体期望更新，不使用随机rollout。固定浮动目标.5、.5、2.5、2.5，表参数从1、1、2、2开始，对1/N² pinball损失执行32次步长4/sqrt(k)更新，显示0、1、4、32次位置。每点质量1/4，竖直错开仅防重叠。所有快照均值1.5，下尾读数1、.75、约.573、约.488；W1由当前分布与真二点分布积分而得，32次仍有误差。下部独立读取浮动首款.6的真实四个midpoint分位，均值选浮动到v，下尾准则选固定到f，未把32步估计当真值。最后只把末款高结果概率改成.8，有限N=4的midpoint投影即使位置准确，真均值2.1近似2、真下尾1.7近似1.5。</desc><rect width="720" height="1498" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">均值相同，尾部读数仍会改变</text><text x="28" y="82" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">准确固定目标；αₖ=4/√k，k≥1</text><text x="28" y="129" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0 次更新</text><path d="M70 175L655 175" fill="none" stroke="#52687b" stroke-width="1.5" stroke-linecap="round" opacity="1"/><path d="M70 175L70 181" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="70" y="203" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M167.5 175L167.5 181" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="167.5" y="203" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.5</text><path d="M265 175L265 181" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="265" y="203" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M362.5 175L362.5 181" fill="none" stroke="#52687b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="362.5" y="