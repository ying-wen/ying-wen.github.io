<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1494" viewBox="0 0 360 1494" role="img" aria-labelledby="crl-s4tcbh-title crl-s4tcbh-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-s4tcbh-title">PCI：从响应矩阵到判断协议</title><desc id="crl-s4tcbh-desc">原创装置及协议示意，无实测波形、PCI分布或计算的PCI值。TMS线圈施加局部脉冲，60通道EEG及2个眼部传感器记录，耳塞遮蔽线圈声；清理伪迹后源估计及显著性筛选得到源乘时间矩阵。两份6乘6构造矩阵都含18个活动格，左侧各行重复，右侧各行时序不同。PCI实际还须Lempel-Ziv复杂度与源熵归一化。150人基准群体按即时、延迟或无体验报告标注，部分重复状态；每个状态取可用位点最大PCI，ROC选择0.31操作阈值后固定用于独立81位患者。人像仅表示群体和参照类型，不按实际人数排列。</desc><rect width="360" height="1494" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">PCI：从响应矩阵到判断协议</text><text x="28" y="86" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">局部脉冲，记录刺激后的脑反应</text><circle cx="158" cy="206" r="48" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><circle cx="112.365" cy="194.7553" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="123.3425" cy="174.2532" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="147.3215" cy="160.2292" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="175.0308" cy="162.1942" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="196.7908" cy="179.4618" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="204.7652" cy="201.3078" r="5" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="115" cy="141" r="18" fill="#ffffff" stroke="#b65a28" stroke-width="4" opacity="1"/><circle cx="148" cy="134" r="18" fill="#ffffff" stroke="#b65a28" stroke-width="4" opacity="1"/><path d="M132 156L144.1153 187.1536" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M146 192L139.3724 185.9937L14