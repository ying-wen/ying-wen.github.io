<svg xmlns="http://www.w3.org/2000/svg" width="360" height="867" viewBox="0 0 360 867" role="img" aria-labelledby="crl-1pxpu4m-title crl-1pxpu4m-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1pxpu4m-title">同一分岔的两种可获取经验</title><desc id="crl-1pxpu4m-desc">原创有限任务规则图。智能体在J，Theta表示补给侧L或R，先验各半且全程固定。图中两条实际路径尽头遮住，不泄漏哪边是G。读固定路标或独立噪声屏幕均在J花1原始步、奖励0；路标-1表示左、+1表示右，屏幕符号与Theta独立。选路花1步，正确当步奖励1到G，G每步继续领取1且不终止；错误当步奖励0到D，并由观测知道Theta，随后再花4个0奖励恢复步回J。恢复圆点每个是一原始步，回J后选路仍要再花一步。评价H6步没有免费reset。</desc><rect width="360" height="867" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一分岔的两种可获取经验</text><text x="28" y="83" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">行动前：哪侧有补给仍被遮住</text><path d="M68 156L180 278" fill="none" stroke="#e9eef2" stroke-width="24" stroke-linecap="round" opacity="1"/><path d="M292 156L180 278" fill="none" stroke="#e9eef2" stroke-width="24" stroke-linecap="round" opacity="1"/><path d="M161 253L92.5337 182.6579" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M88 178L98.5579 181.6785L91.3919 188.6534Z" fill="#b65a28"/><path d="M199 253L267.4663 182.6579" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M272 178L268.6081 188.6534L261.4421 181.6785Z" fill="#b65a28"/><rect x="38" y="125" width="60" height="60" rx="3" fill="#dce2e7" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="68" y="164" font-size="28" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><text x="68" y="111" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">左 L</text><rect x="262" y="125" width="60" height="60" rx="3" fill="#dce2e7" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="292" y="164" font-size="28" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">?</text><text x="292" y="111" font-size="20" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">右 R</text><circle cx="180" cy="278" r="16" fill="#146ca1" stroke="#ffffff" stroke-width="2.5" opacity="1"/><text x="180" y="318" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">分岔 J</text><text x="180" y="211" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">各 1/2</text><text x="28" y="346" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">在 J 读标或看屏：各花 1 步，奖励 0</text><path d="M92 413L92 450" fill="none" stroke="#52687b" stroke-width="5" stroke-linecap="round" opacity="1"/><rect x="52" y="373" width="80" height="42" rx="2" fill="#e4f1ed" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="92" y="402" font-size="26" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">?</text><rect x="229" y="371" width="82" height="49" rx="6" fill="#eef1f5" stroke="#52687b" stroke-width="1.5" opacity="1"/><text x="270" y="403" font-size="26" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">−  +</text><path d="M257 426L283 426" fill="none" stroke="#52687b" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="92" y="475" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">固定路标</text><text x="270" y="475" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">独立重抽的屏幕</text><text x="92" y="508" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">−1 左 / +1 右</text><text x="270" y="508" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">±1 各半</text><circle cx="64" cy="570" r="24" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><text x="64" y="577" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">G</text><path d="M83 555 C158 520 158 620 99 598" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round"/><path d="M99 598L87.0358 588.2791" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M83 585L91.7313 586.9403L86.6865 593.1492Z" fill="#258375"/><text x="166" y="577" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">每步奖励 +1</text><text x="28" y="631" font-size="17" fill="#258375" text-anchor="start" font-weight="400" opacity="1">选对当步 +1 到 G；G 不终止</text><circle cx="54" cy="701" r="24" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><text x="54" y="708" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">D</text><text x="28" y="661" font-size="17" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">走错：当步 0，随即知道正确侧</text><path d="M79 701L293 701" fill="none" stroke="#b54142" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="119" cy="701" r="6" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><text x="119" y="732" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="164" cy="701" r="6" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><text x="164" y="732" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="209" cy="701" r="6" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><text x="209" y="732" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="254" cy="701" r="6" fill="#ffffff" stroke="#b54142" stroke-width="2" opacity="1"/><text x="254" y="732" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">0</text><circle cx="311" cy="701" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="311" y="708" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">J</text><text x="28" y="766" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">再花 4 个恢复步回 J</text><text x="28" y="831" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">H=6 只截取评价；没有 reset 操作</text></g></svg>
