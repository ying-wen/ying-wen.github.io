<svg xmlns="http://www.w3.org/2000/svg" width="720" height="816" viewBox="0 0 720 816" role="img" aria-labelledby="crl-heybss-title crl-heybss-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-heybss-title">奖励为什么也需要状态</title><desc id="crl-heybss-desc">两段动作序列KD和DK具有相同动作计数。保存奖励自动机状态后，只有先拿钥匙再开门得到一。当前物理位置不变，记忆状态改变奖励含义。</desc><rect width="720" height="816" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">奖励为什么也需要状态</text><text x="28" y="80" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">任务：先拿钥匙，再开门。每次动作后回到同一位置。</text><text x="28" y="155" font-size="24" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">K → D</text><rect x="170" y="125" width="187" height="154" rx="5" fill="#eef5fa" stroke="none" stroke-width="1.5" opacity="1"/><circle cx="236" cy="181" r="10" fill="none" stroke="#258375" stroke-width="4"/><path d="M246 181h24m-6 0v9m-9 -9v7" stroke="#258375" stroke-width="4"/><text x="264" y="249" font-size="22" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">奖励 0</text><path d="M362 190L393.5 190" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M400 190L390 195L390 185Z" fill="#146ca1"/><rect x="410" y="125" width="187" height="154" rx="5" fill="#eef5fa" stroke="none" stroke-width="1.5" opacity="1"/><path d="M480 202V160h32v42" fill="#d7eee7" stroke="#258375" stroke-width="3"/><circle cx="505" cy="185" r="3" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="504" y="249" font-size="22" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">奖励 1</text><text x="170" y="313" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">记忆</text><circle cx="271" cy="307" r="13" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="271" y="349" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">未拿钥匙</text><path d="M289 307L361.5 307" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M368 307L358 312L358 302Z" fill="#146ca1"/><circle cx="393" cy="307" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="393" y="349" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">已有钥匙</text><path d="M411 307L483.5 307" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M490 307L480 312L480 302Z" fill="#146ca1"/><circle cx="515" cy="307" r="13" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="515" y="349" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">完成</text><text x="28" y="435" font-size="24" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">D → K</text><rect x="170" y="405" width="187" height="154" rx="5" fill="#eef5fa" stroke="none" stroke-width="1.5" opacity="1"/><path d="M240 482V440h32v42" fill="#d8e3eb" stroke="#52687b" stroke-width="3"/><circle cx="265" cy="465" r="3" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="264" y="529" font-size="22" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">奖励 0</text><path d="M362 470L393.5 470" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M400 470L390 475L390 465Z" fill="#146ca1"/><rect x="410" y="405" width="187" height="154" rx="5" fill="#eef5fa" stroke="none" stroke-width="1.5" opacity="1"/><circle cx="476" cy="461" r="10" fill="none" stroke="#258375" stroke-width="4"/><path d="M486 461h24m-6 0v9m-9 -9v7" stroke="#258375" stroke-width="4"/><text x="504" y="529" font-size="22" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">奖励 0</text><text x="170" y="593" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">记忆</text><circle cx="271" cy="587" r="13" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="271" y="629" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">未拿钥匙</text><path d="M289 587L361.5 587" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M368 587L358 592L358 582Z" fill="#146ca1"/><circle cx="393" cy="587" r="13" fill="#52687b" stroke="none" stroke-width="2" opacity="1"/><text x="393" y="629" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">未拿钥匙</text><path d="M411 587L483.5 587" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M490 587L480 592L480 582Z" fill="#146ca1"/><circle cx="515" cy="587" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="515" y="629" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">已有钥匙</text><text x="28" y="736" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">K、D 各出现一次：只数动作，两个顺序得到同样总分。</text><text x="28" y="775" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">记住“已经拿到钥匙”，才能让开门奖励取决于顺序。</text></g></svg>
