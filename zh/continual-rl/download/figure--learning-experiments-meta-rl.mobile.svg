<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1870" viewBox="0 0 360 1870" role="img" aria-labelledby="crl-1e2ufa-title crl-1e2ufa-desc" data-crl-visual="v1" data-evidence-kind="schematic"><title id="crl-1e2ufa-title">快适应与慢学习：分别改变什么？</title><desc id="crl-1e2ufa-desc">Hattori 等 2023 概率反转任务和三个干预的原创示意。左右口以区组安排概率提供奖励，未领取奖励保留但不累积份数；水滴表示实验者知道的奖励可用状态，并非小鼠能提前看见水。下方紫色区间为选择后 CaMKII 干预，红色区间为选择前 OFC 活动抑制。获得阶段与专家阶段分别比较，时间长度不按比例；未画任何实测结果。</desc><rect width="360" height="1870" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="36" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">快适应与慢学习：分别改变什么？</text><g transform="translate(24,88)"><text x="0" y="0" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 左右舔口选择</text><path d="M0 17L312 17" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="51" cy="85" r="23" fill="#f5f8fb" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="261" cy="85" r="23" fill="#f5f8fb" stroke="#146ca1" stroke-width="2" opacity="1"/><path d="M51,69 C35,87 44,96 51,96 C58,96 67,87 51,69 Z" stroke="#258375" stroke-width="1.5" fill="#258375" stroke-linecap="round" stroke-linejoin="round"/><path d="M261,69 C245,87 254,96 261,96 C268,96 277,87 261,69 Z" stroke="#258375" stroke-width="1.5" fill="#258375" stroke-linecap="round" stroke-linejoin="round"/><text x="51" y="42" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">左口</text><text x="261" y="42" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">右口</text><ellipse cx="156" cy="169" rx="34" ry="47" fill="#f5f8fb" stroke="#52687b" stroke-width="2"/><circle cx="156" cy="119" r="24" fill="#f5f8fb" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="132" cy="104" r="11" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><circle cx="18