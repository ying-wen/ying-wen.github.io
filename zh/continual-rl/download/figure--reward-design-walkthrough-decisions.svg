"339.0955" y="662" font-size="16" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">+1.287</text><rect x="25" y="716" width="671" height="28" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="737" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">遗漏塑形折扣</text><text x="285" y="737" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">→ 第3步送达；真回报 0.81</text><path d="M204.5455 777L223.3636 777" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="223.3636" cy="777" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="223.3636" y="767" font-size="16" fill="#b65a28" text-anchor="end" font-weight="400" opacity="1">+0.18</text><path d="M204.5455 818L138.6818 818" fill="none" stroke="#7854a2" stroke-width="4" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><rect x="134.6818" y="814" width="8" height="8" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="128.6818" y="824" font-size="16" fill="#7854a2" text-anchor="end" font-weight="400" opacity="1">-0.63</text><text x="28" y="903" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">橙圆：第3步送达；紫方：超时</text><text x="28" y="938" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">向右超过0，才胜过尽早送达</text></g></svg>
