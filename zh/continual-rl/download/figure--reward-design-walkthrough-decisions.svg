<svg xmlns="http://www.w3.org/2000/svg" width="720" height="978" viewBox="0 0 720 978" role="img" aria-labelledby="crl-1q0vinb-title crl-1q0vinb-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1q0vinb-title">奖励改变后，控制器选哪条路</title><desc id="crl-1q0vinb-desc">已知任务模型，对所有可行轨迹作精确求解。横轴是各奖励信号下相对第2步送达的折扣训练回报差，同尺度比较。橙圆为第3步送达，紫方为超时，零线为第2步送达。各行箭头给出真实执行决策，并用独立原任务奖励评价：原奖励选早送达0.9；代理奖金选超时0；正确势差仍选早送达0.9；错误保留终端门口势选超时0；省去塑形折扣选迟送达0.81。正确势差减去所有路径同一起点势1，所以差值不变。此图是精确规划决策，不是训练曲线或学习速度证据。</desc><rect width="720" height="978" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">奖励改变后，控制器选哪条路</text><text x="28" y="84" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相对“第2步送达”的训练回报差</text><text x="100" y="119" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><text x="204.5455" y="119" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="413.6364" y="119" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="622.7273" y="119" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">4</text><path d="M100 126L100 863" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><path d="M204.5455 126L204.5455 863" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M413.6364 126L413.6364 863" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><path d="M622.7273 126L622.7273 863" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><rect x="25" y="132" width="671" height="28" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><te