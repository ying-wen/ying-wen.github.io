<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1530" viewBox="0 0 360 1530" role="img" aria-labelledby="crl-1j7otu5-title crl-1j7otu5-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1j7otu5-title">贪心目标与采样继续互动</title><desc id="crl-1j7otu5-desc">沿用S0到S1再真实终止任务，A/B奖励分别为2/0、4/0，γ=.5，Q=C=0，贪心平局选B。行为每回合冻结为相对当前Q的ε=.2 greedy策略。给定三组均匀数实际生成BA、AB、AA，条件概率.09,.01,.09。每个动作的行为概率在采样时保存。蓝色箭头是环境，橙色向左箭头是终止后的反向更新次序。每次先更新C与Q，再改善π，再检查是否break。首回合末步A把目标由B改成A后继续，用保存的.1使上一步W=10；第二回合末步B仍写入C=1,Q=0，再break，因此S0,A保持未更新；第三回合末步A的保存概率.9使S0,A的W=10/9，第一次权重相消写入Q=4。条宽是下一回合行为A概率，目标字母是确定性π。</desc><rect width="360" height="1530" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">贪心目标与采样继续互动</text><text x="22" y="81" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">S₀→S₁→终止 · γ=.5 · ε=.2 · 平局B</text><text x="22" y="126" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">回合 1 · b0 实际选择 BA</text><circle cx="48" cy="189" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="48" y="195" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₀</text><circle cx="180" cy="189" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="180" y="195" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S₁</text><circle cx="312" cy="189" r="21" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><circle cx="312" cy="189" r="16" fill="none" stroke="#19354e" stroke-width="2" opacity="1"/><text x="312" y="195" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">终</text><path d="M71 189L152.45 189" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M157 189L150 192.5L150 185.5Z" fill="#146ca1"/><text x="114" y="171" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">B / 0</text><path d="M203 189L284.45 189" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M289 189L282 192.5L282 185.5Z" fill="#146ca1"/><text x="246" y="171" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">A / 4</text><text x="22" y="236" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">保存 b(Aₜ|Sₜ)：0.9，0.1</text><path d="M302 280L52.55 280" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M48 280L55 276.5L55 283.5Z" fill="#b65a28"/><text x="175" y="268" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">终止后反向处理</text><text x="22" y="321" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">t=1：G=4，W=1</text><text x="22" y="346" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">Q=4，C=1 · 继续</text><text x="22" y="371" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">t=0：G=2，W=10</text><text x="22" y="396" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">Q=2，C=10 · 继续</text><text x="22" y="440" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">下一版 b · S₀</text><rect x="22" y="452" width="14.3" height="16" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36.3" y="452" width="128.7" height="16" rx="0" fill="#e2e7eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="22" y="492" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 0.1 · B 0.9</text><text x="195" y="440" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">下一版 b · S₁</text><rect x="195" y="452" width="128.7" height="