xt><text x="22" y="1242" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">Q=4，C=2 · 继续</text><text x="22" y="1267" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">t=0：G=4，W=1.1111</text><text x="22" y="1292" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">Q=4，C=1.1111 · 继续</text><text x="22" y="1336" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">下一版 b · S₀</text><rect x="22" y="1348" width="128.7" height="16" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="150.7" y="1348" width="14.3" height="16" rx="0" fill="#e2e7eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="22" y="1388" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 0.9 · B 0.1</text><text x="195" y="1336" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">下一版 b · S₁</text><rect x="195" y="1348" width="128.7" height="16" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><rect x="323.7" y="1348" width="14.3" height="16" rx="0" fill="#e2e7eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="195" y="1388" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">A 0.9 · B 0.1</text><text x="22" y="1412" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">目标 π(S₀,S₁)=(A,A)</text><text x="22" y="1495" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">蓝箭头：真实转移；橙箭头：反向更新</text></g></svg>
