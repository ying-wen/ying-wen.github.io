<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="crl-637ug6-title crl-637ug6-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-637ug6-title">C51：位置先变，再搬运概率</title><desc id="crl-637ug6-desc">三个原子位置负一零一，质量0.2、0.5、0.3。奖励0.5、折扣0.5把位置变成零0.5一。中间的0.5质量等分给零和一，投影后概率为零0.45和0.55。柱高表示概率，颜色追踪来源，底部只放大中间原子的拆分。无支持裁剪时本例保持均值0.55。整数落点保留全部质量。</desc><rect width="720" height="720" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="38" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">C51：位置先变，再搬运概率</text><text x="28" y="76" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">r = 0.5 · γ = 0.5 · 固定支持 [−1, 1]</text><text x="28" y="138" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 后继回报分布</text><path d="M52 303L202 303" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 248L202 248" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 193L202 193" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M52 303L202 303" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M52 303L52 308" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="52" y="331" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><path d="M127 303L127 308" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="127" y="331" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M202 303L202 308" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="202" y="331" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><rect x="42" y="259" width="20" height="44" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="52" y="249" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.2</text><rect x="117" y="193" width="20" height="110" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="127" y="183" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.5</text><rect x="192" y="237" width="20" height="66" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="202" y="227" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.3</text><path d="M236 199L246.1 199" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M250 199L244 202L244 196Z" fill="#52687b"/><text x="261" y="138" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · r + γz</text><path d="M285 303L435 303" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M285 248L435 248" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M285 193L435 193" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M285 303L435 303" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M285 303L285 308" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="285" y="331" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><path d="M360 303L360 308" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="360" y="331" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M435 303L435 308" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="435" y="331" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><rect x="350" y="259" width="20" height="44" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="360" y="249" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.2</text><rect x="387.5" y="193" width="20" height="110" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="397.5" y="183" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="397.5" y="331" font-size="16" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">.5</text><rect x="425" y="237" width="20" height="66" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><text x="435" y="227" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.3</text><path d="M469 199L479.1 199" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M483 199L477 202L477 196Z" fill="#52687b"/><text x="494" y="138" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · 投回固定格点</text><path d="M518 303L668 303" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M518 248L668 248" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M518 193L668 193" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M518 303L668 303" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M518 303L518 308" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="518" y="331" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><path d="M593 303L593 308" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="593" y="331" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M668 303L668 308" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="668" y="331" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="518" y="293" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0</text><rect x="583" y="259" width="20" height="44" rx="0" fill="#146ca1" stroke="#ffffff" stroke-width="1" opacity="1"/><rect x="583" y="204" width="20" height="55" rx="0" fill="#b65a28" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="593" y="194" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.45</text><rect x="658" y="248" width="20" height="55" rx="0" fill="#b65a28" stroke="#ffffff" stroke-width="1" opacity="1"/><rect x="658" y="182" width="20" height="66" rx="0" fill="#7854a2" stroke="#ffffff" stroke-width="1" opacity="1"/><text x="668" y="172" font-size="16" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0.55</text><text x="28" y="396" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">落在两格之间的质量怎样分？</text><circle cx="360" cy="452" r="24" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="360" y="459" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">.5</text><text x="360" y="420" font-size="17" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">位置 0.5</text><path d="M345 477L183.1328 533.8462" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M177 536L184.7783 527.969L188.0918 537.404Z" fill="#b65a28"/><path d="M375 477L536.8672 533.8462" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M543 536L531.9082 537.404L535.2217 527.969Z" fill="#b65a28"/><circle cx="165" cy="561" r="17" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="165" y="567" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">.25</text><text x="165" y="600" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">位置 0</text><circle cx="555" cy="561" r="17" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="555" y="567" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">.25</text><text x="555" y="600" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">位置 1</text><text x="28" y="646" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">总质量 = 1；均值 = 0.55</text><text x="28" y="677" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">恰好落在格点：整份质量留下。</text></g></svg>
