<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1068" viewBox="0 0 360 1068" role="img" aria-labelledby="crl-1ux9ncx-title crl-1ux9ncx-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1ux9ncx-title">反馈改后验，再改下一条经验</title><desc id="crl-1ux9ncx-desc">原创真实行动记录的指定合法路径。模拟器真实theta为low，但actor不能读取。第一次q.5与u.4采high，十个right抵达端点；端点量u_reward.4大于low成功率.2，故Y0。Bayes分子.5乘.2、证据.5乘.2加.5乘.8=.5，后验high .2。允许reset到位置0而theta与q保留。第二次相同u.4大于新q.2，采low，第一步选safe到账.25并真正终止；safe似然对两个模型相同，所以q不变。紫条长度是high后验质量，浅紫是low。两次相同u是演示耦合，路径符合策略支持但不是iid随机训练；实际动作次数分别10与1。若第一次成功，q变.8且同u令下次继续采high。另独立已知high控制：即便q1，失败概率.2，失败后q仍1，结果噪声不等于知识缺失。</desc><rect width="360" height="1068" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="39" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">反馈改后验，再改下一条经验</text><text x="28" y="87" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">指定合法路径：两次都用 u=.4</text><text x="28" y="120" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">u 是演示耦合；不代表 iid 训练样本</text><text x="28" y="171" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">episode 1 · 先抽模型 high</text><rect x="28" y="196" width="143" height="24" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><rect x="171" y="196" width="143" height="24" rx="0" fill="#ded5ea" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="246" font-size="17" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">q=P(high)=0.5</text><circle cx="53" cy="310" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="53" y="316" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M73 310L101.5 310" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M108 310L98 315L98 305Z" fill="#b65a28"/><circle cx="128" cy="310" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="128" y="316" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M148 310L176.5 310" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M183 310L173 315L173 305Z" fill="#b65a28"/><text x="203" y="317" font-size="22" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">⋯</text><path d="M226 310L251.5 310" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M258 310L248 315L248 305Z" fill="#b65a28"/><circle cx="278" cy="310" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="278" cy="310" r="13" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="278" y="316" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">10</text><text x="165.5" y="351" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">10 次 right；到账 Y=0</text><path d="M178 354L178 391.5" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M178 398L173 388L183 388Z" fill="#146ca1"/><text x="28" y="418" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">Y=0：high 似然 .2，low 似然 .8</text><rect x="28" y="447" width="57.2" height="24" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><rect x="85.2" y="447" width="228.8" height="24" rx="0" fill="#ded5ea" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="497" font-size="17" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">q=P(high)=0.2</text><text x="28" y="537" font-size="17" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">后验 .2；仍未排除 high</text><text x="28" y="626" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">episode 2 · 同一 u 改抽 low</text><rect x="28" y="654" width="57.2" height="24" rx="0" fill="#7854a2" stroke="none" stroke-width="1.5" opacity="1"/><rect x="85.2" y="654" width="228.8" height="24" rx="0" fill="#ded5ea" stroke="none" stroke-width="1.5" opacity="1"/><text x="28" y="704" font-size="17" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">q=P(high)=0.2</text><circle cx="83" cy="773" r="18" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="83" y="779" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M104 773L202.5 773" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M209 773L199 778L199 768Z" fill="#258375"/><circle cx="231" cy="773" r="18" fill="#ffffff" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="231" cy="773" r="13" fill="none" stroke="#258375" stroke-width="2" opacity="1"/><text x="231" y="779" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">T</text><text x="157" y="813" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">safe → .25</text><text x="28" y="850" font-size="17" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1 次 safe；奖励 .25；q 仍是 .2</text><path d="M28 921L332 921" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="954" font-size="16" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">若首次 Y=1：q=.8，下一次继续 right</text><text x="28" y="993" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">已知 high（q=1）也有 .2 概率失败</text><text x="28" y="1031" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">失败后 q=1：随机结果仍会留下残差</text></g></svg>
