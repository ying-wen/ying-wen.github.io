<svg xmlns="http://www.w3.org/2000/svg" width="720" height="876" viewBox="0 0 720 876" role="img" aria-labelledby="crl-18pcsts-title crl-18pcsts-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-18pcsts-title">越长的后缀，越少的匹配与越大的权重</title><desc id="crl-18pcsts-desc">单独的长后缀诊断延长决策数：γ=1，中间奖励为0，最后真实终止奖励为1，目标固定为每步A，行为每步独立以0.9概率选A。横轴h为尚需纠正的决策数；上图匹配概率0.9的h次方，下图在全匹配时的完整IS权重0.9的负h次方。任一不匹配使完整权重为0。程序精确计算h=1,2,5,10,20,50的点并以直线连接，不插值拟合。h=50匹配概率约0.00515，非零权重约194.03，100独立回合的期望匹配数约0.515。两图纵轴不同且明确标注；曲线显示固定目标的概率诊断，不是控制学习速度的实测。</desc><rect width="720" height="876" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">越长的后缀，越少的匹配与越大的权重</text><text x="22" y="80" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">固定目标总选 A · 行为每步选 A 概率 0.9</text><circle cx="70" cy="120" r="12" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="70" y="153" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M84 120L190.1 120" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M194 120L188 123L188 117Z" fill="#146ca1"/><circle cx="208" cy="120" r="12" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="208" y="153" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M222 120L328.1 120" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M332 120L326 123L326 117Z" fill="#146ca1"/><circle cx="346" cy="120" r="12" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="346" y="153" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M360 120L466.1 120" fill="none" stroke="#146ca1" stroke-width="3"