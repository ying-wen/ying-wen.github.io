<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1214" viewBox="0 0 360 1214" role="img" aria-labelledby="crl-46t6s6-title crl-46t6s6-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-46t6s6-title">同一经验，延续目标怎样改变更新</title><desc id="crl-46t6s6-desc">原创冻结数据精确算例。A的go奖励1到B，实际已选B的fast。旧Q1(A,go)=2，B的fast/detour值1/5，行为概率.25/.75，gamma=.9、alpha=.25。Sarsa目标1.9，新值1.975；Expected Sarsa目标4.6，新值2.65；Q-learning目标5.5，新值2.875。Double额外Q2(B)=(4,2)，更新Q1时按Q1选detour、按Q2评价2，目标2.8、Q1新值2.2；交换角色目标1.9，公平硬币平均目标2.35。两张表固定，是提供给算例的估计而非独立无偏估计。横线以相同0到6价值尺度显示旧值空圆到新值实圆，target数字另列。没有环境采样或训练。</desc><rect width="360" height="1214" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="19" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一经验，延续目标怎样改变更新</text><text x="28" y="83" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一 A→B：实际下一动作 fast</text><circle cx="48" cy="175" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="48" y="182" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><path d="M73 175L116.5 175" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M123 175L113 180L113 170Z" fill="#146ca1"/><text x="98" y="150" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">go, R₁=1</text><circle cx="148" cy="175" r="22" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="148" y="182" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">B</text><path d="M169 167L253.6515 148.3953" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M260 147L251.3064 154.03L249.1598 144.2631Z" fill="#146ca1"/><circle cx="298" cy="147" r="13" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="298" y="122" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">fast</text><text x="298" y="181" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">Q₁=1</text><path d="M163 193L255.5207 290.2898" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M260 295L249.4855 291.1992L256.732 284.3079Z" fill="#b65a28"/><rect x="285" y="282" width="26" height="26" rx="0" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="298" y="268" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">detour</text><text x="298" y="335" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">Q₁=5</text><text x="166" y="121" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">b=.25</text><text x="166" y="307" font-size="16" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">b=.75</text><text x="28" y="397" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">蓝圆：实际；橙方：旧表贪心</text><text x="28" y="431" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧 Q(A,go)=2；γ=.9，α=.25</text><text x="28" y="487" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">Sarsa</text><path d="M60 539L300 539" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="140" cy="539" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M140 539L139.325 539" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M139 539L139.5 538.75L139.5 539.25Z" fill="#146ca1"/><circle cx="139" cy="539" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="60" y="562" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="140" y="562" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="300" y="562" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">6</text><text x="28" y="516" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">target 1.9 → 新值 1.975</text><text x="28" y="592" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">Expected</text><path d="M60 644L300 644" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="140" cy="644" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M140 644L162.1 644" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M166 644L160 647L160 641Z" fill="#258375"/><circle cx="166" cy="644" r="4" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="621" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">target 4.6 → 新值 2.65</text><text x="28" y="697" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">Q-learning</text><path d="M60 749L300 749" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="140" cy="749" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M140 749L171.1 749" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M175 749L169 752L169 746Z" fill="#b65a28"/><circle cx="175" cy="749" r="4" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="726" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">target 5.5 → 新值 2.875</text><text x="28" y="802" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">Double：更新 Q₁</text><path d="M60 854L300 854" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="140" cy="854" r="7" fill="#ffffff" stroke="#52687b" stroke-width="2" opacity="1"/><path d="M140 854L145.4 854" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M148 854L144 856L144 852Z" fill="#7854a2"/><circle cx="148" cy="854" r="4" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="28" y="831" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">target 2.8 → 新值 2.2</text><text x="28" y="931" font-size="20" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">Double 的另表评价</text><text x="28" y="966" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">Q₁ 的 detour 最大：5</text><path d="M62 984L273.5 984" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M280 984L270 989L270 979Z" fill="#7854a2"/><text x="171" y="1015" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">同一动作索引</text><text x="28" y="1049" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">Q₂(fast,detour)=(4,2)</text><text x="28" y="1081" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">取 detour 的 2，target=1+.9×2</text><text x="28" y="1113" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">交换角色 target=1.9；硬币均值2.35</text><text x="28" y="1149" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">Sarsa 对下一动作取均值 = 4.6</text><text x="28" y="1181" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">固定旧表的目标，不是训练收益</text></g></svg>
