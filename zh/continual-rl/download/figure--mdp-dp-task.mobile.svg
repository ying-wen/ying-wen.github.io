<svg xmlns="http://www.w3.org/2000/svg" width="360" height="753" viewBox="0 0 360 753" role="img" aria-labelledby="crl-uag9lv-title crl-uag9lv-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-uag9lv-title">同一网格：终点与记录边界</title><desc id="crl-uag9lv-desc">原创已知模型精确算例。4列3行，墙(1,1)，终点G=(3,0)，起点S=(0,2)，四向动作；进入G奖励1，其他转移奖励−.04，撞墙或越界留原格。gamma=.9。给定路径S上、上、右、右、右；前两步蓝实线为给定记录，记录在P=(0,0)停止，模型里的后续用紫色虚线。五次转移奖励−.04、−.04、−.04、−.04、1。按该路线继续的P尾值.734，起点完整回报和保留尾值的截断目标均为.51854，误将记录结束作为任务终止则为−.076。G的价值为0。没有随机采样或训练。</desc><rect width="360" height="753" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一网格：终点与记录边界</text><text x="28" y="83" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">完整位置可观察；模型已知，γ=.9</text><rect x="40" y="117" width="70" height="70" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="110" y="117" width="70" height="70" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="180" y="117" width="70" height="70" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="250" y="117" width="70" height="70" rx="0" fill="rgb(255,255,255)" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="255" y="122" width="60" height="60" rx="0" fill="none" stroke="#258375" stroke-width="2" opacity="1"/><text x="285" y="144" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="285" y="173" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0</text><rect x="40" y="187" width="70" height="70" rx="0" fill="#ffffff" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="110" y="187" width="70" height="70" rx="0" fill="#19354e" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><rect x="180" y="187" width="70" height="70" rx=