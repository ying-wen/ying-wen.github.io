circle cx="231" cy="559" r="7" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="231" y="538" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R4</text><text x="231" y="592" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">−.04</text><path d="M241 559L285 559" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><circle cx="295" cy="559" r="7" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><text x="295" y="538" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">R5</text><text x="295" y="592" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M135 525L135 597" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="4 5"/><text x="28" y="650" font-size="18" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">P 的路径尾值 = .734</text><text x="28" y="682" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">截断目标 = −.076 + .81×.734</text><text x="28" y="714" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">= .51854；误作终止只有 −.076</text></g></svg>
