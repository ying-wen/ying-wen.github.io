<svg xmlns="http://www.w3.org/2000/svg" width="720" height="722" viewBox="0 0 720 722" role="img" aria-labelledby="crl-jib714-title crl-jib714-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-jib714-title">一件包裹，最多三个动作</title><desc id="crl-jib714-desc">原创确定性有限任务。状态为(时钟t,物理位置x)。S只有接近，A可送达或等待。送达原奖励1，其余0；gamma0.9。第3个动作后为真正期限终止，已送达G也终止。全部三条路径为第2步送达、第3步送达、等待至超时。势在S为1、非终端A为3、所有终端为0。代理额外为每次进入A支付3，包括截止动作；该代理不识别真正送达。箭头为合法实际转移，不表示采样频率。</desc><rect width="720" height="722" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">一件包裹，最多三个动作</text><text x="28" y="84" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">每步耗时1；第3步后任务真正结束</text><path d="M90 245L210.5 245" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M217 245L207 250L207 240Z" fill="#146ca1"/><text x="155" y="276" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">接近</text><path d="M266.4373 232.1376L415.4165 142.7501" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M420.9902 139.4059L414.9877 148.8383L409.8428 140.2634Z" fill="#146ca1"/><text x="358.3769" y="212.2948" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">送达</text><path d="M267.3607 256.1803L414.1423 329.5711" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M419.956 332.478L408.7757 332.478L413.2478 323.5337Z" fill="#146ca1"/><text x="356.6276" y="276.7449" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">等待</text><path d="M468.0409 335.2986L603.2036 278.388" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M609.1942 275.8656L601.9181 284.3543L598.0376 275.138Z" fill="#146ca1"/><text x="550.0895" y="333.9625" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">送达</text><path d="M467.123 356.6437L604.4703 428.9317" fill="none" stroke="#b54142" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M610.2223 431.9591L599.0444 431.7262L603.7018 422.877Z" fill="#b54142"/><text x="552.1094" y="376.9921" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">等待</text><circle cx="65" cy="245" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="65" y="251" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">S</text><text x="65" y="294" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=0</text><text x="65" y="319" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">Φ=1</text><circle cx="245" cy="245" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="245" y="251" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="245" y="294" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=1</text><text x="245" y="319" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">Φ=3</text><circle cx="445" cy="125" r="24" fill="#ffffff" stroke="#258375" stroke-width="2.5" opacity="1"/><circle cx="445" cy="125" r="19" fill="#ffffff" stroke="#258375" stroke-width="1" opacity="1"/><text x="445" y="131" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="445" y="174" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=2</text><text x="445" y="199" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Φ=0</text><circle cx="445" cy="345" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="445" y="351" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="445" y="394" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=2</text><text x="445" y="419" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">Φ=3</text><circle cx="635" cy="265" r="24" fill="#ffffff" stroke="#258375" stroke-width="2.5" opacity="1"/><circle cx="635" cy="265" r="19" fill="#ffffff" stroke="#258375" stroke-width="1" opacity="1"/><text x="635" y="271" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="635" y="314" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=3</text><text x="635" y="339" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">Φ=0</text><circle cx="635" cy="445" r="24" fill="#ffffff" stroke="#b54142" stroke-width="2.5" opacity="1"/><circle cx="635" cy="445" r="19" fill="#ffffff" stroke="#b54142" stroke-width="1" opacity="1"/><text x="635" y="451" font-size="20" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="635" y="494" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">t=3</text><text x="635" y="519" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">Φ=0</text><text x="28" y="581" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">S：出发；A：门口；G：已送达</text><text x="28" y="616" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">双圈表示终端；红圈是未送达超时</text><text x="28" y="651" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">仅送达给原奖励1；γ=0.9</text><text x="28" y="686" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">代理另给到达/停留门口的每一步+3</text></g></svg>
