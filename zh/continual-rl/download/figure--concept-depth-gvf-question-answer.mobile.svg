<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1035" viewBox="0 0 360 1035" role="img" aria-labelledby="crl-9h33yh-title crl-9h33yh-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-9h33yh-title">同一经验，回答不同问题</title><desc id="crl-9h33yh-desc">确定性右路能耗依次1、2、1，到达指示0、0、1。设计者指定策略沿右路和延续1、1、0。完整样本以MC步长1把起点的能耗答案改为4、到达答案改为1。左路的独立经验给能耗2、到达1。任务奖励每步为5倍到达减能耗，两路线总回报为3和1，因此选择左路。问题规格没有被这个答案更新自动发现。</desc><rect width="360" height="1035" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="42" font-size="24" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一经验，回答不同问题</text><g transform="translate(24,96)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">1 · 同一段右路经验</text><circle cx="18" cy="75" r="16" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="18" y="82" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><path d="M37 75L84.5 75" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M91 75L81 80L81 70Z" fill="#146ca1"/><text x="64" y="50" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">E=1</text><text x="64" y="117" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">R=-1</text><circle cx="110" cy="75" r="16" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="110" y="82" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M129 75L176.5 75" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M183 75L173 80L173 70Z" fill="#146ca1"/><text x="156" y="50" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">E=2</text><text x="156" y="117" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">R=-2</text><circle cx="202" cy="75" r="16" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="202" y="82" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M221 75L268.5 75" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M275 75L265 80L265 70Z" fill="#146ca1"/><text x="248" y="50" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">E=1</text><text x="248" y="117" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">R=4</text><circle cx="294" cy="75" r="16" fill="#f5f8fb" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="294" y="82" font-size="18" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">G</text><text x="0" y="160" font-size="19" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">π右：沿右路到 G</text><text x="0" y="190" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">到达后停止累计</text><path d="M0 28L312 28" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/></g><g transform="translate(24,350)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">2 · 两个给定的问题</text><text x="0" y="63" font-size="22" fill="#258375" text-anchor="start" font-weight="400" opacity="1">E</text><text x="0" y="117" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">到达</text><text x="0" y="171" font-size="22" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">γ</text><rect x="47" y="39" width="40" height="32" rx="4" fill="#f5f8fb" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="67" y="62" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">1</text><circle cx="67" cy="111" r="8" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="67" y="170" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><rect x="135.5" y="39" width="40" height="32" rx="4" fill="#f5f8fb" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="155.5" y="62" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">2</text><circle cx="155.5" cy="111" r="8" fill="#ffffff" stroke="#b65a28" stroke-width="2" opacity="1"/><text x="155.5" y="170" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><rect x="224" y="39" width="40" height="32" rx="4" fill="#f5f8fb" stroke="#258375" stroke-width="1.5" opacity="1"/><text x="244" y="62" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M244,101 l3,7 8,1 -6,5 2,8 -7,-4 -7,4 2,-8 -6,-5 8,-1 Z" fill="#b65a28"/><text x="244" y="170" font-size="20" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M65 190L65 214.5" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M65 221L60 211L70 211Z" fill="#258375"/><path d="M247 190L247 214.5" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M247 221L242 211L252 211Z" fill="#b65a28"/><text x="65" y="253" font-size="23" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">能耗 4</text><text x="247" y="253" font-size="23" fill="#b65a28" text-anchor="middle" font-weight="400" opacity="1">到达 1</text><text x="156" y="294" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">v ← 完整累计量（α=1）</text><path d="M0 28L312 28" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/></g><g transform="translate(24,700)"><text x="0" y="0" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">3 · 答案用于动作比较</text><text x="0" y="61" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">左路也有独立经验</text><text x="0" y="95" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">左路</text><path d="M58 132L284 132" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="58" cy="132" r="6" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="166.5" cy="132" r="6" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><circle cx="275" cy="132" r="6" fill="#258375" stroke="#258375" stroke-width="2" opacity="1"/><text x="312" y="95" font-size="22" fill="#258375" text-anchor="end" font-weight="400" opacity="1">5×1−2=3</text><path d="M14 133L34.5 133" fill="none" stroke="#258375" stroke-width="4" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M41 133L31 138L31 128Z" fill="#258375"/><text x="0" y="189" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">右路</text><path d="M58 226L284 226" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="58" cy="226" r="6" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="130.3333" cy="226" r="6" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="202.6667" cy="226" r="6" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><circle cx="275" cy="226" r="6" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="312" y="189" font-size="22" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">5×1−4=1</text><text x="156" y="294" font-size="19" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">比较任务回报，选择左路</text><path d="M0 28L312 28" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/></g></g></svg>
