<svg xmlns="http://www.w3.org/2000/svg" width="360" height="570" viewBox="0 0 360 570" role="img" aria-labelledby="crl-1xyss4y-title crl-1xyss4y-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1xyss4y-title">第二动作怎样影响早先奖励的权重</title><desc id="crl-1xyss4y-desc">同一两步任务的四条轨迹AA、AB、BA、BB在行为策略下各有概率1/4。蓝色实心柱为完整轨迹普通重要性采样校正回报9、1.5、1.5、0；青色空心柱为逐决策重要性采样校正回报7.5、3、1.5、0。纵轴为单条轨迹的估计目标，灰虚线为真实价值3。两种目标的概率加权平均都是3，方差分别为12.375与7.875。</desc><rect width="360" height="570" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">第二动作怎样影响早先奖励的权重</text><path d="M50 367L336 367" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M45 367L50 367" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="40" y="372" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">0</text><path d="M50 293.8L336 293.8" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M45 293.8L50 293.8" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="40" y="298.8" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">3</text><path d="M50 220.6L336 220.6" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M45 220.6L50 220.6" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="40" y="225.6" font-size="16" fill="#52687b" text-anchor="end" font-weight="400" opacity="1">6</text><path d="M50 147.4L336 147.4" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M45 147.4L50 147.4" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="40" y="152.4" font-size="16" fill="#52687b" text-anchor="end" font