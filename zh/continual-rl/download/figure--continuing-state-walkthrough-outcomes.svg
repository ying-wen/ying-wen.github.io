<svg xmlns="http://www.w3.org/2000/svg" width="720" height="893" viewBox="0 0 720 893" role="img" aria-labelledby="crl-1wjuaqu-title crl-1wjuaqu-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1wjuaqu-title">奖励信息能用吗？改变一项再比较</title><desc id="crl-1wjuaqu-desc">原创精确8路径枚举及独立条件期望树核对，隐藏Z整段固定、提示在给定Z后独立。每个横条表示一次选门的期望即时奖励，纵向各条件共享[-1,1]坐标。原例为-0.6、0.36，大步长2为-0.6、0，随机提示为0、0，删除提示为0、1。删除提示仍保留奖励输入，所以没有删除全部信息；在本例固定首动作下下一J的h=Z/4。原例另有概率0.08的路径写出a&gt;3，这个窗口不证明长期稳定。</desc><rect width="720" height="893" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">奖励信息能用吗？改变一项再比较</text><text x="28" y="83" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">8 条完整路径的期望奖励；每项都是同一 5 步窗口</text><text x="28" y="115" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">蓝：第一次选门　青：第二次选门</text><text x="28" y="160" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">原例 α=1/2</text><path d="M260 243L620 243" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="260" y="268" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><text x="440" y="268" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="620" y="268" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M440 178L440 248" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 3"/><rect x="332" y="181" width="108" height="18" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="323" y="196" font-size="16" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">-0.6</text><rect x="440" y="208" width="64.8" height="18" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="513.8" y="223" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0.36</text><text x="28" y="300" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">大步长 α=2</text><path d="M260 383L620 383" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="260" y="408" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><text x="440" y="408" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="620" y="408" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M440 318L440 388" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 3"/><rect x="332" y="321" width="108" height="18" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="323" y="336" font-size="16" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">-0.6</text><circle cx="440" cy="357" r="4" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="449" y="363" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0</text><text x="28" y="440" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">随机提示 p=1/2</text><path d="M260 523L620 523" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="260" y="548" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><text x="440" y="548" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="620" y="548" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M440 458L440 528" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 3"/><circle cx="440" cy="470" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="449" y="476" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0</text><circle cx="440" cy="497" r="4" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="449" y="503" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">0</text><text x="28" y="580" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">删除全部 C 提示</text><path d="M260 663L620 663" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="260" y="688" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">-1</text><text x="440" y="688" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="620" y="688" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M440 598L440 668" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="3 3"/><circle cx="440" cy="610" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="449" y="616" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">0</text><rect x="440" y="628" width="180" height="18" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="629" y="643" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">1</text><path d="M28 715L692 715" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="749" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">删提示后，第一动作固定向左；奖励 r=Z 留在活动中</text><text x="28" y="780" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">参数仍为 −1/2，下一 J 的 h=r/4，第二次选门全对</text><text x="28" y="822" font-size="18" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">原例仍有概率 0.08 的分支在第二次更新后写出 a≈3.4663</text><text x="28" y="853" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">短窗口的期望与参数越界，分别回答收益和稳定性问题</text></g></svg>
