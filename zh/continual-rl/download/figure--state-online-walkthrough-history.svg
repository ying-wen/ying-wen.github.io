<svg xmlns="http://www.w3.org/2000/svg" width="720" height="598" viewBox="0 0 720 598" role="img" aria-labelledby="crl-1dvfkhf-title crl-1dvfkhf-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1dvfkhf-title">更新参数，保留已经发生的活动</title><desc id="crl-1dvfkhf-desc">原创精确算例。四步输入1,0,0,0；初始a=1/2,b=1。在第2步先形成h2=1/2和S2=(1,1/2)，收到监督标签1后以步长1/2更新，得到a=3/4,b=9/8。第3、4步使用新参数和保留的活动、敏感度，得到h3=3/8,h4=9/32，S3=(5/4,3/8),S4=(21/16,9/32)。圆中数字表示时刻，圆面积正比于活动值，蓝色为旧参数版本，青色为新参数版本，紫色为携带的敏感度。第4步损失用于评价，不再更新。没有随机训练。</desc><rect width="720" height="598" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">更新参数，保留已经发生的活动</text><text x="28" y="80" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">o = (1, 0, 0, 0)；h₀=0，S₀=0</text><text x="28" y="110" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">圆面积表示 h；紫色数字为携带的 S</text><path d="M125 232L234.5 232" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M241 232L231 237L231 227Z" fill="#146ca1"/><text x="183" y="214" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">×0.5</text><circle cx="96" cy="232" r="28" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="96" y="238" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">1</text><text x="96" y="173" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">v0：a=0.5</text><text x="96" y="290" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h=1</text><text x="96" y="332" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=0</text><text x="96" y="362" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=1</text><path d="M299 232L408.5 232" fill="none" stroke="#b65a28" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M415 232L405 237L405 227Z" fill="#b65a28"/><text x="357" y="214" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">×0.75</text><circle cx="270" cy="232" r="19.799" fill="#ffffff" stroke="#146ca1" stroke-width="3" opacity="1"/><text x="270" y="238" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">2</text><text x="270" y="173" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">v0：a=0.5</text><text x="270" y="290" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">h=0.5</text><text x="270" y="332" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=1</text><text x="270" y="362" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=0.5</text><path d="M473 232L582.5 232" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M589 232L579 237L579 227Z" fill="#146ca1"/><text x="531" y="214" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">×0.75</text><circle cx="444" cy="232" r="17.1464" fill="#ffffff" stroke="#258375" stroke-width="3" opacity="1"/><text x="444" y="238" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">3</text><text x="444" y="173" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">v1：a=0.75</text><text x="444" y="290" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">h=0.375</text><text x="444" y="332" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=1.25</text><text x="444" y="362" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=0.375</text><circle cx="618" cy="232" r="14.8492" fill="#ffffff" stroke="#258375" stroke-width="3" opacity="1"/><text x="618" y="238" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">4</text><text x="618" y="173" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">v1：a=0.75</text><text x="618" y="290" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">h=0.28125</text><text x="618" y="332" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵃ=1.3125</text><text x="618" y="362" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">Sᵇ=0.28125</text><path d="M28 401L692 401" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="28" y="421" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">t=2：收到标签 1，误差 −1/2</text><text x="28" y="455" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">梯度 (−1/2, −1/4)，步长 α=1/2</text><text x="28" y="489" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">v0：(a,b)=(1/2,1)</text><text x="346" y="489" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">v1：(a,b)=(3/4,9/8)</text><text x="28" y="532" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">t=4：先预测 9/32，再用标签 1 评价</text><text x="28" y="564" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">参数更新只影响之后的前向计算</text></g></svg>
