<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1250" viewBox="0 0 720 1250" role="img" aria-labelledby="crl-1odgwka-title crl-1odgwka-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1odgwka-title">数据、选择与新经验</title><desc id="crl-1odgwka-desc">上部蓝点是D,G,G,G真实探索前缀每次规划后的go值0,.45,.6,.675。橙虚线是exit值.6，平局选择exit。第四次以后估计促使下一真实episode选择go，橙路径实际走S-A-D，新失败把joint model成功比例由3/4降到3/5，重新规划得到go=.54，红点表示此后改选exit。下部枚举iid真实P(G)=3/4时全部16种四次cross序列，各G数的概率为1,12,54,108,81除以256；至少3个G才选go，错误exit概率67/256。每个获取日程均为先exit一次和四个两步探索episode，共9真实步；下一自主episode分别1或2步。真概率只用于读者解析枚举，不进入学习器。柱高是精确概率，不是随机训练频数。</desc><rect width="720" height="1250" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">数据、选择与新经验</text><text x="28" y="86" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">前四次规定探索：D,G,G,G</text><text x="28" y="120" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">第五次来自贪心 go：实际又收到 D</text><path d="M80 173L80 388" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M80 388L80 393" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="80" y="414" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">1</text><path d="M228 173L228 388" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M228 388L228 393" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="228" y="414" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">2</text><path d="M376 173L376 388" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M376 388L376 393" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/