54e" text-anchor="end" font-weight="400" opacity="1">cross 真实访问次数</text><text x="80" y="155" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">Q(S,go)</text><path d="M80 388L228 291.25L376 259L524 242.875" fill="none" stroke="#146ca1" stroke-width="3"/><circle cx="80" cy="388" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="228" cy="291.25" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="376" cy="259" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><circle cx="524" cy="242.875" r="4" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><path d="M524 242.875L672 271.9" fill="none" stroke="#b54142" stroke-width="3"/><circle cx="672" cy="271.9" r="4" fill="#b54142" stroke="none" stroke-width="2" opacity="1"/><path d="M80 259L672 259" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><text x="28" y="484" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">0.6：exit 的已知值；相等时选 exit</text><text x="28" y="520" font-size="20" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">第4次：go=.675，起点自主选择 go</text><g transform="translate(220,567)"><path d="M43.3834 95.072L117.577 76.2092" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M122.6166 74.928L115.8489 80.7758L113.8777 73.0225Z" fill="#c8d6e0"/><path d="M38.8938 113.3482L111.2338 178.1813" fill="none" stroke="#c8d6e0" stroke-width="2" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M115.1062 181.6518L106.479 179.2913L111.8183 173.3337Z" fill="#c8d6e0"/><path d="M160.4615 62.3077L226.7385 34.6923" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="8 6"/><path data-arrow-mode="imagined" d="M231.5385 32.6923L225.6923 39.4615L222.6154 32.0769Z" fill="#7854a2"/><path d="M158.7831 80.8779L228.8