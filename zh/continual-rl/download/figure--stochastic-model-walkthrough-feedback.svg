" y="65" font-size="16" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">go: 0</text><text x="27" y="191" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">exit: 0.6</text><text x="245" y="-7" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">r=1</text><text x="250" y="181" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">r=0</text></g><text x="28" y="824" font-size="20" fill="#b54142" text-anchor="start" font-weight="400" opacity="1">新失败 → p̂(G)=3/5 → go=.54</text><text x="28" y="862" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">四次 cross 的全部16种真实后果</text><text x="28" y="912" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">概率</text><path d="M65 1070L683 1070" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="74.5" y="1068.8281" width="47" height="1.1719" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="1"/><text x="98" y="1056.8281" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">1/256</text><text x="98" y="1099" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">0</text><rect x="197.5" y="1055.9375" width="47" height="14.0625" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="1"/><text x="221" y="1043.9375" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">12/256</text><text x="221" y="1099" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">1</text><rect x="320.5" y="1006.7188" width="47" height="63.2813" rx="0" fill="#b54142" stroke="none" stroke-width="1.5" opacity="1"/><text x="344" y="994.7188" font-size="16" fill="#b54142" text-anchor="middle" font-weight="400" opacity="1">54/256</text><text x="344" y="1099" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">2</text>