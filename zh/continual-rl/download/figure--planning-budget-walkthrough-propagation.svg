<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1345" viewBox="0 0 720 1345" role="img" aria-labelledby="crl-wv238u-title crl-wv238u-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-wv238u-title">相同工作量，传播次序不同</title><desc id="crl-wv238u-desc">两条日程均执行6次full expected backups、6次接口查询、9个联合后果展开、9次后继动作Q读取、6次Q写入，W=30。上图先go和cross，再collect；它们首次读取仍为零的后继，结束时cross和go仍为0，实际首动作exit。下图先四个collect，再cross和go；后继均值先变为1，W26写cross=.9，W30写go=.81，实际首动作go。阶梯按实际异步写入形成，零目标也计成本。给定顺序只使用模型拓扑和固定C1..C4编号，不根据真值或奖励选择叶子。schedule list appends和budget checks各6另计，不在W轴；两行真实转移和模型写入均0。树箭头只显示规划停止后的首段真实路线，完整episode另计。</desc><rect width="720" height="1345" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="28" y="42" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同工作量，传播次序不同</text><text x="28" y="86" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">相同期望备份6次；W均为30</text><text x="28" y="120" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">青点线：后继均值；紫虚线：cross</text><text x="28" y="151" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">橙实线：go；灰线：exit=0.6</text><text x="28" y="212" font-size="22" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">先 go、cross，再四个 collect</text><path d="M80 272L80 467" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M80 467L80 472" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="80" y="493" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><path d="M158.6667 272L158.6667 467" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M158.6667 467L158.6667 472" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="158.6667" y="493" font-size="16" fi