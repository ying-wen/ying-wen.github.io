85" r="5" fill="#c8d6e0" stroke="none" stroke-width="2" opacity="1"/><text x="267" y="947" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">右室时亮 2/10</text><text x="20" y="991" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">橙点：给定位置时，灯亮的概率。</text><text x="20" y="1073" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">④ 用灯光更新信念</text><rect x="44" y="1130" width="96" height="104" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M80 1234L104 1234" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="92" cy="1182" r="33.5232" fill="#258375" stroke="#258375" stroke-width="2" opacity="0.25"/><text x="92" y="1188" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.8671</text><text x="92" y="1261" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">左室</text><rect x="219" y="1130" width="96" height="104" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M255 1234L279 1234" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="267" cy="1182" r="13.1223" fill="#258375" stroke="#258375" stroke-width="2" opacity="0.25"/><text x="267" y="1188" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.1329</text><text x="267" y="1261" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">右室</text><text x="20" y="1293" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">.496 + .076 = .572</text><text x="20" y="1329" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">两份联合概率，同除 .572。</text><text x="20" y="1395" font-size="16" fill="#258375" text-anchor="start" font-weight="400" opacity="1">观测改变的是信念，不是把物体搬到左室。</text></g></svg>
