<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1430" viewBox="0 0 360 1430" role="img" aria-labelledby="crl-9ay08o-title crl-9ay08o-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-9ay08o-title">看见一盏灯，怎样知道位置？</title><desc id="crl-9ay08o-desc">原创两房间隐状态算例。圆面积表示信念，不揭示物体实际位置。等待一步的转移矩阵为0.9,0.1和0.2,0.8。模型将先验0.6和0.4搬运为0.62和0.38。灯亮在左室的条件概率0.8，在右室为0.2；十个图标显示概率比例，不是额外采集的十个样本。灯亮后联合概率0.496和0.076同除证据0.572，得到0.86713和0.13287。四步是先验、动态预测、实际观测及条件化。</desc><rect width="360" height="1430" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="20" y="38" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">看见一盏灯，怎样知道位置？</text><text x="20" y="76" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">物体在左室或右室；位置不可见。</text><text x="20" y="104" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">① 当前的信念</text><rect x="44" y="153" width="96" height="104" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M80 257L104 257" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="92" cy="205" r="27.8855" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="0.25"/><text x="92" y="211" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.6</text><text x="92" y="284" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">左室</text><rect x="219" y="153" width="96" height="104" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width="1.5" opacity="1"/><path d="M255 257L279 257" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="1"/><circle cx="267" cy="205" r="22.7684" fill="#146ca1" stroke="#146ca1" stroke-width="2" opacity="0.25"/><text x="267" y="211" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.4</text><text x="267" y="284" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">右室</text><text x="20" y="330" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">圆面积 ∝ 位置概率</text><text x="20" y="399" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">② 等待一步：预测位置</text><path d="M92 465L92 587.8" fill="none" stroke="#146ca1" stroke-width="8.64" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="imagined" d="M92 593L88 585L96 585Z" fill="#146ca1"/><rect x="58" y="513.5" width="46" height="25" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="80" y="532.5" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.54</text><path d="M92 465L262.8029 589.9301" fill="none" stroke="#146ca1" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="imagined" d="M267 593L258.1814 591.5056L262.9044 585.0485Z" fill="#146ca1"/><rect x="193.7261" y="546" width="46" height="25" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="215.7261" y="565" font-size="16" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">0.06</text><path d="M267 465L96.1971 589.9301" fill="none" stroke="#258375" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="imagined" d="M92 593L96.0956 585.0485L100.8186 591.5056Z" fill="#258375"/><rect x="184.8089" y="489" width="46" height="25" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="206.8089" y="508" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.08</text><path d="M267 465L267 587.8" fill="none" stroke="#258375" stroke-width="5.120000000000001" stroke-linecap="round" opacity="1" stroke-dasharray="6 5"/><path data-arrow-mode="imagined" d="M267 593L263 585L271 585Z" fill="#258375"/><rect x="233" y="513.5" width="46" height="25" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="1"/><text x="255" y="532.5" font-size="16" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">0.32</text><circle cx="92" cy="453" r="11" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="92" y="432" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.6</text><circle cx="92" cy="610" r="22.0472" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="0.2"/><text x="92" y="617" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.62</text><text x="92" y="655" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">左室</text><circle cx="267" cy="453" r="11" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="267" y="432" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0.4</text><circle cx="267" cy="610" r="17.2604" fill="#7854a2" stroke="#7854a2" stroke-width="2" opacity="0.2"/><text x="267" y="617" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.38</text><text x="267" y="655" font-size="18" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">右室</text><text x="20" y="692" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">虚线：模型搬运概率，并非观察。</text><text x="20" y="754" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">③ 实际看到：指示灯亮</text><circle cx="180" cy="799" r="14" fill="#b65a28" stroke="none" stroke-width="2" opacity="1"/><path d="M172 819L188 819" fill="none" stroke="#b65a28" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M153 789L146.25 784" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M207 789L213.75 784" fill="none" stroke="#b65a28" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="41" y="839" width="102" height="76" rx="0" fill="#f5f8fb" stroke="#c8d6e0" stroke-width