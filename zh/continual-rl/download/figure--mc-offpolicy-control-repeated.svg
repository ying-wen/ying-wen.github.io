<svg xmlns="http://www.w3.org/2000/svg" width="720" height="778" viewBox="0 0 720 778" role="img" aria-labelledby="crl-rqb7bz-title crl-rqb7bz-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-rqb7bz-title">同一状态动作，三个后缀与三个权重</title><desc id="crl-rqb7bz-desc">一个新的 proper episodic 单状态任务：A每次奖励1，然后以1/2概率返回S、1/2概率真实终止；B奖励0并终止。行为在每步以1/2概率选A。动作均匀数0.1,0.2,0.3及转移均匀数0.8,0.7,0.2实际生成AAA后终止，这条轨迹概率1/64。三个(S,A)回报为3,2,1；普通首次访问纳入t=0，普通每次访问均值2。反向every-visit weighted-IS控制纳入t=2,1,0，权重1,2,4，C=1,3,7，Q(A)=1,5/3,17/7。条长正比于进入当前更新的W。三份回报属于同一回合、相关；图为原创机制计算，不是三个独立回合或学习曲线。</desc><rect width="720" height="778" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="22" y="40" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一状态动作，三个后缀与三个权重</text><text x="22" y="81" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">同一回合三次 (S,A) · γ=1</text><circle cx="90" cy="152" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="90" y="158" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><text x="90" y="210" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">t=0 · G=3</text><path d="M114 152L231.45 152" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M236 152L229 155.5L229 148.5Z" fill="#146ca1"/><text x="175" y="132" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">A / 1</text><circle cx="260" cy="152" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="260" y="158" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><text x="260" y="210" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">t=1 · G=2</text><path d="M284 152L401.45 152" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M406 152L399 155.5L399 148.5Z" fill="#146ca1"/><text x="345" y="132" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">A / 1</text><circle cx="430" cy="152" r="21" fill="#ffffff" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="430" y="158" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">S</text><text x="430" y="210" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">t=2 · G=1</text><path d="M454 152L581.45 152" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M586 152L579 155.5L579 148.5Z" fill="#146ca1"/><text x="520" y="132" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">A / 1</text><circle cx="610" cy="152" r="21" fill="#ffffff" stroke="#19354e" stroke-width="2" opacity="1"/><circle cx="610" cy="152" r="16" fill="none" stroke="#19354e" stroke-width="2" opacity="1"/><text x="610" y="158" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">终</text><text x="22" y="270" font-size="20" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">反向纳入顺序：t=2 → 1 → 0</text><text x="22" y="332" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">t=2</text><rect x="200" y="313" width="92" height="22" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="302" y="332" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">W=1</text><text x="22" y="366" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">G=1 · C=1 · Q(A)=1</text><text x="22" y="426" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">t=1</text><rect x="200" y="407" width="184" height="22" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="394" y="426" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">W=2</text><text x="22" y="460" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">G=2 · C=3 · Q(A)=5/3</text><text x="22" y="520" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">t=0</text><rect x="200" y="501" width="368" height="22" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="578" y="520" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">W=4</text><text x="22" y="554" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">G=3 · C=7 · Q(A)=17/7</text><path d="M22 612L698 612" fill="none" stroke="#c8d6e0" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="22" y="647" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">首次访问：t=0，取 G₀=3</text><text x="22" y="679" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">每次访问：(3+2+1)/3=2</text><text x="22" y="711" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">加权控制：(4×3+2×2+1×1)/7</text><text x="22" y="743" font-size="18" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">= 17/7；C=7 是权重和</text></g></svg>
