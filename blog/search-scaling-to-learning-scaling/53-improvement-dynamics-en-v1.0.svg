<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two routes into recursive improvement dynamics</title><desc id="desc">AI research search and runtime continual learning can both contribute to recursive self-improvement.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.t{font:700 36px Inter,Arial;fill:#0f172a}.h{font:700 23px Inter,Arial;fill:#0f172a}.b{font:18px Inter,Arial;fill:#334155}.s{font:15px Inter,Arial;fill:#475569}.arr{stroke:#334155;stroke-width:2.7;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="80" y="70" class="t">Self-evolution, AI4AI, and RSI ask different questions</text>
  <rect x="70" y="135" width="450" height="110" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="100" y="180" class="h">Self-evolving</text><text x="100" y="215" class="b">How autonomous is the update process?</text>
  <rect x="575" y="135" width="450" height="110" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="605" y="180" class="h">AI4AI</text><text x="605" y="215" class="b">Is AI itself the object of improvement?</text>
  <rect x="1080" y="135" width="450" height="110" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="1110" y="180" class="h">RSI</text><text x="1110" y="215" class="b">Does capability raise the next improvement rate?</text>
  <rect x="90" y="360" width="600" height="330" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="125" y="410" class="h">Route A · AI research search</text><text x="125" y="465" class="b">Generate and evaluate AI designs</text><text x="125" y="505" class="b">Improve proposal, evaluation, experiments</text><text x="125" y="545" class="b">Selected systems enter later rounds</text><text x="125" y="610" class="s">Can operate without one continually learning</text><text x="125" y="638" class="s">deployed agent.</text>
  <rect x="910" y="360" width="600" height="330" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="945" y="410" class="h">Route B · Runtime continual learning</text><text x="945" y="465" class="b">Improve state construction and prediction</text><text x="945" y="505" class="b">Improve credit assignment and plasticity</text><text x="945" y="545" class="b">Learn unfamiliar structure with less experience</text><text x="945" y="610" class="s">Can improve one continuing agent without</text><text x="945" y="638" class="s">automatically improving AI research.</text>
  <path d="M690 525 H900" class="arr"/><path d="M1210 350 C1210 300 1305 300 1305 255" class="arr"/><path d="M390 350 C390 290 1230 300 1230 255" class="arr"/>
  <rect x="320" y="775" width="960" height="72" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="365" y="819" class="b">Multiple rounds and comparable external inputs are required; one stronger descendant does not establish RSI.</text>
</svg>
