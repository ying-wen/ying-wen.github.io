<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A harness constructs and guides the search graph</title><desc id="desc">The harness maps external task semantics into reachable states, actions, visitation, evaluation, and commitment.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.t{font:700 36px Inter,Arial;fill:#0f172a}.h{font:700 23px Inter,Arial;fill:#0f172a}.b{font:18px Inter,Arial;fill:#334155}.s{font:15px Inter,Arial;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arr{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="80" y="70" class="t">A harness is part of the search problem—not neutral packaging</text>
  <rect x="70" y="190" width="290" height="430" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="100" y="235" class="h">External task</text><text x="100" y="280" class="b">Terminal behavior</text><text x="100" y="315" class="b">Real utility</text><text x="100" y="350" class="b">Environment dynamics</text><text x="100" y="385" class="b">Safety constraints</text><text x="100" y="455" class="s">The task does not prescribe</text><text x="100" y="482" class="s">how the agent represents</text><text x="100" y="509" class="s">or searches intermediate states.</text>
  <rect x="455" y="125" width="690" height="570" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/><text x="490" y="175" class="h">Harness: internal search formulation and control</text>
  <rect x="500" y="220" width="260" height="145" rx="14" class="box"/><text x="525" y="260" class="h">Representation</text><text x="525" y="295" class="s">State · context · memory</text><text x="525" y="325" class="s">What distinctions survive?</text>
  <rect x="835" y="220" width="260" height="145" rx="14" class="box"/><text x="860" y="260" class="h">Reachability</text><text x="860" y="295" class="s">Tools · actions · permissions</text><text x="860" y="325" class="s">Which paths exist?</text>
  <rect x="500" y="430" width="260" height="145" rx="14" class="box"/><text x="525" y="470" class="h">Guidance</text><text x="525" y="505" class="s">Proposal · compute allocation</text><text x="525" y="535" class="s">Which paths are visited?</text>
  <rect x="835" y="430" width="260" height="145" rx="14" class="box"/><text x="860" y="470" class="h">Selection</text><text x="860" y="505" class="s">Evaluation · stopping</text><text x="860" y="535" class="s">Which result is committed?</text>
  <path d="M360 405 H445" class="arr"/><path d="M1145 405 H1230" class="arr"/>
  <rect x="1240" y="190" width="290" height="430" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="1270" y="235" class="h">Finite search</text><text x="1270" y="280" class="b">Reachable candidates</text><text x="1270" y="315" class="b">Visited candidates</text><text x="1270" y="350" class="b">Selected action</text><text x="1270" y="420" class="s">More compute follows one</text><text x="1270" y="447" class="s">conditional curve.</text><text x="1270" y="500" class="s">Changing the harness</text><text x="1270" y="527" class="s">changes the curve.</text>
  <rect x="220" y="755" width="1160" height="85" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="260" y="790" class="b">Guidance reduces wasted search when aligned. A wrong restriction can remove the correct path;</text><text x="260" y="820" class="b">a wrong evaluator can make deeper search exploit the wrong objective.</text>
</svg>
