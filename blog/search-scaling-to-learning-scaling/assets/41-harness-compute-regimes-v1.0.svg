<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">更好的 harness 取决于任务分布与可用计算</title>
  <desc id="desc">三种 harness 在五个任务时计算水平上的示意响应。强限制的 harness 在低计算条件下较优但较早进入平台；较宽支持集的 harness 在计算增加后超过它。固定 harness 增加计算沿同一条件曲线移动，替换 harness 切换曲线。</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .serif{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif}
    .mono{font-family:"SFMono-Regular",Consolas,monospace}
    .title{font-size:42px;font-weight:720;fill:#17211c}
    .lead{font-size:22px;fill:#58635d}
    .h2{font-size:27px;font-weight:720;fill:#24342b}
    .h3{font-size:20px;font-weight:700;fill:#304138}
    .body{font-size:18px;fill:#405048}
    .small{font-size:16px;fill:#647169}
    .tiny{font-size:14px;fill:#768179}
    .orange{fill:#ba4f1c}.green{fill:#2f704f}.blue{fill:#365f82}.gray{fill:#78827c}
  </style>

  <text x="800" y="62" text-anchor="middle" class="sans title">“更好的 harness”取决于任务分布与可用计算</text>
  <text x="800" y="102" text-anchor="middle" class="serif lead">固定 h 沿同一条条件曲线移动；替换 h 则切换曲线</text>

  <g transform="translate(80,155)">
    <rect width="980" height="650" rx="20" fill="#fbfcfb" stroke="#cfd6d2" stroke-width="2"/>
    <text x="42" y="48" class="sans h2">同一任务分布 D，不同 harness 的离散响应</text>
    <text x="938" y="48" text-anchor="end" class="serif tiny">概念示意，不对应公开基准</text>

    <g transform="translate(105,105)">
      <line x1="0" y1="430" x2="760" y2="430" stroke="#8c9891" stroke-width="2"/>
      <line x1="0" y1="430" x2="0" y2="0" stroke="#8c9891" stroke-width="2"/>
      <path d="M760 430 l-13 -7 v14 z" fill="#8c9891"/>
      <path d="M0 0 l-7 13 h14 z" fill="#8c9891"/>

      <g stroke="#e1e6e3" stroke-width="1">
        <line x1="0" y1="344" x2="760" y2="344"/>
        <line x1="0" y1="258" x2="760" y2="258"/>
        <line x1="0" y1="172" x2="760" y2="172"/>
        <line x1="0" y1="86" x2="760" y2="86"/>
        <line x1="150" y1="0" x2="150" y2="430"/>
        <line x1="300" y1="0" x2="300" y2="430"/>
        <line x1="450" y1="0" x2="450" y2="430"/>
        <line x1="600" y1="0" x2="600" y2="430"/>
      </g>

      <text x="-58" y="215" transform="rotate(-90 -58 215)" text-anchor="middle" class="sans body">当前任务表现 J</text>
      <text x="380" y="492" text-anchor="middle" class="sans body">任务时计算 c</text>
      <g class="mono small" text-anchor="middle">
        <text x="0" y="462">c₁</text><text x="150" y="462">c₂</text><text x="300" y="462">c₃</text>
        <text x="450" y="462">c₄</text><text x="600" y="462">c₅</text>
      </g>

      <polyline points="0,274 150,204 300,170 450,154 600,148" fill="none" stroke="#cf6f3f" stroke-width="5"/>
      <g fill="#ffffff" stroke="#cf6f3f" stroke-width="4">
        <circle cx="0" cy="274" r="9"/><circle cx="150" cy="204" r="9"/><circle cx="300" cy="170" r="9"/><circle cx="450" cy="154" r="9"/><circle cx="600" cy="148" r="9"/>
      </g>

      <polyline points="0,358 150,286 300,210 450,130 600,74" fill="none" stroke="#4c8b68" stroke-width="5"/>
      <g fill="#ffffff" stroke="#4c8b68" stroke-width="4">
        <circle cx="0" cy="358" r="9"/><circle cx="150" cy="286" r="9"/><circle cx="300" cy="210" r="9"/><circle cx="450" cy="130" r="9"/><circle cx="600" cy="74" r="9"/>
      </g>

      <polyline points="0,335 150,300 300,280 450,269 600,264" fill="none" stroke="#9aa49e" stroke-width="4" stroke-dasharray="10 8"/>
      <g fill="#ffffff" stroke="#9aa49e" stroke-width="3">
        <circle cx="0" cy="335" r="8"/><circle cx="150" cy="300" r="8"/><circle cx="300" cy="280" r="8"/><circle cx="450" cy="269" r="8"/><circle cx="600" cy="264" r="8"/>
      </g>

      <g transform="translate(625,55)">
        <line x1="0" y1="0" x2="42" y2="0" stroke="#4c8b68" stroke-width="5"/>
        <text x="54" y="7" class="sans h3 green">h₂：较宽支持集</text>
        <line x1="0" y1="47" x2="42" y2="47" stroke="#cf6f3f" stroke-width="5"/>
        <text x="54" y="54" class="sans h3 orange">h₁：强限制</text>
        <line x1="0" y1="94" x2="42" y2="94" stroke="#9aa49e" stroke-width="4" stroke-dasharray="10 8"/>
        <text x="54" y="101" class="sans h3 gray">h₃：引导失配</text>
      </g>

      <g transform="translate(322,116)">
        <rect x="-30" y="-40" width="265" height="84" rx="13" fill="#ffffff" fill-opacity="0.94" stroke="#c8d1d8"/>
        <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#365f82" stroke-width="2"/>
        <text x="0" y="7" text-anchor="middle" class="sans h3 blue">×</text>
        <text x="35" y="-5" class="sans h3 blue">曲线交叉</text>
        <text x="35" y="22" class="serif small">harness 排序随 c 变化</text>
      </g>

      <path d="M62 250 C105 216 132 205 180 194" fill="none" stroke="#cf6f3f" stroke-width="2" marker-end="url(#arrow-orange)"/>
      <text x="62" y="238" class="serif small orange">低计算：快速聚焦</text>
      <path d="M445 113 C505 91 546 82 585 76" fill="none" stroke="#4c8b68" stroke-width="2" marker-end="url(#arrow-green)"/>
      <text x="432" y="101" class="serif small green">高计算：较高上限</text>
    </g>
  </g>

  <g transform="translate(1100,155)">
    <rect width="420" height="650" rx="20" fill="#f7faf8" stroke="#a7b9ae" stroke-width="2"/>
    <text x="32" y="48" class="sans h2">设计层目标必须声明 c</text>

    <rect x="30" y="82" width="360" height="132" rx="14" fill="#fff7f1" stroke="#dfa17d"/>
    <text x="52" y="117" class="sans h3 orange">低计算条件</text>
    <text x="52" y="150" class="serif body">较窄支持集、较强剪枝</text>
    <text x="52" y="180" class="serif body">可能更快触及可用候选</text>

    <rect x="30" y="232" width="360" height="132" rx="14" fill="#f0f7f2" stroke="#86a894"/>
    <text x="52" y="267" class="sans h3 green">高计算条件</text>
    <text x="52" y="300" class="serif body">较宽支持集、较深核验</text>
    <text x="52" y="330" class="serif body">可能达到更高任务表现</text>

    <rect x="30" y="390" width="360" height="154" rx="14" fill="#f5f7fb" stroke="#9aaabc"/>
    <text x="52" y="426" class="sans h3 blue">固定计算水平</text>
    <text x="52" y="462" class="mono small">h*(c₀,D) = arg max J(c₀|h,D)</text>
    <text x="52" y="500" class="sans h3 blue">实际计算分布</text>
    <text x="52" y="530" class="mono small">h*(P_C,D) = arg max E[J(c|h,D)]</text>

    <rect x="30" y="568" width="360" height="54" rx="12" fill="#ffffff" stroke="#c5cfca"/>
    <text x="210" y="602" text-anchor="middle" class="sans h3">单点排序不能推出全程占优</text>
  </g>

  <defs>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#cf6f3f"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4c8b68"/></marker>
  </defs>
</svg>
