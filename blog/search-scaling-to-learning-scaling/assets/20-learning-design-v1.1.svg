<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">区分任务时搜索与持久学习的对照实验设计</title>
  <desc id="desc">相同初始系统和经历序列分成冻结分支与更新分支，在清空任务状态后用固定运行条件评估未来新任务。</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#20262b}.muted{fill:#68727a}.blue{fill:#edf4fb;stroke:#89aace}.green{fill:#eaf5f1;stroke:#6fa290}.gray{fill:#f4f6f7;stroke:#c8d0d5}.amber{fill:#fbf3e8;stroke:#d6a361}.box{stroke-width:2}.line{fill:none;stroke:#626e75;stroke-width:4;marker-end:url(#a)}.lineg{fill:none;stroke:#267763;stroke-width:5;marker-end:url(#g)}.lineb{fill:none;stroke:#567ea9;stroke-width:5;marker-end:url(#b)}
      .t{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.h{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.b{font:400 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.s{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#626e75"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#267763"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#567ea9"/></marker>
  </defs>
  <rect class="bg" width="1600" height="920"/>
  <text x="80" y="75" class="t ink">冻结分支与更新分支的对照实验</text>
  <text x="80" y="117" class="b muted">两个分支具有相同初始状态与经历序列，仅持久更新的提交条件不同。</text>

  <rect x="90" y="235" width="250" height="125" rx="22" class="box blue"/>
  <text x="215" y="282" text-anchor="middle" class="h ink">初始状态 A₀</text>
  <text x="215" y="319" text-anchor="middle" class="s muted">同一参数、记忆与工具</text>
  <path d="M340 298H430" class="line"/>
  <rect x="440" y="220" width="315" height="155" rx="22" class="box amber"/>
  <text x="597" y="268" text-anchor="middle" class="h ink">经历序列 E</text>
  <text x="597" y="307" text-anchor="middle" class="s muted">同一任务顺序、观测与反馈</text>
  <text x="597" y="339" text-anchor="middle" class="s muted">记录 token、交互与更新时间</text>

  <path d="M755 298H835V225H915" class="lineb"/>
  <path d="M755 298H835V535H915" class="lineg"/>

  <rect x="925" y="165" width="300" height="135" rx="22" class="box blue"/>
  <text x="1075" y="212" text-anchor="middle" class="h ink">冻结分支 A⁻</text>
  <text x="1075" y="250" text-anchor="middle" class="s muted">经历不提交至持久状态</text>
  <text x="1075" y="278" text-anchor="middle" class="s muted">允许相同任务时搜索</text>

  <rect x="925" y="475" width="300" height="135" rx="22" class="box green"/>
  <text x="1075" y="522" text-anchor="middle" class="h ink">更新分支 A⁺</text>
  <text x="1075" y="560" text-anchor="middle" class="s muted">经历提交至参数、记忆或策略结构</text>
  <text x="1075" y="588" text-anchor="middle" class="s muted">更新规则保持可追踪</text>

  <path d="M1225 232H1290V375" class="lineb"/>
  <path d="M1225 542H1290V435" class="lineg"/>
  <rect x="1245" y="345" width="285" height="145" rx="22" class="box gray"/>
  <text x="1387" y="390" text-anchor="middle" class="h ink">未来新任务 Dₙₑw</text>
  <text x="1387" y="427" text-anchor="middle" class="s muted">清空 context 与 scratchpad</text>
  <text x="1387" y="457" text-anchor="middle" class="s muted">固定 token、工具调用、墙钟时间</text>

  <rect x="180" y="700" width="1240" height="145" rx="24" fill="#f4f6f7"/>
  <text x="230" y="748" class="h ink">同时报告四项评估</text>
  <text x="230" y="795" class="b ink">Jₙₑw：新任务表现</text>
  <text x="560" y="795" class="b ink">nτ：达到阈值所需经历数</text>
  <text x="925" y="795" class="b ink">Rₒld：旧能力保持</text>
  <text x="1195" y="795" class="b ink">Pₗₐₜₑ：后期可塑性</text>
</svg>
