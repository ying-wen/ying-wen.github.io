<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">不同研究视角对应的响应关系</title>
  <desc id="desc">以二乘二卡片并列比较训练扩展、搜索扩展、学习扩展与递归自我改进的自变量、估计对象和代表性研究视角，并在下方标出横跨各项机制的产业经济分析。</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#20262b}.muted{fill:#66727a}.line{stroke:#ccd4d9;stroke-width:2}.blue{fill:#edf4fb;stroke:#89aace}.amber{fill:#fbf3e8;stroke:#d6a361}.green{fill:#eaf5f1;stroke:#6fa290}.purple{fill:#f5effa;stroke:#aa92c8}.card{stroke-width:2}.t{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.h{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.b{font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.s{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.eq{font:600 28px Georgia,"Times New Roman",serif}
    </style>
  </defs>

  <rect class="bg" width="1600" height="980"/>
  <text x="80" y="72" class="t ink">不同研究视角关注不同的响应关系</text>
  <text x="80" y="114" class="b muted">四项评估并列存在，并非依次替代的阶段；每一项都需要声明自变量与固定条件。</text>

  <rect x="70" y="160" width="705" height="285" rx="24" class="card blue"/>
  <circle cx="115" cy="205" r="24" fill="#5d86ad"/>
  <text x="115" y="213" text-anchor="middle" class="h" fill="#fff">1</text>
  <text x="155" y="215" class="h ink">Training Scaling</text>
  <text x="110" y="270" class="s muted">变化量</text>
  <text x="110" y="312" class="eq ink">N, D, C<tspan baseline-shift="sub" font-size="18">train</tspan></text>
  <line x1="335" y1="252" x2="335" y2="405" class="line"/>
  <text x="375" y="270" class="s muted">估计对象</text>
  <text x="375" y="309" class="b ink">部署前的训练规模如何决定</text>
  <text x="375" y="342" class="b ink">初始持久状态 z₀？</text>
  <rect x="375" y="365" width="350" height="52" rx="14" fill="#fff" opacity="0.82"/>
  <text x="395" y="398" class="s ink">Kaplan · Hoffmann</text>

  <rect x="825" y="160" width="705" height="285" rx="24" class="card amber"/>
  <circle cx="870" cy="205" r="24" fill="#b77925"/>
  <text x="870" y="213" text-anchor="middle" class="h" fill="#fff">2</text>
  <text x="910" y="215" class="h ink">Search Scaling</text>
  <text x="865" y="270" class="s muted">变化量</text>
  <text x="865" y="312" class="eq ink">c → J<tspan baseline-shift="sub" font-size="18">task</tspan></text>
  <line x1="1090" y1="252" x2="1090" y2="405" class="line"/>
  <text x="1130" y="270" class="s muted">估计对象</text>
  <text x="1130" y="309" class="b ink">持久状态固定时，更多候选、轨迹</text>
  <text x="1130" y="342" class="b ink">或工具调用如何影响任务表现？</text>
  <rect x="1130" y="365" width="350" height="52" rx="14" fill="#fff" opacity="0.82"/>
  <text x="1150" y="398" class="s ink">Snell · OpenAI · DeepSeek</text>

  <rect x="70" y="475" width="705" height="285" rx="24" class="card green"/>
  <circle cx="115" cy="520" r="24" fill="#337c68"/>
  <text x="115" y="528" text-anchor="middle" class="h" fill="#fff">3</text>
  <text x="155" y="530" class="h ink">Learning Scaling</text>
  <text x="110" y="585" class="s muted">变化量</text>
  <text x="110" y="627" class="eq ink">n → J<tspan baseline-shift="sub" font-size="18">future</tspan> ; n<tspan baseline-shift="sub" font-size="18">ρ,t</tspan></text>
  <line x1="335" y1="567" x2="335" y2="720" class="line"/>
  <text x="375" y="585" class="s muted">估计对象</text>
  <text x="375" y="624" class="b ink">固定未来运行条件后，累计经历如何</text>
  <text x="375" y="657" class="b ink">形成能力与新任务学习效率？</text>
  <rect x="375" y="680" width="350" height="52" rx="14" fill="#fff" opacity="0.82"/>
  <text x="395" y="713" class="s ink">Sutton · Silver · Chollet · LeCun</text>

  <rect x="825" y="475" width="705" height="285" rx="24" class="card purple"/>
  <circle cx="870" cy="520" r="24" fill="#7a59a7"/>
  <text x="870" y="528" text-anchor="middle" class="h" fill="#fff">4</text>
  <text x="910" y="530" class="h ink">RSI Feedback</text>
  <text x="865" y="585" class="s muted">变化量</text>
  <text x="865" y="627" class="eq ink">I → İ</text>
  <line x1="1090" y1="567" x2="1090" y2="720" class="line"/>
  <text x="1130" y="585" class="s muted">估计对象</text>
  <text x="1130" y="624" class="b ink">能力提高是否使下一轮改进速率</text>
  <text x="1130" y="657" class="b ink">继续上升？</text>
  <rect x="1130" y="680" width="350" height="52" rx="14" fill="#fff" opacity="0.82"/>
  <text x="1150" y="713" class="s ink">Aschenbrenner · Cunningham · METR</text>

  <rect x="135" y="815" width="1330" height="112" rx="22" fill="#f4f6f7" stroke="#cbd3d8" stroke-width="2"/>
  <text x="175" y="861" class="h ink">产业经济分析</text>
  <text x="410" y="861" class="b ink">Sequoia · BOND · a16z</text>
  <text x="175" y="899" class="b muted">基础设施、单位价格、利用率、应用价值与持久载体决定可行边界，但不替代四项机制的操作性评估。</text>
</svg>
