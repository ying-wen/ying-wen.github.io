<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Harness 构造并引导有限计算下的搜索</title>
  <desc id="desc">外部任务只规定终端行为及其评价。Harness 将任务编译为内部搜索图，确定可达候选支持集，并在有限计算下诱导非均匀访问分布。对象层固定 harness 调整搜索计算；设计层搜索不同 harness。</desc>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .serif{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif}
    .mono{font-family:"SFMono-Regular",Consolas,monospace}
    .title{font-size:40px;font-weight:720;fill:#17211c}.lead{font-size:21px;fill:#56615b}
    .h2{font-size:27px;font-weight:720;fill:#223129}.h3{font-size:19px;font-weight:700;fill:#2f3d35}
    .body{font-size:18px;fill:#3e4b44}.small{font-size:16px;fill:#637068}.tiny{font-size:14px;fill:#718078}
    .orange{fill:#b84e1b}.green{fill:#2f704f}.blue{fill:#365f82}.purple{fill:#6f5683}
  </style>

  <text x="800" y="58" text-anchor="middle" class="sans title">Harness 的核心作用：构造并引导任务搜索</text>
  <text x="800" y="94" text-anchor="middle" class="serif lead">可达候选支持集与有限计算的访问分布，共同决定搜索表现</text>

  <g transform="translate(55,140)">
    <rect width="390" height="570" rx="18" fill="#fafafa" stroke="#cfd5d2"/>
    <text x="195" y="44" text-anchor="middle" class="sans h2">外部解空间 Ω(x)</text>
    <text x="195" y="74" text-anchor="middle" class="serif small">任务语义允许的终端行为及其评价</text>

    <g fill="#dfe4e1">
      <circle cx="68" cy="135" r="13"/><circle cx="132" cy="118" r="12"/><circle cx="205" cy="143" r="14"/><circle cx="294" cy="116" r="11"/><circle cx="342" cy="161" r="13"/>
      <circle cx="94" cy="210" r="12"/><circle cx="165" cy="195" r="14"/><circle cx="248" cy="218" r="12"/><circle cx="323" cy="229" r="14"/>
      <circle cx="55" cy="291" r="12"/><circle cx="128" cy="278" r="13"/><circle cx="208" cy="300" r="11"/><circle cx="278" cy="281" r="14"/><circle cx="350" cy="310" r="12"/>
      <circle cx="87" cy="367" r="14"/><circle cx="168" cy="354" r="11"/><circle cx="238" cy="382" r="13"/><circle cx="319" cy="365" r="12"/>
      <circle cx="56" cy="451" r="11"/><circle cx="139" cy="432" r="13"/><circle cx="218" cy="463" r="12"/><circle cx="291" cy="438" r="14"/><circle cx="343" cy="486" r="12"/>
    </g>
    <g fill="#5f9876" stroke="#2f704f" stroke-width="2">
      <circle cx="303" cy="164" r="14"/><circle cx="137" cy="329" r="14"/><circle cx="257" cy="424" r="14"/>
    </g>
    <path d="M55 525 C130 488 237 535 338 505" fill="none" stroke="#bcc6c0" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="195" y="548" text-anchor="middle" class="serif small">高质量终端行为稀疏，不能直接穷举</text>
  </g>

  <g transform="translate(495,140)">
    <rect width="500" height="570" rx="18" fill="#fff9f5" stroke="#d98a5f" stroke-width="2"/>
    <text x="250" y="44" text-anchor="middle" class="sans h2 orange">Harness h</text>
    <text x="250" y="74" text-anchor="middle" class="serif small">把任务与持久状态编译为内部搜索图 Gₕ(x,z)</text>

    <g transform="translate(32,105)">
      <rect width="205" height="94" rx="11" fill="#fff" stroke="#e4b294"/>
      <text x="18" y="31" class="sans h3">状态表示 φₕ</text>
      <text x="18" y="58" class="serif small">保留哪些观测、轨迹</text>
      <text x="18" y="80" class="serif small">记忆与中间产物</text>

      <rect x="231" width="205" height="94" rx="11" fill="#fff" stroke="#e4b294"/>
      <text x="249" y="31" class="sans h3">可行动作 𝒜ₕ(s)</text>
      <text x="249" y="58" class="serif small">工具、权限、调用结构</text>
      <text x="249" y="80" class="serif small">与可编辑对象</text>

      <rect y="114" width="205" height="94" rx="11" fill="#fff" stroke="#e4b294"/>
      <text x="18" y="145" class="sans h3">展开算子 qₕ</text>
      <text x="18" y="172" class="serif small">提出哪些后继候选</text>
      <text x="18" y="194" class="serif small">以及候选相关结构</text>

      <rect x="231" y="114" width="205" height="94" rx="11" fill="#fff" stroke="#e4b294"/>
      <text x="249" y="145" class="sans h3">评价 vₕ</text>
      <text x="249" y="172" class="serif small">过程反馈、验证器</text>
      <text x="249" y="194" class="serif small">与候选排序</text>

      <rect y="228" width="205" height="94" rx="11" fill="#fff" stroke="#e4b294"/>
      <text x="18" y="259" class="sans h3">分配策略 μₕ</text>
      <text x="18" y="286" class="serif small">计算投向哪些节点</text>
      <text x="18" y="308" class="serif small">何时探索或利用</text>

      <rect x="231" y="228" width="205" height="94" rx="11" fill="#fff" stroke="#e4b294"/>
      <text x="249" y="259" class="sans h3">停止与提交 σₕ</text>
      <text x="249" y="286" class="serif small">何时终止搜索</text>
      <text x="249" y="308" class="serif small">以及写入哪个状态</text>
    </g>

    <rect x="32" y="456" width="436" height="76" rx="12" fill="#fff1e7" stroke="#d98a5f"/>
    <text x="250" y="485" text-anchor="middle" class="sans h3 orange">可达支持集 𝒰ₕ(x,z) ⊆ Ω(x)</text>
    <text x="250" y="514" text-anchor="middle" class="serif small">表示与可行动作决定哪些终端行为能够到达</text>
  </g>

  <g transform="translate(1045,140)">
    <rect width="500" height="570" rx="18" fill="#f7fbf8" stroke="#6f9f83" stroke-width="2"/>
    <text x="250" y="44" text-anchor="middle" class="sans h2 green">状态访问分布 ρₕ,𝚌</text>
    <text x="250" y="74" text-anchor="middle" class="serif small">只访问被表示、可达并优先分配的节点</text>

    <g transform="translate(54,116)" stroke="#729c82" stroke-width="3" fill="none">
      <path d="M196 12 L93 96 M196 12 L222 96 M196 12 L342 96"/>
      <path d="M93 96 L45 184 M93 96 L128 184"/>
      <path d="M222 96 L190 184 M222 96 L270 184"/>
      <path d="M342 96 L326 184 M342 96 L390 184"/>
      <path d="M128 184 L100 276 M128 184 L160 276"/>
      <path d="M270 184 L238 276 M270 184 L305 276"/>
    </g>
    <g transform="translate(54,116)">
      <g fill="#ffffff" stroke="#729c82" stroke-width="2">
        <circle cx="196" cy="12" r="18"/><circle cx="93" cy="96" r="17"/><circle cx="222" cy="96" r="17"/><circle cx="342" cy="96" r="17"/>
        <circle cx="45" cy="184" r="15"/><circle cx="128" cy="184" r="15"/><circle cx="190" cy="184" r="15"/><circle cx="270" cy="184" r="15"/><circle cx="326" cy="184" r="15"/><circle cx="390" cy="184" r="15"/>
        <circle cx="100" cy="276" r="15"/><circle cx="160" cy="276" r="15"/><circle cx="238" cy="276" r="15"/><circle cx="305" cy="276" r="15"/>
      </g>
      <g fill="#dfe4e1" stroke="#aeb9b2">
        <circle cx="45" cy="184" r="8"/><circle cx="190" cy="184" r="8"/><circle cx="326" cy="184" r="8"/><circle cx="390" cy="184" r="8"/>
      </g>
      <circle cx="238" cy="276" r="12" fill="#5f9876" stroke="#2f704f" stroke-width="2"/>
      <path d="M196 12 L222 96 L270 184 L238 276" fill="none" stroke="#2f704f" stroke-width="6" opacity="0.55"/>
    </g>
    <rect x="40" y="442" width="420" height="90" rx="12" fill="#eaf4ed" stroke="#6f9f83"/>
    <text x="250" y="473" text-anchor="middle" class="sans h3 green">Search Scaling：固定 h，调整计算 c</text>
    <text x="250" y="501" text-anchor="middle" class="mono body">J_task(c | h, z, D)</text>
    <text x="250" y="523" text-anchor="middle" class="serif tiny">增加 c 沿同一条条件曲线移动；替换 h 则切换曲线</text>
  </g>

  <g transform="translate(150,765)">
    <rect width="1300" height="174" rx="18" fill="#f7f8fb" stroke="#9aaabc"/>
    <text x="30" y="42" class="sans h2 blue">设计层 meta-search：搜索不同的 harness</text>
    <text x="30" y="76" class="serif body">候选为 h₁, h₂, …, hₘ；评价其在任务分布上的表现并提交 h*</text>

    <g transform="translate(60,104)">
      <rect width="158" height="48" rx="10" fill="#fff" stroke="#9aaabc"/><text x="79" y="31" text-anchor="middle" class="mono body">h₁</text>
      <rect x="190" width="158" height="48" rx="10" fill="#fff" stroke="#9aaabc"/><text x="269" y="31" text-anchor="middle" class="mono body">h₂</text>
      <text x="382" y="31" class="sans h2 muted">⋯</text>
      <rect x="430" width="158" height="48" rx="10" fill="#fff" stroke="#9aaabc"/><text x="509" y="31" text-anchor="middle" class="mono body">hₘ</text>
      <path d="M620 24 H764" stroke="#6f5683" stroke-width="3" marker-end="url(#arrow-purple)"/>
      <rect x="792" y="-2" width="190" height="52" rx="10" fill="#f5eff8" stroke="#9a80a8" stroke-width="2"/>
      <text x="887" y="31" text-anchor="middle" class="sans h3 purple">提交 h*</text>
      <text x="1012" y="31" class="serif body">→ 改写下一轮对象层搜索</text>
    </g>
  </g>

  <defs>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6f5683"/></marker>
  </defs>
</svg>
