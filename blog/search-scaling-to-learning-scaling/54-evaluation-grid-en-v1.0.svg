<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two-axis evaluation grid for search and learning</title><desc id="desc">Search computation varies horizontally and accumulated experience varies vertically.</desc>
  <defs><style>.t{font:700 36px Inter,Arial;fill:#0f172a}.h{font:700 23px Inter,Arial;fill:#0f172a}.b{font:18px Inter,Arial;fill:#334155}.s{font:15px Inter,Arial;fill:#475569}.box{stroke:#cbd5e1;stroke-width:2}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="80" y="70" class="t">Evaluate search computation and accumulated experience on separate axes</text>
  <text x="620" y="835" class="h">Task-time search computation →</text><text x="85" y="555" class="h" transform="rotate(-90 85 555)">Accumulated experience →</text>
  <rect x="260" y="180" width="550" height="250" rx="18" fill="#f8fafc" class="box"/><text x="300" y="225" class="h">Less experience · low search</text><text x="300" y="275" class="b">Baseline later behavior</text><text x="300" y="315" class="s">Same future task distribution</text><text x="300" y="350" class="s">Same model and harness definition</text>
  <rect x="875" y="180" width="550" height="250" rx="18" fill="#eff6ff" class="box"/><text x="915" y="225" class="h">Less experience · more search</text><text x="915" y="275" class="b">Search response at fixed state</text><text x="915" y="315" class="s">Coverage · diversity · evaluation</text><text x="915" y="350" class="s">Current-task improvement</text>
  <rect x="260" y="500" width="550" height="250" rx="18" fill="#ecfdf5" class="box"/><text x="300" y="545" class="h">More experience · low search</text><text x="300" y="595" class="b">Learning response under equal compute</text><text x="300" y="635" class="s">Control · recovery · transfer</text><text x="300" y="670" class="s">Retention · late plasticity</text>
  <rect x="875" y="500" width="550" height="250" rx="18" fill="#f0fdf4" class="box"/><text x="915" y="545" class="h">More experience · more search</text><text x="915" y="595" class="b">Interaction of learning and search</text><text x="915" y="635" class="s">Does learning move the search curve?</text><text x="915" y="670" class="s">Does search improve future experience?</text>
  <line x1="835" y1="160" x2="835" y2="780" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/><line x1="230" y1="465" x2="1455" y2="465" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="260" y="120" class="s">Estimate multiple compute levels at each experience checkpoint; two endpoints do not define a scaling law.</text>
</svg>
