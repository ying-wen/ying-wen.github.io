<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">候选覆盖与评价器可靠性共同限制 Search Scaling</title>
  <desc id="desc">左侧展示候选数增加如何提高可行项出现概率，右侧比较可靠评价器与存在 proxy 误差的评价器如何从同一候选集合选择不同提交项。</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#fbfcfd;stroke:#c8d0d5;stroke-width:2}.box{fill:#fff;stroke:#c8d0d5;stroke-width:2}.valid{fill:#eaf5f1;stroke:#267763;stroke-width:3}.search{fill:#fbf3e8;stroke:#b96b17;stroke-width:3}.other{fill:#f1f3f4;stroke:#9aa4aa;stroke-width:2}.ink{fill:#20262b}.muted{fill:#68727a}.amber{fill:#a85e12}.green{fill:#267763}
      .t{font:700 40px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.h{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.b{font:400 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.s{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.eq{font:500 25px Georgia,"Times New Roman",serif}.mono{font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace}
      .line{fill:none;stroke:#626e75;stroke-width:3}.linea{fill:none;stroke:#b96b17;stroke-width:4}.lineg{fill:none;stroke:#267763;stroke-width:4}.dash{fill:none;stroke:#8b969c;stroke-width:2.5;stroke-dasharray:8 8}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#626e75"/></marker>
    <marker id="arrowa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b96b17"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#267763"/></marker>
  </defs>

  <rect class="bg" width="1600" height="920"/>
  <text x="80" y="70" class="t ink">Search Scaling 的两项乘法条件</text>
  <text x="80" y="112" class="b muted">Proposal 决定可行候选能否出现；评价器决定它能否被选中。增加候选数只直接改善前一项。</text>

  <rect x="80" y="165" width="690" height="610" rx="24" class="panel"/>
  <text x="120" y="220" class="h ink">A. 候选覆盖</text>
  <text x="120" y="255" class="b muted">若单次 proposal 产生可行项的概率为 p</text>

  <text x="120" y="330" class="mono ink">N = 1</text>
  <circle cx="270" cy="322" r="24" class="other"/>
  <text x="310" y="330" class="s muted">一次采样可能没有可行项</text>

  <text x="120" y="430" class="mono ink">N = 4</text>
  <circle cx="270" cy="422" r="24" class="other"/>
  <circle cx="335" cy="422" r="24" class="other"/>
  <circle cx="400" cy="422" r="24" class="valid"/>
  <circle cx="465" cy="422" r="24" class="other"/>
  <text x="510" y="430" class="s green">可行项出现</text>

  <text x="120" y="530" class="mono ink">N = 16</text>
  <g>
    <circle cx="270" cy="522" r="15" class="other"/><circle cx="307" cy="522" r="15" class="other"/>
    <circle cx="344" cy="522" r="15" class="other"/><circle cx="381" cy="522" r="15" class="valid"/>
    <circle cx="418" cy="522" r="15" class="other"/><circle cx="455" cy="522" r="15" class="other"/>
    <circle cx="492" cy="522" r="15" class="other"/><circle cx="529" cy="522" r="15" class="other"/>
    <circle cx="566" cy="522" r="15" class="valid"/><circle cx="603" cy="522" r="15" class="other"/>
    <circle cx="640" cy="522" r="15" class="other"/><circle cx="677" cy="522" r="15" class="other"/>
  </g>
  <text x="270" y="568" class="s muted">候选相关性越强，有效候选数越小</text>

  <rect x="120" y="615" width="610" height="105" rx="18" class="box"/>
  <text x="425" y="660" text-anchor="middle" class="eq ink">P(G<tspan baseline-shift="sub" font-size="17">N</tspan>) = 1 − (1 − p)<tspan baseline-shift="super" font-size="17">N</tspan></text>
  <text x="425" y="696" text-anchor="middle" class="s muted">独立 proposal 下，“至少出现一个可行项”的概率</text>

  <rect x="830" y="165" width="690" height="610" rx="24" class="panel"/>
  <text x="870" y="220" class="h ink">B. 评价排序</text>
  <text x="870" y="255" class="b muted">同一候选集合可以被两种评价器排出不同顺序</text>

  <rect x="875" y="300" width="150" height="68" rx="16" class="valid"/>
  <text x="950" y="329" text-anchor="middle" class="s ink">可行项</text>
  <text x="950" y="353" text-anchor="middle" class="s green">外部任务通过</text>
  <rect x="875" y="390" width="150" height="68" rx="16" class="search"/>
  <text x="950" y="419" text-anchor="middle" class="s ink">高 proxy 项</text>
  <text x="950" y="443" text-anchor="middle" class="s amber">外部任务未通过</text>
  <rect x="875" y="480" width="150" height="68" rx="16" class="other"/>
  <text x="950" y="521" text-anchor="middle" class="s muted">其他候选</text>

  <path d="M1035 334H1110" class="lineg" marker-end="url(#arrowg)"/>
  <rect x="1120" y="292" width="170" height="84" rx="17" class="valid"/>
  <text x="1205" y="324" text-anchor="middle" class="s ink">可靠评价器</text>
  <text x="1205" y="351" text-anchor="middle" class="s green">可行项排在首位</text>
  <path d="M1290 334H1360" class="lineg" marker-end="url(#arrowg)"/>
  <rect x="1370" y="300" width="110" height="68" rx="16" class="valid"/>
  <text x="1425" y="341" text-anchor="middle" class="s green">提交</text>

  <path d="M1035 424H1110" class="linea" marker-end="url(#arrowa)"/>
  <rect x="1120" y="402" width="170" height="106" rx="17" class="search"/>
  <text x="1205" y="436" text-anchor="middle" class="s ink">存在 proxy 误差</text>
  <text x="1205" y="465" text-anchor="middle" class="s amber">高分伪解排在首位</text>
  <text x="1205" y="490" text-anchor="middle" class="s muted">搜索触及误差尾部</text>
  <path d="M1290 455H1360" class="linea" marker-end="url(#arrowa)"/>
  <rect x="1370" y="421" width="110" height="68" rx="16" class="search"/>
  <text x="1425" y="462" text-anchor="middle" class="s amber">误选</text>

  <rect x="870" y="615" width="610" height="105" rx="18" class="box"/>
  <text x="1175" y="658" text-anchor="middle" class="eq ink">P(û ∈ 𝒢) = P(G<tspan baseline-shift="sub" font-size="17">N</tspan>) · P(û ∈ 𝒢 | G<tspan baseline-shift="sub" font-size="17">N</tspan>)</text>
  <text x="1175" y="696" text-anchor="middle" class="s muted">覆盖概率 × 条件排序可靠性</text>

  <rect x="205" y="820" width="1190" height="64" rx="18" fill="#f4f6f7"/>
  <text x="800" y="860" text-anchor="middle" class="h ink">更多候选扩大可行项出现的机会，也扩大评价器误差可被搜索利用的边界。</text>
</svg>
